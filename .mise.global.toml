# Global mise config
[settings]
experimental = true

[env]
EDITOR = "nvim"
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/home-ops/age.key"
TALOSCONFIG = "{{ env.HOME }}/home-ops/talos/home/clusterconfig/talosconfig"
ATUIN_SYNC_ADDRESS = "https://atuin.clerici.tech"

[tools]
"aqua:jdx/mise" = "2026.8.10"

# k8s
kubectl = "1.36.4"
helm = "4.2.4"
kustomize = "5.8.1"
flux2 = "2.9.4"
k9s = "0.51.0"
kind = "0.32.0"
kubebuilder = "4.15.0"
helmfile = "1.7.4"
helm-docs = "1.14.2"
cilium-cli = "0.19.7"
kubeconform = "0.8.0"

# Talos
talosctl = "1.13.9"
talhelper = "3.1.16"

# Tools
lefthook = "2.1.11"
yamllint = "1.38.0"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
sops = "3.13.3"
age = "1.3.1"
zizmor = "1.29.0"
crane = "0.21.9"
mc = "latest"
gh = "2.98.0"
oci = "3.90.3"
jq = "1.8.2"
yq = "4.53.6"
go = "1.27.0"
uv = "0.12.5"
envsubst = "1.4.3"
claude-code = "2.1.238"
ffmpeg = "8.1.1"
neovim = "0.12.4"

"github:cloudnative-pg/cloudnative-pg" = { version = "1.30.0", exe = "kubectl-cnpg" }
"github:home-operations/yayamlls" = "0.2.0"
"github:home-operations/flate" = "v0.5.1"
