{{- /* Legacy per-app cluster. mode: shared is handled by cnpg-shared.yaml. */}}
{{- if and (hasKey .Values "cnpg") (ne (dig "mode" "" .Values.cnpg) "shared") }}
{{- $app := include "resources.app" . -}}
{{- $c := .Values.cnpg -}}
{{- /* Per-resource overrides, deep-merged onto each rendered .spec. */ -}}
{{- $spec := dig "spec" dict $c -}}
{{- if not (hasKey $c "mode") }}{{ fail "cnpg.mode is required (init | restore | no-backup | shared)" }}{{- end -}}
{{- /* mode gates the ObjectStore + ScheduledBackup docs, the WAL archiver,
       the recovery bootstrap and an annotation. */ -}}
{{- $backup := ne $c.mode "no-backup" -}}
{{- $restore := eq $c.mode "restore" -}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $app }}-db
  {{- if $restore }}
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
  {{- end }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpg.clusterSpec" .) (dig "cluster" dict $spec)) | nindent 2 }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $app }}-pooler-rw
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpg.poolerSpec" .) (dig "pooler" dict $spec)) | nindent 2 }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $app }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpg.databaseSpec" .) (dig "database" dict $spec)) | nindent 2 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-db-app
  labels:
    dormammu.internal/component: cnpg
spec:
  {{- include "resources.cnpg.appSecretSpec" . | nindent 2 }}
---
# Referenced by the ObjectStore's s3Credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg
  labels:
    dormammu.internal/component: cnpg
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - secretKey: versity-access-key-id
      remoteRef:
        key: versity
        property: username
    - secretKey: versity-secret-access-key
      remoteRef:
        key: versity
        property: password
{{- if $backup }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $app }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpg.objectStoreSpec" .) (dig "objectStore" dict $spec)) | nindent 2 }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $app }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpg.scheduledBackupSpec" .) (dig "scheduledBackup" dict $spec)) | nindent 2 }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $app }}-db
  labels:
    cnpg.io/cluster: {{ $app }}-db
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $app }}-db
      cnpg.io/podRole: instance
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $app }}-pooler-rw
  labels:
    cnpg.io/poolerName: {{ $app }}-pooler-rw
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/podRole: pooler
      cnpg.io/poolerName: {{ $app }}-pooler-rw
---
# Instances: Postgres is reachable only from the pooler, the operator and the
# cluster's own pods (replicas, join/recovery Jobs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $app }}-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $app }}-db
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $app }}-db
            matchExpressions:
              - {key: cnpg.io/podRole, operator: NotIn, values: [pooler]}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ $app }}-pooler-rw
      ports:
        - {port: 5432, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {port: 9187, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $app }}-pooler-rw
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: {{ $app }}-pooler-rw
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- with $c.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {port: 5432, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {port: 9127, protocol: TCP}
{{- end }}
