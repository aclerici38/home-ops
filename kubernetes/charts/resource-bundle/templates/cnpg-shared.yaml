{{- /*
  cnpg.mode: shared — attach to the shared "pg18" cluster instead of getting a
  Cluster of its own. The role password is generated once (the <app>-role
  ExternalSecret in cloudnative-pg, which the DatabaseRole references) and read
  back into the app namespace via the cnpg-role-secrets ClusterSecretStore, so
  both copies always match.
  With cnpg.mtls the role has no password: the app mounts a client cert (CN =
  role) and talks to the cert-only pooler; this renders a Certificate plus a
  ConfigMap instead of the ExternalSecrets.
  cnpg.readers adds read-only roles (pg_read_all_data) on the same database;
  sameuser in pg_hba refuses them until cloudnative-pg/cluster names them.
*/}}
{{- if and (hasKey .Values "cnpg") (eq (dig "mode" "" .Values.cnpg) "shared") }}
{{- $c := .Values.cnpg -}}
{{- /* The owner role first, then one read-only role per cnpg.readers entry on the
       same database. Each gets a context whose Values.app is its role name, so
       the helpers below render its role/secret/ConfigMap/NetworkPolicy. */ -}}
{{- $db := dig "database" (include "resources.app" .) $c -}}
{{- $roles := list (dict "ctx" $ "owner" true) -}}
{{- range $r := dig "readers" list $c }}
{{- $rc := dict "database" $db "readOnly" true "mtls" (dig "mtls" false $r) "poolMode" (dig "poolMode" "transaction" $r) "allowFrom" (dig "allowFrom" list $r) "certNamespace" (dig "certNamespace" "" $r) "podSelector" (dig "podSelector" dict $r) -}}
{{- $rc = merge $rc (pick $c "cluster" "clusterNamespace") -}}
{{- $roles = append $roles (dict "ctx" (dict "Values" (dict "app" $r.name "cnpg" $rc) "Release" $.Release) "owner" false) -}}
{{- end }}
{{- range $roles }}
{{- $owner := .owner -}}
{{- with .ctx }}
{{- $app := include "resources.app" . -}}
{{- $c := .Values.cnpg -}}
{{- /* Per-resource overrides, deep-merged onto each rendered .spec (owner only). */ -}}
{{- $spec := $owner | ternary (dig "spec" dict $c) dict -}}
{{- $cnpgNs := dig "clusterNamespace" "cloudnative-pg" $c -}}
{{- $ns := include "resources.ns" . -}}
{{- /* No right-chomp: keeps each iteration's `---` on its own line. */}}
{{- $i := fromYaml (include "resources.cnpgShared.ident" .) }}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ $app }}
  namespace: {{ $cnpgNs }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpgShared.roleSpec" .) (dig "role" dict $spec)) | nindent 2 }}
{{- if $owner }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $app }}
  namespace: {{ $cnpgNs }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpgShared.databaseSpec" .) (dig "database" dict $spec)) | nindent 2 }}
{{- end }}
{{- if not $i.mtls }}
---
# Generated role password — source of truth, mirrored into the app namespace below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-role
  namespace: {{ $cnpgNs }}
  labels:
    dormammu.internal/component: cnpg
spec:
  {{- include "resources.cnpgShared.roleSecretSpec" . | nindent 2 }}
{{- end }}
---
# Admit the app's namespace (plus any cnpg.allowFrom peers) to its pooler.
# Allow rules from every app's policy union on the shared pooler pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $app }}-pooler
  namespace: {{ $cnpgNs }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: {{ $i.pooler }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
        {{- with $c.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
{{- /* The other half, for once the consuming namespace is default-deny: let the
       pods that hold this role's credential out to its pooler. One policy per
       role, not per namespace — cnpg.podSelector names the pods, defaulting to
       app-template's app.kubernetes.io/name. It lands wherever that credential
       is mounted (certNamespace when the reader is consumed from another
       namespace). Allow-only, so it never enforces by itself. Cilium clusters
       only; raphael has none. */}}
{{- if $.Capabilities.APIVersions.Has "cilium.io/v2/CiliumNetworkPolicy" }}
{{- $egressNs := dig "certNamespace" "" $c | default $ns }}
{{- $sel := dig "podSelector" dict $c }}
{{- if empty $sel }}{{ $sel = dict "app.kubernetes.io/name" $app }}{{ end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $app }}-pooler
  namespace: {{ $egressNs }}
  labels:
    dormammu.internal/component: cnpg
spec:
  description: The {{ $app }} role's pods reach the {{ $i.pooler }} pooler
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $cnpgNs }}
            cnpg.io/poolerName: {{ $i.pooler }}
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
{{- end }}
{{- if $i.mtls }}
---
# The client cert itself, in the app's namespace. cert-manager writes tls.crt,
# tls.key and ca.crt into the Secret of the same name, which the app mounts at
# the sslcert/sslkey/sslrootcert paths below.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "resources.cnpgShared.certName" . }}
  {{- with dig "certNamespace" "" $c }}
  # The consuming pod runs here, and a Secret is only mountable in its own namespace.
  namespace: {{ . }}
  {{- end }}
  labels:
    dormammu.internal/component: cnpg
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpgShared.certificateSpec" .) (dig "certificate" dict $spec)) | nindent 2 }}
---
# Connection settings for the cert-only pooler. The credential is the cert
# Secret above, mounted at the sslcert/sslkey/sslrootcert paths below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $app }}-postgres
  labels:
    dormammu.internal/component: cnpg
data:
  {{- include "resources.cnpgShared.mtlsConfigData" . | nindent 2 }}
{{- else }}
---
# App-facing connection secret, in the app's own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-postgres
  labels:
    dormammu.internal/component: cnpg
spec:
  {{- include "resources.cnpgShared.appSecretSpec" . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
