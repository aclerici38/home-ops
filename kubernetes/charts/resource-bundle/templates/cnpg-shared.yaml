{{- /*
  cnpg.mode: shared — attach to the shared "pg18" cluster instead of getting a
  Cluster of its own. The role password is generated once (the <app>-role
  ExternalSecret in cloudnative-pg, which the DatabaseRole references) and read
  back into the app namespace via the cnpg-role-secrets ClusterSecretStore, so
  both copies always match.
*/}}
{{- if and (hasKey .Values "cnpg") (eq (dig "mode" "" .Values.cnpg) "shared") }}
{{- $app := include "resources.app" . -}}
{{- $c := .Values.cnpg -}}
{{- /* Per-resource overrides, deep-merged onto each rendered .spec. */ -}}
{{- $spec := dig "spec" dict $c -}}
{{- $cnpgNs := dig "clusterNamespace" "cloudnative-pg" $c -}}
{{- $ns := include "resources.ns" . -}}
{{- $i := fromYaml (include "resources.cnpgShared.ident" .) -}}
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ $app }}
  namespace: {{ $cnpgNs }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpgShared.roleSpec" .) (dig "role" dict $spec)) | nindent 2 }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $app }}
  namespace: {{ $cnpgNs }}
spec:
  {{- include "resources.mergeSpec" (list (include "resources.cnpgShared.databaseSpec" .) (dig "database" dict $spec)) | nindent 2 }}
---
# Generated role password — source of truth, mirrored into the app namespace below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-role
  namespace: {{ $cnpgNs }}
  labels:
    dormammu.internal/component: cnpg
spec:
  {{- include "resources.cnpgShared.roleSecretSpec" . | nindent 2 }}
---
# Admit the app's namespace (plus any cnpg.allowFrom peers) to its pooler.
# Allow rules from every app's policy union on the shared pooler pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $app }}-pooler
  namespace: {{ $cnpgNs }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: {{ $i.pooler }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
        {{- with $c.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
---
# App-facing connection secret, in the app's own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $app }}-postgres
  labels:
    dormammu.internal/component: cnpg
spec:
  {{- include "resources.cnpgShared.appSecretSpec" . | nindent 2 }}
{{- end }}
