{{- if hasKey .Values "kopiur" }}
{{- $app := include "resources.app" . -}}
{{- $k := .Values.kopiur -}}
{{- /* Per-resource overrides, deep-merged onto each rendered .spec. */ -}}
{{- $spec := dig "spec" dict $k -}}
{{- /* Backup-only / adopt mode. When true, render only the SnapshotPolicy +
       SnapshotSchedule against an already-existing PVC and skip the Restore +
       populator PVC — so kopiur backs the live volume up without touching it.
       Gates whole documents, so it cannot be expressed as a spec merge. */ -}}
{{- $existingClaim := dig "existingClaim" false $k -}}
---
# WHAT to back up (the recipe; idempotent, runs nothing on its own).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.policySpec" .) (dig "policy" dict $spec)) | nindent 2 }}
---
# WHEN. Stamps Snapshot CRs on the cron; runOnCreate:false so applying the
# release does not fire an immediate backup.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.scheduleSpec" .) (dig "schedule" dict $spec)) | nindent 2 }}
{{- if not $existingClaim }}
---
# Deploy-or-restore seed. The populator restores the PVC below from the newest
# snapshot at provision time; onMissingSnapshot:Continue provisions a blank
# volume on an empty repo instead of failing. Create-time only, so it seeds a
# fresh/rebuilt cluster but never clobbers a live volume.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.restoreSpec" .) (dig "restore" dict $spec)) | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.pvcSpec" .) (dig "pvc" dict $spec)) | nindent 2 }}
{{- end }}
{{- end }}
