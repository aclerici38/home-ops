{{- if hasKey .Values "kopiur" }}
{{- $app := include "resources.app" . -}}
{{- $k := .Values.kopiur -}}
{{- $spec := dig "spec" dict $k -}}
{{- /* Adopt mode: back up an existing PVC without provisioning one. */ -}}
{{- $existingClaim := dig "existingClaim" false $k -}}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.policySpec" .) (dig "policy" dict $spec)) | nindent 2 }}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.scheduleSpec" .) (dig "schedule" dict $spec)) | nindent 2 }}
{{- if not $existingClaim }}
---
{{- /* Create-time only: seeds a fresh cluster, never clobbers a live volume. */}}
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.restoreSpec" .) (dig "restore" dict $spec)) | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $app }}
  labels:
    dormammu.internal/component: kopiur
spec:
  {{- include "resources.mergeSpec" (list (include "resources.kopiur.pvcSpec" .) (dig "pvc" dict $spec)) | nindent 2 }}
{{- end }}
{{- end }}
