{{- if hasKey .Values "oidc" }}
{{- $app := include "resources.app" . -}}
{{- $o := .Values.oidc -}}
{{- /* Per-resource overrides, deep-merged onto each rendered .spec. */ -}}
{{- $spec := dig "spec" dict $o -}}
{{- /* Where the control plane reaches pocket-id. Feeds the Backend host, the
       BackendConfigPolicy sni, and the TLS decision below — three fields across
       two documents, so these stay knobs. */ -}}
{{- $host := dig "backendHost" "pocket-id.pocket-id-operator.svc.cluster.local" $o -}}
{{- $port := dig "backendPort" 1411 $o -}}
{{- /* Originate TLS to the IdP when talking to a remote pocket-id (clusters with
       no in-cluster instance reaching id.clerici.tech:443). Gates a whole
       document, so it cannot be a spec merge. Defaults on for port 443. */ -}}
{{- $tls := dig "backendTLS" (eq (toString $port) "443") $o -}}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: {{ $app }}-oauth-backend
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.backendSpec" .) (dig "backend" dict $spec)) | nindent 2 }}
{{- if $tls }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: {{ $app }}-oauth-backend
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.backendConfigSpec" .) (dig "backendConfig" dict $spec)) | nindent 2 }}
{{- end }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: {{ $app }}-oauth
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.extensionSpec" .) (dig "extension" dict $spec)) | nindent 2 }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ $app }}-oauth
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.trafficPolicySpec" .) (dig "trafficPolicy" dict $spec)) | nindent 2 }}
{{- end }}
