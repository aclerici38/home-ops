{{- if hasKey .Values "oidc" }}
{{- $app := include "resources.app" . -}}
{{- $o := .Values.oidc -}}
{{- $spec := dig "spec" dict $o -}}
{{- $port := dig "backendPort" 1411 $o -}}
{{- /* Originate TLS to a remote pocket-id (id.clerici.tech:443). Gates a document. */ -}}
{{- $tls := dig "backendTLS" (eq (toString $port) "443") $o -}}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: {{ $app }}-oauth-backend
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.backendSpec" .) (dig "backend" dict $spec)) | nindent 2 }}
{{- if $tls }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: {{ $app }}-oauth-backend
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.backendConfigSpec" .) (dig "backendConfig" dict $spec)) | nindent 2 }}
{{- end }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: {{ $app }}-oauth
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.extensionSpec" .) (dig "extension" dict $spec)) | nindent 2 }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ $app }}-oauth
spec:
  {{- include "resources.mergeSpec" (list (include "resources.oidc.trafficPolicySpec" .) (dig "trafficPolicy" dict $spec)) | nindent 2 }}
{{- end }}
