{{- if hasKey .Values "dragonfly" }}
{{- $app := include "resources.app" . -}}
{{- $spec := dig "spec" dict .Values.dragonfly -}}
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: {{ $app }}-dragonfly-db
spec:
  {{- include "resources.mergeSpec" (list (include "resources.dragonfly.spec" .) (dig "dragonfly" dict $spec)) | nindent 2 }}
{{- /* Cilium clusters only. The operator stopped managing a NetworkPolicy in v1.7.0. */}}
{{- if .Capabilities.APIVersions.Has "cilium.io/v2/CiliumNetworkPolicy" }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $app }}-dragonfly-db
  labels:
    dormammu.internal/component: dragonfly
spec:
  {{- include "resources.mergeSpec" (list (include "resources.dragonfly.networkPolicySpec" .) (dig "networkPolicy" dict $spec)) | nindent 2 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $app }}-dragonfly-client
  labels:
    dormammu.internal/component: dragonfly
spec:
  {{- include "resources.mergeSpec" (list (include "resources.dragonfly.clientNetworkPolicySpec" .) (dig "clientNetworkPolicy" dict $spec)) | nindent 2 }}
{{- end }}
{{- end }}
