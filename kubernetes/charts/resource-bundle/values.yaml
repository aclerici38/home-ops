---
# A feature renders only if its key is present in the HelmRelease values.
# `dragonfly: {}` enables it with defaults; omit the key to disable.
#
# app: immich          # override the name derived from <release>-resources
#
# Shape:
#   <feature>:
#     <knob>: ...      # named knobs, listed per feature below
#     spec: {}         # deep-merged onto the rendered .spec
#     spec:            # ...or keyed by kind when a feature renders several
#       <kind>: {}
#
# Base specs are plain YAML in templates/_*.tpl — read those to see what you are
# overriding. Merges are recursive for maps; LISTS REPLACE. Anything needing
# append/prepend or a computed value is a named knob instead. Fully derived
# resources (credential plumbing, PodMonitors) have no merge key by design.

# cnpg:
#   mode: init            # REQUIRED: init | restore | no-backup | shared
#   instances: 3          # 1 drops the PDB, sync replication and switchover
#   poolMode: transaction # transaction | session (also picks the shared pooler)
#   database: <app>       # shared: db + role name
#   cluster: pg18         # shared: target Cluster
#   clusterNamespace: cloudnative-pg
#   allowFrom: []         # extra NetworkPolicyPeers admitted to the pooler; the
#                         # app's own namespace is always allowed
#   readers: []           # shared: extra read-only roles (pg_read_all_data) on
#                         # this database, each rendered like the owner with its
#                         # own <name>-postgres Secret/ConfigMap and pooler policy:
#                         #   - name: blocky-ui     # role name
#                         #     mtls: false
#                         #     poolMode: transaction
#                         #     allowFrom: []
#                         # sameuser in pg_hba refuses them until a line in
#                         # cloudnative-pg/cluster (Postgres + pooler) names them.
#   mtls: false           # shared: passwordless. Role joins cert_apps with no
#                         # password; app uses the pg18-pooler-mtls-* pooler and
#                         # the <app>-postgres ConfigMap (uri/sslcert/... paths).
#                         # The app mounts its cert with csi-driver, e.g.:
#                         #   persistence:
#                         #     postgres-cert:
#                         #       type: custom
#                         #       globalMounts: [{path: /var/run/secrets/postgresql}]
#                         #       volumeSpec:
#                         #         csi:
#                         #           driver: csi.cert-manager.io
#                         #           readOnly: true
#                         #           volumeAttributes:
#                         #             csi.cert-manager.io/issuer-name: postgres-mtls
#                         #             csi.cert-manager.io/issuer-kind: ClusterIssuer
#                         #             csi.cert-manager.io/common-name: <role>
#                         #             csi.cert-manager.io/key-usages: client auth,digital signature
#                         #             csi.cert-manager.io/key-algorithm: ECDSA
#                         #             csi.cert-manager.io/key-size: "384"
#                         #             csi.cert-manager.io/key-encoding: PKCS8
#                         #             csi.cert-manager.io/duration: 24h
#                         #             csi.cert-manager.io/fs-group: "<pod fsGroup>"
#   spec:
#     cluster: {}         # Cluster
#     pooler: {}          # Pooler
#     database: {}        # Database
#     objectStore: {}     # ObjectStore
#     scheduledBackup: {} # ScheduledBackup
#     role: {}            # shared: DatabaseRole

# dragonfly:
#   extraArgs: []         # appended to the default args
#   spec: {}              # Dragonfly

# pocketId:
#   clientID: <app>       # also feeds the name default and oidc credentials
#   name: <clientID>      # display name; also the logo nameOverride default
#   url: <app>.clerici.tech
#   group: admin          # PocketIDUserGroup in the operator namespace
#   callbackPaths: []     # each becomes https://<url><path>
#   callbackUrls: []      # literal entries, combined with the above
#   skipConsent: true     # skip the initial authorization consent screen
#   spec: {}              # PocketIDOIDCClient

# externalSecret:
#   key: <app>            # 1Password item to extract
#   spec: {}              # ExternalSecret

# oidc:                   # Envoy Gateway OIDC forward-auth for an HTTPRoute
#   backendHost: pocket-id.pocket-id-operator.svc.cluster.local
#   backendPort: 1411
#   backendTLS: <port==443>
#   route: <app>          # HTTPRoute the SecurityPolicy targets
#   clientID: <pocketId.clientID | app>
#   spec:
#     backend: {}         # Backend (only when backendHost != the issuer host)
#     securityPolicy: {}  # SecurityPolicy

# machineTokens:          # client_credentials bearer tokens minted by pocket-id
#   <key>:                # renders <app>-<key>-token off the <app>-<key> client,
#                         # whose PocketIDOIDCClient is hand-written by the app
#     refreshInterval: 168h
#     data:               # Secret keys -> ESO templates; {{ .access_token }} is
#                         # the minted token. Default: {ACCESS_TOKEN: <token>}
#     spec:
#       webhook: {}       # Webhook generator
#       externalSecret: {}# ExternalSecret

# kopiur:                 # PVC -> shared ClusterRepository
#   existingClaim: true   # adopt an existing PVC; skip Restore + populator PVC
#   cephfs: false         # RWX ceph-filesystem + backingSnapshot staging
#   storageClass: <sc>    # PVC + staging class (raphael sets miroir)
#   capacity: 5Gi         # populator PVC size (ignored when existingClaim)
#   ignoreRules: []       # globs kopia skips; /lost+found is prepended
#   spec:
#     policy: {}          # SnapshotPolicy
#     schedule: {}        # SnapshotSchedule
#     restore: {}         # Restore
#     pvc: {}             # PersistentVolumeClaim
#     networkPolicy: {}   # CiliumNetworkPolicy <app>-kopiur (Cilium clusters only):
#                         # mover egress to the repository — versity pods or the
#                         # B2 FQDN; any other repository must set egress here

# gpu:
#   spec: {}              # ResourceClaimTemplate (Intel GPU, <app>-gpu)
