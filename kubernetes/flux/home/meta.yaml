---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-meta
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  targetNamespace: flux-system
  path: ./kubernetes/flux/home/meta
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      TZ: America/Los_Angeles
      # renovate: datasource=docker depName=quay.io/k8tz/tzdata versioning=loose
      TZDATA_VERSION: "2026f@sha256:66fe5eeaa6b43f88d15bf6151c33a5a28b16fc0796cea38f605f68bd668d6acf"
