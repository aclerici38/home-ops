---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-meta
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  targetNamespace: flux-system
  path: ./kubernetes/flux/cloud/meta
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      TZ: America/Los_Angeles
      # renovate: datasource=docker depName=quay.io/k8tz/tzdata versioning=loose
      TZDATA_VERSION: "2026e@sha256:aede69d0c675a5eb6d7ac722d379e4eedd7e38f1d1baf1a4ab67051cb37e3961"
