---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/mutatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: pod-timezone
spec:
  # A CEL error should never block a pod; it just starts in UTC
  failurePolicy: Ignore
  # Re-run if a later webhook adds containers
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
        resources:
          - "pods"
  matchConditions:
    - name: not-opted-out
      expression: >-
        object.metadata.?annotations[?"timezone.internal/inject"].orValue("true") != "false"
  variables:
    # Pod annotation, then namespace annotation, then the cluster default
    - name: tz
      expression: >-
        object.metadata.?annotations[?"timezone.internal/timezone"].orValue(
          namespaceObject.metadata.?annotations[?"timezone.internal/timezone"].orValue("${TZ}"))
    # Containers that set TZ or mount zoneinfo themselves are left alone
    - name: noTZ
      expression: >-
        object.spec.containers.filter(c, !c.?env.orValue([]).exists(e, e.name == "TZ"))
    - name: initNoTZ
      expression: >-
        object.spec.?initContainers.orValue([]).filter(c, !c.?env.orValue([]).exists(e, e.name == "TZ"))
    - name: noZoneinfo
      expression: >-
        object.spec.containers.filter(c, !c.?volumeMounts.orValue([]).exists(m, m.mountPath == "/usr/share/zoneinfo"))
    # Merging into a pod's own volume of the same name gives it two sources,
    # which fails pod validation even with failurePolicy: Ignore
    - name: volumeNameTaken
      expression: >-
        object.spec.?volumes.orValue([]).exists(v, v.name == "timezone-tzdata" && !has(v.image))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: variables.noTZ.map(c, Object.spec.containers{
                name: c.name,
                env: [Object.spec.containers.env{name: "TZ", value: variables.tz}]
              }),
              initContainers: variables.initNoTZ.map(c, Object.spec.initContainers{
                name: c.name,
                env: [Object.spec.initContainers.env{name: "TZ", value: variables.tz}]
              })
            }
          }
    # /etc/localtime is left as-is: containerd only mounts directory subPaths from image volumes (containerd#11578).
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          variables.noZoneinfo.size() == 0 || variables.volumeNameTaken ? Object{} : Object{
            spec: Object.spec{
              volumes: [Object.spec.volumes{
                name: "timezone-tzdata",
                image: Object.spec.volumes.image{
                  reference: "quay.io/k8tz/tzdata:${TZDATA_VERSION}",
                  pullPolicy: "IfNotPresent"
                }
              }],
              containers: variables.noZoneinfo.map(c, Object.spec.containers{
                name: c.name,
                volumeMounts: [Object.spec.containers.volumeMounts{
                  name: "timezone-tzdata",
                  mountPath: "/usr/share/zoneinfo",
                  subPath: "usr/share/zoneinfo",
                  readOnly: true
                }]
              })
            }
          }
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/mutatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: pod-timezone
spec:
  policyName: pod-timezone
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - cilium
            - kube-system
            - flux-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/mutatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: cronjob-timezone
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "batch"
        apiVersions:
          - "v1"
        # UPDATE too: a Flux apply that omits timeZone would otherwise drop it
        operations:
          - "CREATE"
          - "UPDATE"
        resources:
          - "cronjobs"
  matchConditions:
    - name: unset
      expression: "!has(object.spec.timeZone)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{timeZone: "${TZ}"}}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/mutatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: cronjob-timezone
spec:
  policyName: cronjob-timezone
