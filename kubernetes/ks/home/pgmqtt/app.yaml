---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgmqtt
  namespace: flux-system
spec:
  targetNamespace: pgmqtt
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/pgmqtt/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: pgmqtt
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgmqtt-users
  namespace: flux-system
spec:
  targetNamespace: pgmqtt
  dependsOn:
    - name: pgmqtt
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/pgmqtt/users
  commonMetadata:
    labels:
      app.kubernetes.io/name: pgmqtt
