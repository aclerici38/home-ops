---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/kustomization_v1.json
# Lands in the envoy-gateway namespace beside the HelmRelease that consumes it,
# and only once the controller it points at is Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-ai-gateway-eg-config
  namespace: flux-system
spec:
  targetNamespace: envoy-gateway
  dependsOn:
    - name: envoy-ai-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/envoy-ai-gateway/eg-config
  commonMetadata:
    labels:
      app.kubernetes.io/name: envoy-ai-gateway
