---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: short-smart-tester
  namespace: flux-system
spec:
  targetNamespace: disk-health
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/disk-health/smart-tester
  commonMetadata:
    labels:
      app.kubernetes.io/name: smart-tester
  postBuild:
    substitute:
      TEST_TYPE: short
      TEST_SCHEDULE: "0 0 8,16,22 * *"
