---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/kustomization_v1.json
# Lets paseo run ad-hoc test pods in default (internet-only netpol, no secrets/PVCs there)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo-sandbox
  namespace: flux-system
spec:
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/paseo/sandbox
  commonMetadata:
    labels:
      app.kubernetes.io/name: paseo
