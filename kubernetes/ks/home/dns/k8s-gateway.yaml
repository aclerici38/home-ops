---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-gateway
  namespace: flux-system
spec:
  targetNamespace: dns
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/dns/k8s-gateway
  commonMetadata:
    labels:
      app.kubernetes.io/name: k8s-gateway
