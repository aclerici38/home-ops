---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.3/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-ui
  namespace: flux-system
spec:
  targetNamespace: crowdsec
  dependsOn:
    - name: crowdsec
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/crowdsec/ui
  commonMetadata:
    labels:
      app.kubernetes.io/name: crowdsec-ui
