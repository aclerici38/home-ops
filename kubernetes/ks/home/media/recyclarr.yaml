---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recyclarr
  namespace: flux-system
spec:
  targetNamespace: media
  dependsOn:
    - name: sonarr
    - name: radarr
    - name: sonarr-raphael
    - name: radarr-raphael
    - name: external-secrets-stores
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/home/media/recyclarr
  commonMetadata:
    labels:
      app.kubernetes.io/name: recyclarr
