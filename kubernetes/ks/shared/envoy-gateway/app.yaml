---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  targetNamespace: envoy-gateway
  dependsOn:
    - name: envoy-gateway-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/shared/envoy-gateway/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: envoy-gateway
