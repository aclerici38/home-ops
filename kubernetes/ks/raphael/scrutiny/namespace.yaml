---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: scrutiny
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # The collector needs SYS_ADMIN for NVMe admin passthrough
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
