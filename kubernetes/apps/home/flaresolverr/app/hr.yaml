---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      flaresolverr:
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          # cf_clearance is bound to the solving IP; Chrome picks v4/v6 per connection.
          # glibc skips AAAA lookups with no-aaaa; dns.json points Chrome at glibc instead of its own resolver.
          dnsConfig:
            options:
              - name: no-aaaa
        containers:
          flaresolverr:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
            resources:
              requests:
                cpu: 500m
                memory: 150Mi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8191
                    path: /health
              readiness: *probes
    service:
      flaresolverr:
        controller: flaresolverr
        ports:
          http:
            port: *port
    networkpolicies:
      flaresolverr:
        type: cilium
        controller: flaresolverr
        ingress:
          # Opt-in clients; egress side is the flaresolverr-clients CCNP.
          # Without the namespace Exists, fromEndpoints is scoped to this namespace only.
          - fromEndpoints:
              - matchLabels:
                  dormammu.internal/flaresolverr-client: "true"
                matchExpressions:
                  - key: k8s:io.kubernetes.pod.namespace
                    operator: Exists
            toPorts:
              - ports:
                  - {port: "8191", protocol: TCP}
        egress:
          # Headless Chrome against arbitrary sites
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
                  - {port: "443", protocol: UDP}
    configMaps:
      chromium-policy:
        data:
          # Challenge pages probe WebRTC, which sends STUN (UDP 3478/19302)
          webrtc.json: |-
            {"WebRtcIPHandling": "disable_non_proxied_udp"}
          dns.json: |-
            {"BuiltInDnsClientEnabled": false, "DnsOverHttpsMode": "off"}
      chromium-flags:
        data:
          zz-disable-background-networking: |-
            export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-background-networking"
    persistence:
      chromium-policy:
        type: configMap
        identifier: chromium-policy
        globalMounts:
          - path: /etc/chromium/policies/managed
      chromium-flags:
        type: configMap
        identifier: chromium-flags
        globalMounts:
          - path: /etc/chromium.d/zz-disable-background-networking
            subPath: zz-disable-background-networking
            readOnly: true
      tmpfs:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /app/.local
            subPath: local
