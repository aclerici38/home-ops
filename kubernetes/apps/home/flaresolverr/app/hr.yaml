---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      flaresolverr:
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          # cf_clearance is bound to the solving IP; Chrome picks v4/v6 per connection.
          # glibc skips AAAA lookups with no-aaaa; dns.json points Chrome at glibc instead of its own resolver.
          dnsConfig:
            options:
              - name: no-aaaa
        containers:
          flaresolverr:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
            resources:
              requests:
                cpu: 500m
                memory: 150Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            probes:
              # /health can stall
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8191
                    path: /health
                  timeoutSeconds: 5
                  periodSeconds: 20
                  failureThreshold: 6
              readiness: *probes
    service:
      flaresolverr:
        controller: flaresolverr
        ports:
          http:
            port: *port
    networkpolicies:
      flaresolverr:
        type: cilium
        controller: flaresolverr
        ingress:
          # Opt-in clients; egress side is the flaresolverr-clients CCNP.
          # Without the namespace Exists, fromEndpoints is scoped to this namespace only.
          - fromEndpoints:
              - matchLabels:
                  dormammu.internal/flaresolverr-client: "true"
                matchExpressions:
                  - key: k8s:io.kubernetes.pod.namespace
                    operator: Exists
            toPorts:
              - ports:
                  - {port: "8191", protocol: TCP}
        egress:
          # Headless Chrome against arbitrary sites
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
                  - {port: "443", protocol: UDP}
    configMaps:
      chromium-policy:
        data:
          # Challenge pages probe WebRTC, which sends STUN (UDP 3478/19302)
          webrtc.json: |-
            {"WebRtcIPHandling": "disable_non_proxied_udp"}
          dns.json: |-
            {"BuiltInDnsClientEnabled": false, "DnsOverHttpsMode": "off"}
          # Browser-initiated Google traffic: NTP/search suggest, network time, safe browsing,
          # autofill/translate/spellcheck servers, optimization guide model downloads, preconnects
          background.json: |-
            {
              "DefaultSearchProviderEnabled": false,
              "SearchSuggestEnabled": false,
              "NewTabPageLocation": "about:blank",
              "NetworkPredictionOptions": 2,
              "BrowserNetworkTimeQueriesEnabled": false,
              "ComponentUpdatesEnabled": false,
              "BrowserSignin": 0,
              "SyncDisabled": true,
              "SafeBrowsingProtectionLevel": 0,
              "AutofillAddressEnabled": false,
              "AutofillCreditCardEnabled": false,
              "PasswordManagerEnabled": false,
              "TranslateEnabled": false,
              "SpellcheckEnabled": false,
              "SpellCheckServiceEnabled": false,
              "UrlKeyedAnonymizedDataCollectionEnabled": false,
              "MetricsReportingEnabled": false,
              "DomainReliabilityAllowed": false,
              "AlternateErrorPagesEnabled": false,
              "GenAiDefaultSettings": 2
            }
      chromium-flags:
        data:
          # Every profile starts the user-policy FCM invalidation listeners (no switch/policy gate),
          # which force a GCM checkin + MCS connect to mtalk.google.com:5228. Point GCM at a dead
          # local port so checkin never succeeds and MCS is never attempted (no fallback with an override).
          zz-local-flags: |-
            export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-background-networking"
            export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --gcm-checkin-url=http://127.0.0.1:9/"
            export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --gcm-registration-url=http://127.0.0.1:9/"
            export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --gcm-mcs-endpoint=https://127.0.0.1:9"
            # The ComponentUpdatesEnabled policy (needed to stop optimization guide model fetches)
            # still lets some components check in; the switch doesn't.
            export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-component-update"
            # Fail these lookups in-browser: Adscore (pulled in by ad scripts on indexer pages) probes
            # 4/6.adsco.re:2087 to fingerprint the v4/v6 address, and the Gaia cookie manager polls
            # ListAccounts on every launch regardless of the signin policies.
            # Prepended to "$@" since the wrapper word-splits CHROMIUM_FLAGS and the rules need spaces.
            set -- "--host-resolver-rules=MAP adsco.re ~NOTFOUND, MAP *.adsco.re ~NOTFOUND, MAP accounts.google.com ~NOTFOUND" "$@"
            # Cloudflare NEL/Reporting beacons (a.nel.cloudflare.com). FlareSolverr passes its own
            # --disable-features and the last one wins, so merge into it rather than adding another.
            _feat=NetworkErrorLogging,Reporting
            _merged=
            for _arg; do
              shift
              case $_arg in --disable-features=*) _arg="$_arg,$_feat" _merged=1 ;; esac
              set -- "$@" "$_arg"
            done
            [ -n "$_merged" ] || set -- "$@" "--disable-features=$_feat"
    persistence:
      chromium-policy:
        type: configMap
        identifier: chromium-policy
        globalMounts:
          - path: /etc/chromium/policies/managed
      chromium-flags:
        type: configMap
        identifier: chromium-flags
        globalMounts:
          - path: /etc/chromium.d/zz-local-flags
            subPath: zz-local-flags
            readOnly: true
      tmpfs:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /app/.local
            subPath: local
