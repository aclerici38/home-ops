---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: flaresolverr-clients
spec:
  description: Egress to flaresolverr for pods labelled dormammu.internal/flaresolverr-client=true
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      dormammu.internal/flaresolverr-client: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flaresolverr
            app.kubernetes.io/instance: flaresolverr
      toPorts:
        - ports:
            - {port: "8191", protocol: TCP}
