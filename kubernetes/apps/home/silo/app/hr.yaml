---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: silo-resources
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    controllers:
      silo:
        pod:
          <<: &gpuPod
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: silo-gpu
            # Server and transcode node never share a GPU host
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: silo
                      matchExpressions:
                        - key: app.kubernetes.io/controller
                          operator: In
                          values:
                            - silo
                            - transcode
          labels:
            dormammu.internal/smtp-relay-client: "true"
        containers:
          silo:
            image: &image
              repository: ghcr.io/silo-server/silo-server
              tag: latest@sha256:2f04f2522c983f71d1ee7574f0e3b4b4166acc4f9fd122bf8b65a8f666a4dafc
            # Skip s6 /init
            command: &command
              - silo
            env:
              PORT: &port 8080
              # Jellyfin/Emby compatibility listener
              JF_PORT: &jfPort 8096
              SILO_METRICS_LISTEN: :9091
              # Plugins stored in postgres
              SILO_PLUGIN_CACHE_DIR: /tmp/silo-plugins
              SILO_TRUSTED_PROXIES: ${CLUSTER_POD_CIDR}
              SILO_SHUTDOWN_DELAY: "0"
              # Settings below are locked in the admin UI
              SILO_PUBLIC_URL: https://silo.clerici.tech
              SILO_JELLYFIN_PUBLIC_URL: https://jellyfin.clerici.tech
              SILO_LAN_DISCOVERY: "false"
              # NFS sends no inotify events
              SILO_SCANNER_REALTIME_MONITORING: "false"
              # Image's pg_dump 18 can't dump pg19, and a failed pre-migration backup blocks startup
              SILO_BACKUP_ENABLED: "false"
              SILO_SMTP_ENABLED: "true"
              SILO_SMTP_HOST: smtp-relay.smtp-relay.svc.cluster.local
              SILO_SMTP_PORT: "25"
              SILO_SMTP_SECURITY: none
              SILO_SMTP_FROM_ADDRESS: bot@clerici.tech
              SILO_HW_ACCEL: qsv
              # On the /tmp emptyDir
              SILO_TRANSCODE_DIR: /tmp/silo-transcode
              # Embedding lock is per model: changing it re-embeds, changing provider does not
              SILO_RECOMMENDATIONS_ENABLED: "true"
              SILO_RECOMMENDATIONS_PROVIDER: qwen3-embedding-0-6b
              SILO_RECOMMENDATIONS_MODEL: qwen3-embedding-0.6b
              SILO_CONFIG_FILE: /etc/silo/deployment.yaml
              SILO_TRANSCODE_NODES_FILE: /etc/silo/transcode-nodes.yaml
              TRANSCODE_0_NODE_KEY:
                secretKeyRef:
                  name: silo
                  key: SILO_NODE_KEY
              REDIS_URL: redis://silo-dragonfly-db:6379
              DATABASE_URL:
                valueFrom:
                  configMapKeyRef:
                    name: silo-postgres
                    key: uri
              SECRET_KEY:
                secretKeyRef:
                  name: silo
                  key: SECRET_KEY
              SILO_SEARCH_PROVIDER: meilisearch
              SILO_MEILISEARCH_URL: http://silo-meilisearch:7700
              SILO_MEILISEARCH_API_KEY:
                secretKeyRef:
                  name: silo
                  key: MEILI_MASTER_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /api/v1/health
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /api/v1/ready
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 12Gi
              claims:
                - name: gpu
      transcode:
        type: statefulset
        replicas: 1
        statefulset:
          podManagementPolicy: Parallel
          serviceName:
            identifier: transcode
        pod:
          <<: *gpuPod
          # Below default so the server can evict it when it needs this host
          priorityClassName: silo-transcode
        containers:
          transcode:
            image: *image
            command: *command
            env:
              MODE: transcode
              PORT: *port
              SILO_CORE_URL: http://silo.silo.svc.cluster.local:8080
              SILO_NODE_KEY:
                secretKeyRef:
                  name: silo
                  key: SILO_NODE_KEY
              # Stop at once instead of draining; sessions replan onto the server
              SILO_NODE_DRAIN_TIMEOUT: "0"
              SILO_NODE_HW_ACCEL: qsv
            probes:
              liveness: &nodeProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /api/v1/health
              readiness: *nodeProbes
            securityContext: *containerSecurity
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
              claims:
                - name: gpu
      meilisearch:
        pod:
          hostUsers: false
        containers:
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.58.0@sha256:cee0d2e31191594ff8e1651eb144aabd95b389a0bc3532327ecfb9ed91dffe7e
            args:
              - /bin/meilisearch
            env:
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: true
              # Upstream sets this too: Silo polls, which floods INFO
              MEILI_LOG_LEVEL: WARN
              MEILI_UPGRADE_DB: true
              MEILI_MAX_INDEXING_MEMORY: 1GiB
              MEILI_MASTER_KEY:
                secretKeyRef:
                  name: silo
                  key: MEILI_MASTER_KEY
            probes:
              liveness: &meiliProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 7700
                    path: /health
              readiness: *meiliProbes
            securityContext: *containerSecurity
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      silo:
        controller: silo
        # Jellyfin-compat API; inference would pick the http port and the silo.* route
        annotations:
          com.dashbrr.service.type: "jellyfin"
          com.dashbrr.service.name: "Jellyfin"
          com.dashbrr.service.url: "http://silo.silo.svc:8096"
          com.dashbrr.service.apikey: "$${SILO_API_KEY}"
          com.dashbrr.service.access_url: "https://jellyfin.clerici.tech"
        ports:
          http:
            port: *port
          jellyfin:
            port: *jfPort
          metrics:
            port: 9091
      # Headless for the stable per-pod URLs in config/transcode-nodes.yaml
      transcode:
        controller: transcode
        clusterIP: None
        ports:
          http:
            port: *port
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
    serviceMonitor:
      silo:
        serviceName: silo
        endpoints:
          - port: metrics
            # Target labels the upstream rules/dashboard aggregate on; the
            # dashboard legends are {{instance}}, so name targets by pod not IP
            relabelings:
              - sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
              - targetLabel: cluster
                replacement: home
              - targetLabel: process_role
                replacement: api
      transcode:
        serviceName: silo-transcode
        endpoints:
          - port: http
            relabelings:
              - sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
              - targetLabel: cluster
                replacement: home
              - targetLabel: process_role
                replacement: transcode
    route:
      silo:
        hostnames:
          - silo.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: silo
                port: *port
      jellyfin:
        hostnames:
          - jellyfin.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: silo
                port: *jfPort
    networkpolicies:
      silo:
        type: cilium
        controller: silo
        ingress:
          # Signed node configuration, source approval, reports and logs
          - fromControllers:
              - transcode
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
                  - {port: "8096", protocol: TCP}
          # Sonarr/Radarr webhooks, Bazarr+ item/library refresh
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: sonarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Seerr library sync + media-server login, dashbrr health checks
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: seerr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
            toPorts:
              - ports:
                  - {port: "8096", protocol: TCP}
        egress:
          - toControllers:
              - transcode
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          - toControllers:
              - meilisearch
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
          # Seerr requests plugin
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: seerr
            toPorts:
              - ports:
                  - {port: "5055", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: llmkube
                  inference.llmkube.dev/service: qwen3-embedding-0-6b
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Metadata providers, plugin catalog, jellyfin-web source + npm registry
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
        egressDeny:
          # Keep the LAN out of reach; in-cluster peers above are pod identities
          - toCIDRSet:
              - cidrGroupRef: private-networks
      transcode:
        type: cilium
        controller: transcode
        ingress:
          - fromControllers:
              - silo
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        egress:
          - toControllers:
              - silo
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
      meilisearch:
        type: cilium
        controller: meilisearch
        ingress:
          - fromControllers:
              - silo
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
        egress:
          - {}
    persistence:
      config:
        type: configMap
        name: silo-config
        advancedMounts:
          silo:
            silo:
              - path: /etc/silo
                readOnly: true
      postgres-cert:
        type: secret
        name: silo-postgres-cert
        defaultMode: 0440
        advancedMounts:
          silo:
            silo:
              - path: /var/run/secrets/postgresql
      # Skipped s6 init links /var/lib/silo -> /config/silo
      data:
        existingClaim: silo
        advancedMounts:
          silo:
            silo:
              - path: /config/silo/artwork
                subPath: artwork
              - path: /config/silo/compat
                subPath: compat
      trickplay:
        existingClaim: silo-trickplay
        advancedMounts:
          silo:
            silo:
              - path: /config/silo/artwork/trickplay
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        advancedMounts:
          silo:
            silo: &mediaMount
              - path: /mnt/media
                readOnly: true
          transcode:
            transcode: *mediaMount
      # Derived from postgres, so not backed up
      meilisearch:
        existingClaim: silo-meilisearch
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
      # Transcodes, download artifacts, uploads and the plugin cache
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
