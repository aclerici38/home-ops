---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: silo-resources
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    controllers:
      silo:
        pod: &gpuPod
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: silo-gpu
          # Server and transcode node never share a GPU host
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: silo
                    matchExpressions:
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - silo
                          - transcode
        containers:
          silo:
            image: &image
              repository: ghcr.io/silo-server/silo-server
              tag: latest@sha256:8b652b0be194081936889b8ce48d5fc25cd8f71269d376a51170aada75678d07
            # Skip s6 /init
            command: &command
              - silo
            env:
              <<: &env
                PORT: &port 8080
                # Jellyfin/Emby compatibility listener
                JF_PORT: &jfPort 8096
                SILO_METRICS_LISTEN: :9091
                # Plugins stored in postgres
                SILO_PLUGIN_CACHE_DIR: /tmp/silo-plugins
                SILO_TRUSTED_PROXIES: ${CLUSTER_POD_CIDR}
                SILO_SHUTDOWN_DELAY: "0"
                # Image has no passwd entry
                HOME: /tmp
                REDIS_URL: redis://silo-dragonfly-db:6379
                DATABASE_URL:
                  valueFrom:
                    configMapKeyRef:
                      name: silo-postgres
                      key: uri
                SECRET_KEY:
                  secretKeyRef:
                    name: silo
                    key: SECRET_KEY
              SILO_SEARCH_PROVIDER: meilisearch
              SILO_MEILISEARCH_URL: http://silo-meilisearch:7700
              SILO_MEILISEARCH_API_KEY:
                secretKeyRef:
                  name: silo
                  key: MEILI_MASTER_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /api/v1/health
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /api/v1/ready
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 12Gi
              claims:
                - name: gpu
      transcode:
        type: statefulset
        replicas: 1
        statefulset:
          podManagementPolicy: Parallel
          serviceName:
            identifier: transcode
        pod:
          <<: *gpuPod
          # Below default so the server can evict it when it needs this host
          priorityClassName: silo-transcode
        containers:
          transcode:
            image: *image
            command: *command
            env:
              <<: *env
              MODE: transcode
              # Stop at once instead of draining; sessions replan onto the server
              SILO_NODE_DRAIN_TIMEOUT: "0"
              POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              NODE_NAME:
                value: $(POD_NAME)
                dependsOn: POD_NAME
              # Must match the URL the node is registered under in the admin UI.
              NODE_URL:
                value: http://$(POD_NAME).silo-transcode.silo.svc.cluster.local:8080
                dependsOn: POD_NAME
            probes:
              liveness: &nodeProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /api/v1/health
              readiness: *nodeProbes
            securityContext: *containerSecurity
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
              claims:
                - name: gpu
      meilisearch:
        pod:
          hostUsers: false
        containers:
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
            args:
              - /bin/meilisearch
            env:
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: true
              # Upstream sets this too: Silo polls, which floods INFO
              MEILI_LOG_LEVEL: WARN
              MEILI_UPGRADE_DB: true
              MEILI_MAX_INDEXING_MEMORY: 1GiB
              MEILI_MASTER_KEY:
                secretKeyRef:
                  name: silo
                  key: MEILI_MASTER_KEY
            probes:
              liveness: &meiliProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 7700
                    path: /health
              readiness: *meiliProbes
            securityContext: *containerSecurity
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      silo:
        controller: silo
        ports:
          http:
            port: *port
          jellyfin:
            port: *jfPort
          metrics:
            port: 9091
      # Headless for the stable per-pod NODE_URLs
      transcode:
        controller: transcode
        clusterIP: None
        ports:
          http:
            port: *port
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
    serviceMonitor:
      silo:
        serviceName: silo
        endpoints:
          - port: metrics
            # Target labels the upstream rules/dashboard aggregate on; the
            # dashboard legends are {{instance}}, so name targets by pod not IP
            relabelings:
              - sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
              - targetLabel: cluster
                replacement: home
              - targetLabel: process_role
                replacement: api
      transcode:
        serviceName: silo-transcode
        endpoints:
          - port: http
            relabelings:
              - sourceLabels:
                  - __meta_kubernetes_pod_name
                targetLabel: instance
              - targetLabel: cluster
                replacement: home
              - targetLabel: process_role
                replacement: transcode
    route:
      silo:
        hostnames:
          - silo.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: silo
                port: *port
      jellyfin:
        hostnames:
          - jellyfin.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: silo
                port: *jfPort
    networkpolicies:
      silo:
        type: cilium
        controller: silo
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
                  - {port: "8096", protocol: TCP}
          # Sonarr/Radarr webhooks, Bazarr+ item/library refresh
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: sonarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Seerr library sync + media-server login, dashbrr health checks
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: seerr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
            toPorts:
              - ports:
                  - {port: "8096", protocol: TCP}
        egress:
          - toControllers:
              - transcode
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          - toControllers:
              - meilisearch
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
          # Seerr requests plugin
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: seerr
            toPorts:
              - ports:
                  - {port: "5055", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: llmkube
                  inference.llmkube.dev/service: qwen3-embedding-0-6b
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Metadata providers, plugin catalog, jellyfin-web source + npm registry
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
        egressDeny:
          # Keep the LAN out of reach; in-cluster peers above are pod identities
          - toCIDRSet:
              - cidrGroupRef: private-networks
      transcode:
        type: cilium
        controller: transcode
        ingress:
          - fromControllers:
              - silo
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        egress:
          - {}
      meilisearch:
        type: cilium
        controller: meilisearch
        ingress:
          - fromControllers:
              - silo
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
        egress:
          - {}
    persistence:
      postgres-cert:
        type: secret
        name: silo-postgres-cert
        defaultMode: 0440
        advancedMounts:
          silo:
            silo: &postgresCertMount
              - path: /var/run/secrets/postgresql
          transcode:
            transcode: *postgresCertMount
      # Skipped s6 init links /var/lib/silo -> /config/silo
      data:
        existingClaim: silo
        advancedMounts:
          silo:
            silo:
              - path: /config/silo/artwork
                subPath: artwork
              - path: /config/silo/compat
                subPath: compat
      trickplay:
        existingClaim: silo-trickplay
        advancedMounts:
          silo:
            silo:
              - path: /config/silo/artwork/trickplay
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        advancedMounts:
          silo:
            silo: &mediaMount
              - path: /mnt/media
                readOnly: true
          transcode:
            transcode: *mediaMount
      # Derived from postgres, so not backed up
      meilisearch:
        existingClaim: silo-meilisearch
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
      # Transcodes, download artifacts, uploads and the plugin cache
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
