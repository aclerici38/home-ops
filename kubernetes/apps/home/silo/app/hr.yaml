---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: silo-resources
  values:
    controllers:
      silo:
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: silo-gpu
          securityContext:
            runAsNonRoot: true
            runAsUser: &uid 1000
            runAsGroup: *uid
            fsGroup: *uid
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          silo:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: latest@sha256:04b1626f6abe4e3e66f7b7a1f80d44bf8e98e1c75eb340620cb2037fd09cd6e0
            env:
              TZ: America/Los_Angeles
              PORT: &port 8080
              SILO_METRICS_LISTEN: :9091
              # Plugins stored in postgres
              SILO_PLUGIN_CACHE_DIR: /tmp/silo-plugins
              SILO_TRUSTED_PROXIES: ${CLUSTER_POD_CIDR}
              # Image has no passwd entry
              HOME: /tmp
              DATABASE_URL:
                valueFrom:
                  configMapKeyRef:
                    name: silo-postgres
                    key: uri
              SECRET_KEY:
                secretKeyRef:
                  name: silo
                  key: SECRET_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: &health /api/v1/health
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: /api/v1/ready
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
              claims:
                - name: gpu
    service:
      silo:
        controller: silo
        ports:
          http:
            port: *port
          metrics:
            port: 9091
    serviceMonitor:
      silo:
        serviceName: silo
        endpoints:
          - port: metrics
    route:
      silo:
        hostnames:
          - silo.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    networkpolicies:
      silo:
        type: cilium
        controller: silo
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: cloudnative-pg
                  cnpg.io/poolerName: pg18-pooler-mtls-session-rw
            toPorts:
              - ports:
                  - {port: "5432", protocol: TCP}
          # Pocket-id
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "10443", protocol: TCP}
          # Metadata providers, plugin catalog, jellyfin-web source + npm registry
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: silo-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      data:
        existingClaim: silo
        globalMounts:
          - path: /var/lib/silo/artwork
            subPath: artwork
          - path: /var/lib/silo/compat
            subPath: compat
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /mnt/media
            readOnly: true
      # Transcodes, download artifacts, uploads and the plugin cache
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
