---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: dragonfly-operator
      namespace: dragonfly-operator
    - name: external-secrets
      namespace: external-secrets
    - name: intel-gpu-resource-driver
      namespace: intel-gpu-resource-driver
    - name: kopiur
      namespace: kopiur
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    nfsGate:
      targets:
        - name: silo
        - name: silo-transcode
          kind: StatefulSet
          replicas: 1
    cnpg:
      mode: shared
      mtls: true
      # Session-scoped pg_advisory_lock (pglock, provider recheck) needs a pinned connection.
      poolMode: session
      spec:
        database:
          extensions:
            - name: vector
              ensure: present
    dragonfly: {}
    externalSecret: {}
    gpu: {}
    pocketId:
      group: all
      podLabels:
        app.kubernetes.io/instance: silo
        app.kubernetes.io/controller: silo
      spec:
        oidcClient:
          isPublic: true
          secret:
            enabled: false
      # Plugin installation ID isn't known until it's installed.
      callbackPaths:
        - /api/v2/auth/oauth/*/callback
    kopiur:
      cephfs: true
      capacity: 20Gi
      # Rebuilt jellyfin-web checkout (node_modules), reinstallable from the admin UI.
      ignoreRules:
        - /compat
