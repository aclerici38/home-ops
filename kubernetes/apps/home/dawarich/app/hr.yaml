---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      dawarich:
        pod:
          labels:
            dormammu.internal/smtp-relay-client: "true"
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          server: &container
            image:
              repository: mirror.gcr.io/freikin/dawarich
              tag: 1.24.0@sha256:5634307e9c9a50abf86112dbda896ea20fc4116c51cf90e391b9c8633b563cf1
            command:
              - "web-entrypoint.sh"
            args:
              - "bin/rails"
              - "server"
              - "-p"
              - "3000"
              - "-b"
              - "::"
            env:
              RAILS_ENV: production
              SELF_HOSTED: true
              REDIS_URL: redis://dawarich-dragonfly-db:6379
              TIME_ZONE: ${TZ}
              APPLICATION_HOSTS: dawarich.clerici.tech
              DISTANCE_UNIT: mi
              STORE_GEODATA: true
              RAILS_CACHE_DB: 0
              RAILS_JOB_QUEUE_DB: 0
              RAILS_WS_DB: 0
              SMTP_SERVER: smtp-relay.smtp-relay
              SMTP_PORT: 25
              SMTP_FROM: bot@clerici.tech
              DOMAIN: clerici.tech
              SECRET_KEY_BASE:
                secretKeyRef:
                  name: dawarich
                  key: SECRET_KEY_BASE
              OTP_ENCRYPTION_PRIMARY_KEY:
                secretKeyRef:
                  name: dawarich
                  key: OTP_ENCRYPTION_PRIMARY_KEY
              OTP_ENCRYPTION_DETERMINISTIC_KEY:
                secretKeyRef:
                  name: dawarich
                  key: OTP_ENCRYPTION_DETERMINISTIC_KEY
              OTP_ENCRYPTION_KEY_DERIVATION_SALT:
                secretKeyRef:
                  name: dawarich
                  key: OTP_ENCRYPTION_KEY_DERIVATION_SALT
              DATABASE_HOST:
                configMapKeyRef:
                  name: dawarich-postgres
                  key: host
              DATABASE_USERNAME:
                configMapKeyRef:
                  name: dawarich-postgres
                  key: user
              DATABASE_NAME:
                configMapKeyRef:
                  name: dawarich-postgres
                  key: dbname
              PGSSLMODE: verify-full
              PGSSLCERT: /var/run/secrets/postgresql/tls.crt
              PGSSLKEY: /var/run/secrets/postgresql/tls.key
              PGSSLROOTCERT: /var/run/secrets/postgresql/ca.crt
              OIDC_CLIENT_ID:
                secretKeyRef:
                  name: dawarich-oidc-credentials
                  key: client_id
              OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: dawarich-oidc-credentials
                  key: client_secret
              OIDC_ISSUER:
                secretKeyRef:
                  name: dawarich-oidc-credentials
                  key: issuer_url
              OIDC_REDIRECT_URI: https://dawarich.clerici.tech/users/auth/openid_connect/callback
              OIDC_PROVIDER_NAME: Pocket-ID
              OIDC_PKCE_ENABLED: true
              ALLOW_EMAIL_PASSWORD_REGISTRATION: false
              ALLOW_EMAIL_PASSWORD_LOGIN: false
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3000
                    path: /api/v1/health
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
          sidekiq:
            <<: *container
            command:
              - "sidekiq-entrypoint.sh"
            args:
              - "bundle exec sidekiq"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
    service:
      dawarich:
        controller: dawarich
        ports:
          http:
            port: *port
    route:
      dawarich:
        hostnames:
          - dawarich.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    networkpolicies:
      dawarich:
        type: cilium
        controller: dawarich
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
        # Postgres, Dragonfly, OIDC and SMTP egress come from the dawarich-*
        # policies and the smtp-relay-clients CCNP. No reverse geocoder is configured.
        egress:
          - {}
    persistence:
      postgres-cert:
        type: secret
        name: dawarich-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      data:
        existingClaim: dawarich
        globalMounts:
          - path: /var/app/storage
            subPath: storage
          - path: /var/app/public
            subPath: public
          # ruby won't let tmp dir be world-writeable so can't be emptydir
          - path: /tmp
            subPath: tmp
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /var/app/tmp
            subPath: app_tmp
  dependsOn:
    - name: dawarich-resources
