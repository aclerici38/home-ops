---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: dragonfly-operator
      namespace: dragonfly-operator
    - name: external-secrets
      namespace: external-secrets
    - name: pocket-id-operator
      namespace: pocket-id-operator
    - name: kopiur
      namespace: kopiur
  values:
    cnpg:
      mode: shared
      mtls: true
      poolMode: session
      spec:
        database:
          extensions:
            - {name: postgis, version: 3.6.4}
            - {name: postgis_raster, version: 3.6.4}
            - {name: postgis_sfcgal, version: 3.6.4}
            - {name: fuzzystrmatch}
            - {name: address_standardizer, version: 3.6.4}
            - {name: address_standardizer_data_us, version: 3.6.4}
            - {name: postgis_tiger_geocoder, version: 3.6.4}
            - {name: postgis_topology, version: 3.6.4}
    dragonfly:
      extraArgs:
        - --default_lua_flags=allow-undeclared-keys
    externalSecret: {}
    pocketId:
      group: fam
      callbackPaths:
        - /users/auth/openid_connect/callback
    kopiur:
      existingClaim: true
      cephfs: true
