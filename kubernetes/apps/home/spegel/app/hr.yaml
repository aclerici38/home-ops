---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.8.2
        digest: sha256:2449e91ce3ae949433126f2a3293270937be23391798b486b26c173043ee759f
      url: oci://ghcr.io/spegel-org/helm-charts/spegel
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/spegel-org/spegel.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    serviceMonitor:
      enabled: true
    spegel:
      # Talos keeps containerd registry config here, not /etc/containerd/certs.d
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      # Don't pin mutable :latest tags to the first digest seen in the cluster;
      # resolve them upstream (layers still come from peers).
      # https://spegel.dev/docs/usage/resolving-tags/
      registryFilters:
        - ":latest$"
