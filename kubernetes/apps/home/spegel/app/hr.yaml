---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: spegel
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    serviceMonitor:
      enabled: true
    spegel:
      # Talos keeps containerd registry config here, not /etc/containerd/certs.d
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      # Don't pin mutable :latest tags to the first digest seen in the cluster;
      # resolve them upstream (layers still come from peers).
      # https://spegel.dev/docs/usage/resolving-tags/
      registryFilters:
        - ":latest$"
