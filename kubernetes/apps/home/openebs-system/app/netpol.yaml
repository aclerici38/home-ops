---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openebs
spec:
  # localpv provisioner + zfs controller only talk to the apiserver (via the
  # apiserver-clients CCNP) and the CSI sidecars over unix sockets; the zfs
  # node plugin is hostNetwork and outside policy
  endpointSelector:
    matchExpressions:
      - key: name
        operator: In
        values:
          - openebs-localpv-provisioner
          - openebs-zfs-controller
  ingress:
    - {}
  egress:
    - {}
