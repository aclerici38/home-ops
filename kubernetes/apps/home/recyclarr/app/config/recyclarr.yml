---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.7.1/schemas/config-schema.json
#
################################################################################
## Grab-everything, prefer-some-things.
##
## Design goals (in priority order):
##   1. English audio beats everything, including resolution. A release with an
##      English track (dub, dual-audio, or native) always outscores one without.
##   2. Higher resolution next: 2160p > 1080p > 720p.
##   3. h265/HEVC preferred over anything else at the same resolution.
##   4. Nothing below 720p, and obvious garbage (LQ, upscales, BR-DISK, extras)
##      is rejected. Everything else is fair game.
##
## How the language-over-resolution rule works:
## Sonarr/Radarr never replace a file with a *lower quality* one, no matter the
## custom format score. So both profiles collapse every allowed source (720p WEB
## through 2160p Remux) into a SINGLE quality tier, and resolution preference is
## expressed with the guide's resolution custom formats instead. That makes score
## the only thing that ranks releases, which is what lets a 720p English release
## replace a 1080p non-English one.
##
## Score budget (keep the gaps intact if you tune this):
##   Language: Not English  -1000   reverse-scored; only fires when NO English
##   2160p / 1080p / 720p    +300 / +200 / +100
##   Anime Dual Audio         +150   English + original audio (implies subs)
##   Dual Audio Asian         +150
##   Dubs Only                 +40   English audio, usually no original/subs
##   x265                      +50
##   AV1                       -50   accepted, just last in line
##   Unwanted formats       -10000   hard reject (min_format_score is -2000)
## The -1000 language penalty is larger than the widest possible resolution +
## codec spread (300 + 50), so English always wins. Everything non-English still
## lands well above min_format_score, so it still gets grabbed.
################################################################################

sonarr:
  sonarr:
    base_url: http://sonarr.sonarr.svc.cluster.local:8989
    api_key: !env_var SONARR__AUTH__APIKEY

    delete_old_custom_formats: true

    media_naming:
      season: default
      series: jellyfin-tvdb
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    media_management:
      # Repacks/propers are handled by custom formats below, not by Sonarr's
      # built-in preference.
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: series

    quality_profiles:
      - name: English Preferred (720p+)
        # Accept anything that clears the garbage floor. Non-English bottoms out
        # around -900, unwanted formats at -9800 or worse.
        min_format_score: -2000
        upgrade:
          allowed: true
          until_quality: Any (720p-2160p)
          # Effectively "never stop looking for something better".
          until_score: 10000
        reset_unmatched_scores:
          enabled: true
        quality_sort: top
        qualities:
          # One tier on purpose - see the header. Anything not listed here is
          # disabled, which is what enforces the 720p floor.
          - name: Any (720p-2160p)
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

    custom_formats:
      # --- Language: the dominant term ----------------------------------------
      # Reverse-scored: this only matches releases with NO English audio, so
      # English (including dubs and dual-audio) effectively scores +1000 relative
      # to everything else. Big enough to outrank any resolution difference.
      - trash_ids:
          - 69aa1e159f97d860440b04cd6d590c4f # Language: Not English
        score: -1000
        assign_scores_to:
          - name: English Preferred (720p+)

      # Dual audio ships English *and* the original track, and in practice always
      # carries subtitles - the closest thing to a "has subs" signal that exists
      # at grab time. Ranked above a dub-only release.
      - trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
          - ceb6ca558f4a3d47a00ebbdcb7fa7922 # Dual Audio Asian
        score: 150
        assign_scores_to:
          - name: English Preferred (720p+)

      # English dub with the original track dropped. Still English, so still
      # preferred over a non-English release - just the least good way to get it.
      - trash_ids:
          - 9c14d194486c4014d422adc64092d794 # Dubs Only
        score: 40
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Resolution ---------------------------------------------------------
      - trash_ids:
          - 1bef6c151fa35093015b0bfef18279e5 # 2160p
        score: 300
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - 290078c8b266272a5cc8e251b5e2eb0b # 1080p
        score: 200
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - c99279ee27a154c2f20d1d505cc99e25 # 720p
        score: 100
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Codec --------------------------------------------------------------
      # Deliberately NOT using "x265 (HD)" / "x265 (no HDR/DV)" - those are the
      # guide's -10000 penalties for HD HEVC re-encodes. This is the plain
      # any-resolution HEVC format, scored positive.
      - trash_ids:
          - c9eafd50846d299b862ca9bb6ea91950 # x265
        score: 50
        assign_scores_to:
          - name: English Preferred (720p+)

      # Accepted, just ranked last. The guide rejects AV1 outright (-10000);
      # softened to a nudge so it still gets grabbed when it's all there is.
      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        score: -50
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Hard rejects -------------------------------------------------------
      # Below min_format_score, so these are never grabbed.
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
        score: -10000
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Small tiebreakers --------------------------------------------------
      # Guide default scores (+5/+6/+7 and the anime v0-v4 ladder). Only matter
      # when two releases are otherwise identical.
      - trash_ids:
          - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
          - eb3d5cc0a2be0db205fb823640db6a3c # Repack2
          - 44e7c4de10ae50265753082e5dc76047 # Repack3
          - d2d7b8a9d39413da5f44054080e028a3 # v0
          - 273bd326df95955e1b6c26527d1df89b # v1
          - 228b8ee9aa0a609463efca874524a6b8 # v2
          - 0e5833d3af2cc5fa96a0c29cd4477feb # v3
          - 4fc15eeb8f2f9a749f918217d4234ad8 # v4
        assign_scores_to:
          - name: English Preferred (720p+)

radarr:
  radarr:
    base_url: http://radarr.radarr.svc.cluster.local:7878
    api_key: !env_var RADARR__AUTH__APIKEY

    delete_old_custom_formats: true

    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb

    media_management:
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: movie

    quality_profiles:
      - name: English Preferred (720p+)
        min_format_score: -2000
        upgrade:
          allowed: true
          until_quality: Any (720p-2160p)
          until_score: 10000
        reset_unmatched_scores:
          enabled: true
        quality_sort: top
        qualities:
          - name: Any (720p-2160p)
            qualities:
              - Remux-2160p
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Remux-1080p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
