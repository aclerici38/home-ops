---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.7.1/schemas/config-schema.json
#
################################################################################
## Grab-everything, prefer-some-things.
##
## Design goals (in priority order):
##   1. English audio beats everything, including resolution. A release with an
##      English track (dub, dual-audio, or native) always outscores one without.
##   2. Higher resolution next: 2160p > 1080p > 720p.
##   3. h265/HEVC preferred over anything else at the same resolution.
##   4. Nothing below 720p, and obvious garbage (LQ, upscales, BR-DISK, extras)
##      is rejected. Everything else is fair game.
##
## How the language-over-resolution rule works:
## Sonarr/Radarr never replace a file with a *lower quality* one, no matter the
## custom format score. So both profiles collapse every allowed source (720p WEB
## through 2160p Remux) into a SINGLE quality tier, and resolution preference is
## expressed with the guide's resolution custom formats instead. That makes score
## the only thing that ranks releases, which is what lets a 720p English release
## replace a 1080p non-English one.
##
## Two score layers, deliberately on different scales:
##
##   OURS (overridden below) - the hard constraints:
##     Unwanted formats     -200000   hard reject
##     Language: Not English -40000   reverse-scored; fires only when NO English
##     2160p / 1080p / 720p  +12000 / +8000 / +4000
##     Anime Dual Audio      +40000   exactly cancels the penalty above; see the
##                                    note at the CF for why this is not a bonus
##     x265                   +2000
##     AV1                    -2000   accepted, just last in line
##     Dubs Only                  0   already parses as English, so no penalty
##
##   THEIRS (custom_format_groups, guide scores untouched) - the tiebreakers:
##     Remux/Bluray/WEB group tiers   1600-1950
##     Anime BD/Web group tiers        100-1400
##     HDR                                 500
##     Streaming services               0-  75
##     Season packs / repacks / anime versions  4-10
##
## The scales are chosen so the guide can never overturn a hard constraint:
##   * Worst-case guide stack is 1950 + 1400 + 500 + 75 + 10 + 7 = 3942, which
##     is under the 4000 resolution step - so release-group tiering reorders
##     releases WITHIN a resolution but never promotes 1080p over 2160p.
##   * 40000 dwarfs any achievable positive total, so an English release always
##     outranks a non-English one no matter how good the latter's groups are.
##   * min_format_score -60000 sits between the two: non-English still gets
##     grabbed (worst case 4000 - 2000 - 40000 = -38000), unwanted never does.
##     Note the reject penalty has to clear the BEST possible positive total
##     (12000 + 2000 + 40000 + 3942 = 57942), not zero - at -100000 an LQ
##     dual-audio release scored -52000 and would have been accepted.
## If you retune, keep those three inequalities true and everything else follows.
################################################################################

sonarr:
  sonarr:
    base_url: http://sonarr.sonarr.svc.cluster.local:8989
    api_key: !env_var SONARR__AUTH__APIKEY

    delete_old_custom_formats: true

    media_naming:
      season: default
      series: jellyfin-tvdb
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    media_management:
      # Repacks/propers are handled by custom formats below, not by Sonarr's
      # built-in preference.
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: series
      # The guide's "series" sizes are effectively uncapped (max 1000 MB/min,
      # preferred 995) - which also means Sonarr actively chases the LARGEST
      # release in every quality. Both are overridden here with a flat ceiling.
      #
      # 90 MB/min ~= 4 GB for a 45-minute episode, ~2 GB for a 22-minute one.
      # preferred sits just under max, so within that budget the best release
      # still wins; the cap is the only brake. (It has to be set explicitly -
      # preferred_ratio does not apply on top of a per-quality max, and leaving
      # it at the guide's 995 makes Sonarr reject the whole definition.) In
      # practice this means a 1080p library, with 2160p landing only when the
      # encode is efficient - which the x265 bonus already pushes toward.
      qualities:
        - name: HDTV-720p
          max: 90
          preferred: 85
        - name: WEBRip-720p
          max: 90
          preferred: 85
        - name: WEBDL-720p
          max: 90
          preferred: 85
        - name: Bluray-720p
          max: 90
          preferred: 85
        - name: HDTV-1080p
          max: 90
          preferred: 85
        - name: WEBRip-1080p
          max: 90
          preferred: 85
        - name: WEBDL-1080p
          max: 90
          preferred: 85
        - name: Bluray-1080p
          max: 90
          preferred: 85
        - name: Bluray-1080p Remux
          max: 90
          preferred: 85
        - name: HDTV-2160p
          max: 90
          preferred: 85
        - name: WEBRip-2160p
          max: 90
          preferred: 85
        - name: WEBDL-2160p
          max: 90
          preferred: 85
        # The guide's floor for these two (94.6 and 187.4) sits above our
        # ceiling, so min has to come down or nothing in them is ever valid.
        - name: Bluray-2160p
          min: 25
          max: 90
          preferred: 85
        - name: Bluray-2160p Remux
          min: 25
          max: 90
          preferred: 85

    quality_profiles:
      - name: English Preferred (720p+)
        # Accept anything that clears the garbage floor. Non-English bottoms out
        # around -38000; anything carrying an unwanted format lands below -142000.
        min_format_score: -60000
        upgrade:
          allowed: true
          until_quality: Any (720p-2160p)
          # Effectively "never stop looking for something better".
          until_score: 100000
        reset_unmatched_scores:
          enabled: true
        quality_sort: top
        qualities:
          # One tier on purpose - see the header. Anything not listed here is
          # disabled, which is what enforces the 720p floor.
          - name: Any (720p-2160p)
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

    custom_formats:
      # --- Language: the dominant term ----------------------------------------
      # Reverse-scored: this only matches releases with NO English audio, so
      # English (including dubs and dual-audio) effectively scores +40000 over
      # everything else - more than resolution and every guide tier combined.
      - trash_ids:
          - 69aa1e159f97d860440b04cd6d590c4f # Language: Not English
        score: -40000
        assign_scores_to:
          - name: English Preferred (720p+)

      # Exactly cancels the -40000 above, and only for Asian-language content:
      # this CF requires a Japanese/Chinese/Korean language spec alongside the
      # dual-audio title match, so it can never fire on ordinary English TV.
      #
      # Why it is needed: Sonarr does NOT read "Dual Audio" in a title as
      # "contains English". It parses such a release as Japanese only, so the
      # language penalty fires even though the release demonstrably has an
      # English track. Netting to zero puts dual-audio anime on exactly the same
      # footing as an English release, which is the point - it hands the
      # decision back to the guide's release-group tiers.
      #
      # "Dual Audio Asian" is deliberately NOT listed with it: its regex is a
      # subset of this one, so the two nearly always co-fire, and that would
      # double the offset to +80000 and massively overshoot.
      - trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
        score: 40000
        assign_scores_to:
          - name: English Preferred (720p+)

      # A dub-only release has English audio but no original track and usually no
      # subtitles. Sonarr parses these as English, so they take no penalty and
      # already sit at parity with native English - no bonus needed. Left at 0
      # explicitly so it is clear this is a decision, not an omission: dubs and
      # dual audio now tie, and the guide's tiers break it.
      - trash_ids:
          - 9c14d194486c4014d422adc64092d794 # Dubs Only
        score: 0
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Resolution ---------------------------------------------------------
      - trash_ids:
          - 1bef6c151fa35093015b0bfef18279e5 # 2160p
        score: 12000
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - 290078c8b266272a5cc8e251b5e2eb0b # 1080p
        score: 8000
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - c99279ee27a154c2f20d1d505cc99e25 # 720p
        score: 4000
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Codec --------------------------------------------------------------
      # Deliberately NOT using "x265 (HD)" / "x265 (no HDR/DV)" - those are the
      # guide's -10000 penalties for HD HEVC re-encodes. This is the plain
      # any-resolution HEVC format, scored positive.
      - trash_ids:
          - c9eafd50846d299b862ca9bb6ea91950 # x265
        score: 2000
        assign_scores_to:
          - name: English Preferred (720p+)

      # Accepted, just ranked last. The guide rejects AV1 outright (-10000);
      # softened to a nudge so it still gets grabbed when it's all there is.
      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        score: -2000
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Hard rejects -------------------------------------------------------
      # Below min_format_score, so these are never grabbed.
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
        score: -200000
        assign_scores_to:
          - name: English Preferred (720p+)

    # --- The guide's own judgement, scores untouched ---------------------------
    # Everything above is ours. Everything here is TRaSH's, at their scores, and
    # is what makes this more than a hand-rolled config: the release-group tier
    # lists are the part of the guide that actually changes over time, and using
    # groups (rather than pinned trash_ids) means new groups and re-tierings
    # arrive on the next sync without an edit here.
    #
    # assign_scores_to is required: auto-sync of default groups only happens for
    # guide-backed (trash_id) profiles, and ours is user-defined by name.
    #
    # Deliberately NOT added: [Audio] Audio Formats. Its 750-5000 range would
    # rival the resolution ladder, and it fights the size caps above - TrueHD
    # and Atmos tracks are exactly what push a file past 90 MB/min, so it would
    # score +5000 for releases the cap then rejects.
    custom_format_groups:
      add:
        # select_all is REQUIRED for the two release-group sets: every tier CF
        # in them is opt-in (default: false), so without it the group resolves
        # to nothing at all and you silently get no tiering.
        - trash_id: b4a4353e3b3e6789dbef07677ff23686 # [Release Groups] HQ
          select_all: true
          assign_scores_to:
            - name: English Preferred (720p+)

        # Also brings Anime Raws / Anime LQ Groups at the guide's -10000. That
        # is far softer than our -100000 rejects, so those stay grabbable as a
        # last resort rather than being banned outright - deliberate.
        - trash_id: f206572b1147d0221bb1c96765b349e8 # [Release Groups] Anime
          select_all: true
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: 7e1724c5da59e7474803ad25be98f6a3 # [HDR Formats] HDR
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: abe720fab2d27682adc2a735136cec02 # [Streaming Services] General
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: d920fd959d220306888f40b6f38e1578 # [Optional] Season Packs
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: 22256473b656e195eabc2798e326fbb7 # [Required] Repack/Proper
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: 4b196eed652c65ea98d615212040ebe2 # [Required] Anime Versions
          assign_scores_to:
            - name: English Preferred (720p+)

radarr:
  radarr:
    base_url: http://radarr.radarr.svc.cluster.local:7878
    api_key: !env_var RADARR__AUTH__APIKEY

    delete_old_custom_formats: true

    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb

    media_management:
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: movie
      # Same story as Sonarr: the guide's "movie" sizes are uncapped (max 2000
      # MB/min, preferred 1999), so Radarr would chase the biggest file it can
      # find - which for Remux-2160p means 55-85 GB.
      #
      # 130 MB/min ~= 15 GB for a 115-minute movie. That keeps good 1080p and
      # the leaner 2160p WEB-DLs, and structurally excludes remuxes: a real
      # Remux-2160p runs 480-740 MB/min, so it can never fit.
      qualities:
        - name: HDTV-720p
          max: 130
          preferred: 125
        - name: WEBRip-720p
          max: 130
          preferred: 125
        - name: WEBDL-720p
          max: 130
          preferred: 125
        - name: Bluray-720p
          max: 130
          preferred: 125
        - name: HDTV-1080p
          max: 130
          preferred: 125
        - name: WEBRip-1080p
          max: 130
          preferred: 125
        - name: WEBDL-1080p
          max: 130
          preferred: 125
        - name: Bluray-1080p
          max: 130
          preferred: 125
        - name: Remux-1080p
          max: 130
          preferred: 125
        - name: HDTV-2160p
          max: 130
          preferred: 125
        - name: WEBRip-2160p
          max: 130
          preferred: 125
        - name: WEBDL-2160p
          max: 130
          preferred: 125
        - name: Bluray-2160p
          min: 34.5
          max: 130
          preferred: 125
        # Guide floor is 187.4, above our ceiling - lower it so the quality is
        # at least valid, even though real remuxes will never fit the cap.
        - name: Remux-2160p
          min: 34.5
          max: 130
          preferred: 125

    quality_profiles:
      - name: English Preferred (720p+)
        min_format_score: -60000
        upgrade:
          allowed: true
          until_quality: Any (720p-2160p)
          until_score: 100000
        reset_unmatched_scores:
          enabled: true
        quality_sort: top
        qualities:
          - name: Any (720p-2160p)
            qualities:
              - Remux-2160p
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Remux-1080p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

    custom_formats:
      # --- Language: the dominant term ----------------------------------------
      - trash_ids:
          - 0dc8aec3bd1c47cd6c40c46ecd27e846 # Language: Not English
        score: -40000
        assign_scores_to:
          - name: English Preferred (720p+)

      # See the Sonarr block: exact cancellation of the language penalty for
      # dual-audio Asian content, "Dual Audio Asian" left out to avoid doubling.
      - trash_ids:
          - 4a3b087eea2ce012fcc1ce319259a3be # Anime Dual Audio
        score: 40000
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - b23eae459cc960816f2d6ba84af45055 # Dubs Only
        score: 0
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Resolution ---------------------------------------------------------
      - trash_ids:
          - fb392fb0d61a010ae38e49ceaa24a1ef # 2160p
        score: 12000
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - 820b09bb9acbfde9c35c71e0e565dad8 # 1080p
        score: 8000
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - b2be17d608fc88818940cd1833b0b24c # 720p
        score: 4000
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Codec --------------------------------------------------------------
      - trash_ids:
          - 9170d55c319f4fe40da8711ba9d8050d # x265
        score: 2000
        assign_scores_to:
          - name: English Preferred (720p+)

      - trash_ids:
          - cae4ca30163749b891686f95532519bd # AV1
        score: -2000
        assign_scores_to:
          - name: English Preferred (720p+)

      # --- Hard rejects -------------------------------------------------------
      - trash_ids:
          - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ed38b889b31be83fda192888e2286d83 # BR-DISK
          - 0a3f082873eb454bde444150b70253cc # Extras
          - e6886871085226c3da1830830146846c # Generated Dynamic HDR
          - c465ccc73923871b3eb1802042331306 # Line/Mic Dubbed
          - 90a6f9a284dff5103f6346090e6280c8 # LQ
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
          - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled
        score: -200000
        assign_scores_to:
          - name: English Preferred (720p+)

    # --- The guide's own judgement, scores untouched ---------------------------
    # Same split as Sonarr. Radarr's HQ tiers reach 1950 (it has UHD Bluray
    # tiers Sonarr lacks), which is what sets the 4000 resolution step above.
    # Also not added: [Audio] Audio Formats (see Sonarr); no season-pack group
    # exists for Radarr.
    custom_format_groups:
      add:
        - trash_id: b2f2af430f73f3ad1f9948f33e0f0cf8 # [Release Groups] HQ
          select_all: true
          assign_scores_to:
            - name: English Preferred (720p+)

        # Radarr's copy of this group also contains Anime Dual Audio, which we
        # score explicitly above - excluded here so there is exactly one source
        # of truth for it.
        - trash_id: 1f8404f7f72c7edc8901f2f3589d1a91 # [Release Groups] Anime
          select_all: true
          exclude:
            - 4a3b087eea2ce012fcc1ce319259a3be # Anime Dual Audio
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46 # [HDR Formats] HDR
          assign_scores_to:
            - name: English Preferred (720p+)

        # Mostly unscored in the guide for Radarr (only BCORE/CRiT/MA carry
        # 15-20), so this is close to a no-op - included for symmetry and so it
        # picks up scores if the guide ever adds them.
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028 # [Streaming Services] General
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: d688ff99733a9bc626c37eb61ea74704 # [Required] Repack/Proper
          assign_scores_to:
            - name: English Preferred (720p+)

        - trash_id: 6ebc4bfba9721581d3e9e8994456e6f7 # [Required] Anime Versions
          assign_scores_to:
            - name: English Preferred (720p+)
