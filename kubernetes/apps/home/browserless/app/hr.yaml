---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browserless
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
  values:
    controllers:
      browserless:
        strategy: RollingUpdate
        pod:
          securityContext:
            runAsNonRoot: true
            # "blessuser"
            runAsGroup: 999
            runAsUser: 999
            seccompProfile: {type: RuntimeDefault}
        containers:
          browserless:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.57.1@sha256:93dc614e2532ee66bac78f68b6229c33392309293c626d2a0899ccdf0c8aac67
            env:
              CONCURRENT: 5
              QUEUED: 10
              TIMEOUT: 60000
              DEBUG: browserless*:info
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /active
                    port: &port 3000
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 12Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
    service:
      browserless:
        controller: browserless
        ports:
          http:
            port: *port
    networkpolicies:
      browserless:
        type: cilium
        controller: browserless
        ingress:
          # open-webui's Playwright web loader
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: open-webui
                  app.kubernetes.io/instance: open-webui
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
        egress:
          # Headless Chromium against arbitrary public sites
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
                  - {port: "443", protocol: UDP}
        egressDeny:
          # Keep the LAN out of reach (SSRF)
          - toCIDRSet:
              - cidrGroupRef: private-networks
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/run
            subPath: run
          - path: /home/blessuser
            subPath: home
          - path: /usr/src/app/workspace
            subPath: workspace
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
