---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browserless
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
  values:
    controllers:
      browserless:
        strategy: RollingUpdate
        pod:
          securityContext:
            runAsNonRoot: true
            # "blessuser"
            runAsGroup: 999
            runAsUser: 999
            seccompProfile: {type: RuntimeDefault}
        containers:
          browserless:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.64.4@sha256:cee2fee0b7c92dfb70f0ab0738801a358b8548e5fdb954d5ca9315e459d11a71
            env:
              CONCURRENT: 5
              QUEUED: 10
              TIMEOUT: 60000
              DEBUG: browserless*:info
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /active
                    port: &port 3000
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 12Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
    service:
      browserless:
        controller: browserless
        ports:
          http:
            port: *port
    networkpolicies:
      browserless:
        type: cilium
        controller: browserless
        ingress:
          # hermes's browser tools (CDP)
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: hermes
                  app.kubernetes.io/instance: hermes
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
        egress:
          # Headless Chromium against arbitrary public sites
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
                  - {port: "443", protocol: UDP}
        egressDeny:
          # Keep the LAN out of reach (SSRF)
          - toCIDRSet:
              - cidrGroupRef: private-networks
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/run
            subPath: run
          - path: /home/blessuser
            subPath: home
          - path: /usr/src/app/workspace
            subPath: workspace
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
