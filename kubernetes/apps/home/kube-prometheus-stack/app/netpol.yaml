---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-home
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      operator.prometheus.io/name: kube-prometheus-stack
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
    # rook-ceph mgr (hostNetwork) prometheusEndpoint for the dashboard
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
  egress:
    # opnsense ScrapeConfig (NODE_GATEWAY)
    - toCIDR:
        - ${NODE_GATEWAY}/32
      toPorts:
        - ports:
            - {port: "9100", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-home
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: silence-operator
            app.kubernetes.io/name: silence-operator
      toPorts:
        - ports:
            - {port: "9093", protocol: TCP}
