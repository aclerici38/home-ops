---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/grafana-operator/5.25.0/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: opnsense
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  # Held at revision 7, the last one published in the classic dashboard schema.
  # Revision 8 is dashboard.grafana.app/v2, and grafana-operator unconditionally
  # sets a root "id" key on every model it resolves (content/resolver.go), which
  # Grafana rejects for v2 payloads: "The k8s style dashboard must not include an
  # id on the root element". Renovate is pinned to match in renovate/grafanaDashboards.json5.
  url: https://grafana.com/api/dashboards/19366/revisions/7/download
