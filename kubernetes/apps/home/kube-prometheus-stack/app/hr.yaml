---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 94.1.0
        digest: sha256:ad187276d823edb8f3655a3e538f311b9fe76d9fba008e8f0fa195dce18242e0
      url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  # Admission webhook certs are issued by cert-manager
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
  values:
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - "alertmanager.clerici.tech"
          parentRefs:
            - name: trusted
              namespace: envoy-gateway
              sectionName: https
      alertmanagerSpec:
        externalUrl: https://alertmanager.clerici.tech
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-filesystem
              resources:
                requests:
                  storage: 5Gi
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - "prometheus.clerici.tech"
          parentRefs:
            - name: trusted
              namespace: envoy-gateway
              sectionName: https
      prometheusSpec:
        # nfs_available (prometheus-adapter) must keep resolving while bonds drains.
        affinity: &notBonds
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - "bonds"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-filesystem
              resources:
                requests:
                  storage: 50Gi
    kube-state-metrics:
      affinity: *notBonds
