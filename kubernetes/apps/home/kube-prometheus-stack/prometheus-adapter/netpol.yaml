---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-adapter
spec:
  # apiserver egress (delegated authn/authz) comes from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
  ingress:
    # v1beta1.external.metrics.k8s.io APIService (Service 443 -> 6443)
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            operator.prometheus.io/name: kube-prometheus-stack
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-adapter-clients
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      operator.prometheus.io/name: kube-prometheus-stack
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus-adapter
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
