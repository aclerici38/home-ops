---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-adapter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prometheus-adapter
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    prometheus:
      url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc
      port: 9090
    logLevel: 2
    rules:
      # External metrics only
      default: false
      external:
        # 1 while nfs-server is serving and bonds is schedulable, else 0.
        - seriesQuery: 'kube_deployment_status_replicas_available{namespace="nfs-server",deployment="nfs-server"}'
          resources:
            namespaced: false
          name:
            matches: ^kube_deployment_status_replicas_available$
            as: nfs_available
          metricsQuery: |-
            clamp_max(
              min(last_over_time(kube_deployment_status_replicas_available{namespace="nfs-server",deployment="nfs-server"}[2m]))
              * (1 - max(last_over_time(kube_node_spec_unschedulable{node="bonds"}[2m])))
            , 1)
    # Must stay up while bonds drains, or the HPAs can't read the metric and hold.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - "bonds"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
