---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.1.2
        digest: sha256:05c548d9bab6ca77b294888ab1f7b0adf863bd54dc4c20ceb3be3987b83c7e83
      url: oci://ghcr.io/home-operations/charts/multus
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
            subject: "^https://github\\.com/home-operations/.*"
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    # Pods may only attach NADs in their own namespace or in multus (the shared
    # house/cottage/iot/lab networks). Single-tenant networks live in the
    # consuming app's namespace (e.g. frigate/security) so nothing else can join.
    extraArgs:
      - --namespace-isolation=true
      - --global-namespaces=multus
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 32Mi
