---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: multus
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    # Pods may only attach NADs in their own namespace or in multus (the shared
    # house/cottage/iot/lab networks). Single-tenant networks live in the
    # consuming app's namespace (e.g. frigate/security) so nothing else can join.
    extraArgs:
      - --namespace-isolation=true
      - --global-namespaces=multus
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 32Mi
