---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: matter-server-resources
  values:
    controllers:
      matter-server:
        pod:
          nodeSelector:
            network.dormammu/multus: "true"
          securityContext:
            sysctls:
              # accept RA route-info (Thread OMR prefix) on every multus interface
              - name: net.ipv6.conf.iot.accept_ra_rt_info_max_plen
                value: "64"
              - name: net.ipv6.conf.cottage.accept_ra_rt_info_max_plen
                value: "64"
              - name: net.ipv6.conf.house.accept_ra_rt_info_max_plen
                value: "64"
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          annotations:
            # iot = wifi matter devices; cottage/house = trusted VLANs
            # (Thread OMR routes + operational mDNS from the OTBR backbones)
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name":"iot",
                  "namespace": "multus",
                  "interface": "iot",
                  "ips": ["10.0.80.23/24"],
                  "mac": "64:16:7F:33:88:AC"
                },
                {
                  "name":"cottage",
                  "namespace": "multus",
                  "interface": "cottage",
                  "ips": ["10.0.40.23/24"],
                  "mac": "64:16:7F:33:88:AD"
                },
                {
                  "name":"house",
                  "namespace": "multus",
                  "interface": "house",
                  "ips": ["10.0.20.23/24"],
                  "mac": "64:16:7F:33:88:AE"
                }
              ]
        containers:
          matter-server:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e
            args:
              - --storage-path=/data
              - --ota-provider-dir=/data/ota
              - --production-mode
            env:
              MATTER_LOG_FORMAT: plain
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5580
              readiness: *probe
            resources:
              requests:
                cpu: 47m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
    service:
      matter-server:
        controller: matter-server
        ports:
          http:
            port: 5580
    route:
      matter-server:
        hostnames:
          - matter.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      matter-server:
        type: cilium
        controller: matter-server
        ingress:
          - fromEndpoints:
              # Route (dashboard)
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              # Matter integration
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: home-assistant
                  app.kubernetes.io/instance: home-assistant
            toPorts:
              - ports:
                  - {port: "5580", protocol: TCP}
        egress:
          # DCL + GitHub PAA certs, plus the vendor-hosted OTA images and CRLs
          # the DCL points at, which can be any host
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
          # mDNS goes out every interface, eth0 included (matter.js can only
          # limit it to one, and it needs all three multus nets). Allowing it
          # lets it die quietly at the host instead of tripping CiliumPolicyDrops
          - toCIDR:
              - 224.0.0.251/32
            toPorts:
              - ports:
                  - {port: "5353", protocol: UDP}
        egressDeny:
          - toCIDRSet:
              - cidrGroupRef: private-networks
    persistence:
      data:
        existingClaim: matter-server
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
