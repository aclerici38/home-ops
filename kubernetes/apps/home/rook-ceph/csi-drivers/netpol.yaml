---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ceph-csi-ctrlplugin
spec:
  # rbd + cephfs provisioners; apiserver egress comes from the
  # apiserver-clients CCNP. The node plugins are hostNetwork.
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - rook-ceph.rbd.csi.ceph.com-ctrlplugin
          - rook-ceph.cephfs.csi.ceph.com-ctrlplugin
  ingress:
    - {}
  egress:
    # Ceph is hostNetwork: mons (msgr2 only), then osd/mds/mgr
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "3300", protocol: TCP}
            - {port: "6800", endPort: 7568, protocol: TCP}
