---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.3/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  maxHistory: 1
  chart:
    spec:
      chart: ceph-csi-drivers
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
      version: 1.0.4
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: rook-ceph
  values:
    operatorConfig:
      create: true
      name: ceph-csi-operator-config
      namespace: rook-ceph
      driverSpecDefaults:
        log:
          verbosity: 0
          rotation:
            enabled: false
        imageSet:
          name: rook-csi-operator-image-set-configmap
        clusterName: rook-ceph
        enableFencing: false
        enableMetadata: false
        generateOMapInfo: false
        deployCsiAddons: false
        attachRequired: true
        fsGroupPolicy: File
        cephFsClientType: kernel
        grpcTimeout: 150 # chart default 30
        snapshotPolicy: volumeSnapshot # chart default "none" drops the snapshotter sidecar
        nodePlugin:
          kubeletDirPath: /var/lib/kubelet
          enableSeLinuxHostMount: false
          priorityClassName: system-node-critical
          imagePullPolicy: IfNotPresent
          updateStrategy:
            type: RollingUpdate
          resources:
            registrar:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            plugin:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
        controllerPlugin:
          replicas: 2
          hostNetwork: false
          privileged: false
          priorityClassName: system-cluster-critical
          imagePullPolicy: IfNotPresent
          deploymentStrategy:
            type: Recreate
          resources:
            attacher: &sidecar
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
            provisioner: *sidecar
            resizer: *sidecar
            snapshotter: *sidecar
            omapGenerator: &heavy
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
            plugin: *heavy
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        grpcTimeout: 150
        snapshotPolicy: volumeSnapshot
        log:
          verbosity: 0
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          verbosity: 0
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
