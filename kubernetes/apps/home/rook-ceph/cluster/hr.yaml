---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  dependsOn:
    - name: rook-ceph
    - name: ceph-csi-drivers
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        CephNodeDiskspaceWarning:
          disabled: true
        CephNodeNetworkPacketDrops:
          for: 15m
          expr: |
            (
              rate(node_network_receive_drop_total{device!~"lo|bond1[.].*"}[1m]) +
              rate(node_network_transmit_drop_total{device!~"lo|bond1[.].*"}[1m])
            ) / (
              rate(node_network_receive_packets_total{device!~"lo|bond1[.].*"}[1m]) +
              rate(node_network_transmit_packets_total{device!~"lo|bond1[.].*"}[1m])
            ) >= 0.005 and (
              rate(node_network_receive_drop_total{device!~"lo|bond1[.].*"}[1m]) +
              rate(node_network_transmit_drop_total{device!~"lo|bond1[.].*"}[1m])
            ) >= 10
        CephNodeNetworkBondDegraded:
          for: 15m
        CephMonClockSkew:
          for: 15m
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.clerici.tech
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: internal
            namespace: kgateway
            sectionName: https
    cephClusterSpec:
      upgradeOSDRequiresHealthyPGs: true
      csi:
        cephfs:
          kernelMountOptions: ms_mode=crc
      mon:
        count: 3
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: none
          osd_pool_default_size: "2" # quote; 2 OSDs, every pool is size 2
        mgr:
          log_max_recent: "100" # quote; bounds rook/rook#17786 mgr heap growth on ceph v20.2.2
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.kube-prometheus-stack.svc.cluster.local:9090
      mgr:
        modules:
          - name: diskprediction_local
            enabled: false
          # Removed in Tentacle (v20)
          - name: restful
            enabled: false
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      resources:
        mgr:
          limits:
            memory: 4Gi
        osd:
          limits:
            memory: 8Gi
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          - name: "bonds"
            devices:
              - name: "/dev/disk/by-id/nvme-eui.000000000000000100a07523458d4f6c"
          - name: "cain"
            devices:
              - name: "/dev/disk/by-id/nvme-eui.000000000000000100a075254e4190df"
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 2
            parameters:
              min_size: "1"
          dataPools:
            - failureDomain: host
              replicated:
                size: 2
              parameters:
                min_size: "1"
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "ms_mode=crc"
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 2
          parameters:
            min_size: "1"
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      # devicehealth stores its sqlite DB here. Without this pool the mgr raises
      # MgrDBNotReady and diskprediction_local crashes it daily at 00:00.
      - name: builtin-mgr
        spec:
          name: .mgr
          failureDomain: host
          replicated:
            size: 2
          parameters:
            min_size: "1"
        storageClass:
          enabled: false
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: true
      deletionPolicy: Delete
    cephObjectStores: []
