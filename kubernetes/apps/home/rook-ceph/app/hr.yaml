---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  # ceph-csi-operator subchart: no pod-label value, and an unconditional
  # NetworkPolicy whose `egress: [{}]` (allow all) would union away netpol.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ceph-csi-controller-manager
            patch: |
              - op: add
                path: /spec/template/metadata/labels/dormammu.internal~1apiserver-client
                value: "true"
          - target:
              kind: NetworkPolicy
              name: ceph-csi-ceph-csi-controller-manager
            patch: |
              $patch: delete
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: ceph-csi-ceph-csi-controller-manager
  values:
    operatorPodLabels:
      dormammu.internal/apiserver-client: "true"
    currentNamespaceOnly: true
    csi:
      installCsiOperator: true
      createCsiOperatorResources: true
      serviceMonitor:
        enabled: false
    enableDiscoveryDaemon: false
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
