---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      filebrowser:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          filebrowser:
            image:
              repository: ghcr.io/gtsteffaniak/filebrowser
              tag: 2.1.0-stable@sha256:17de8d0ac6a6bcfd5ef9aca43d6c0aa2fd031a07d6ee9b8a3b7c6c646efe35bf
            env:
              FILEBROWSER_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: filebrowser-oidc-credentials
                  key: client_id
              FILEBROWSER_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: filebrowser-oidc-credentials
                  key: client_secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 6Gi
    service:
      filebrowser:
        controller: filebrowser
        ports:
          http:
            port: *port
    route:
      filebrowser:
        hostnames:
          - filebrowser.clerici.tech
        parentRefs:
          - name: trusted
            namespace: envoy-gateway
    networkpolicies:
      filebrowser:
        type: cilium
        controller: filebrowser
        ingress:
          # Route
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: trusted
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        # OIDC egress comes from filebrowser-pocket-id; the media NFS mount is the node's
        egress:
          - {}
    persistence:
      database:
        existingClaim: filebrowser
        globalMounts:
          - path: /home/filebrowser/database
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      config:
        type: configMap
        name: filebrowser
        globalMounts:
          - path: /home/filebrowser/data/config.yaml
            subPath: config.yaml
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /mnt/media
    configMaps:
      config:
        data:
          config.yaml: |-
            server:
              disableUpdateCheck: true
              cacheDir: /tmp
              database:
                path: /home/filebrowser/database/filebrowser.sqlite
              sources:
                - name: Media
                  path: /mnt/media
            http:
              port: 8080
              externalUrl: https://filebrowser.clerici.tech
              # Required behind envoy, otherwise the OIDC redirect_uri is built as http://
              trustProxyHeaders: true
              disableWebDAV: true
            auth:
              methods:
                password:
                  enabled: false
                oidc:
                  enabled: true
                  issuerUrl: https://id.clerici.tech
                  scopes: openid email profile groups
                  adminGroup: admin
  dependsOn:
    - name: filebrowser-resources
