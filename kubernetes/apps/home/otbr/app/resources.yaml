---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: kopiur
      namespace: kopiur
    - name: envoy-gateway
      namespace: envoy-gateway
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    # One client and one SecurityPolicy for both sites' web UIs
    pocketId:
      name: OpenThread Border Router
      url: otbr-house.clerici.tech
      callbackUrls:
        - https://otbr-house.clerici.tech/oauth2/callback
        - https://otbr-cottage.clerici.tech/oauth2/callback
      logoutCallbackUrls:
        - https://otbr-house.clerici.tech/
        - https://otbr-cottage.clerici.tech/
      spec:
        oidcClient:
          logo:
            nameOverride: thread
          secret:
            keys:
              clientID: client-id
              clientSecret: client-secret
    oidc:
      spec:
        securityPolicy:
          targetRefs:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: otbr-house
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: otbr-cottage
    kopiur:
      existingClaim: true
      cephfs: true
      spec:
        policy:
          mover:
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            podSecurityContext:
              fsGroup: 0
