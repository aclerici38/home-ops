---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: socat
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      # ZBDongle-E (ot-rcp, no flow control) on belt, which has no multus leg
      socat:
        pod:
          priorityClassName: otbr-socat
          nodeSelector:
            kubernetes.io/hostname: belt
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            supplementalGroups:
              - 20
            seccompProfile:
              type: RuntimeDefault
        containers:
          socat:
            image:
              repository: mirror.gcr.io/alpine/socat
              tag: 1.8.1.3@sha256:5aa280c6fc5bee94dbd2bbdf2a58d30f50396eaa110be84b03636945b157ae68
            # TCP_USER_TIMEOUT (6:18) drops dead clients; keepalive never fires on a busy spinel stream
            args:
              - -dd
              - TCP-LISTEN:7638,fork,max-children=1,nodelay,keepalive,keepidle=10,keepintvl=10,keepcnt=3,setsockopt-int=6:18:30000
              - GOPEN:/dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_d4f0088f4c1fef119b9450d0639e525b-if00-port0,rawer,b460800,crtscts=0
            # A TCP probe would grab the single serial session
            probes:
              liveness: {enabled: false}
              readiness: {enabled: false}
              startup: {enabled: false}
            resources:
              requests:
                cpu: 10m
                memory: 8Mi
              limits:
                memory: 32Mi
                devic.es/sonoff-dongle-e: 1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
    service:
      socat:
        controller: socat
        ports:
          rcp:
            port: 7638
    networkpolicies:
      socat:
        type: cilium
        controller: socat
        ingress:
          - fromEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: otbr
                  app.kubernetes.io/controller: office
            toPorts:
              - ports:
                  - {port: "7638", protocol: TCP}
