---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-exporter
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      speedtest-exporter:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          speedtest-exporter:
            image:
              repository: ghcr.io/miguelndecarvalho/speedtest-exporter
              tag: v3.5.4@sha256:f1064d49124c7fc45faabb87c6c876a2fd04e92b3dc14d4b871301217ba30fed
            probes:
              readiness: &probes
                enabled: true
                type: HTTP
              liveness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      speedtest-exporter:
        controller: speedtest-exporter
        ports:
          http:
            port: &port 9798
    networkpolicies:
      speedtest-exporter:
        type: cilium
        controller: speedtest-exporter
        # Only Prometheus scrapes it (baseline)
        ingress:
          - {}
        egress:
          # Ookla API: server list, CLI config, result upload
          - toFQDNs:
              - matchPattern: "*.speedtest.net"
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
          # 8080 is the test port, 5060 the TCP fallback, UDP 8080 the packet-loss probe
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
                  - {port: "8080", protocol: UDP}
                  - {port: "5060", protocol: TCP}
        egressDeny:
          - toCIDRSet:
              - cidrGroupRef: private-networks
    serviceMonitor:
      speedtest-exporter:
        serviceName: speedtest-exporter
        endpoints:
          - port: http
            interval: 1h
            scrapeTimeout: 2m
