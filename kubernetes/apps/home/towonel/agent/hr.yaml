---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 1.15.1
        digest: sha256:e1b4d8cb87c60eccdc25b2af6b862cffa5b50df1ea6700c50d724483514594ae
      url: oci://git.ow-ops.eu/towonel/charts/towonel-agent
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  valuesFrom:
    - kind: ConfigMap
      name: towonel-agent-values
      valuesKey: values.yaml
  # home-only: syncthing's sync protocol, so the RV can reach it from off-LAN.
  # Not HTTPS, so it cannot ride the shared `services` hostname routes. Both
  # transports are exposed and syncthing picks whichever connects.
  values:
    agent:
      tcpServices:
        - name: syncthing
          origin: &origin syncthing-sync.syncthing.svc.cluster.local:22000
          listen_port: &syncPort 22000
      udpServices:
        - name: syncthing-quic
          origin: *origin
          listen_port: *syncPort
        - name: home-wireguard
          origin: 10.0.30.1:51823
          listen_port: 51823
