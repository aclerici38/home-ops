---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/silence-operator/0.20.1/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: nas-memory-high-utilization
spec:
  matchers:
    - name: alertname
      value: NodeMemoryHighUtilization
    - name: instance
      value: ${BONDS_IP}:9100
