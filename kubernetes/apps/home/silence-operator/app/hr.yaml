---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=silence-operator/0.22.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.22.0
        digest: sha256:f8d727fe09855019235a7b98ea635006cc0b6ec12835015ab21d17f1de943738
      url: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  # The chart has no pod-label value; apiserver egress via the apiserver-clients CCNP
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: silence-operator
            patch: |
              - op: add
                path: /spec/template/metadata/labels/dormammu.internal~1apiserver-client
                value: "true"
  values:
    alertmanagerAddress: http://kube-prometheus-stack-alertmanager.kube-prometheus-stack:9093
    networkPolicy:
      enabled: false
