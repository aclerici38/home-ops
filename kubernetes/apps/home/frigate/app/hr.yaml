---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      frigate:
        pod:
          # Cameras are reached over L2 on the security VLAN (bond1.50)
          nodeSelector:
            network.dormammu/multus: "true"
          # Opts into the descheduler multus profile
          labels:
            dormammu.internal/multus: "true"
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name": "security",
                  "namespace": "frigate",
                  "interface": "security",
                  "ips": ["10.0.50.25/24"],
                  "mac": "64:16:7F:50:F1:25"
                }
              ]
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: frigate-gpu
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: Unconfined}
        initContainers:
          # Crashloops if multus interfaces are missing; the descheduler recreates the pod
          multus-guard:
            image:
              repository: mirror.gcr.io/library/busybox
              tag: 1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
            command:
              - sh
              - -c
              - |
                for i in "$@"; do
                  [ -e "/sys/class/net/$i" ] || { echo "multus interface $i missing"; exit 1; }
                done
              - multus-guard
            args:
              - security
            resources:
              requests:
                cpu: 10m
                memory: 8Mi
              limits:
                memory: 16Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
              seccompProfile: {type: RuntimeDefault}
        containers:
          frigate:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
            env:
              HF_HOME: /tmp
              # FRIGATE_MEMRAY_MODULES: frigate.detector:openvino
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              S6_READ_ONLY_ROOT: 1
              # Substituted into mqtt: in config.yaml on the PVC
              FRIGATE_MQTT_HOST:
                secretKeyRef:
                  name: frigate-mqtt-credentials
                  key: host
              FRIGATE_MQTT_USER:
                secretKeyRef:
                  name: frigate-mqtt-credentials
                  key: username
              FRIGATE_MQTT_PASSWORD:
                secretKeyRef:
                  name: frigate-mqtt-credentials
                  key: password
            envFrom:
              - secretRef:
                  name: frigate
            securityContext:
              allowPrivilegeEscalation: false
              # Frigate does in-place nginx config editing, so no true readonly root fs
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  # S6
                  - CHOWN
                  - SETUID
                  - SETGID
                  - FOWNER
                  - DAC_OVERRIDE
            resources:
              requests:
                cpu: 2000m
                memory: 2Gi
              limits:
                memory: 16Gi
              claims:
                - name: gpu
    service:
      frigate:
        controller: frigate
        type: ClusterIP
        ports:
          http:
            port: 5000
          http-auth:
            primary: true
            port: &auth 8971
          rtsp:
            port: 8554
          webrtc:
            port: 8555
          go2rtc:
            port: 1984
    route:
      auth:
        forceRename: frigate
        annotations:
          gatus.home-operations.com/endpoint: |-
            client:
              ignore-redirect: true
            conditions:
              - "[STATUS] == 302"
        hostnames:
          - frigate.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: frigate
                port: *auth
      # Birdseye stream via go2rtc
      birdseye:
        hostnames:
          - birdseye.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /api/birdseye/latest.jpg
            backendRefs:
              - identifier: frigate
                port: 5000
          - matches:
              - path:
                  type: Exact
                  value: /video-rtc.js
              - path:
                  type: Exact
                  value: /api/ws
                queryParams:
                  - type: Exact
                    name: src
                    value: birdseye
            backendRefs:
              - identifier: frigate
                port: 1984
    networkpolicies:
      frigate:
        type: cilium
        controller: frigate
        ingress:
          # Authenticated UI route
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "8971", protocol: TCP}
          # Birdseye route
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
            toPorts:
              - ports:
                  - {port: "5000", protocol: TCP}
                  - {port: "1984", protocol: TCP}
          # Frigate integration: API + RTSP restream for camera entities
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: home-assistant
                  app.kubernetes.io/instance: home-assistant
            toPorts:
              - ports:
                  - {port: "5000", protocol: TCP}
                  - {port: "8554", protocol: TCP}
        # Only eth0 is policed: *.security.internal cameras are reached on the
        # security multus leg (10.0.50.0/24), which bypasses Cilium.
        egress:
          # Cottage camera is on the cottage VLAN, still routed: RTSP + ONVIF
          - toFQDNs:
              - matchName: cottage-yard-cam.cottage.internal
            toPorts:
              - ports:
                  - {port: "554", protocol: TCP}
                  - {port: "2020", protocol: TCP}
          # Gate access panel is on the voip VLAN, routed: RTSP only
          - toFQDNs:
              - matchName: gate-access-panel.voip.internal
            toPorts:
              - ports:
                  - {port: "554", protocol: TCP}
          # Semantic search / classification models
          - toFQDNs:
              - matchName: huggingface.co
              - matchPattern: "**.hf.co"
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    configMaps:
      # temp until v0.19
      # https://github.com/blakeblackshear/frigate/pull/24573 https://github.com/blakeblackshear/frigate/pull/24010
      paho-select-fix:
        data:
          paho_select_fix.py: |
            import selectors
            import types

            def _select(rlist, wlist, xlist, timeout=None):
                events = {}
                for obj in rlist:
                    events[obj] = events.get(obj, 0) | selectors.EVENT_READ
                for obj in wlist:
                    events[obj] = events.get(obj, 0) | selectors.EVENT_WRITE
                with selectors.DefaultSelector() as sel:
                    for obj, mask in events.items():
                        sel.register(obj, mask)
                    ready = sel.select(timeout)
                r = [key.fileobj for key, mask in ready if mask & selectors.EVENT_READ]
                w = [key.fileobj for key, mask in ready if mask & selectors.EVENT_WRITE]
                return r, w, []

            try:
                import paho.mqtt.client as _paho_client
            except ImportError:
                pass
            else:
                _paho_client.select = types.SimpleNamespace(select=_select)
          # site.py executes `import` lines in .pth files at interpreter startup
          paho-select-fix.pth: |
            import paho_select_fix
    persistence:
      config:
        existingClaim: frigate
      media:
        existingClaim: frigate-media
        globalMounts:
          - path: /media/frigate
      tmpfs:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /run
            subPath: run
          - path: /tmp
            subPath: tmp
          - path: /dev/shm
            subPath: shm
          - path: /etc/letsencrypt
            subPath: letsencrypt
            # memray dumps are huge
            # - path: /config/memray_reports
            #   subPath: memray
      paho-select-fix:
        type: configMap
        identifier: paho-select-fix
        globalMounts:
          - path: /usr/local/lib/python3.11/dist-packages/paho_select_fix.py
            subPath: paho_select_fix.py
            readOnly: true
          - path: /usr/local/lib/python3.11/dist-packages/paho-select-fix.pth
            subPath: paho-select-fix.pth
            readOnly: true
  dependsOn:
    - name: frigate-resources
