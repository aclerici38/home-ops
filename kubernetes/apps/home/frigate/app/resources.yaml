---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: intel-gpu-resource-driver
      namespace: intel-gpu-resource-driver
    - name: envoy-gateway
      namespace: envoy-gateway
    - name: nfs-server
      namespace: nfs-server
    - name: pocket-id-operator
      namespace: pocket-id-operator
    - name: kopiur
      namespace: kopiur
  values:
    externalSecret:
      spec:
        data:
          - secretKey: FRIGATE_MQTT_PASS
            remoteRef:
              key: home-mosquitto
              property: FRIGATE_MQTT_PASS
    gpu: {}
    kopiur:
      existingClaim: true
      # Back up config.yaml + model_cache (the custom classification models are
      # trained artifacts, not re-downloadable) and skip the sqlite DB. Restoring
      # the DB is only ever useful alongside the media it indexes, which lives on
      # nfs-tank and isn't backed up — so a restored DB just yields dead thumbnails.
      # An empty DB is the correct post-restore state; retention re-indexes from
      # scratch. backup.db is frigate's pre-migration copy, dead weight after an
      # upgrade settles.
      ignoreRules:
        - /frigate.db*
        - /backup.db
    pocketId:
      group: fam
      clientID: frigate-home
      name: Frigate (Home)
      callbackPaths:
        - oauth2/callback
      spec:
        logo:
          nameOverride: frigate
        secret:
          keys:
            clientID: client-id
            clientSecret: client-secret
    oidc:
      spec:
        extension:
          oauth2:
            jwt:
              idToken:
                claimsToHeaders:
                  - name: preferred_username
                    header: x-forwarded-user
                  - name: frigate_role
                    header: x-forwarded-groups
