---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: intel-gpu-resource-driver
      namespace: intel-gpu-resource-driver
    - name: envoy-gateway
      namespace: envoy-gateway
    - name: nfs-server
      namespace: nfs-server
    - name: pocket-id-operator
      namespace: pocket-id-operator
    - name: kopiur
      namespace: kopiur
  values:
    externalSecret:
      spec:
        data:
          - secretKey: FRIGATE_MQTT_PASS
            remoteRef:
              key: home-mosquitto
              property: FRIGATE_MQTT_PASS
    gpu: {}
    kopiur:
      existingClaim: true
      # Back up config.yaml + model_cache (the custom classification models are
      # trained artifacts, not re-downloadable) and skip the sqlite DB. Restoring
      # the DB is only ever useful alongside the media it indexes, which lives on
      # nfs-tank and isn't backed up — so a restored DB just yields dead thumbnails.
      # An empty DB is the correct post-restore state; retention re-indexes from
      # scratch. backup.db is frigate's pre-migration copy, dead weight after an
      # upgrade settles.
      ignoreRules:
        - /frigate.db*
        - /backup.db
    pocketId:
      group: fam
      clientID: frigate-home
      name: Frigate (Home)
      callbackPaths:
        - /oauth2/callback
      spec:
        logo:
          nameOverride: frigate
        secret:
          keys:
            clientID: client-id
            clientSecret: client-secret
    oidc:
      spec:
        securityPolicy:
          # Frigate reads identity off headers (proxy.header_map in the on-PVC
          # config.yml). Envoy Gateway has no claim-to-header under oidc, so the
          # ID token is forwarded on a header and a jwt provider maps its claims.
          # The oauth2 filter is order 9 and jwt_authn order 10, so the token is
          # on the request by the time the provider reads it. Envoy strips
          # x-oidc-id-token off inbound requests, so it can't be spoofed.
          oidc:
            forwardIDToken:
              header: x-oidc-id-token
          jwt:
            # optional => Envoy's allow_missing, NOT allow_missing_or_failed: a
            # session that got past oauth2 carrying no ID token falls through to
            # proxy.default_role (viewer), but a malformed or wrong-audience
            # token is still a 401. oauth2, not this, is what enforces authn.
            optional: true
            providers:
              - name: frigate
                issuer: https://id.clerici.tech
                # Binds the token to frigate's own client, so an ID token minted
                # for another clerici.tech app can't be replayed here.
                audiences:
                  - frigate-home
                extractFrom:
                  headers:
                    - name: x-oidc-id-token
                remoteJWKS:
                  uri: https://id.clerici.tech/.well-known/jwks.json
                  # Same issuer short-circuit the chart applies to the token
                  # endpoint: discovery through this very Gateway would deadlock.
                  backendRefs:
                    - group: gateway.envoyproxy.io
                      kind: Backend
                      name: frigate-oidc-backend
                claimToHeaders:
                  - claim: preferred_username
                    header: x-forwarded-user
                  - claim: frigate_role
                    header: x-forwarded-groups
