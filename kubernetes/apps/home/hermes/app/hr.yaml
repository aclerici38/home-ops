---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: hermes-resources
  values:
    controllers:
      hermes:
        pod:
          hostUsers: false
          securityContext:
            # The image's baked hermes uid; its entrypoint exits on any other non-root uid
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        initContainers:
          # HERMES_HOME must be owned by the gateway uid, and a volume root is root-owned.
          # Hermes only scans HERMES_HOME/plugins, so repo plugins are copied in on each start.
          home:
            image: &image
              repository: mirror.gcr.io/nousresearch/hermes-agent
              tag: v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
            command:
              - "sh"
              - "-ec"
              - |
                dst=/pvc/hermes/plugins/web-tika
                rm -rf "$dst" && mkdir -p "$dst"
                cp -L /plugin-src/web-tika/* "$dst"/
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          hermes:
            image: *image
            # The image's default CMD is the interactive CLI, which exits without a TTY
            args:
              - "gateway"
              - "run"
            env:
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              HERMES_MANAGED_DIR: /etc/hermes-managed
              HERMES_DASHBOARD: 1
              # Loopback only; the gateway's own cron/control plane uses it
              API_SERVER_ENABLED: true
              SEARXNG_URL: http://searxng.searxng.svc.cluster.local:8080
              TIKA_SERVER_URL: http://tika.tika.svc.cluster.local:9998
              # Socket read; the remote default (120s) can expire mid-prefill
              HERMES_STREAM_READ_TIMEOUT: 1800
            securityContext: *sec
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                path: /api/status
                port: &dashboard 9119
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      hermes:
        controller: hermes
        ports:
          webapp:
            port: &webapp 9120
          dashboard:
            port: *dashboard
    route:
      hermes:
        hostnames:
          - hermes.clerici.tech
        parentRefs:
          - name: trusted
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: hermes
                port: *webapp
      dashboard:
        hostnames:
          - hermes-dashboard.clerici.tech
        parentRefs:
          - name: trusted
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: hermes
                port: *dashboard
    networkpolicies:
      hermes:
        type: cilium
        controller: hermes
        # DNS from the baseline CCNP, OIDC from hermes-pocket-id
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: trusted
            toPorts:
              - ports:
                  - {port: "9119", protocol: TCP}
                  - {port: "9120", protocol: TCP}
        egress:
          # llm.clerici.tech via the trusted Gateway LB IP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: trusted
            toPorts:
              - ports:
                  - {port: "10443", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: searxng
                  app.kubernetes.io/instance: searxng
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: tika
                  app.kubernetes.io/instance: tika
            toPorts:
              - ports:
                  - {port: "9998", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: browserless
                  app.kubernetes.io/instance: browserless
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
          # Web extract, STT/skill downloads
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
        egressDeny:
          # Keep the LAN out of reach (SSRF)
          - toCIDRSet:
              - cidrGroupRef: private-networks
    configMaps:
      managed:
        # Managed scope: pinned keys beat /opt/data/config.yaml and are read-only to the agent
        data:
          config.yaml: |-
            model:
              provider: openai-codex
              default: gpt-6.1-sol
            providers:
              llm:
                name: Home LLM gateway
                api: https://llm.clerici.tech/v1
                transport: chat_completions
                # Pocket ID machine token, re-read as ESO rotates the Secret
                key_cmd: cat /etc/hermes-secrets/llm/token
                # Hermes only lifts its timeouts for local-looking hostnames; a cold ~13K-token
                # prefill on the Mac can run a minute or more with no output
                stale_timeout_seconds: 900
                models:
                  # Catalogs advertise gpt-oss's native 131072; the server holds 65536
                  gpt-oss-20b:
                    context_length: 65536
            timezone: ${TZ}
            terminal:
              backend: local
            browser:
              # The image's Chromium is left unused; timeout lifts browserless's 60s session cap
              cdp_url: ws://browserless.browserless.svc.cluster.local:3000/chromium?timeout=600000
              # Otherwise LAN URLs fall back to launching the bundled Chromium
              auto_local_for_private_urls: false
            web:
              search_backend: searxng
              # plugins/web-tika: fetched here behind the SSRF guard, parsed by Tika
              extract_backend: tika
              # Default 120s cuts off OCR of long scans
              extract_timeout: 600
            plugins:
              enabled:
                - web-tika
            dashboard:
              public_url: https://hermes-dashboard.clerici.tech
              # Envoy pods; the netpol admits nothing else
              trusted_proxies:
                - ${CLUSTER_POD_CIDR}
                - ${CLUSTER_POD_CIDR_V6}
              oauth:
                provider: self-hosted
                self_hosted:
                  issuer: https://id.clerici.tech
                  client_id: hermes
            webapp:
              enabled: true
              host: 0.0.0.0
              port: 9120
              public_url: https://hermes.clerici.tech
            security:
              redact_secrets: true
            approvals:
              mode: smart
            # Image-managed; Renovate bumps it
            updates:
              check: false
            telemetry:
              shared_metrics:
                enabled: false
                send: false
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            home:
              - path: /pvc
            hermes:
              - path: /opt/data
                subPath: hermes
      plugin-web-tika:
        type: configMap
        name: hermes-plugin-web-tika
        advancedMounts:
          hermes:
            home:
              - path: /plugin-src/web-tika
                readOnly: true
      managed:
        type: configMap
        identifier: managed
        globalMounts:
          - path: /etc/hermes-managed
            readOnly: true
      llm-token:
        type: secret
        name: hermes-llm-token
        globalMounts:
          - path: /etc/hermes-secrets/llm
            readOnly: true
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        globalMounts:
          - path: /run
      tmp:
        type: emptyDir
