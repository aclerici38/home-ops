---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    # Webapp + dashboard sign-in; Hermes only supports public PKCE clients
    pocketId:
      callbackPaths:
        - /auth/callback
      callbackUrls:
        - https://hermes-dashboard.clerici.tech/auth/callback
      spec:
        oidcClient:
          isPublic: true
          secret:
            enabled: false
    kopiur:
      capacity: 10Gi
      ignoreRules:
        - /hermes/cache
        - /hermes/installs
        - /hermes/logs
    machineTokens:
      llm:
        data:
          token: "{{ .access_token }}"
        spec:
          externalSecret:
            target:
              template:
                metadata:
                  # key_cmd re-reads the mounted file, so a refresh needs no restart
                  annotations:
                    reloader.stakater.com/ignore: "true"
