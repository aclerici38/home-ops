---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-blocky
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: coredns
      app.kubernetes.io/name: coredns
  egress:
    # forward . ${BLOCKY_CLUSTER_IP} (blocky-k8s)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dns
            app.kubernetes.io/instance: blocky
            app.kubernetes.io/name: blocky
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
