---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: external-secrets
      namespace: external-secrets
    - name: pocket-id-operator
      namespace: pocket-id-operator
    - name: kopiur
      namespace: kopiur
  values:
    cnpg:
      mode: shared
      spec:
        database:
          extensions:
            - {name: vector, ensure: present}
    externalSecret:
      spec:
        data:
          - secretKey: EMAIL
            remoteRef:
              key: cluster-secrets
              property: EMAIL
          - secretKey: S3_ACCESS_KEY_ID
            remoteRef:
              key: versity
              property: username
          - secretKey: S3_SECRET_ACCESS_KEY
            remoteRef:
              key: versity
              property: password
    pocketId:
      group: fam
      callbackUrls:
        - https://chat.clerici.tech/oauth/oidc/callback
    kopiur:
      existingClaim: true
      cephfs: true
    llmToken: {}
