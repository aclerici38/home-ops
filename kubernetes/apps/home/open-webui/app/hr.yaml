---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.1.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 3m
  upgrade:
    timeout: 3m
  values:
    controllers:
      open-webui:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          open-webui:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.2@sha256:77ff490214a4b2699b309aa8d39bf4b42eca05f62d2742ef669ff846fcd10355
            env:
              HOME: /app/backend
              ENABLE_PERSISTENT_CONFIG: false # always read env vars
              OLLAMA_BASE_URL: http://mac-mini.cottage.internal:11434
              ENABLE_WEB_SEARCH: true
              WEB_SEARCH_ENGINE: tavily
              WEB_SEARCH_RESULT_COUNT: 5
              WEB_SEARCH_CONCURRENT_REQUESTS: 3
              BYPASS_EMBEDDING_AND_RETRIEVAL: false
              RAG_FULL_CONTEXT: false
              TASK_MODEL: llama3.2:3b
              # Title/tag/query generation for OpenAI-type connections.
              TASK_MODEL_EXTERNAL: qwen3-8b
              ENABLE_RAG_WEB_SEARCH: true
              ENABLE_SEARCH_QUERY: true
              RAG_WEB_SEARCH_ENGINE: tavily
              TAVILY_API_KEY:
                secretKeyRef:
                  name: open-webui
                  key: TAVILY_API_KEY
              WEB_LOADER_ENGINE: playwright
              PLAYWRIGHT_WS_URL: ws://browserless.browserless:3000/chromium/playwright
              WEBUI_URL: &url https://chat.clerici.tech
              CORS_ALLOW_ORIGIN: *url
              ENABLE_LOGIN_FORM: false
              ENABLE_PASSWORD_AUTH: false
              DEFAULT_USER_ROLE: user
              ENABLE_AUDIT_STDOUT: true
              ENABLE_AUDIT_LOGS_FILE: false
              ENABLE_AUTOCOMPLETE_GENERATION: false
              ENABLE_FOLLOW_UP_GENERATION: false
              ENABLE_VERSION_UPDATE_CHECK: false
              VECTOR_DB: pgvector
              PGVECTOR_CREATE_EXTENSION: false
              STORAGE_PROVIDER: s3
              S3_BUCKET_NAME: open-webui
              S3_ENDPOINT_URL: http://versitygw.versity.svc.cluster.local:7070
              S3_REGION_NAME: us-east-1
              S3_ACCESS_KEY_ID:
                secretKeyRef:
                  name: open-webui
                  key: S3_ACCESS_KEY_ID
              S3_SECRET_ACCESS_KEY:
                secretKeyRef:
                  name: open-webui
                  key: S3_SECRET_ACCESS_KEY
              DATABASE_ENABLE_SESSION_SHARING: true
              CONTENT_EXTRACTION_ENGINE: tika
              TIKA_SERVER_URL: http://tika.tika:9998
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: qwen3-embedding-0.6b
              RAG_OPENAI_API_BASE_URL: http://qwen3-embedding-0-6b.llmkube.svc.cluster.local:8080/v1
              # RAG_OPENAI_API_KEY defaults to OPENAI_API_KEY
              RAG_OPENAI_API_KEY: sk-no-key-required
              # Qwen3-Embedding is asymmetric and was trained with an
              # instruction prefix on the query side only, so documents get
              # none. With RAG_EMBEDDING_PREFIX_FIELD_NAME unset this is a
              # plain string prepend, which is exactly the documented format.
              RAG_EMBEDDING_QUERY_PREFIX: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
              # Reranking needs hybrid search: the reranker only ever sees the candidates BM25 + vector search hand it.
              ENABLE_RAG_HYBRID_SEARCH: true
              RAG_RERANKING_ENGINE: external
              RAG_RERANKING_MODEL: bge-reranker-v2-m3
              RAG_EXTERNAL_RERANKER_URL: http://bge-reranker-v2-m3.llmkube.svc.cluster.local:8080/v1/rerank
              ENABLE_OAUTH_SIGNUP: true
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_SCOPES: "openid profile email groups"
              ENABLE_OAUTH_ROLE_MANAGEMENT: true
              OAUTH_ROLES_CLAIM: groups
              OAUTH_ALLOWED_ROLES: all # literal group in pocket-id with all users
              OAUTH_CODE_CHALLENGE_METHOD: S256 # needed for pkce
              WEBUI_SESSION_COOKIE_SAME_SITE: lax
              WEBUI_SESSION_COOKIE_SECURE: true
              ENABLE_OPENAI_API: true
              # First one uses the api key
              OPENAI_API_BASE_URLS: https://api.openai.com/v1;http://qwen3-8b.llmkube.svc.cluster.local:8080/v1
              USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: true
              ENABLE_FORWARD_USER_INFO_HEADERS: true
              TOOL_SERVER_CONNECTIONS: |
                [
                  {
                    "type": "mcp",
                    "url": "https://trek.clerici.tech/mcp",
                    "path": "",
                    "auth_type": "oauth_2.1",
                    "key": "",
                    "config": { "enable": true },
                    "info": {
                      "id": "trek",
                      "name": "TREK",
                      "description": "TREK travel planner"
                    }
                  }
                ]
              OPENAI_API_KEY:
                secretKeyRef:
                  name: open-webui
                  key: OPENAI_API_KEY
              WEBUI_SECRET_KEY:
                secretKeyRef:
                  name: open-webui
                  key: WEBUI_SECRET_KEY
              WEBUI_ADMIN_EMAIL:
                secretKeyRef:
                  name: open-webui
                  key: EMAIL
              OAUTH_CLIENT_ID:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: client_id
              OAUTH_CLIENT_SECRET:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: client_secret
              OPENID_PROVIDER_URL:
                secretKeyRef:
                  name: open-webui-oidc-credentials
                  key: discovery_url
              DATABASE_URL:
                secretKeyRef:
                  name: open-webui-postgres
                  key: uri
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8080
                    path: /health
              readiness: *probes
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile: {type: RuntimeDefault}
              capabilities: {drop: ["ALL"]}
    service:
      open-webui:
        controller: open-webui
        ports:
          http:
            port: *port
    route:
      open-webui:
        hostnames:
          - chat.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    persistence:
      data:
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
            subPath: data
          - path: /app/backend/nltk_data
            subPath: nltk_data
  dependsOn:
    - name: open-webui-resources
