---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-admin-api-key
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      engineVersion: v2
      metadata:
        labels:
          # ESO refuses to read a Secret for a Webhook generator without it.
          external-secrets.io/type: webhook
      data:
        api_key: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: open-webui
        property: ADMIN_API_KEY
