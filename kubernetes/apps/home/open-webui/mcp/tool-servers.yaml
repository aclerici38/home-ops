---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-tool-servers
spec:
  # The webhook re-registers on every call
  refreshPolicy: OnChange
  target:
    template:
      engineVersion: v2
      data:
        # One entry per backend on the same gateway URL
        TOOL_SERVER_CONNECTIONS: |-
          [
            {
              "type": "mcp",
              "url": "https://mcp.clerici.tech/mcp",
              "path": "",
              "auth_type": "oauth_2.1_static",
              "key": "",
              "config": {"enable": true},
              "info": {
                "id": "open-webui-home-assistant",
                "name": "Home Assistant",
                "description": "Home Assistant via the MCP gateway",
                "oauth_client_info": "{{ .home_assistant_oauth_client_info }}"
              }
            },
            {
              "type": "mcp",
              "url": "https://mcp.clerici.tech/mcp",
              "path": "",
              "auth_type": "oauth_2.1_static",
              "key": "",
              "config": {"enable": true},
              "info": {
                "id": "open-webui-grafana",
                "name": "Grafana",
                "description": "Grafana via the MCP gateway",
                "oauth_client_info": "{{ .grafana_oauth_client_info }}"
              }
            },
            {
              "type": "mcp",
              "url": "https://mcp.clerici.tech/mcp",
              "path": "",
              "auth_type": "oauth_2.1_static",
              "key": "",
              "config": {"enable": true},
              "info": {
                "id": "open-webui-flux",
                "name": "Flux",
                "description": "Flux via the MCP gateway",
                "oauth_client_info": "{{ .flux_oauth_client_info }}"
              }
            }
          ]
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: open-webui-home-assistant-client-info
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "home_assistant_$1"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: open-webui-grafana-client-info
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "grafana_$1"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: open-webui-flux-client-info
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "flux_$1"
