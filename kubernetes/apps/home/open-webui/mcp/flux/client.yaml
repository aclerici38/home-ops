---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/pocket-id-operator/0.14.3/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: open-webui-flux
spec:
  name: open-webui (Flux)
  # Must equal this backend's tool server info.id
  clientID: open-webui-flux
  pkceEnabled: true
  callbackUrls:
    - https://chat.clerici.tech/oauth/clients/mcp:open-webui-flux/callback
  secret:
    additionalLabels:
      external-secrets.io/type: webhook
  allowedUserGroups:
    - name: admin
      namespace: pocket-id-operator
  apiAccess:
    - apiRef:
        name: mcp
        namespace: envoy-gateway
      delegatedPermissions:
        - flux
        - flux:write
