---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: versitygw
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: versitygw
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: versity-resources
  values:
    image:
      repository: ghcr.io/versity/versitygw
      tag: v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
    serviceAccount:
      create: false
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    resources:
      requests:
        cpu: 100m
        memory: 20Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: true
      create: false
      claimName: backups
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: /_/health
      parentRefs: &gateway
        - name: internal
          namespace: kgateway
          sectionName: https
      hostnames:
        - s3.clerici.tech
    auth:
      existingSecret: versity
    gateway:
      backend:
        type: posix
        # kopia doesn't support xattrs so we must store metadata separately.
        sidecarDir: /mnt/metadata
        versioningDir: /mnt/versioning
      corsAllowOrigin: https://versity.clerici.tech
    admin:
      enabled: true
      httpRoute:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: "false"
        parentRefs: *gateway
        hostnames:
          - s3-admin.clerici.tech
    webui:
      enabled: true
      apiGateways:
        - https://s3.clerici.tech
      adminGateways:
        - https://s3-admin.clerici.tech
      httpRoute:
        enabled: true
        parentRefs: *gateway
        hostnames:
          - versity.clerici.tech
