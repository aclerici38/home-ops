---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: versity
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: versity-resources
  values:
    controllers:
      versity:
        strategy: RollingUpdate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          versity:
            image:
              repository: ghcr.io/versity/versitygw
              tag: v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
            env:
              VGW_BACKEND: posix
              VGW_BACKEND_ARGS: /mnt/data
              # kopia doesn't support xattrs so we must store metadata separately.
              VGW_META_SIDECAR: /mnt/metadata
              VGW_VERSIONING_DIR: /mnt/versioning
              ROOT_ACCESS_KEY_ID:
                secretKeyRef:
                  name: versity
                  key: rootAccessKeyId
              ROOT_SECRET_ACCESS_KEY:
                secretKeyRef:
                  name: versity
                  key: rootSecretAccessKey
              VGW_PORT: ":7070"
              VGW_REGION: us-east-1
              VGW_HEALTH: &health /_/health
              VGW_CORS_ALLOW_ORIGIN: https://versity.clerici.tech
              # S3 over TLS
              VGW_CERT: /certs/tls.crt
              VGW_KEY: /certs/tls.key
              VGW_ADMIN_PORT: ":7071"
              VGW_ADMIN_MAX_CONNECTIONS: "250000"
              VGW_ADMIN_MAX_REQUESTS: "100000"
              VGW_WEBUI_PORT: ":8080"
              VGW_WEBUI_NO_TLS: "true"
              VGW_WEBUI_GATEWAYS: https://s3.clerici.tech
              VGW_WEBUI_ADMIN_GATEWAYS: https://s3-admin.clerici.tech
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *health
                    port: 7070
                    scheme: HTTPS
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      versity:
        controller: versity
        ports:
          s3-api:
            port: &s3Port 7070
          admin:
            port: &adminPort 7071
          webui:
            port: &webuiPort 8080
      s3:
        controller: versity
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: ${VERSITY_LB_IP}
          coredns.io/hostname: s3.clerici.tech
          gatus.home-operations.com/endpoint: |-
            url: https://s3.clerici.tech/_/health
            conditions:
              - "[STATUS] == 200"
              - "[CERTIFICATE_EXPIRATION] > 240h"
            client:
              dns-resolver: udp://${K8S_GATEWAY_CLUSTER_IP}:53
        ports:
          https:
            port: 443
            targetPort: *s3Port
    route:
      admin:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - s3-admin.clerici.tech
        parentRefs: &gateway
          - name: internal
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: versity
                port: *adminPort
      webui:
        hostnames:
          - versity.clerici.tech
        parentRefs: *gateway
        rules:
          - backendRefs:
              - identifier: versity
                port: *webuiPort
    # S3 is open, admin API and WebUI are only reachable through the internal Envoy gateway.
    # All egress is denied.
    networkpolicies:
      versity:
        controller: versity
        policyTypes:
          - Ingress
          - Egress
        rules:
          ingress:
            - ports:
                - {port: *s3Port, protocol: TCP}
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: envoy-gateway
                  podSelector:
                    matchLabels:
                      gateway.envoyproxy.io/owning-gateway-name: internal
              ports:
                - {port: *adminPort, protocol: TCP}
                - {port: *webuiPort, protocol: TCP}
    persistence:
      data:
        existingClaim: backups
        globalMounts:
          - path: /mnt/data
            subPath: data
          - path: /mnt/metadata
            subPath: metadata
          - path: /mnt/versioning
            subPath: versioning
      certs:
        type: secret
        name: versitygw-tls
        globalMounts:
          - path: /certs
            readOnly: true
