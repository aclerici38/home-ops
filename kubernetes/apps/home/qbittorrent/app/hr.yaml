---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
  upgrade:
    timeout: 2m
  valuesFrom:
    - kind: Secret
      name: qbittorrent-netpol-values
      valuesKey: values.yaml
  values:
    controllers:
      qbittorrent:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          # gluetun forwards cluster names to the resolv.conf nameservers; the v6 one resolves to
          # CoreDNS pod IPs (socket LB) that would need the v6 pod CIDR allowed, but that /56
          # contains the pod gateway and breaks gluetun's outbound routes. Keep cluster DNS on v4.
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - "${COREDNS_CLUSTER_IP}"
            searches:
              - qbittorrent.svc.cluster.local
              - svc.cluster.local
              - cluster.local
            options:
              - {name: ndots, value: "1"}
        initContainers:
          gluetun:
            lifecycle:
              postStart:
                exec:
                  # https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/kubernetes.md#adding-ipv6-rule--file-exists
                  command:
                    - "/bin/sh"
                    - "-c"
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              LOG_LEVEL: debug
              # files in /tmp/gluetun are only read by gluetun; keeping them root-owned means no DAC_OVERRIDE/CHOWN caps needed
              PUID: 0
              PGID: 0
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              # kernel WireGuard needs no /dev/net/tun; fail loudly instead of falling back to userspace
              WIREGUARD_IMPLEMENTATION: kernelspace
              WIREGUARD_ENDPOINT_PORT: 51820
              VPN_PORT_FORWARDING: "on"
              VPN_PORT_FORWARDING_PROVIDER: protonvpn
              FIREWALL_INPUT_PORTS: &port 8080
              FIREWALL_OUTBOUND_SUBNETS: ${CLUSTER_POD_CIDR},${CLUSTER_SVC_CIDR},${CLUSTER_SVC_CIDR_V6}
              VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{`{{PORTS}}`}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
            restartPolicy: Always
            envFrom:
              - secretRef:
                  name: qbittorrent
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              seccompProfile: {type: RuntimeDefault}
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: false
        containers:
          qbittorrent:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.0@sha256:faa37907a4242c6c3c5fdd3f7ea95e0c2308534406f4d606ba64d816e764d39f
            resources:
              requests:
                cpu: 49m
                memory: 1024Mi
              limits:
                memory: 6000Mi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile: {type: RuntimeDefault}
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                type: HTTP
                port: *port
              readiness: *probes
    service:
      qbittorrent:
        controller: qbittorrent
        ports:
          http:
            port: *port
    networkpolicies:
      qbittorrent:
        type: cilium
        controller: qbittorrent
        # egress comes from valuesFrom (qbittorrent-netpol-values): pinned to the VPN endpoint IP,
        ingress:
          - fromEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: vuetorrent
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
              # Download client for the arrs; prowlarr grabs from its search UI
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: sonarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: sonarr-raphael
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: radarr-raphael
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: prowlarr
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
    persistence:
      config:
        existingClaim: qbittorrent
        advancedMounts:
          qbittorrent:
            qbittorrent:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /tmp/gluetun
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /allMedia
  dependsOn:
    - name: qbittorrent-resources
