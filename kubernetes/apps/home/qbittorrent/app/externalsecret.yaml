---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.12.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-netpol-values
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        # The whole egress list
        values.yaml: |
          networkpolicies:
            qbittorrent:
              egress:
                # WireGuard to gluetun's endpoint only
                - toCIDR:
                    - {{ .WIREGUARD_ENDPOINT_IP }}/32
                  toPorts:
                    - ports:
                        - {port: "51820", protocol: UDP}
  # Same 1Password field gluetun reads, so a server change moves both together.
  data:
    - secretKey: WIREGUARD_ENDPOINT_IP
      remoteRef:
        key: qbittorrent
        property: WIREGUARD_ENDPOINT_IP
