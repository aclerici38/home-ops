---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vuetorrent
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: vuetorrent-resources
  values:
    controllers:
      vuetorrent:
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: &uid 1000
            runAsGroup: *uid
            fsGroup: *uid
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          vuetorrent:
            image:
              repository: ghcr.io/vuetorrent/vuetorrent-backend
              tag: 2.7.4@sha256:8887bd34b17396543c8374dcf2ab98af4c7deb24b24889cbc47742b3d56e4adc
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 200Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /backend/ping
                    port: &port 8080
              readiness: *probes
            env:
              RELEASE_TYPE: none # UI comes from the image volume; disables the GitHub updater
              PORT: *port
              QBIT_BASE: http://qbittorrent.qbittorrent:8080
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      vuetorrent:
        controller: vuetorrent
        ports:
          http:
            port: *port
    route:
      vuetorrent:
        hostnames:
          - qbit.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      vuetorrent:
        type: cilium
        controller: vuetorrent
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
    persistence:
      vuetorrent:
        type: image
        image: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.36.1@sha256:2750543ce2f9868e12bca941482431eb59b5517e89c2538cb2229124aa79d2c2
        globalMounts:
          - path: /vuetorrent
      # Server-side settings store (CONFIG_PATH defaults to /config)
      config:
        existingClaim: vuetorrent
        globalMounts:
          - path: /config
