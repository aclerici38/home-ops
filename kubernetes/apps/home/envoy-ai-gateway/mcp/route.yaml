---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-ai-gateway/1.1.0/mcproute_v1beta1.json
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /.well-known/oauth-protected-resource/mcp
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
    - name: internal
      sectionName: https
  hostnames:
    - mcp.clerici.tech
  path: /mcp
  backendRefs:
    - name: home-assistant
      group: gateway.envoyproxy.io
      kind: Backend
      path: /api/mcp
      securityPolicy:
        apiKey:
          secretRef:
            name: hass-mcp-token
    - name: raphael
      group: gateway.envoyproxy.io
      kind: Backend
      path: /api/mcp
      securityPolicy:
        apiKey:
          secretRef:
            name: raphael-mcp-token
    - name: grafana
      group: gateway.envoyproxy.io
      kind: Backend
      path: /mcp
      securityPolicy:
        apiKey:
          secretRef:
            name: grafana-mcp-token
    - name: flux
      group: gateway.envoyproxy.io
      kind: Backend
      path: /mcp
  securityPolicy:
    oauth:
      issuer: https://id.clerici.tech
      audiences:
        - &resource https://mcp.clerici.tech/mcp
      protectedResourceMetadata:
        resource: *resource
        resourceName: clerici.tech MCP
        scopesSupported:
          - home-assistant
          - raphael
          - grafana
          - flux
          - flux:write
      # backendRefs keeps this lookup inside the cluster.
      jwks:
        remoteJWKS:
          uri: http://id.clerici.tech/.well-known/jwks.json
          backendRefs:
            - group: gateway.envoyproxy.io
              kind: Backend
              name: pocket-id
      claimToHeaders:
        - claim: sub
          header: x-mcp-client
    # Rules gate tools/call and also filter tools/list, so a caller only sees
    # what it may invoke. The list-filter path populates only backend, tool and
    # headers, so CEL must stay off request.path, request.method and
    # request.mcp.params or listing and calling will disagree.
    authorization:
      defaultAction: Deny
      rules:
        - action: Allow
          source:
            jwt:
              scopes:
                - "home-assistant"
          cel: request.mcp.backend == "home-assistant"
        - action: Allow
          source:
            jwt:
              scopes:
                - "raphael"
          cel: request.mcp.backend == "raphael"
        - action: Allow
          source:
            jwt:
              scopes:
                - "grafana"
          cel: request.mcp.backend == "grafana"
        # apply/patch/delete/install take arbitrary manifests, so no scope
        # grants them and they never reach tools/list.
        - action: Allow
          source:
            jwt:
              scopes:
                - "flux"
          cel: request.mcp.backend == "flux" && request.mcp.tool in ["get_flux_instance", "get_kubernetes_resources", "get_kubernetes_logs", "get_kubernetes_events", "get_kubernetes_metrics", "get_kubernetes_api_versions", "diff_kubernetes_manifest", "search_flux_docs", "read_flux_doc"]
        - action: Allow
          source:
            jwt:
              scopes:
                - "flux:write"
          cel: request.mcp.backend == "flux" && request.mcp.tool in ["reconcile_flux_resource", "suspend_flux_reconciliation", "resume_flux_reconciliation"]
