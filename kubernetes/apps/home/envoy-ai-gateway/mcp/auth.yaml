---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/pocket-id-operator/0.14.3/pocketidapi_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDAPI
metadata:
  name: mcp
spec:
  resource: https://mcp.clerici.tech/mcp
  cimdAccess: true
  permissions:
    - key: home-assistant
      name: Home Assistant
      description: Tools on the Home Assistant MCP backend
      cimdAccess: true
    - key: grafana
      name: Grafana
      description: Tools on the Grafana MCP backend
      cimdAccess: true
    - key: flux
      name: Flux
      description: Read-only tools on the Flux MCP backend
      cimdAccess: true
    - key: flux:write
      name: Flux (write)
      description: Reconcile, suspend and resume tools on the Flux MCP backend
      cimdAccess: false
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.1/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: pocket-id
spec:
  endpoints:
    - fqdn:
        hostname: pocket-id.pocket-id-operator.svc.cluster.local
        port: 1411
