---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.1/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: home-assistant
spec:
  # External httproute url until https://github.com/envoyproxy/ai-gateway/pull/2587/changes or https://github.com/envoyproxy/ai-gateway/pull/2306/changes
  endpoints:
    - fqdn:
        hostname: hass.clerici.tech
        port: 443
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/gateway-api/1.6.1/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: home-assistant
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: home-assistant
  validation:
    # The gateway serves the Let's Encrypt clerici-tech cert.
    wellKnownCACertificates: System
    hostname: hass.clerici.tech
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-mcp-token
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    # MCPRoute reads the fixed key "apiKey".
    - secretKey: apiKey
      remoteRef:
        key: mcp
        property: password
