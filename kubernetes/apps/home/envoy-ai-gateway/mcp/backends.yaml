---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.1/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: home-assistant
spec:
  endpoints:
    - fqdn:
        hostname: home-assistant.home-assistant.svc.cluster.local
        port: 8123
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-mcp-token
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    # MCPRoute reads the fixed key "apiKey".
    - secretKey: apiKey
      remoteRef:
        key: mcp
        property: HASS_TOKEN
