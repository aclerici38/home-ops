---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-gateway-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: ai-gateway
      app.kubernetes.io/name: ai-gateway-helm
  ingress:
    # Gateway pod mutator webhook
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "9443", protocol: TCP}
    # Envoy Gateway extensionManager
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            app.kubernetes.io/name: gateway-helm
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - {port: "1063", protocol: TCP}
  egress:
    - {}
