---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ai-gateway
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
  values:
    controller:
      image:
        repository: mirror.gcr.io/envoyproxy/ai-gateway-controller
      # The mutating webhook is failurePolicy: Fail over every pod labelled app.kubernetes.io/managed-by=envoy-gateway
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
      mutatingWebhook:
        certManager:
          enable: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    extProc:
      image:
        repository: mirror.gcr.io/envoyproxy/ai-gateway-extproc
    envoyGateway:
      namespace: envoy-gateway
  dependsOn:
    - name: ai-gateway-crds
