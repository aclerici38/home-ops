---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 1.3.0
        digest: sha256:5d1a75e7fc0595fef3e40871ccba51147daa22396d7f88df9e00b876089d0efd
      url: oci://mirror.gcr.io/envoyproxy/ai-gateway-helm
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
  values:
    controller:
      image:
        repository: mirror.gcr.io/envoyproxy/ai-gateway-controller
      # The mutating webhook is failurePolicy: Fail over every pod labelled app.kubernetes.io/managed-by=envoy-gateway
      replicaCount: 2
      podLabels:
        dormammu.internal/apiserver-client: "true"
      priorityClassName: system-cluster-critical
      podDisruptionBudget:
        enabled: true
      mutatingWebhook:
        certManager:
          enable: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
      mcp:
        sessionEncryption:
          existingSecret: ai-gateway-mcp-session-encryption
    extProc:
      image:
        repository: mirror.gcr.io/envoyproxy/ai-gateway-extproc
    envoyGateway:
      namespace: envoy-gateway
  dependsOn:
    - name: ai-gateway-crds
