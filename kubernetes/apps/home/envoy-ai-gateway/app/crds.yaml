---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway-crds
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ai-gateway-crds
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
