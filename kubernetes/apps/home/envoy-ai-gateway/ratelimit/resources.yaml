---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-ratelimit-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: dragonfly-operator
      namespace: dragonfly-operator
  values:
    dragonfly:
      # Dragonfly needs 256MiB of maxmemory per proactor thread or it refuses to start
      extraArgs:
        - "--proactor_threads=1"
      spec:
        # MAX_MEMORY tracks limits.memory, which is what that floor is checked
        # against.
        resources:
          requests: {cpu: 50m}
          limits: {memory: 256Mi}
