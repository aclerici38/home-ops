---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.3/helmrelease_v2.json?values=app-template/5.0.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: home-assistant-resources
  values:
    controllers:
      home-assistant:
        pod:
          nodeSelector:
            network.dormammu/multus: "true"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          hostname: home-assistant
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name":"house",
                  "namespace": "multus",
                  "interface": "house",
                  "ips": ["10.0.20.25/24"],
                  "mac": "64:16:7F:E9:23:A5"
                },
                {
                  "name":"cottage",
                  "namespace": "multus",
                  "interface": "cottage",
                  "ips": ["10.0.40.25/24"],
                  "mac": "64:16:7F:41:52:65"
                },
                {
                  "name":"iot",
                  "namespace": "multus",
                  "interface": "iot",
                  "ips": ["10.0.80.25/24"],
                  "mac": "64:16:7F:13:97:2A"
                }
              ]
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.7.4@sha256:fc3c0b5f7c2ff61a81b3c84dfcc405d3ff28bfc73caf68fb5c31818515f3554e
            env:
              VENV_FOLDER: /venv
              DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/tmp/dbus-stub"
            resources:
              requests:
                cpu: 47m
              limits:
                memory: 2Gi
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.130.0@sha256:fa367e7eddd303a95c736f7aede351cdee9036a7383cecfd8786bb5bbe78c13b
            command:
              - "/usr/bin/dumb-init"
              - "--"
              - "/usr/bin/code-server"
            args:
              - "--bind-addr=127.0.0.1:8080"
              - "--auth=none"
              - "--app-name=Home Assistant"
              - "--disable-telemetry"
              - "--disable-update-check"
              - "--disable-getting-started-override"
              - "--disable-workspace-trust"
              - "/config"
            env:
              HOME: /home/coder
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "curl"
                      - "-fsS"
                      - "http://127.0.0.1:8080/healthz"
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *sec
    service:
      home-assistant:
        controller: home-assistant
        ports:
          http:
            port: 8123
    route:
      home-assistant:
        hostnames:
          - hass.clerici.tech
        parentRefs:
          - name: external
            namespace: kgateway
    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
        advancedMounts:
          home-assistant:
            code-server:
              - path: /home/coder
                subPath: .code-server
      hass-cache:
        existingClaim: hass-cache
        globalMounts:
          - path: /venv
      tmpfs:
        type: emptyDir
        globalMounts:
          # Because of https://github.com/home-assistant/core/blob/0d66d298ec57b8e50379cc2ec31cbebf771705c3/homeassistant/util/package.py#L29
          - path: /.dockerenv
            subPath: dockerenv
          - path: /config/logs
            subPath: logs
          - path: /config/tts
            subPath: tts
          - path: /tmp
            subPath: tmp
