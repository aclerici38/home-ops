---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smtp-relay
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      smtp-relay:
        replicas: 2
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          smtp-relay:
            image:
              repository: ghcr.io/foxcpp/maddy
              tag: 0.9.8@sha256:f2396d08bad7cc3e2ec76422530a6310644ac03d435093991150486a791b08a2
            env:
              SMTP_RELAY_METRICS_PORT: &metricsPort 8080
              SMTP_RELAY_SMTP_PORT: &smtpPort 25
              HOSTNAME: relay.clerici.tech
            envFrom:
              - secretRef:
                  name: smtp-relay
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      smtp-relay:
        controller: smtp-relay
        ports:
          http:
            port: *metricsPort
          smtp:
            port: *smtpPort
    networkpolicies:
      smtp-relay:
        type: cilium
        controller: smtp-relay
        ingress:
          # Opt-in clients; egress side is the smtp-relay-clients CCNP.
          - fromEndpoints:
              - matchLabels:
                  dormammu.internal/smtp-relay-client: "true"
                matchExpressions:
                  - key: k8s:io.kubernetes.pod.namespace
                    operator: Exists
            toPorts:
              - ports:
                  - {port: "25", protocol: TCP}
        egress:
          # Upstream submission (implicit TLS)
          - toFQDNs:
              - matchName: smtp.migadu.com
            toPorts:
              - ports:
                  - {port: "465", protocol: TCP}
    serviceMonitor:
      smtp-relay:
        serviceName: smtp-relay
        endpoints:
          - port: http
    persistence:
      cache:
        type: emptyDir
      config:
        type: configMap
        name: smtp-relay
        globalMounts:
          - path: /data/maddy.conf
            subPath: maddy.conf
    configMaps:
      config:
        data:
          maddy.conf: |-
            state_dir /cache/state
            runtime_dir /cache/run

            openmetrics tcp://0.0.0.0:{env:SMTP_RELAY_METRICS_PORT} { }

            tls off
            hostname {env:HOSTNAME}

            smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
                default_source {
                    deliver_to &remote_queue
                }
            }

            target.queue remote_queue {
                target &remote_smtp
            }

            target.smtp remote_smtp {
                auth plain {env:MIGADU_USERNAME} {env:MIGADU_PASSWORD}
                targets tls://{env:MIGADU_SERVER}:465
                starttls no
            }
  dependsOn:
    - name: smtp-relay-resources
