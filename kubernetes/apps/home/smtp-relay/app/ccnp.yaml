---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: smtp-relay-clients
spec:
  description: Egress to smtp-relay for pods labelled dormammu.internal/smtp-relay-client=true
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      dormammu.internal/smtp-relay-client: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: smtp-relay
            app.kubernetes.io/instance: smtp-relay
      toPorts:
        - ports:
            - {port: "25", protocol: TCP}
