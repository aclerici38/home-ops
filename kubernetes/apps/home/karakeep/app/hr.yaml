---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  values:
    controllers:
      karakeep:
        containers:
          karakeep:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            env:
              BROWSER_WEB_URL: http://karakeep-chrome:9222
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              DATA_DIR: /data
              MEILI_ADDR: http://karakeep-meilisearch:7700
              NEXTAUTH_URL: https://karakeep.clerici.tech
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              NEXTAUTH_SECRET:
                secretKeyRef:
                  name: karakeep
                  key: NEXTAUTH_SECRET
              MEILI_MASTER_KEY:
                secretKeyRef:
                  name: karakeep
                  key: MEILI_MASTER_KEY
              DISABLE_PASSWORD_AUTH: true
              DISABLE_SIGNUPS: false
              OAUTH_AUTO_REDIRECT: true
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_WELLKNOWN_URL:
                secretKeyRef:
                  name: karakeep-oidc-credentials
                  key: discovery_url
              OAUTH_CLIENT_ID:
                secretKeyRef:
                  name: karakeep-oidc-credentials
                  key: client_id
              OAUTH_CLIENT_SECRET:
                secretKeyRef:
                  name: karakeep-oidc-credentials
                  key: client_secret
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              S6_READ_ONLY_ROOT: 1
            securityContext: &sec
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3000
                    path: /api/health
              readiness: *probes
            resources: &res
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
      chrome:
        containers:
          chrome:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            securityContext: *sec
            resources: *res
            probes:
              liveness: &chromeProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 9222
                    path: /json/version
              readiness: *chromeProbes
      meilisearch:
        containers:
          meilisearch:
            image:
              repository: mirror.gcr.io/getmeili/meilisearch
              tag: v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
            args:
              - /bin/meilisearch
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_UPGRADE_DB: true
              MEILI_MASTER_KEY:
                secretKeyRef:
                  name: karakeep
                  key: MEILI_MASTER_KEY
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
            securityContext: *sec
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 7700
                    path: /health
              readiness: *probes
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      karakeep:
        controller: karakeep
        ports:
          http:
            port: *port
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
    route:
      karakeep:
        hostnames:
          - karakeep.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: karakeep
                port: *port
    networkpolicies:
      karakeep:
        type: cilium
        controller: karakeep
        # OIDC egress comes from karakeep-pocket-id
        ingress:
          # Route
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
        egress:
          - toControllers:
              - chrome
            toPorts:
              - ports:
                  - {port: "9222", protocol: TCP}
          - toControllers:
              - meilisearch
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
          # Link metadata, banner images, feeds, adblock lists
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
        egressDeny: &lan
          # Keep the LAN out of reach (SSRF)
          - toCIDRSet:
              - cidrGroupRef: private-networks
      chrome:
        type: cilium
        controller: chrome
        ingress:
          - fromControllers:
              - karakeep
            toPorts:
              - ports:
                  - {port: "9222", protocol: TCP}
        egress:
          # Crawling arbitrary public sites
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
                  - {port: "443", protocol: UDP}
        egressDeny: *lan
      meilisearch:
        type: cilium
        controller: meilisearch
        ingress:
          - fromControllers:
              - karakeep
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
        egress:
          - {}
    persistence:
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            karakeep:
              - path: /data
                subPath: karakeep
          meilisearch:
            meilisearch:
              - path: /meili_data
                subPath: meilisearch
      tmp:
        type: emptyDir
      run:
        type: emptyDir
        advancedMounts:
          karakeep:
            karakeep:
              - path: /run
  dependsOn:
    - name: karakeep-resources
