---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  values:
    controllers:
      karakeep:
        containers:
          karakeep:
            image: &image
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
            env:
              <<: &crawlerEnv
                CRAWLER_DOWNLOAD_BANNER_IMAGE: true
                CRAWLER_ENABLE_ADBLOCKER: true
                CRAWLER_STORE_SCREENSHOT: true
              # Crawling, video and asset parsing run in the sandbox
              SANDBOX_REMOTE_URL: http://karakeep-sandbox:4000
              SANDBOX_REMOTE_TOKEN: &sandboxToken
                secretKeyRef:
                  name: karakeep-sandbox
                  key: SANDBOX_REMOTE_TOKEN
              DATA_DIR: /data
              MEILI_ADDR: http://karakeep-meilisearch:7700
              NEXTAUTH_URL: https://karakeep.clerici.tech
              DISABLE_NEW_RELEASE_CHECK: true
              AUTH_TRUSTED_ORIGINS: https://karakeep.clerici.tech
              RATE_LIMITING_ENABLED: true
              NEXTAUTH_SECRET:
                secretKeyRef:
                  name: karakeep
                  key: NEXTAUTH_SECRET
              MEILI_MASTER_KEY:
                secretKeyRef:
                  name: karakeep
                  key: MEILI_MASTER_KEY
              DISABLE_PASSWORD_AUTH: true
              DISABLE_SIGNUPS: false
              OAUTH_AUTO_REDIRECT: true
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_WELLKNOWN_URL:
                secretKeyRef:
                  name: karakeep-oidc-credentials
                  key: discovery_url
              OAUTH_CLIENT_ID:
                secretKeyRef:
                  name: karakeep-oidc-credentials
                  key: client_id
              OAUTH_CLIENT_SECRET:
                secretKeyRef:
                  name: karakeep-oidc-credentials
                  key: client_secret
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              S6_READ_ONLY_ROOT: 1
            securityContext: &sec
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3000
                    path: /api/health
              readiness: *probes
            resources: &res
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
      sandbox:
        containers:
          sandbox:
            image: *image
            command:
              - node
              - dist/index.js
            workingDir: /app/apps/workers
            env:
              <<: *crawlerEnv
              SANDBOX_REMOTE_SERVER_ENABLED: true
              SANDBOX_REMOTE_TOKEN: *sandboxToken
              BROWSER_WEB_URL: http://karakeep-chrome:9222
              DATA_DIR: /tmp
              WORKERS_HOST: 0.0.0.0
              WORKERS_PORT: &sandboxPort 4000
            securityContext: *sec
            probes:
              liveness: &sandboxProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *sandboxPort
                    path: /health
              readiness: *sandboxProbes
            resources: *res
      chrome:
        containers:
          chrome:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 157.0.8103.78-r1@sha256:00fb4fa9c37aa74c58e74d0bdd16c4e3b81dddb5f264917c879f9579c3b3ad95
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            securityContext: *sec
            resources: *res
            probes:
              liveness: &chromeProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 9222
                    path: /json/version
              readiness: *chromeProbes
      meilisearch:
        containers:
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.58.0@sha256:cee0d2e31191594ff8e1651eb144aabd95b389a0bc3532327ecfb9ed91dffe7e
            args:
              - /bin/meilisearch
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_UPGRADE_DB: true
              MEILI_MASTER_KEY:
                secretKeyRef:
                  name: karakeep
                  key: MEILI_MASTER_KEY
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
            securityContext: *sec
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 7700
                    path: /health
              readiness: *probes
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      karakeep:
        controller: karakeep
        ports:
          http:
            port: *port
      sandbox:
        controller: sandbox
        ports:
          http:
            port: *sandboxPort
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
    route:
      karakeep:
        hostnames:
          - karakeep.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: karakeep
                port: *port
    networkpolicies:
      karakeep:
        type: cilium
        controller: karakeep
        # OIDC egress comes from karakeep-pocket-id
        ingress:
          # Route
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
        # No world egress; RSS feeds, webhooks or AI providers would need it
        egress:
          - toControllers:
              - sandbox
            toPorts:
              - ports:
                  - {port: "4000", protocol: TCP}
          - toControllers:
              - meilisearch
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
      sandbox:
        type: cilium
        controller: sandbox
        ingress:
          - fromControllers:
              - karakeep
            toPorts:
              - ports:
                  - {port: "4000", protocol: TCP}
        egress:
          - toControllers:
              - chrome
            toPorts:
              - ports:
                  - {port: "9222", protocol: TCP}
          # Link metadata, banner images, adblock lists
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
        egressDeny: &lan
          # Keep the LAN out of reach (SSRF)
          - toCIDRSet:
              - cidrGroupRef: private-networks
      chrome:
        type: cilium
        controller: chrome
        ingress:
          - fromControllers:
              - sandbox
            toPorts:
              - ports:
                  - {port: "9222", protocol: TCP}
        egress:
          # Crawling arbitrary public sites
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
                  - {port: "443", protocol: UDP}
        egressDeny: *lan
      meilisearch:
        type: cilium
        controller: meilisearch
        ingress:
          - fromControllers:
              - karakeep
            toPorts:
              - ports:
                  - {port: "7700", protocol: TCP}
        egress:
          - {}
    persistence:
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            karakeep:
              - path: /data
                subPath: karakeep
          meilisearch:
            meilisearch:
              - path: /meili_data
                subPath: meilisearch
      tmp:
        type: emptyDir
      run:
        type: emptyDir
        advancedMounts:
          karakeep:
            karakeep:
              - path: /run
  dependsOn:
    - name: karakeep-resources
