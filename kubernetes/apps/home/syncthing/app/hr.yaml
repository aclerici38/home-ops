---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/helmrelease_v2.json?values=app-template/5.0.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      syncthing:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          syncthing:
            image:
              repository: ghcr.io/syncthing/syncthing
              tag: 2.1.3@sha256:8c8ff37ab6aa8be23b700648a90fa9412e214852e9fd6ea8477c8334792daec0
            env:
              HOME: /var/syncthing
              STHOMEDIR: /var/syncthing/config
              STGUIADDRESS: 0.0.0.0:8384
              STNODEFAULTFOLDER: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &port 8384
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: *port
      sync:
        controller: syncthing
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "${SYNCTHING_LB_IP}"
          coredns.io/hostname: sync.clerici.tech
        ports:
          sync-tcp:
            port: &syncPort 22000
            protocol: TCP
          sync-udp:
            port: *syncPort
            protocol: UDP
    route:
      syncthing:
        hostnames:
          - syncthing.clerici.tech
        parentRefs:
          - name: internal
            namespace: kgateway
        rules:
          - backendRefs:
              - identifier: syncthing
                port: *port
    persistence:
      config:
        existingClaim: syncthing
        globalMounts:
          - path: /var/syncthing
      media:
        type: nfs
        server: nfs.clerici.tech
        path: /media
        globalMounts:
          - path: /allMedia
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
  dependsOn:
    - name: syncthing-resources
