---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      syncthing:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          syncthing:
            image:
              repository: ghcr.io/syncthing/syncthing
              tag: 2.1.6@sha256:4d0281bdcb4ed9baf503d251d0544ddd856f49fce3f114056257ae172b7fb670
            env:
              HOME: /var/syncthing
              STHOMEDIR: /var/syncthing/config
              STGUIADDRESS: 0.0.0.0:8384
              STNODEFAULTFOLDER: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &port 8384
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: *port
      sync:
        controller: syncthing
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "${SYNCTHING_LB_IP}"
          external-dns.kubernetes.io/hostname: sync.clerici.tech
          external-dns.kubernetes.io/target: vps.clerici.tech
        ports:
          sync-tcp:
            port: &syncPort 22000
            protocol: TCP
          sync-udp:
            port: *syncPort
            protocol: UDP
    networkpolicies:
      syncthing:
        type: cilium
        controller: syncthing
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
            toPorts:
              - ports:
                  - {port: "8384", protocol: TCP}
          # Peers dial in via sync.clerici.tech -> VPS -> towonel agent
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: towonel
                  app.kubernetes.io/instance: towonel-agent
                  app.kubernetes.io/name: towonel-agent
            toPorts:
              - ports:
                  - {port: "22000", protocol: TCP}
                  - {port: "22000", protocol: UDP}
          # LAN peers via the sync LoadBalancer (externalTrafficPolicy Local keeps the client IP)
          - fromCIDRSet:
              - cidrGroupRef: private-networks
            toPorts:
              - ports:
                  - {port: "22000", protocol: TCP}
                  - {port: "22000", protocol: UDP}
        # Discovery, relays, NAT and local announce are off in config.xml and every
        # device address is dynamic, so it never dials out
        egress:
          - {}
    route:
      syncthing:
        hostnames:
          - syncthing.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: syncthing
                port: *port
    persistence:
      config:
        existingClaim: syncthing
        globalMounts:
          - path: /var/syncthing
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /allMedia
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
  dependsOn:
    - name: syncthing-resources
