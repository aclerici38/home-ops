---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: nfs-server
      namespace: nfs-server
    - name: kopiur
      namespace: kopiur
  values:
    kopiur:
      # config.xml + cert.pem/key.pem are the device identity and are all that
      # matters; index-v2 is the SQLite index, rebuilt by a rescan and rewritten
      # constantly, so it stays out of the repo.
      ignoreRules:
        - /config/index-v2
        - /config/*.log
        - /config/syncthing.lock
