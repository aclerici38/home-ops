---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/grafana-operator/5.25.0/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: blocky-postgres
  labels:
    grafana.internal/instance: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    access: proxy
    name: blocky-postgres
    type: postgres
    url: $${host}:$${port}
    user: $${user}
    jsonData:
      database: $${dbname}
      # mTLS as the read-only blocky-grafana role; cert files come from the
      # csi-driver volume on the Grafana pod.
      sslmode: verify-full
      tlsConfigurationMethod: file-path
      sslRootCertFile: $${sslrootcert}
      sslCertFile: $${sslcert}
      sslKeyFile: $${sslkey}
      postgresVersion: 1801
      timescaledb: false
  valuesFrom:
    - targetPath: url
      valueFrom:
        configMapKeyRef:
          name: blocky-grafana-postgres
          key: host
    - targetPath: url
      valueFrom:
        configMapKeyRef:
          name: blocky-grafana-postgres
          key: port
    - targetPath: user
      valueFrom:
        configMapKeyRef:
          name: blocky-grafana-postgres
          key: user
    - targetPath: jsonData.database
      valueFrom:
        configMapKeyRef:
          name: blocky-grafana-postgres
          key: dbname
    - targetPath: jsonData.sslRootCertFile
      valueFrom:
        configMapKeyRef:
          name: blocky-grafana-postgres
          key: sslrootcert
    - targetPath: jsonData.sslCertFile
      valueFrom:
        configMapKeyRef:
          name: blocky-grafana-postgres
          key: sslcert
    - targetPath: jsonData.sslKeyFile
      valueFrom:
        configMapKeyRef:
          name: blocky-grafana-postgres
          key: sslkey
