---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: blocky-resources
  values:
    controllers:
      blocky:
        strategy: RollingUpdate
        replicas: 3
        rollingUpdate:
          surge: 1
          unavailable: 1
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: blocky
                  topologyKey: kubernetes.io/hostname
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          blocky:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
            env:
              PGCONNECT_TIMEOUT: 10
              PGSSLMODE: verify-full
              PGSSLCERT: /var/run/secrets/postgresql/tls.crt
              PGSSLKEY: /var/run/secrets/postgresql/tls.key
              PGSSLROOTCERT: /var/run/secrets/postgresql/ca.crt
              PGHOST:
                valueFrom:
                  configMapKeyRef:
                    name: blocky-postgres
                    key: host
              PGPORT:
                valueFrom:
                  configMapKeyRef:
                    name: blocky-postgres
                    key: port
              PGUSER:
                valueFrom:
                  configMapKeyRef:
                    name: blocky-postgres
                    key: username
              PGDATABASE:
                valueFrom:
                  configMapKeyRef:
                    name: blocky-postgres
                    key: dbname
            probes:
              readiness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /app/blocky
                      - healthcheck
              liveness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL
    service:
      dns:
        controller: blocky
        type: LoadBalancer
        externalTrafficPolicy: Local
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - "IPv4"
          - "IPv6"
        annotations:
          lbipam.cilium.io/ips: "${BLOCKY_LB_IP},${BLOCKY_LB_IPV6}"
          coredns.io/hostname: dot.clerici.tech
        ports: &p
          dns-tcp:
            port: 53
          dns-udp:
            port: 53
            protocol: UDP
          dns-tls:
            port: 853
      k8s:
        controller: blocky
        clusterIP: "${BLOCKY_CLUSTER_IP}"
        ports:
          <<: *p
          http:
            port: &port 4000
    serviceMonitor:
      blocky:
        serviceName: blocky-k8s
        endpoints:
          - port: http
    route:
      blocky-DOH:
        hostnames:
          - dns.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /dns-query
            backendRefs:
              - identifier: k8s
                port: *port
    networkpolicies:
      blocky:
        type: cilium
        controller: blocky
        # Postgres (query log) and Dragonfly egress come from blocky-postgres and
        # blocky-dragonfly-client. Incoming DNS is open to everything; outgoing
        # DNS only reaches the configured bootstrap/conditional servers.
        ingress:
          - fromEntities:
              - all
            toPorts:
              - ports:
                  - {port: "53", protocol: UDP}
                  - {port: "53", protocol: TCP}
                  - {port: "853", protocol: TCP}
          # DoH via the Route, and blocky-ui's API calls
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
              - matchLabels:
                  app.kubernetes.io/instance: blocky-ui
            toPorts:
              - ports:
                  - {port: "4000", protocol: TCP}
        egress:
          # bootstrapDns
          - toCIDR:
              - 8.8.8.8/32
              - 1.1.1.1/32
              - 9.9.9.9/32
              - 2620:fe::fe/128
              - 2606:4700:4700::1111/128
              - 2001:4860:4860::8888/128
            toPorts:
              - ports:
                  - {port: "53", protocol: UDP}
                  - {port: "53", protocol: TCP}
          # conditional: house/.internal + PTR on opnsense
          - toCIDR:
              - ${NODE_GATEWAY}/32
            toPorts:
              - ports:
                  - {port: "53", protocol: UDP}
                  - {port: "53", protocol: TCP}
          # Upstreams: DoQ (quad9, controld) and DoH (opendns, cloudflare), plus
          # denylists. Resolved via bootstrapDns, never kube-dns, so no FQDN rules.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
                  - {port: "853", protocol: UDP}
          # conditional: clerici.tech -> k8s-gateway
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: k8s-gateway
            toPorts:
              - ports:
                  - {port: "1053", protocol: UDP}
                  - {port: "1053", protocol: TCP}
          # conditional: cluster.local + pod/service PTR -> CoreDNS
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
            toPorts:
              - ports:
                  - {port: "53", protocol: UDP}
                  - {port: "53", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: blocky-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      config:
        type: configMap
        name: blocky-config
        globalMounts:
          - path: /app/config.yml
            subPath: config.yml
      tls:
        type: secret
        name: blocky-tls
        globalMounts:
          - path: /certs/tls.crt
            subPath: tls.crt
          - path: /certs/tls.key
            subPath: tls.key
