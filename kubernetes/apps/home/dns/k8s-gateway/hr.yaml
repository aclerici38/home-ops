---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    replicaCount: 2
    servers:
      - zones:
          - zone: .
            use_tcp: true
        # unprivileged port inside the pod, exposed as 53 on the Service
        port: 1053
        servicePort: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: k8s_gateway
            parameters: clerici.tech
            configBlock: |-
              apex k8s-gateway.dns
              ttl 300
              resources HTTPRoute Service
              fallthrough clerici.tech
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . 1.1.1.1 1.0.0.1
          - name: loop
          - name: reload
          - name: loadbalance
    serviceType: ClusterIP
    service:
      clusterIP: ${K8S_GATEWAY_CLUSTER_IP}
    prometheus:
      monitor:
        enabled: true
    podDisruptionBudget:
      maxUnavailable: 1
    priorityClassName: system-cluster-critical
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "k8s-gateway.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
