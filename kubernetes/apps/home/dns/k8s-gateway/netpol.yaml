---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway
spec:
  # Incoming DNS is open to everything. apiserver egress (HTTPRoute/Service
  # watch) comes from the apiserver-clients CCNP.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: k8s-gateway
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - {port: "1053", protocol: UDP}
            - {port: "1053", protocol: TCP}
  egress:
    # forward . 1.1.1.1 1.0.0.1 (fallthrough clerici.tech)
    - toCIDR:
        - 1.1.1.1/32
        - 1.0.0.1/32
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
