---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky-ui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: blocky-resources
  # blocky-ui only takes the client cert as inline PEM
  valuesFrom:
    - kind: Secret
      name: blocky-ui-postgres-cert
      valuesKey: ca.crt
      targetPath: postgresTLS.ca
      literal: true
    - kind: Secret
      name: blocky-ui-postgres-cert
      valuesKey: tls.crt
      targetPath: postgresTLS.cert
      literal: true
    - kind: Secret
      name: blocky-ui-postgres-cert
      valuesKey: tls.key
      targetPath: postgresTLS.key
      literal: true
  values:
    controllers:
      blocky-ui:
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          blocky-ui:
            image:
              repository: ghcr.io/gabeduartem/blocky-ui
              tag: main@sha256:6b7cc7e3c9403129378d17bee200f11984887445339739a70cfd0aef6d52ea20
            env:
              BLOCKY_UI_CONFIG: /config/blocky-ui.yaml
            probes:
              liveness:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      blocky-ui:
        controller: blocky-ui
        ports:
          http:
            port: 3000
    route:
      blocky-ui:
        hostnames:
          - blocky.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    secrets:
      config:
        stringData:
          # https://github.com/GabeDuarteM/blocky-ui/blob/main/blocky-ui.example.yml
          blocky-ui.yaml: |-
            servers:
              blocky:
                name: Blocky
                url: http://blocky-k8s:4000
                logs:
                  source: postgres
            logSources:
              postgres:
                type: postgresql
                target:
                  host: pg18-pooler-mtls-rw.cloudnative-pg.svc.cluster.local
                  port: 5432
                  username: blocky-ui
                  password: ""
                  database: blocky
                  options:
                    # postgresTLS is injected via valuesFrom. defaults are just for flate to pass
                    ssl: {{ .Values.postgresTLS | default dict | toJson }}
    persistence:
      config:
        type: secret
        identifier: config
        globalMounts:
          - path: /config/blocky-ui.yaml
            subPath: blocky-ui.yaml
