---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky-ui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: blocky-resources
  values:
    controllers:
      blocky-ui:
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          blocky-ui:
            image:
              repository: ghcr.io/gabeduartem/blocky-ui
              tag: 2.2.0@sha256:9cf986ea7b1e9b01d082a0eec5cb93a4322bbadff3a411633c10ed668eb01528
            env:
              BLOCKY_UI_CONFIG: /config/blocky-ui.yaml
            probes:
              liveness:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      blocky-ui:
        controller: blocky-ui
        ports:
          http:
            port: 3000
    route:
      blocky-ui:
        hostnames:
          - blocky.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      blocky-ui:
        type: cilium
        controller: blocky-ui
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: blocky
                  app.kubernetes.io/controller: blocky
            toPorts:
              - ports:
                  - {port: "4000", protocol: TCP}
          # blocky-ui read-only role; resource-bundle renders no egress for readers
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: cloudnative-pg
                  cnpg.io/poolerName: pg18-pooler-mtls-rw
            toPorts:
              - ports:
                  - {port: "5432", protocol: TCP}
    configMaps:
      config:
        data:
          # https://github.com/GabeDuarteM/blocky-ui/blob/main/blocky-ui.example.yml
          # file: values come from the blocky-ui-postgres ConfigMap and cert Secret.
          blocky-ui.yaml: |-
            servers:
              blocky:
                name: Blocky
                url: http://blocky-k8s:4000
                logs:
                  source: postgres
            logSources:
              postgres:
                type: postgresql
                target:
                  host: file:/config/postgres/host
                  port: 5432
                  username: file:/config/postgres/username
                  password: ""
                  database: file:/config/postgres/dbname
                  options:
                    ssl:
                      ca: file:/var/run/secrets/postgresql/ca.crt
                      cert: file:/var/run/secrets/postgresql/tls.crt
                      key: file:/var/run/secrets/postgresql/tls.key
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/blocky-ui.yaml
            subPath: blocky-ui.yaml
      postgres:
        type: configMap
        name: blocky-ui-postgres
        globalMounts:
          - path: /config/postgres
            readOnly: true
      postgres-cert:
        type: secret
        name: blocky-ui-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
            readOnly: true
