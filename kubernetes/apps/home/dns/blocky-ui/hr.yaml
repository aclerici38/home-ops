---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky-ui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: blocky-resources
  values:
    controllers:
      blocky-ui:
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          blocky-ui:
            image:
              repository: ghcr.io/gabeduartem/blocky-ui
              tag: 2.1.1@sha256:7edeaddee3963e59248b0dd0900234912982c86ea867c544fe2ee084bd479274
            env:
              BLOCKY_UI_CONFIG: /config/blocky-ui.yaml
              # The target uri carries sslmode=verify-full; trust the cluster CA for it.
              NODE_EXTRA_CA_CERTS: /var/run/secrets/postgresql/ca.crt
            probes:
              liveness:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      blocky-ui:
        controller: blocky-ui
        ports:
          http:
            port: 3000
    route:
      blocky-ui:
        hostnames:
          - blocky.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    configMaps:
      config:
        data:
          # https://github.com/GabeDuarteM/blocky-ui/blob/main/blocky-ui.example.yml
          blocky-ui.yaml: |-
            servers:
              blocky:
                name: Blocky
                url: http://blocky-k8s:4000
                logs:
                  source: postgres
            logSources:
              postgres:
                type: postgresql
                target: file:/secrets/query-log-target
    persistence:
      config:
        type: configMap
        name: blocky-ui
        globalMounts:
          - path: /config/blocky-ui.yaml
            subPath: blocky-ui.yaml
      query-log-target:
        type: secret
        name: blocky-ui-postgres
        globalMounts:
          - path: /secrets/query-log-target
            subPath: uri
      postgres-ca:
        type: secret
        name: blocky-ui-postgres
        items:
          - key: ca.crt
            path: ca.crt
        globalMounts:
          - path: /var/run/secrets/postgresql
            readOnly: true
