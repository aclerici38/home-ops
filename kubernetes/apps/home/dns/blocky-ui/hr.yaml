---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky-ui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: blocky-resources
  values:
    controllers:
      blocky-ui:
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          blocky-ui:
            image:
              repository: ghcr.io/gabeduartem/blocky-ui
              tag: main@sha256:c3ca4e1418ab5660012c6429925fd2d7c3f3f0ddff34bdfb0e858822ba222188
            env:
              BLOCKY_UI_CONFIG: /config/blocky-ui.yaml
            probes:
              liveness:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      blocky-ui:
        controller: blocky-ui
        ports:
          http:
            port: 3000
    route:
      blocky-ui:
        hostnames:
          - blocky.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    configMaps:
      config:
        data:
          # https://github.com/GabeDuarteM/blocky-ui/blob/main/blocky-ui.example.yml
          # file: values come from the blocky-ui-postgres ConfigMap and cert Secret.
          blocky-ui.yaml: |-
            servers:
              blocky:
                name: Blocky
                url: http://blocky-k8s:4000
                logs:
                  source: postgres
            logSources:
              postgres:
                type: postgresql
                target:
                  host: file:/config/postgres/host
                  port: 5432
                  username: file:/config/postgres/username
                  password: ""
                  database: file:/config/postgres/dbname
                  options:
                    ssl:
                      ca: file:/var/run/secrets/postgresql/ca.crt
                      cert: file:/var/run/secrets/postgresql/tls.crt
                      key: file:/var/run/secrets/postgresql/tls.key
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/blocky-ui.yaml
            subPath: blocky-ui.yaml
      postgres:
        type: configMap
        name: blocky-ui-postgres
        globalMounts:
          - path: /config/postgres
            readOnly: true
      postgres-cert:
        type: secret
        name: blocky-ui-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
            readOnly: true
