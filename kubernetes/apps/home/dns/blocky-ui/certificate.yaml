---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cert-manager/1.21.2/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blocky-ui-postgres-cert
spec:
  secretName: blocky-ui-postgres-cert
  commonName: blocky-ui
  usages:
    - client auth
    - digital signature
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: postgres-mtls
