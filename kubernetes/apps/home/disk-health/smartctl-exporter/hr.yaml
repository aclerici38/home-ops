---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 0.19.3
        digest: sha256:90bf0301a6a7b74b28ce0dba3a2f6e08a33f108b06e54c2bb549186cad8391f0
      url: oci://ghcr.io/prometheus-community/charts/prometheus-smartctl-exporter
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    tolerations:
      - key: "rpi"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    image:
      repository: quay.io/prometheuscommunity/smartctl-exporter
      tag: v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    rbac:
      create: false
    config:
      device_include: '^(nvme|sd).*'
    serviceMonitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (pod)
    prometheusRules:
      enabled: true
