---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smart-tester
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      smart-tester:
        type: daemonset
        containers:
          smartd:
            image:
              repository: ghcr.io/aclerici38/smartmontools
              tag: 7.5.0@sha256:1226f7478c145ba028e58e5b1f19545e73ca0cb92119b0a03cdc3303c416f5c9
            # smartd's own scheduler runs the self-tests on every node; results
            # land in each drive's self-test log, which scrutiny's collector
            # picks up. --debug keeps smartd in the foreground and logs to
            # stdout (otherwise it only speaks syslog); --quit=never keeps it
            # up on a node with no visible drives.
            command:
              - /usr/sbin/smartd
              - --debug
              - --quit=never
              - --configfile=/etc/smartd.conf
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
                devic.es/disks: 1
              limits:
                memory: 32Mi
                devic.es/disks: 1
            # Self-tests go through the same passthrough as smartctl: SYS_RAWIO
            # for SATA/SAS, SYS_ADMIN for NVMe admin commands; both need root.
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "SYS_RAWIO"
                  - "SYS_ADMIN"
    networkpolicies:
      smart-tester:
        type: cilium
        controller: smart-tester
        # Only talks to local disks; no inbound or outbound traffic
        ingress:
          - {}
        egress:
          - {}
    defaultPodOptions:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    configMaps:
      config:
        data:
          # Schedule regex is T/MM/DD/d/HH in local time (the pod-timezone MAP sets TZ). Same
          # cadence as the old CronJobs: short at 00:00 on the 8th/16th/22nd,
          # long at 02:00 on the 3rd. Only -s is given, so smartd runs tests
          # and nothing else: no attribute monitoring, no mail.
          smartd.conf: |
            DEVICESCAN -s (S/../(08|16|22)/./00|L/../03/./02)
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/smartd.conf
            subPath: smartd.conf
            readOnly: true
