---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      searxng:
        pod:
          # hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: &uid 977 # upstream searxng user
            runAsGroup: *uid
            fsGroup: *uid
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        strategy: RollingUpdate
        containers:
          searxng:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.10.16-ff8f5ddcc@sha256:b4e34a39f76b1c860bbc53a0f35b10492029b2b18ef1d868df464fe43d7e0b93
            env:
              SEARXNG_BASE_URL: &url https://search.clerici.tech
              SEARXNG_URL: *url
              SEARXNG_PORT: &port 8080
              SEARXNG_VALKEY_URL: redis://searxng-dragonfly-db:6379
              UWSGI_THREADS:
                valueFrom:
                  resourceFieldRef:
                    containerName: searxng
                    resource: limits.cpu
              UWSGI_WORKERS: 1
            envFrom:
              - secretRef:
                  name: searxng
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 1
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 2
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      searxng:
        controller: searxng
        ports:
          http:
            port: *port
    route:
      searxng:
        hostnames:
          - search.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    networkpolicies:
      searxng:
        type: cilium
        controller: searxng
        # Valkey egress comes from searxng-dragonfly-client
        ingress:
          - fromEndpoints:
              # Route
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
              # open-webui web search (JSON API, passed by limiter.toml)
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: open-webui
                  app.kubernetes.io/instance: open-webui
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        egress:
          # Search engines, autocomplete, favicons and the image proxy
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
                  - {port: "443", protocol: UDP}
        egressDeny:
          - toCIDRSet:
              - cidrGroupRef: private-networks
    persistence:
      config:
        type: configMap
        name: searxng
        globalMounts:
          - path: /etc/searxng/settings.yml
            subPath: settings.yml
          - path: /etc/searxng/limiter.toml
            subPath: limiter.toml
      tmp:
        type: emptyDir
    configMaps:
      config:
        data:
          # Pods are trusted proxies, so web users are limited by the client IP
          # envoy appends to X-Forwarded-For (read right to left, spoof-safe).
          # In-cluster API callers (open-webui) send no XFF and are passed.
          limiter.toml: |-
            [botdetection]
            trusted_proxies = [
              '${CLUSTER_POD_CIDR}',
              '${CLUSTER_POD_CIDR_V6}',
            ]

            [botdetection.ip_lists]
            pass_ip = [
              '${CLUSTER_POD_CIDR}',
              '${CLUSTER_POD_CIDR_V6}',
            ]
          settings.yml: |-
            use_default_settings: true

            server:
              public_instance: false
              limiter: true
              image_proxy: true
              method: GET # https://github.com/searxng/searxng/pull/3619

            outgoing:
              request_timeout: 1.0

            search:
              autocomplete: google
              favicon_resolver: duckduckgo
              languages:
                - en
                - en-US
              formats:
                - html
                - json

            ui:
              static_use_hash: true
              default_theme: simple
              theme_args:
                simple_style: dark
              infinite_scroll: true
              results_on_new_tab: false

            enabled_plugins:
              - Basic Calculator
              - Hash plugin
              - Hostnames plugin
              - Open Access DOI rewrite
              - Self Informations
              - Tracker URL remover
              - Unit converter plugin

            hostnames:
              high_priority:
                - (.*)\/blog\/(.*)
                - (.*\.)?wikipedia.org$
                - (.*\.)?github.com$
                - (.*\.)?reddit.com$
                - (.*\.)?docker.com$
                - (.*\.)?archlinux.org$
                - (.*\.)?stackoverflow.com$
                - (.*\.)?askubuntu.com$
                - (.*\.)?superuser.com$
  dependsOn:
    - name: searxng-resources
