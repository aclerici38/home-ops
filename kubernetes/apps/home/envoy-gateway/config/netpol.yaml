---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-external
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: external
      app.kubernetes.io/managed-by: envoy-gateway
  egress:
    # opensprinkler (selectorless Service)
    - toCIDR:
        - 10.0.80.99/32
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-internal
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: internal
      app.kubernetes.io/managed-by: envoy-gateway
  # Off-cluster clients only from these VLANs + VPN
  ingressDeny:
    - fromCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.0.20.0/24
            - 10.0.40.0/24
            - 10.0.80.0/24
            - 10.38.0.0/24
  egress:
    # rook-ceph dashboard (hostNetwork mgr)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "7000", protocol: TCP}
    # llmkube openai Backend
    - toFQDNs:
        - matchName: api.openai.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
