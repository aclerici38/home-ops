---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/gateway-api/1.7.0/gateway_v1.json
# House/cottage VLANs + VPN only (envoy-trusted CNP).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: trusted
  annotations:
    gatus.home-operations.com/endpoint: |-
      group: trusted
      guarded: true
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: ${ENVOY_TRUSTED_LB_IP}
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: trusted
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.clerici.tech"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: clerici-tech-tls
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/gateway-api/1.7.0/httproute_v1.json
# The shared httpsredirect only knows internal/external
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpsredirect-trusted
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: trusted
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
