---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-barman-cloud
spec:
  # The object-store traffic runs in the instance pods' sidecar.
  # apiserver egress comes from the apiserver-clients CCNP.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: plugin-barman-cloud
      app.kubernetes.io/name: plugin-barman-cloud
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
  egress:
    - {}
