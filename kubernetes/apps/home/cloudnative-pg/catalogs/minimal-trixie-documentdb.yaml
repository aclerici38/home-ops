---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cloudnative-pg/0.29.1/clusterimagecatalog_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-minimal-trixie-documentdb
spec:
  componentImages:
    - key: pgbouncer
      image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:9738cbb7fd5f31bf83e7e351bafe33e29d8bcad5baffc876f6c2e02bcc78e37c
  images:
    # DocumentDB doesn't immediately support new postgres versions apparently
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
      extensions:
        - name: pgvector
          image:
            reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:5e42ba35f8f1102cf8760dbb3db9352698257f12f757c089eb78740c50da944d
        - name: postgis
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-18-trixie@sha256:77755937c0777ebffa8f8d35acc13a9764a33efca6081e5b0a0ac1d9e7b61276
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: $${image_root}/share/gdal
            - name: PROJ_DATA
              value: $${image_root}/share/proj
        - name: documentdb
          image:
            reference: ghcr.io/documentdb/documentdb-kubernetes-operator/documentdb:1.0.1@sha256:e848b1d09d2ec14f4f6e6b87e1f97d7292e43b98a67e7b61d7755e9b4ef06a94
          dynamic_library_path:
            - "lib"
          extension_control_path:
            - "share"
          ld_library_path:
            - "lib"
            - "system"
