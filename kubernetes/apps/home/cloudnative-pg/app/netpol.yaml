---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudnative-pg
spec:
  # apiserver egress comes from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cloudnative-pg
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    # Mutating/validating webhooks (Service 443 -> 9443)
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "9443", protocol: TCP}
  egress:
    # Instance manager status/control, for Clusters in any namespace
    - toEndpoints:
        - matchLabels:
            cnpg.io/podRole: instance
          matchExpressions:
            - {key: 'k8s:io.kubernetes.pod.namespace', operator: Exists}
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
            - {port: "5432", protocol: TCP}
    # barman-cloud plugin gRPC
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: plugin-barman-cloud
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
