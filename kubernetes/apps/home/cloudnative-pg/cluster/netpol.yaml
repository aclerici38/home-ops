---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pg18
spec:
  # Instances plus the cluster's join/recovery Jobs. Postgres is reachable only
  # from the poolers, the operator and the cluster's own pods.
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: pg18
    matchExpressions:
      - {key: cnpg.io/podRole, operator: NotIn, values: [pooler]}
  ingress:
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: pg18
          matchExpressions:
            - {key: cnpg.io/podRole, operator: NotIn, values: [pooler]}
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
            - {port: "8000", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: pg18
            cnpg.io/podRole: pooler
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
  egress:
    # Streaming replication / pg_basebackup between instances and Jobs
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: pg18
          matchExpressions:
            - {key: cnpg.io/podRole, operator: NotIn, values: [pooler]}
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # barman-cloud WAL archive + base backups (s3.clerici.tech -> versity)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: versity
            app.kubernetes.io/name: versity
            app.kubernetes.io/controller: versity
      toPorts:
        - ports:
            - {port: "7070", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pg18-poolers
spec:
  # Client access on 5432 comes from the per-app <app>-pooler policies the
  # resource-bundle chart renders into this namespace. apiserver egress (pooler
  # instance manager) comes from template.metadata.labels.
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: pg18
      cnpg.io/podRole: pooler
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: pg18
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
