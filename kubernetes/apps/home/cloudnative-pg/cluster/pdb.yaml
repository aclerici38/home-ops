---
# CNPG creates PDBs for instances but not poolers. Keep one pod of each pooler
# up through drains; AlwaysAllow so a crash-looping pod never blocks one.
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/poddisruptionbudget-policy-v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pg18-pooler-rw
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      cnpg.io/poolerName: pg18-pooler-rw
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/poddisruptionbudget-policy-v1.json
