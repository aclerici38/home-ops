---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.1.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tududi
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: tududi-resources
  values:
    controllers:
      tududi:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: &uid 1000
            runAsGroup: *uid
            fsGroup: *uid
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          tududi:
            image:
              repository: mirror.gcr.io/chrisvel/tududi
              tag: 1.4.1@sha256:864d1a9f9cba650fba5d12da9693d9711b4199a58c3bb0eba20be7952f707d97
            # docker-entrypoint.sh only exists to chown /app and su-exec down; it
            # needs root, so skip straight to the start script it would exec.
            command:
              - "/app/backend/cmd/start.sh"
            env:
              BASE_URL: &url https://todo.clerici.tech
              TUDUDI_ALLOWED_ORIGINS: *url
              TUDUDI_TRUST_PROXY: 1
              COOKIE_SECURE: "true"
              # start.sh shells out to npx for migrations; npm wants a writable HOME.
              HOME: /tmp
              DISABLE_TELEGRAM: true
              PASSWORD_AUTH_ENABLED: "false"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: Pocket-ID
              OIDC_PROVIDER_SLUG: pocket-id
              OIDC_SCOPE: openid profile email
              OIDC_AUTO_PROVISION: "true"
              OIDC_ISSUER_URL:
                secretKeyRef:
                  name: tududi-oidc-credentials
                  key: issuer_url
              OIDC_CLIENT_ID:
                secretKeyRef:
                  name: tududi-oidc-credentials
                  key: client_id
              OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: tududi-oidc-credentials
                  key: client_secret
              TUDUDI_SESSION_SECRET:
                secretKeyRef:
                  name: tududi
                  key: TUDUDI_SESSION_SECRET
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3002
                    path: /api/health
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      tududi:
        controller: tududi
        ports:
          http:
            port: *port
    route:
      tududi:
        hostnames:
          - todo.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    persistence:
      data:
        existingClaim: tududi
        globalMounts:
          - path: /app/db
            subPath: db
          - path: /app/uploads
            subPath: uploads
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
