---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tududi-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: external-secrets
      namespace: external-secrets
    - name: pocket-id-operator
      namespace: pocket-id-operator
    - name: kopiur
      namespace: kopiur
  values:
    cnpg:
      mode: shared
      # start.sh takes pg_advisory_xact_lock in a transaction that then sits
      # idle for the whole migration run, so the transaction pooler's
      # idle_transaction_timeout (60s) would drop it mid-migration.
      poolMode: session
    externalSecret: {}
    pocketId:
      url: todo.clerici.tech
      group: fam
      spec:
        # openid-client is driven without a code_challenge (modules/oidc/service.js).
        pkceEnabled: false
      callbackPaths:
        - /api/oidc/callback/pocket-id
    kopiur:
      cephfs: true
      capacity: 2Gi
