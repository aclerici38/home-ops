---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tududi-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: pocket-id-operator
      namespace: pocket-id-operator
    - name: kopiur
      namespace: kopiur
  values:
    externalSecret: {}
    pocketId:
      url: todo.clerici.tech
      group: fam
      spec:
        # openid-client is driven without a code_challenge (modules/oidc/service.js).
        pkceEnabled: false
      callbackPaths:
        - /api/oidc/callback/pocket-id
    kopiur:
      ignoreRules:
        # start.sh rotates its own sqlite copies on every boot; the live DB is
        # the only thing worth shipping to the repository.
        - /db/db-backup-*.sqlite3
