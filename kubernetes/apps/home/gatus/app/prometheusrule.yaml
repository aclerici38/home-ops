---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/prometheus-operator/0.94.2/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |-
            gatus_results_endpoint_success{group!="internal"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical
        # internal-gateway routes are guarded: they fail when the hostname
        # resolves on public DNS
        - alert: GatusEndpointExposed
          expr: |-
            gatus_results_endpoint_success{group="internal"} == 0
          for: 5m
          annotations:
            summary: >-
              The internal {{ $labels.name }} endpoint has a public DNS record
          labels:
            severity: critical
        - alert: GatusDown
          expr: |-
            absent(gatus_results_endpoint_success)
          for: 10m
          annotations:
            summary: >-
              gatus is not reporting any endpoint results — every service check
              is blind, not passing
          labels:
            severity: critical
