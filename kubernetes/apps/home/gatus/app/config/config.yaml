---
# PKCE
web:
  read-buffer-size: 32768
connectivity:
  checker:
    target: ${COREDNS_CLUSTER_IP}:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: tcp://1.1.1.1:53
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google-DNS
    group: connectivity
    url: tcp://8.8.8.8:53
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: tcp://9.9.9.9:53
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google-HTTPS
    group: connectivity
    url: tcp://google.com:443
    conditions:
      - "[CONNECTED] == true"

  - name: Raphael
    group: travel
    url: https://raphael.clerici.tech/manifest.json
    conditions:
      - "[STATUS] == 200"
      - "[BODY].name == Home Assistant"

  - name: Hub-API
    group: towonel
    url: https://towonel.cloud.clerici.tech/v1/health
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  - name: Edge-HTTP
    group: towonel
    url: http://vps.clerici.tech
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 301"

  - name: Iroh-Relay
    group: towonel
    url: https://vps.clerici.tech:8444/healthz
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

metrics: true

security:
  oidc:
    issuer-url: https://id.clerici.tech
    redirect-url: https://gatus.clerici.tech/authorization-code/callback
    client-id: $${CLIENT_ID}
    client-secret: $${CLIENT_SECRET}
    scopes:
      - openid

storage:
  type: postgres
  caching: true
  path: $${PG_URI}
