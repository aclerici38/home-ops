---
# PKCE
web:
  read-buffer-size: 32768
# Skip evaluations while the internet itself is unreachable, so a WAN drop
# doesn't record every external endpoint as down
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  # Plain UDP lookups against the network DNS LB IPs
  - name: Blocky-IPv4
    group: dns
    url: ${BLOCKY_LB_IP}:53
    dns: &google
      query-name: google.com
      query-type: A
    conditions: &resolves
      - "[DNS_RCODE] == NOERROR"
      - "len([BODY]) > 0"

  - name: Blocky-IPv6
    group: dns
    url: "[${BLOCKY_LB_IPV6}]:53"
    dns: *google
    conditions: *resolves

  # clerici.tech records, conditionally forwarded to k8s-gateway, must
  # still point at the right Gateway
  - name: Blocky-External
    group: dns
    url: ${BLOCKY_LB_IP}:53
    dns:
      query-name: id.clerici.tech
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == ${ENVOY_EXTERNAL_LB_IP}"

  - name: Blocky-Internal
    group: dns
    url: ${BLOCKY_LB_IP}:53
    dns:
      query-name: blocky.clerici.tech
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == ${ENVOY_INTERNAL_LB_IP}"

  # The VPS, from outside it
  - name: Hub-API
    group: towonel
    url: https://towonel.cloud.clerici.tech/v1/health
    client: &client
      dns-resolver: udp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  - name: Edge-HTTP
    group: towonel
    url: http://vps.clerici.tech
    client:
      <<: *client
      ignore-redirect: true
    conditions:
      - "[STATUS] == 301"

  - name: Iroh-Relay
    group: towonel
    url: https://vps.clerici.tech:8444/healthz
    client: *client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  - name: Status-Page
    group: buddy
    url: https://gatus.cloud.clerici.tech/health
    client: *client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

# cloud's Alertmanager Watchdog, pushed every ~2m; silence means cloud's
# Prometheus, Alertmanager or the path from it is down
external-endpoints:
  - name: cloud
    group: buddy
    token: $${BUDDY_TOKEN}
    heartbeat:
      interval: 10m

metrics: true

security:
  oidc:
    issuer-url: https://id.clerici.tech
    redirect-url: https://gatus.clerici.tech/authorization-code/callback
    client-id: $${CLIENT_ID}
    client-secret: $${CLIENT_SECRET}
    scopes:
      - openid

storage:
  type: postgres
  caching: true
  path: $${PG_URI}
