---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus
spec:
  # apiserver egress (sidecar watching HTTPRoutes/Services) comes from the
  # apiserver-clients CCNP; postgres and OIDC from gatus-postgres/-pocket-id
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: gatus
      app.kubernetes.io/name: gatus-sidecar
  ingress:
    # Route
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: external
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    # 1.1.1.1 resolves every external/static probe (so it takes the public
    # path), answers the internal routes' guarded lookups and is the
    # connectivity checker; the dns rule feeds the toFQDNs below
    - toCIDR:
        - 1.1.1.1/32
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
    # Blocky checks: the LB IPs are translated to the blocky pods in-cluster
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dns
            app.kubernetes.io/instance: blocky
            app.kubernetes.io/controller: blocky
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
    # versity-s3 Service probe resolves via k8s-gateway (Service 53 -> 1053)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dns
            app.kubernetes.io/instance: k8s-gateway
      toPorts:
        - ports:
            - {port: "1053", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
    # ...and lands on the s3.clerici.tech LB IP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: versity
            app.kubernetes.io/instance: versity
            app.kubernetes.io/controller: versity
      toPorts:
        - ports:
            - {port: "7070", protocol: TCP}
    # External HTTPRoutes, towonel and cloud probes, all of which resolve to
    # the VPS publicly
    - toFQDNs:
        - matchPattern: "*.clerici.tech"
        - matchPattern: "*.dormammu.clerici.tech"
        - matchPattern: "*.cloud.clerici.tech"
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    - toFQDNs:
        - matchName: vps.clerici.tech
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "8444", protocol: TCP}
