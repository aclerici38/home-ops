---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr-service-keys
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR__AUTH__APIKEY
    - secretKey: SONARR_RAPHAEL_API_KEY
      remoteRef:
        key: sonarr-raphael
        property: SONARR__AUTH__APIKEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR__AUTH__APIKEY
    - secretKey: RADARR_RAPHAEL_API_KEY
      remoteRef:
        key: radarr-raphael
        property: RADARR__AUTH__APIKEY
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: prowlarr
        property: PROWLARR__AUTH__APIKEY
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: bazarr
        property: BAZARR_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: seerr
        property: SEERR_API_KEY
    # Jellyfin mints a key per consumer, so dashbrr's lives on dashbrr's item.
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: dashbrr
        property: JELLYFIN_API_KEY
