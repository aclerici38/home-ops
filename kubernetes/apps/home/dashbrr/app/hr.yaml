---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.1.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashbrr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      dashbrr:
        initContainers:
          seed:
            image: &img
              repository: ghcr.io/autobrr/dashbrr
              tag: v0.6.0@sha256:55289a0487008f13388e4541fc95079f3d3a9cd660dfba170861dd4b6f0b7292
            command:
              - sh
              - -c
              # `config import` has no --yes; it always prompts, and on closed
              # stdin it reads "" and cancels. Existing services are skipped by
              # URL, so re-running on every start is a no-op.
              - |
                set -eu
                echo y | dashbrr config import /seed/services.yaml
            env: &env
              DASHBRR__LISTEN_ADDR: ":8080"
              DASHBRR__LOG_LEVEL: info
              DASHBRR__DB_TYPE: postgres
              DASHBRR__DB_HOST:
                secretKeyRef:
                  name: dashbrr-postgres
                  key: host
              DASHBRR__DB_PORT:
                secretKeyRef:
                  name: dashbrr-postgres
                  key: port
              DASHBRR__DB_USER:
                secretKeyRef:
                  name: dashbrr-postgres
                  key: user
              DASHBRR__DB_PASSWORD:
                secretKeyRef:
                  name: dashbrr-postgres
                  key: password
              DASHBRR__DB_NAME:
                secretKeyRef:
                  name: dashbrr-postgres
                  key: dbname
              DASHBRR__OIDC_ISSUER:
                secretKeyRef:
                  name: dashbrr-oidc-credentials
                  key: issuer_url
              DASHBRR__OIDC_CLIENT_ID:
                secretKeyRef:
                  name: dashbrr-oidc-credentials
                  key: client_id
              DASHBRR__OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: dashbrr-oidc-credentials
                  key: client_secret
              DASHBRR__OIDC_REDIRECT_URL: https://dashbrr.clerici.tech/api/auth/oidc/callback
            envFrom:
              - secretRef:
                  name: dashbrr-service-keys
            securityContext: &sec
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources: &res
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          dashbrr:
            image: *img
            env: *env
            securityContext: *sec
            resources: *res
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8080
                    path: /health
              readiness: *probes
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    service:
      dashbrr:
        controller: dashbrr
        ports:
          http:
            port: *port
    route:
      dashbrr:
        hostnames:
          - dashbrr.clerici.tech
        parentRefs:
          - name: external
            namespace: kgateway
    persistence:
      seed:
        type: configMap
        name: dashbrr
        advancedMounts:
          dashbrr:
            seed:
              - path: /seed
    configMaps:
      config:
        data:
          services.yaml: |
            ---
            services:
              sonarr:
                - name: Sonarr
                  url: http://sonarr.media.svc.cluster.local:8989
                  access_url: https://sonarr.clerici.tech
                  apikey: $${SONARR_API_KEY}
                - name: Sonarr (raphael)
                  url: http://sonarr-raphael.media.svc.cluster.local:8989
                  access_url: https://sonarr-raphael.clerici.tech
                  apikey: $${SONARR_RAPHAEL_API_KEY}
              radarr:
                - name: Radarr
                  url: http://radarr.media.svc.cluster.local:7878
                  access_url: https://radarr.clerici.tech
                  apikey: $${RADARR_API_KEY}
                - name: Radarr (raphael)
                  url: http://radarr-raphael.media.svc.cluster.local:7878
                  access_url: https://radarr-raphael.clerici.tech
                  apikey: $${RADARR_RAPHAEL_API_KEY}
              prowlarr:
                - name: Prowlarr
                  url: http://prowlarr.media.svc.cluster.local:9696
                  access_url: https://prowlarr.clerici.tech
                  apikey: $${PROWLARR_API_KEY}
              bazarr:
                - name: Bazarr
                  url: http://bazarr.media.svc.cluster.local:6767
                  access_url: https://bazarr.clerici.tech
                  apikey: $${BAZARR_API_KEY}
              jellyfin:
                - name: Jellyfin
                  url: http://jellyfin.jellyfin.svc.cluster.local:8096
                  access_url: https://jellyfin.clerici.tech
                  apikey: $${JELLYFIN_API_KEY}
              overseerr:
                - name: Seerr
                  url: http://seerr.media.svc.cluster.local:5055
                  access_url: https://seerr.clerici.tech
                  apikey: $${SEERR_API_KEY}
              # No qbittorrent type upstream
              general:
                - name: qBittorrent
                  url: http://qbittorrent.qbittorrent.svc.cluster.local:8080/api/v2/transfer/info
                  access_url: https://qbit.clerici.tech
  dependsOn:
    - name: dashbrr-resources
