---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashbrr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      dashbrr:
        pod:
          automountServiceAccountToken: true
          labels:
            dormammu.internal/apiserver-client: "true"
        containers:
          dashbrr:
            image:
              repository: ghcr.io/autobrr/dashbrr
              tag: v0.8.0@sha256:ce36626f51e4f7b2d7017c025c99faf2c41540209f21bb665a601d60c11ffffd
            env:
              DASHBRR__LISTEN_ADDR: ":8080"
              DASHBRR__LOG_LEVEL: info
              DASHBRR__ARR_IGNORED_HEALTH_CHECKS: DownloadClientRemovesCompletedDownloadsCheck
              # Services come from com.dashbrr.service.* annotations; apikeys resolve from envFrom
              DASHBRR__K8S_DISCOVERY_ENABLED: "true"
              DASHBRR__K8S_DISCOVERY_NAMESPACES: media,silo,qbittorrent
              DASHBRR__METRICS_ENABLED: "true"
              DASHBRR__METRICS_LISTEN_ADDR: ":9075"
              DASHBRR__DB_TYPE: postgres
              DASHBRR__DB_DSN:
                configMapKeyRef:
                  name: dashbrr-postgres
                  key: uri
              DASHBRR__OIDC_ISSUER:
                secretKeyRef:
                  name: dashbrr-oidc-credentials
                  key: issuer_url
              DASHBRR__OIDC_CLIENT_ID:
                secretKeyRef:
                  name: dashbrr-oidc-credentials
                  key: client_id
              DASHBRR__OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: dashbrr-oidc-credentials
                  key: client_secret
              DASHBRR__OIDC_REDIRECT_URL: https://dashbrr.clerici.tech/api/auth/oidc/callback
            envFrom:
              - secretRef:
                  name: dashbrr-service-keys
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 8080
                    path: /health
              readiness: *probes
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    service:
      dashbrr:
        controller: dashbrr
        ports:
          http:
            port: *port
          metrics:
            port: 9075
    serviceMonitor:
      dashbrr:
        serviceName: dashbrr
        endpoints:
          - port: metrics
    route:
      dashbrr:
        hostnames:
          - dashbrr.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    networkpolicies:
      dashbrr:
        type: cilium
        controller: dashbrr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        egress:
          # Monitored services
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: sonarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: sonarr-raphael
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: radarr-raphael
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: prowlarr
            toPorts:
              - ports:
                  - {port: "9696", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/instance: seerr
            toPorts:
              - ports:
                  - {port: "5055", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: silo
                  app.kubernetes.io/instance: silo
                  app.kubernetes.io/controller: silo
            toPorts:
              - ports:
                  - {port: "8096", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: dashbrr-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
  dependsOn:
    - name: dashbrr-resources
