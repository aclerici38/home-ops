---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: kopiur
      namespace: kopiur
  values:
    kopiur:
      existingClaim: true
      cephfs: true
    externalSecret:
      spec:
        data:
          - secretKey: MQTT_PASSWORD
            remoteRef:
              key: home-mosquitto
              property: Z2M_MQTT_PASS
