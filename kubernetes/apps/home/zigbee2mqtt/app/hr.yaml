---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.1.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      cottage:
        containers:
          cottage-z2m:
            image: &img
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.14.1@sha256:fef0de769dcd04c27b3a6d277b61046eb96284bdd4198dcb1687c3a01b3020f3
            env:
              <<: &env
                ZIGBEE2MQTT_DATA: /data
                ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ember
                ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE: 115200
                # MQTT
                ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto.mosquitto.svc.cluster.local
                ZIGBEE2MQTT_CONFIG_MQTT_VERSION: 5
                ZIGBEE2MQTT_CONFIG_MQTT_INCLUDE_DEVICE_INFORMATION: true
                ZIGBEE2MQTT_CONFIG_MQTT_USER: zigbee2mqtt
                ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD:
                  secretKeyRef:
                    name: zigbee2mqtt
                    key: MQTT_PASSWORD
                # Frontend
                ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: true
                ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: &port 8080
                # Advanced
                ZIGBEE2MQTT_CONFIG_ADVANCED_TRANSMIT_POWER: 20
                ZIGBEE2MQTT_CONFIG_ADVANCED_LAST_SEEN: ISO_8601
                ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL: info
                ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_OUTPUT: '["console"]'
                # Availability
                ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: true
                ZIGBEE2MQTT_CONFIG_AVAILABILITY_ACTIVE_TIMEOUT: 60
                ZIGBEE2MQTT_CONFIG_AVAILABILITY_PASSIVE_TIMEOUT: 2000
                # Home Assistant discovery.
                ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: true
                ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_EXPERIMENTAL_EVENT_ENTITIES: true
                # Device defaults
                ZIGBEE2MQTT_CONFIG_DEVICE_OPTIONS_RETAIN: true
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: tcp://cottage-slzb-ultima3.iot.internal:6638
              ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC: z2m-cottage
              ZIGBEE2MQTT_CONFIG_FRONTEND_URL: https://z2m.clerici.tech
              ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL: 11
              ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID: 17489
              ZIGBEE2MQTT_CONFIG_ADVANCED_EXT_PAN_ID: '[95, 40, 134, 189, 21, 240, 136, 221]'
              ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY:
                secretKeyRef:
                  name: zigbee2mqtt
                  key: COTTAGE_NETWORK_KEY
            resources: &resources
              requests:
                cpu: 5m
                memory: 202Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            probes: &probes
              liveness:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
      house:
        containers:
          house-z2m:
            image: *img
            env:
              <<: *env
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: tcp://house-slzb-ultima3.iot.internal:6638
              ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC: z2m-house
              ZIGBEE2MQTT_CONFIG_FRONTEND_URL: https://z2m-house.clerici.tech
              # Fresh network, formed on first start: the two ex-ZHA devices are being
              # re-paired, so nothing needs the old PAN or key.
              ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL: 25
              ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID: 46317
              ZIGBEE2MQTT_CONFIG_ADVANCED_EXT_PAN_ID: '[152, 196, 97, 47, 109, 52, 250, 247]'
              ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY:
                secretKeyRef:
                  name: zigbee2mqtt
                  key: HOUSE_NETWORK_KEY
            resources: *resources
            securityContext: *securityContext
            probes: *probes
    service:
      cottage:
        controller: cottage
        ports: &ports
          http:
            primary: true
            port: *port
          metrics:
            port: 9000
      house:
        controller: house
        ports: *ports
    route:
      cottage:
        hostnames:
          - z2m.clerici.tech
        parentRefs: &parentRefs
          - name: internal
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: cottage
                port: *port
      house:
        hostnames:
          - z2m-house.clerici.tech
        parentRefs: *parentRefs
        rules:
          - backendRefs:
              - identifier: house
                port: *port
    persistence:
      data:
        existingClaim: zigbee2mqtt
        advancedMounts:
          cottage:
            cottage-z2m:
              - path: /data
                subPath: cottage
          house:
            house-z2m:
              - path: /data
                subPath: house
  dependsOn:
    - name: zigbee2mqtt-resources
