---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur-movers
spec:
  # Maintenance, health-probe, bootstrap and delete Jobs run here
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kopiur
    matchExpressions:
      # kopia-server UI Deployments are policied below; maintenance Jobs carry
      # component=maintenance, so match everything else rather than no label
      - {key: app.kubernetes.io/component, operator: NotIn, values: [kopia-server]}
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: versity
            app.kubernetes.io/name: versity
            app.kubernetes.io/controller: versity
      toPorts:
        - ports:
            - {port: "7070", protocol: TCP}
    - toFQDNs:
        - matchName: s3.us-west-004.backblazeb2.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: versity-kopia-ui
spec:
  # `kopiur-mover serve`: kopia only, no apiserver
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: kopia-server
      kopiur.home-operations.com/cluster-repository: versity
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "51515", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: versity
            app.kubernetes.io/name: versity
            app.kubernetes.io/controller: versity
      toPorts:
        - ports:
            - {port: "7070", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backblaze-kopia-ui
spec:
  # `kopiur-mover serve`: kopia only, no apiserver
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: kopia-server
      kopiur.home-operations.com/cluster-repository: backblaze
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "51515", protocol: TCP}
  egress:
    - toFQDNs:
        - matchName: s3.us-west-004.backblazeb2.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
