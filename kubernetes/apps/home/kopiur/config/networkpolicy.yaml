---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: backblaze-clients
spec:
  description: Pods labelled egress.dormammu/backblaze reach the B2 S3 endpoint
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      egress.dormammu/backblaze: "true"
  egress:
    - toFQDNs:
        - matchName: s3.us-west-004.backblazeb2.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
