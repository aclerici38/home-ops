---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopia-versity-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: kgateway
      namespace: kgateway
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    pocketId:
      # Backup tooling: the UI can read and delete every snapshot in the repo.
      group: admin
      clientID: kopia-versity-home
      name: Kopia (versity)
      spec:
        logo:
          nameOverride: kopia
        secret:
          keys:
            clientID: client-id
            clientSecret: client-secret
      callbackPaths:
        - /oauth2/redirect
    oidc: {}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
