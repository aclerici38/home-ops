  values:
    pocketId:
      group: admin
      clientID: kopia-backblaze-home
      name: Kopia (backblaze)
      spec:
        logo:
          nameOverride: kopia
        secret:
          keys:
            clientID: client-id
            clientSecret: client-secret
      callbackPaths:
        - /oauth2/redirect
    oidc: {}
