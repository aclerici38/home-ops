---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.1.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-pet-tagger
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: immich-pet-tagger-resources
  values:
    controllers:
      immich-pet-tagger:
        replicas: 0
        pod:
          hostUsers: false
          nodeSelector:
            kubernetes.io/hostname: "bonds"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
        containers:
          immich-pet-tagger:
            image:
              repository: ghcr.io/tedornitier/immich-pet-tagger
              tag: v1.7.5-cpu@sha256:eae9b7e161951277ff833d8e2d2d9aebdebbacb6a494bbd488bade1835900455
            env:
              IMMICH_URL: http://immich-server.immich:2283
              IMMICH_EXTERNAL_URL: https://immich.clerici.tech
              IMMICH_API_KEY:
                secretKeyRef:
                  name: immich-pet-tagger
                  key: IMMICH_API_KEY
              POLL_INTERVAL: "900"
              TAG_NAME: Pets/Review
              YOLO_MODEL_NAME: yolov8s.pt
              CLIP_MODEL_NAME: ViT-L-14
              CLIP_PRETRAINED: openai
              YOLO_INPUT_SIZE: "1280"
              YOLO_CONF: "0.2"
              IOU_THRESHOLD: "0.5"
              THRESHOLD: "0.8"
              THRESHOLD_FALLBACK: "0.9"
              # 2 workers x 8 threads = 16 of the node's 32.
              GPU_WORKERS: "2"
              OMP_NUM_THREADS: "8"
              MKL_NUM_THREADS: "8"
              YOLO_BATCH_SIZE: "16"
              CLIP_BATCH_SIZE: "16"
              SCAN_WORKERS: "32"
              EMBED_CACHE_SIZE: "20000"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  periodSeconds: 5
                  failureThreshold: 60
                  timeoutSeconds: 5
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              readiness: *probe
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
              limits:
                memory: 16Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: {type: RuntimeDefault}
              capabilities: {drop: ["ALL"]}
    service:
      immich-pet-tagger:
        controller: immich-pet-tagger
        ports:
          http:
            port: *port
    route:
      immich-pet-tagger:
        hostnames:
          - pets.clerici.tech
        parentRefs:
          - name: internal
            namespace: kgateway
        rules:
          - backendRefs:
              - identifier: immich-pet-tagger
                port: *port
    persistence:
      data:
        existingClaim: immich-pet-tagger
        globalMounts:
          - path: /data
      cache:
        existingClaim: immich-pet-tagger-cache
        globalMounts:
          - path: /data/.cache
