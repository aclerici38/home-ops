<!doctype html>
<meta charset="utf-8">
<!--
  Frigate birdseye tile for the Kiosk slideshow.

  Kiosk reads local iframe files at render time and inlines them with srcdoc, so
  this runs on the Kiosk origin and talks cross-origin to go2rtc's birdseye
  restream through the internal gateway.

  The player is go2rtc's own VideoRTC element, loaded from the go2rtc bundled
  with Frigate so it always matches the server. It reconnects on its own and
  drops the stream while the page is hidden. MSE only: WebRTC would need 8555
  reachable from the display. The snapshot poster covers the wait for the first
  keyframe (birdseye encodes one every 5s).
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video-rtc { display: block; height: 100%; }
  video { object-fit: contain; }
</style>

<script type="module">
  import { VideoRTC } from "https://birdseye.clerici.tech/video-rtc.js";

  customElements.define("video-rtc", VideoRTC);
  const player = document.createElement("video-rtc");
  player.mode = "mse";
  player.media = "video";
  player.src = "wss://birdseye.clerici.tech/api/ws?src=birdseye";
  document.body.append(player);
  player.video.controls = false;
  player.video.poster = "https://birdseye.clerici.tech/api/birdseye/latest.jpg";
</script>
