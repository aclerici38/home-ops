---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: external-secrets
      namespace: external-secrets
    - name: dragonfly-operator
      namespace: dragonfly-operator
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    nfsGate:
      targets:
        - name: immich
        - name: immich-machine-learning
    cnpg:
      mode: shared
      mtls: true
      poolMode: session
      podLabels:
        app.kubernetes.io/instance: immich
        app.kubernetes.io/controller: server
      spec:
        database:
          extensions:
            - name: vector
              ensure: present
            - name: vchord
              ensure: present
              version: 1.1.1
            - name: earthdistance
              ensure: present
            - name: cube
              ensure: present
    externalSecret: {}
    dragonfly:
      podLabels:
        app.kubernetes.io/instance: immich
        app.kubernetes.io/controller: server
      extraArgs:
        - --default_lua_flags=allow-undeclared-keys
    pocketId:
      group: all
      podLabels:
        app.kubernetes.io/instance: immich
        app.kubernetes.io/controller: server
      spec:
        oidcClient:
          secret:
            storeClientSecret: false
          clientSecretRotation:
            enabled: false
      callbackUrls:
        - app.immich:///oauth-callback
      callbackPaths:
        - /auth/login
        - /user-settings
    gpu: {}
