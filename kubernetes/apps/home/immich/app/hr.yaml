---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: nfs-server
      namespace: nfs-server
    - name: immich-resources
  values:
    controllers:
      server:
        forceRename: immich
        strategy: RollingUpdate
        pod:
          # keep at 1 replica until https://github.com/immich-app/immich/pull/28410
          nodeSelector:
            kubernetes.io/hostname: "bonds"
        containers:
          immich-server:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.2@sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
            env:
              IMMICH_LOG_LEVEL: verbose
              REDIS_HOSTNAME: immich-dragonfly-db
              IMMICH_TELEMETRY_INCLUDE: all
              IMMICH_IGNORE_MOUNT_CHECK_ERRORS: true
              IMMICH_TRUSTED_PROXIES: ${CLUSTER_POD_CIDR}
              IMMICH_PROCESS_INVALID_IMAGES: true
              DB_URL:
                valueFrom:
                  configMapKeyRef:
                    name: immich-postgres
                    key: uri
            probes:
              liveness: &probes
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &port 2283
              readiness: *probes
              startup:
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 18
                  initialDelaySeconds: 2
                  timeoutSeconds: 1
            securityContext: &contSec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 300Mi
              limits:
                memory: 12Gi
              claims:
                - name: gpu
      machine-learning:
        pod:
          nodeSelector:
            kubernetes.io/hostname: "bonds"
        containers:
          immich-ml:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.2-openvino@sha256:4013ec28ccf6344d7ae24554743a116d7f61124b98858f5646a401d5c5df12e2
            env:
              HF_HOME: /cache/hf
              IMMICH_LOG_LEVEL: verbose
              MACHINE_LEARNING_MODEL_TTL: 0
              MACHINE_LEARNING_CACHE_FOLDER: /cache
              MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-SO400M-16-SigLIP2-384__webli
              GUNICORN_CMD_ARGS: --no-control-socket
            resources:
              requests:
                cpu: 500m
                memory: 5Gi
              limits:
                memory: 16Gi
              claims:
                - name: gpu
            securityContext: *contSec
    defaultPodOptions:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: immich-gpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      server:
        controller: server
        ports:
          http:
            port: *port
          metrics-api:
            port: 8081
      ml:
        controller: machine-learning
        ports:
          http:
            port: 3003
    serviceMonitor:
      server:
        serviceName: immich-server
        endpoints:
          - port: metrics-api
            scheme: http
    route:
      immich:
        hostnames:
          - immich.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: server
                port: *port
    persistence:
      postgres-cert:
        type: secret
        name: immich-postgres-cert
        defaultMode: 0440
        advancedMounts:
          server:
            immich-server:
              - path: /var/run/secrets/postgresql
      data:
        type: persistentVolumeClaim
        storageClass: nfs-immich
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: data
        advancedMounts:
          server:
            immich-server:
              - path: /data
      thumbnails:
        existingClaim: immich-thumbs
        advancedMounts:
          server:
            immich-server:
              - path: /data/thumbs
      encoded-video:
        existingClaim: immich-encoded-video
        advancedMounts:
          server:
            immich-server:
              - path: /data/encoded-video
      cache:
        existingClaim: immich-ml-cache
        advancedMounts:
          machine-learning:
            immich-ml:
              - path: /cache
                subPath: cache
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
        advancedMounts:
          server:
            immich-server:
              - path: /data/backups
                subPath: backups
