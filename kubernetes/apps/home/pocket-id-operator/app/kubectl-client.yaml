---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/pocket-id-operator/0.16.2/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kubectl
spec:
  name: kubectl
  clientID: kubectl
  isPublic: true
  pkceEnabled: true
  skipConsent: true
  # kubelogin's default ports
  callbackUrls:
    - http://localhost:8000
    - http://localhost:18000
  allowedUserGroups:
    - name: admin
