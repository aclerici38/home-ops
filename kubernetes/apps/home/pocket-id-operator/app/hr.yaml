---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/refs/heads/main/dist/schemas/helmrelease_v2_pocket-id-operator.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  # chart:
  #   spec:
  #     chart: charts/pocket-id-operator
  #     reconcileStrategy: Revision
  #     sourceRef:
  #       kind: GitRepository
  #       name: pocket-id-operator-main
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: pocket-id-operator-resources
  valuesFrom:
    - kind: ConfigMap
      name: pocket-id-operator-values
      valuesKey: values.yaml
  # home-only: the pocket-id instance, users and groups (base operator/metrics values
  # come from the shared pocket-id-operator-values ConfigMap).
  values:
    operator:
      image:
        repository: ghcr.io/aclerici38/pocket-id-operator
        tag: pr-605
    pocket-id-instance:
      instance:
        enabled: true
        name: pocket-id
        spec:
          image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless@sha256:e0f83a42a78d0759b6d2d8c7380ef0fa8a4c95dfa01ad88740a073ae9cc4ba94
          podTemplate:
            spec:
              hostUsers: false
          route:
            enabled: true
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: external
                namespace: kgateway
                sectionName: https
          encryptionKey:
            valueFrom:
              secretKeyRef:
                name: pocket-id
                key: ENCRYPTION_KEY
          databaseUrl:
            valueFrom:
              secretKeyRef:
                name: pocket-id-postgres
                key: uri
          appUrl: https://id.clerici.tech
          hostUsers: false
          versionCheckDisabled: true
          fileBackend: database
          ui:
            sessionDuration: 1440
          smtp:
            host: smtp-relay.smtp-relay.svc.cluster.local
            from: bot@clerici.tech
            port: 25
            tls: none
          emailNotifications:
            loginNotification: true
            oneTimeAccessAsAdmin: true
            apiKeyExpiration: true
            verification: true
          persistence:
            enabled: false
          metrics:
            enabled: true
          OIDCClientRotation:
            minSpacing: 5m
          trustedProxies:
            enabled: true
            cidrs:
              - "172.16.0.0/16"
      users:
        - name: anthony
          spec:
            locale: en
            admin: true
            apiKeys:
              - name: cloud
                description: cloud cluster pocket-id-operator
                expiresAt: "2031-01-01T00:00:00Z"
            email:
              valueFrom:
                key: EMAIL
                name: pocket-id
            firstName:
              value: Anthony
            lastName:
              value: Clerici
            customClaims:
              - key: oc_groups
                value: opencloud-admins
              - key: immich_role
                value: admin
              - key: frigate_role
                value: admin
        - name: steve
          spec:
            locale: en
            userInfoSecretRef:
              name: pocket-id-steve-info
      userGroups:
        - name: admin
          spec:
            users:
              userRefs:
                - name: anthony
        - name: fam
          spec:
            users: &fam
              userRefs:
                - name: anthony
                - name: steve
              usernames:
                - melanie
        - name: all
          spec:
            users:
              <<: *fam
              userIDs:
                - 56f6f365-feb5-464f-bf31-f537d3a34a9e
            customClaims:
              - key: oc_groups
                value: opencloud-users
              - key: immich_role
                value: user
