---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/refs/heads/main/dist/schemas/helmrelease_v2_pocket-id-operator.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  # chart:
  #   spec:
  #     chart: charts/pocket-id-operator
  #     reconcileStrategy: Revision
  #     sourceRef:
  #       kind: GitRepository
  #       name: pocket-id-operator-main
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: pocket-id-operator-resources
  valuesFrom:
    - kind: ConfigMap
      name: pocket-id-operator-values
      valuesKey: values.yaml
  # home-only: the pocket-id instance, users and groups (base operator/metrics values
  # come from the shared pocket-id-operator-values ConfigMap).
  values:
    operator:
      image:
        repository: ghcr.io/aclerici38/pocket-id-operator
        tag: pr-726
    pocket-id-instance:
      instance:
        enabled: true
        name: pocket-id
        spec:
          image: ghcr.io/pocket-id/pocket-id:v2.19.1-distroless@sha256:d035c9c229304cfd25f97a79b2da00bde9cf942abbd70430d452a95420e2836b
          podTemplate:
            spec:
              hostUsers: false
              volumes:
                - name: postgres-cert
                  secret:
                    secretName: pocket-id-postgres-cert
                    defaultMode: 0440
          route:
            enabled: true
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: external
                namespace: envoy-gateway
                sectionName: https
          encryptionKey:
            valueFrom:
              secretKeyRef:
                name: pocket-id
                key: ENCRYPTION_KEY
          databaseUrl:
            valueFrom:
              configMapKeyRef:
                name: pocket-id-postgres
                key: uri
          appUrl: https://id.clerici.tech
          cimdUrlAllowlist:
            - https://claude.ai/oauth/claude-code-client-metadata
          hostUsers: false
          # Workload + pod; egress via the smtp-relay-clients CCNP
          labels:
            dormammu.internal/smtp-relay-client: "true"
          versionCheckDisabled: true
          fileBackend: database
          ui:
            sessionDuration: 1440
          smtp:
            host: smtp-relay.smtp-relay.svc.cluster.local
            from: bot@clerici.tech
            port: 25
            tls: none
          emailNotifications:
            loginNotificationMode: browserRecognition
            oneTimeAccessAsAdmin: true
            apiKeyExpiration: true
            verificationMode: optional
          persistence:
            enabled: false
            extraVolumeMounts:
              - name: postgres-cert
                mountPath: /var/run/secrets/postgresql
                readOnly: true
          metrics:
            enabled: true
          OIDCClientRotation:
            minSpacing: 1m
          trustedProxies:
            enabled: true
            cidrs:
              - "172.16.0.0/16"
      users:
        - name: anthony
          spec:
            locale: en
            admin: true
            apiKeys:
              - name: cloud
                description: cloud cluster pocket-id-operator
                expiresAt: "2031-01-01T00:00:00Z"
            email:
              valueFrom:
                key: EMAIL
                name: pocket-id
            firstName:
              value: Anthony
            lastName:
              value: Clerici
            customClaims:
              - key: oc_groups
                value: opencloud-admins
              - key: immich_role
                value: admin
              - key: frigate_role
                value: admin
        - name: steve
          spec:
            locale: en
            userInfoSecretRef:
              name: pocket-id-steve-info
      userGroups:
        - name: admin
          spec:
            users:
              userRefs:
                - name: anthony
        - name: fam
          spec:
            users: &fam
              userRefs:
                - name: anthony
                - name: steve
              usernames:
                - melanie
        - name: all
          spec:
            users:
              <<: *fam
              userIDs:
                - 56f6f365-feb5-464f-bf31-f537d3a34a9e
            customClaims:
              - key: oc_groups
                value: opencloud-users
              - key: immich_role
                value: user
