---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/tuppr/0.5.10/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    version: ${TALOS_VERSION}
  policy:
    rebootMode: powercycle
    # Drain + wait for CSI detach before the powercycle; otherwise RWO Ceph
    # volumes stay attached to the dead node until it returns (Multi-Attach)
    waitForVolumeDetach: true
  healthChecks:
    - apiVersion: v1
      kind: Node
      description: every node Ready
      timeout: 15m
      expr: |-
        status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      timeout: 15m
      expr: |-
        status.phase != "Running"
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      timeout: 15m
      expr: |-
        status.ceph.health in ['HEALTH_OK']
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      description: CNPG clusters healthy, every instance ready, no switchover in flight
      timeout: 15m
      expr: |-
        status.phase == "Cluster in healthy state" &&
        status.readyInstances == object.spec.instances &&
        status.currentPrimary == status.targetPrimary
    - apiVersion: apps/v1
      kind: Deployment
      description: every CNPG pooler fully available
      timeout: 10m
      labelSelector:
        matchLabels:
          cnpg.io/podRole: pooler
      expr: |-
        has(status.availableReplicas) && status.availableReplicas == object.spec.replicas
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: pocket-id-operator
      description: pocket-id serving
      timeout: 10m
      expr: |-
        has(status.availableReplicas) && status.availableReplicas == object.spec.replicas
