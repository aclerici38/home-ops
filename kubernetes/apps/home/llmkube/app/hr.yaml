---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=llmkube/0.9.25
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: llmkube
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  values:
    crds:
      install: true
      keep: true

    controllerManager:
      # Not needed for intel DRA
      driRenderGID: 0
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 1Gi

    modelCache:
      enabled: true
      mode: shared
      storageClass: ceph-filesystem
      accessMode: ReadWriteMany
      size: 40Gi

    metrics:
      enabled: true
      secure: true
      # The inference PodMonitor below is the discovery mechanism; enabling
      # annotations too would double-scrape every inference pod.
      emitScrapeAnnotations: false

    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: llmkube
        rules:
          # drm-exporter covers this
          gpu:
            enabled: false
          inference:
            enabled: true
          serving:
            enabled: true

    grafana:
      dashboards:
        enabled: true
        only:
          - llamacpp-dashboard
          - llmkube-inference
        operator:
          enabled: true
          mode: auto
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
          allowCrossNamespaceImport: true
          datasources:
            - inputName: DS_PROMETHEUS
              datasourceName: prometheus

    modelSource:
      allowedHostPathRoots: []
      allowedRemoteHosts: []
  dependsOn:
    - name: intel-gpu-resource-driver
      namespace: intel-gpu-resource-driver
