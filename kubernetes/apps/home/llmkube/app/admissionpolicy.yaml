---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/mutatingadmissionpolicy-admissionregistration-v1.json
# The operator injects a root model-cache-prep init container (uid 0, +CHOWN/FOWNER)
# into every cache-backed pod, which PSA restricted rejects. It only matters on CSI
# drivers with fsGroupPolicy None; cephfs here is File, so kubelet already leaves the
# cache root 0:1000 2775 from the pod fsGroup. Remove once upstream #2057 lands.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: llmkube-drop-cache-prep
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: llmkube
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - "v1"
        operations:
          - "CREATE"
        resources:
          - "pods"
  matchConditions:
    - name: has-cache-prep
      expression: >-
        has(object.spec.initContainers) &&
        object.spec.initContainers.exists(c, c.name == "model-cache-prep")
    # Without a pod fsGroup nothing else fixes the mount root's ownership.
    - name: has-fsgroup
      expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.fsGroup)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        # Remove by index: a value built from typed Containers cannot be marshalled.
        expression: >-
          [
            JSONPatch{
              op: "remove",
              path: "/spec/initContainers/" + string(object.spec.initContainers.map(c, c.name).indexOf("model-cache-prep"))
            }
          ]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/mutatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: llmkube-drop-cache-prep
spec:
  policyName: llmkube-drop-cache-prep
