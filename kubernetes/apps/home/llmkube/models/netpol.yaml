---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-inference
spec:
  # Every InferenceService pod
  endpointSelector:
    matchExpressions:
      - {key: inference.llmkube.dev/service, operator: Exists}
  ingress:
    # AIGatewayRoute backends and the rerank HTTPRoute
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - {}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-prefetch
spec:
  # Model prefetch Job pods (operator-set pod template labels)
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: model-prefetch
  ingress:
    - {}
  egress:
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "**.hf.co"
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-metal
spec:
  # Relays (ingress comes from llmkube-inference) and MetalNode dial-back pods
  endpointSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [metal-relay, metal-node-verifier]}
  egress:
    # The agent's ingress (selectorless <isvc>-agent Services); nix-config/mac-mini
    - toCIDR:
        - 10.0.40.140/32
      toPorts:
        - ports:
            - {port: "9443", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llmkube-embedding-silo
spec:
  # silo's recommendations.embedding_base_url points at the Service directly
  # (DB-only setting), bypassing the gateway
  endpointSelector:
    matchLabels:
      inference.llmkube.dev/service: qwen3-embedding-0-6b
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: silo
            app.kubernetes.io/instance: silo
            app.kubernetes.io/controller: silo
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
