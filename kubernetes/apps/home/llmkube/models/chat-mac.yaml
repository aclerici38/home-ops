---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.18/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-14b
spec:
  source: https://huggingface.co/bartowski/Qwen_Qwen3-14B-GGUF/resolve/main/Qwen_Qwen3-14B-Q4_K_M.gguf
  format: gguf
  sha256: 915913e22399475dbe6c968ac014d9f1fbe08975e489279aede9d5c7b2c98eb6
  quantization: Q4_K_M
  hardware:
    # Served by the Mac mini's metal-agent (nix-config/mac-mini)
    accelerator: metal
    gpu:
      enabled: true
      layers: -1
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.18/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-14b
spec:
  modelRef: qwen3-14b
  runtime: llamacpp
  mode: chat
  replicas: 1
  # ~8.4 GiB weights + ~5.3 GiB q8_0 KV, inside the agent's ~16 GiB budget.
  # Hermes refuses <64K; YaRN 2x past the 32768 training context, slots share it via --kv-unified
  contextSize: 65536
  ropeScaling:
    type: yarn
    factor: "2.0"
    originalContext: 32768
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  parallelSlots: 2
  flashAttention: true
  jinja: true
  uBatchSize: 2048
  extraArgs:
    - --kv-unified
    - --cache-ram
    - "2048"
    - --reasoning-budget
    - "0"
