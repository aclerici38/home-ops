---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.19/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: gpt-oss-20b
spec:
  source: https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf
  format: gguf
  sha256: 27cd6c432c7672cb812a92f611cf3ba7bbc35928262bb1e1253ff4ee6ae35901
  quantization: MXFP4
  hardware:
    # Served by the Mac mini's metal-agent (nix-config/mac-mini)
    accelerator: metal
    gpu:
      enabled: true
      layers: -1
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.19/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gpt-oss-20b
spec:
  modelRef: gpt-oss-20b
  runtime: llamacpp
  mode: chat
  replicas: 1
  # ~11.3 GiB weights + 3 GiB f16 KV (the agent charges every layer; half are 128-token
  # sliding window), inside its ~16 GiB budget. Hermes needs >=64K; 128K is native
  contextSize: 65536
  parallelSlots: 2
  flashAttention: true
  jinja: true
  uBatchSize: 2048
  extraArgs:
    - --kv-unified
    - --cache-ram
    - "2048"
    # OpenAI's recommended gpt-oss sampling
    - --temp
    - "1.0"
    - --top-p
    - "1.0"
    - --top-k
    - "0"
