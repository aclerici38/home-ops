---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.12/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-reranker-v2-m3
spec:
  source: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf
  format: gguf
  sha256: a43c7c9b11a4c1517e5bf95151960e1621d1b72f7a493364b01e386cf1aaa1d3
  # Stage into the shared cache from a Job; Model reads Downloading until done.
  prefetch: true
  quantization: Q8_0
  hardware:
    # cain's iGPU, shared with the embedder — see claims.yaml.
    accelerator: intel
    gpu:
      enabled: true
      vendor: intel
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimName: llmkube-cain-igpu
  resources:
    cpu: "1"
    memory: 4Gi
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.12/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-reranker-v2-m3
spec:
  modelRef: bge-reranker-v2-m3
  runtime: llamacpp
  mode: rerank
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11913@sha256:3607a208ef03bc4f64515fbfac6bffc386859c14b64abec24c96f143868fcb37

  # This one is a BERT-style encoder with non-causal attention, so the whole
  # sequence has to fit in a single micro-batch — uBatchSize is a hard ceiling
  # on document length, not a throughput knob. Equal to contextSize for that
  # reason.
  contextSize: 4096
  batchSize: 4096
  uBatchSize: 4096

  resources:
    cpu: "1"
    memory: 4Gi

  env:
    - name: HOME
      value: /tmp
    - name: XDG_CACHE_HOME
      value: /tmp/cache

  extraArgs:
    - --alias
    - bge-reranker-v2-m3
    - --threads
    - "2"

  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  modelCache:
    prefetch: true

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # The operator --default-fsgroup (curl_group)
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
