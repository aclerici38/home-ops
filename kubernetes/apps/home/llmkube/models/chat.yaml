---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.9.24/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8b
spec:
  source: https://huggingface.co/bartowski/Qwen_Qwen3-8B-GGUF/resolve/main/Qwen_Qwen3-8B-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: intel
    gpu:
      enabled: true
      vendor: intel
      layers: -1 # -1 resolves to --n-gpu-layers 99, i.e. full offload
      # DRA claim instead of an extended resource.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-a770
  resources:
    cpu: "2"
    memory: 6Gi
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.9.24/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8b
spec:
  modelRef: qwen3-8b
  runtime: llamacpp
  mode: chat
  replicas: 1
  # Benchmarked against :server-intel (SYCL) on this A770, identical flags.
  # SYCL wins prompt processing 1458 vs 663 tok/s, but loses generation 26.0 vs
  # 38.5. Prompts cache across turns here (HA reuses one entity-list system
  # prompt), so generation dominates and Vulkan wins the real workload.
  # SYCL only pays off above ~15 prompt tokens per generated token on a cache
  # miss — bulk document summarisation, not chat or voice.
  # SYCL image: server-intel-b10711@sha256:d46028d074393c12d3734269cb9be77b1d38121f1dc1f6e1d51235f7eee8b835
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10752@sha256:a07daf5557d88b5eacfa0b5f2f067bad5fb0e7ad1d68956c06e7c2c732249020

  # Measured VRAM: this service holds ~7.15 GiB, device total sits at 12.84 of
  # 15.9 with the media stack idle and ~14.0 at its 7-day peak. KV is 144 KiB
  # per token at f16 (36 layers x 8 KV heads x 128 head_dim), so 32768 context
  # would add 2.25 GiB and overrun that margin.
  contextSize: 16384
  # Context is divided across slots, so this is 8k each: one for HA voice, one
  # for open-webui, so a long chat cannot block a voice command behind it.
  parallelSlots: 2
  flashAttention: true
  # f16, not q8_0. Quantised KV dequantises in the attention inner loop every
  # token: measured 33.0 tok/s at q8_0 vs 38.8 at f16, for 1.1 GiB of VRAM.
  cacheTypeK: f16
  cacheTypeV: f16

  # Required for HA's Assist API: it drives entity control through tool calls,
  # which need the model's real chat template for both rendering and tool-call
  # parsing.
  jinja: true
  # Qwen3-8B is a hybrid thinking model and emits <think> blocks by default.
  # For a voice assistant that is latency spent on tokens nobody hears, so
  # visible reasoning is off; the model still reasons internally.
  reasoningBudget: 0

  batchSize: 2048
  # 2048 over the 512 default: +8% prompt processing (663 vs 612 tok/s) for
  # ~0.3 GiB. Matters on RAG requests, where retrieved chunks miss the cache.
  uBatchSize: 2048

  resources:
    cpu: "2"
    memory: 6Gi

  env:
    - name: HOME
      value: /tmp
    - name: XDG_CACHE_HOME
      value: /tmp/cache

  extraArgs:
    # The name clients send as "model".
    - --alias
    - qwen3-8b
    - --threads
    - "4"
    # Cap the host-RAM prompt cache. Left at its 8192 MiB default it would
    # dominate the pod's memory profile; 2 GiB is enough to keep HA's system
    # prompt (the exposed-entity list) warm across turns, which is the single
    # biggest time-to-first-token win for voice.
    - --cache-ram
    - "2048"

  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
