---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.13/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0-6b
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  sha256: 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439
  # Stage into the shared cache from a Job; Model reads Downloading until done.
  prefetch: true
  quantization: Q8_0
  hardware:
    # cain's iGPU, not the A770: keeps the chat model's VRAM budget intact.
    accelerator: intel
    gpu:
      enabled: true
      vendor: intel
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimName: llmkube-cain-igpu
  resources:
    cpu: "1"
    memory: 4Gi
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/llmkube/0.10.13/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding-0-6b
spec:
  modelRef: qwen3-embedding-0-6b
  runtime: llamacpp
  mode: embedding
  replicas: 1
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11977@sha256:76af7ee470093727cb66db78368935b027b965df8a6c4dc4ca6e782c1cd0cfac

  # batch and ubatch are held equal to contextSize: llama.cpp will not split a
  # sequence across micro-batches when embedding, so a chunk longer than
  # uBatchSize fails the request rather than degrading.
  contextSize: 4096
  batchSize: 4096
  uBatchSize: 4096

  resources:
    cpu: "1"
    memory: 6Gi

  env:
    - name: HOME
      value: /tmp
    - name: XDG_CACHE_HOME
      value: /tmp/cache

  extraArgs:
    - --alias
    - qwen3-embedding-0.6b
    # llama.cpp sizes its pool from hardware_concurrency, not the cgroup quota.
    - --threads
    - "2"

  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  modelCache:
    prefetch: true

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # The operator --default-fsgroup (curl_group)
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
