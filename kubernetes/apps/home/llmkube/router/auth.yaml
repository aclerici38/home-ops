---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/pocket-id-operator/0.14.3/pocketidapi_v1alpha1.json
# Clients are granted access to it with apiAccess.clientPermissions, which is what enables client_credentials.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDAPI
metadata:
  name: llm
spec:
  # Immutable once set; also the "aud" the SecurityPolicy below checks.
  resource: https://llm.clerici.tech
  permissions:
    - key: inference:local
      name: Local inference
      description: Models served in-cluster
    - key: inference:cloud
      name: Cloud inference
      description: Billed third-party models reached through the gateway
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.1/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: pocket-id
spec:
  endpoints:
    - fqdn:
        hostname: pocket-id.pocket-id-operator.svc.cluster.local
        port: 1411
