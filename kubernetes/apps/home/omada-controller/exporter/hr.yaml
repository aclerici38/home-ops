---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada-exporter
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 2m
  upgrade:
    timeout: 2m
  dependsOn:
    - name: omada-controller
      namespace: omada-controller
  values:
    controllers:
      omada-exporter:
        pod:
          hostUsers: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
        strategy: RollingUpdate
        containers:
          omada-exporter:
            image:
              repository: ghcr.io/charlie-haley/omada_exporter
              tag: 0.13.1@sha256:f1b939655866d87bcc5df4e6017627cfe690dee81c4a8550382d108e9e852171
            env:
              OMADA_HOST: https://omada-controller
              OMADA_INSECURE: true
              OMADA_SITE: Lab
              OMADA_USER:
                secretKeyRef:
                  name: omada-controller
                  key: username
              OMADA_PASS:
                secretKeyRef:
                  name: omada-controller
                  key: password
    service:
      omada-exporter:
        controller: omada-exporter
        ports:
          http:
            port: 9202
    networkpolicies:
      omada-exporter:
        type: cilium
        controller: omada-exporter
        ingress:
          - {}
        egress:
          # OMADA_HOST
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: omada-controller
                  app.kubernetes.io/name: omada-controller
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    serviceMonitor:
      exporter:
        serviceName: omada-exporter
        endpoints:
          - port: http
            scheme: http
