---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/prometheus-operator/0.94.2/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator
spec:
  groups:
    - name: trivy-operator.rules
      rules:
        - alert: TrivyFixableCriticalVulnerability
          # ignoreUnfixed is on, so every counted CVE has a fixed version.
          # Reports on superseded ReplicaSets and finished Jobs linger until
          # the 24h report TTL; drop them so a rollout resolves the alert.
          # Recreate rollouts never mark old reports for deletion:
          # https://github.com/aquasecurity/trivy-operator/issues/3069
          # Drop the ReplicaSet clause once this ships:
          # https://github.com/aquasecurity/trivy-operator/pull/3070
          expr: |-
            max by (image_registry, image_repository, image_tag) (
              trivy_image_vulnerabilities{severity="Critical"}
                unless on (namespace, resource_name)
                  label_replace(
                    kube_replicaset_spec_replicas == 0,
                    "resource_name", "$1", "replicaset", "(.+)"
                  )
                unless on (namespace, resource_name)
                  label_replace(
                    kube_job_status_active == 0,
                    "resource_name", "$1", "job_name", "(.+)"
                  )
            ) > 0
          for: 1d
          annotations:
            summary: >-
              {{ $labels.image_repository }}:{{ $labels.image_tag }} has
              {{ $value }} fixable critical CVEs
            description: >-
              Check the image's VulnerabilityReport; a Renovate bump usually
              clears it.
          labels:
            severity: warning
