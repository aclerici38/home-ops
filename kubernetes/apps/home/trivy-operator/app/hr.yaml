---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: trivy-operator
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  values:
    image:
      registry: mirror.gcr.io
      repository: aquasec/trivy-operator
      tag: 0.30.1@sha256:448484ece65e26f1c7237c8d20dab997f5a8319968286a09e188140b863cf1f9
    operator:
      podLabels:
        dormammu.internal/apiserver-client: "true"
      builtInTrivyServer: true
      scanJobsConcurrentLimit: 2
      rbacAssessmentScannerEnabled: false
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
    compliance:
      specs: []
    serviceMonitor:
      enabled: true
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    trivyOperator:
      scanJobPodTemplateLabels: app.kubernetes.io/component=scanner
      scanJobPodTemplatePodSecurityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    trivy:
      image:
        registry: ghcr.io
        repository: aquasecurity/trivy
        tag: 0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
      severity: HIGH,CRITICAL
      ignoreUnfixed: true
      storageClassName: ceph-filesystem
      server:
        podSecurityContext:
          seccompProfile: {type: RuntimeDefault}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
