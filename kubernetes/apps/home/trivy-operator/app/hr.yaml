---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 1h
  maxHistory: 1
  chart:
    spec:
      chart: trivy-operator
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
      version: 0.38.1
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    crds: CreateReplace
    remediation:
      retries: 1
  values:
    image:
      registry: mirror.gcr.io
      repository: aquasec/trivy-operator
      tag: 0.36.1@sha256:05191a514247ae644dd5cc71306a94f44faff0a6a3fa817235911b911ecebcb9
    operator:
      podLabels:
        dormammu.internal/apiserver-client: "true"
      builtInTrivyServer: true
      scanJobsConcurrentLimit: 2
      # Image vulnerability scanning only
      sbomGenerationEnabled: false
      configAuditScannerEnabled: false
      exposedSecretScannerEnabled: false
      rbacAssessmentScannerEnabled: false
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
    # Otherwise the chart still installs the compliance specs
    compliance:
      specs: []
    serviceMonitor:
      enabled: true
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    trivyOperator:
      scanJobPodTemplateLabels: app.kubernetes.io/component=scanner
      scanJobPodTemplatePodSecurityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    trivy:
      image:
        registry: ghcr.io
        repository: aquasecurity/trivy
        tag: 0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      severity: HIGH,CRITICAL
      ignoreUnfixed: true
      storageClassName: ceph-filesystem
      server:
        podSecurityContext:
          seccompProfile: {type: RuntimeDefault}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
