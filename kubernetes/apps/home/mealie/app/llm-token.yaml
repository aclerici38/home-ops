---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/webhook_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: llm-token
spec:
  url: http://pocket-id.pocket-id-operator.svc.cluster.local:1411/api/oidc/token
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Authorization: Basic {{ print .creds.client_id ":" .creds.client_secret | b64enc }}
  body: grant_type=client_credentials&resource={{ urlquery .creds.resource }}&scope={{ urlquery .creds.scopes }}
  result:
    # The whole token response; access_token is the field we keep.
    jsonPath: "$"
  secrets:
    - name: creds
      # No key: the entire Secret is exposed to the templates above.
      secretRef:
        name: mealie-llm-oidc-credentials
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
spec:
  # Weekly
  refreshInterval: 168h
  target:
    template:
      data:
        LLM_GATEWAY_TOKEN: "{{ .access_token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Webhook
          name: llm-token
