---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-bouncer
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: envoy-proxy-crowdsec-bouncer
  ingress:
    # ext_authz from the crowdsec-ext-auth SecurityPolicy on the external gateway
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: external
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: crowdsec
            type: lapi
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s-app: crowdsec
            type: appsec
      toPorts:
        - ports:
            - {port: "7422", protocol: TCP}
