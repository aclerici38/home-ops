---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.3/helmrelease_v2.json?values=app-template/5.0.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-ui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: crowdsec-ui-resources
    - name: crowdsec
  values:
    controllers:
      crowdsec-ui:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          crowdsec-ui:
            image:
              repository: ghcr.io/theduffman85/crowdsec-web-ui
              tag: 2026.7.23@sha256:c183c120bdb15d496bf292f6f8d00f573f7cd4b93b7a295e0cd528d8a4dded50
            env:
              CONFIG_UI_TIME_ZONE: ${TZ}
              CONFIG_INSTANCE_LAPI_URL: http://crowdsec-service:8080
              CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
              CONFIG_INSTANCE_LAPI_AUTH_PASSWORD:
                secretKeyRef:
                  name: crowdsec
                  key: WEBUI_PASS
              CONFIG_AUTH_OIDC_ISSUER_URL:
                secretKeyRef:
                  name: crowdsec-ui-oidc-credentials
                  key: issuer_url
              CONFIG_AUTH_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: crowdsec-ui-oidc-credentials
                  key: client_id
              CONFIG_AUTH_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: crowdsec-ui-oidc-credentials
                  key: client_secret
              CONFIG_AUTH_OIDC_SCOPE: "openid profile email groups"
              CONFIG_AUTH_OIDC_GROUPS_CLAIM: groups
              CONFIG_AUTH_OIDC_ADMIN_GROUPS_0: admin
              CONFIG_AUTH_OIDC_UNMATCHED_ROLE: deny
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3000
                    path: /api/health
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      crowdsec-ui:
        controller: crowdsec-ui
        ports:
          http:
            port: *port
    route:
      crowdsec-ui:
        hostnames:
          - crowdsec.clerici.tech
        parentRefs:
          - name: internal
            namespace: kgateway
    persistence:
      data:
        existingClaim: crowdsec-ui
        globalMounts:
          - path: /app/data
