---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-ui-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: kopiur
      namespace: kopiur
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    pocketId:
      url: crowdsec.clerici.tech
      spec:
        pkceEnabled: false
      callbackPaths:
        - /api/auth/oidc/callback
    kopiur: {}
