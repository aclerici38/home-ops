---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-agent-syslog
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: agent
  ingress:
    # opnsense/pf syslog via the LoadBalancer
    - fromCIDR:
        - ${NODE_GATEWAY}/32
      toPorts:
        - ports:
            - {port: "514", protocol: UDP}
