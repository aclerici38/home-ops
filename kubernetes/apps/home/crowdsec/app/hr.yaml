---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=crowdsec/0.24.2
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: crowdsec
  # The chart's schema (0.24.2) predates the kubernetes acquisition source
  install:
    disableSchemaValidation: true
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    disableSchemaValidation: true
    timeout: 2m
    remediation:
      retries: 1
  valuesFrom:
    - kind: ConfigMap
      name: crowdsec-values
      valuesKey: values.yaml
  # home-only: OPNsense pf logs over syslog, HA failed logins. Lists replace, so the shared
  # gateway acquisition and collections are restated.
  values:
    # No LAPI here and mTLS needs no registration token, so this only stops the
    # chart from demanding values for its own crowdsec-lapi-secrets.
    secrets:
      externalSecret:
        name: crowdsec-secrets
    config:
      postoverflows:
        s01-whitelist:
          02-whitelist-cloud.yaml: |-
            name: crowdsec/whitelist-cloud
            description: "Whitelist the cloud node (gatus probes)"
            whitelist:
              reason: "Own infrastructure"
              cidr:
                - "${CLOUD_NODE_V4_CIDR}"
                - "${CLOUD_NODE_V6_CIDR}"
    agent:
      env:
        - name: COLLECTIONS
          value: "yanis-kouidri/envoy crowdsecurity/base-http-scenarios crowdsecurity/http-cve crowdsecurity/http-dos crowdsecurity/http-extended-context crowdsecurity/opnsense firewallservices/pf crowdsecurity/home-assistant"
        - name: PARSERS
          value: "crowdsecurity/syslog-logs firewallservices/pf-logs crowdsecurity/jellyseerr-whitelist"
      additionalAcquisition:
        - source: kubernetes
          namespace: envoy-gateway
          selector: gateway.envoyproxy.io/owning-gateway-name=external
          labels:
            type: envoy
        - source: kubernetes
          namespace: home-assistant
          selector: app.kubernetes.io/controller=home-assistant
          labels:
            type: home-assistant
        - source: syslog
          listen_addr: "0.0.0.0"
          listen_port: 514
          labels:
            type: syslog
      service:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${CROWDSEC_AGENT_LB_IP}
        ports:
          - name: syslog
            port: 514
            protocol: UDP
            targetPort: 514
  # Not exposed by the chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/hostUsers
                value: false
          - target:
              kind: Deployment
              labelSelector: type=appsec
            patch: |-
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          # With mTLS the chart drops wait-for-lapi's env, so it polls ''
          - target:
              kind: Deployment
              labelSelector: type=agent
            patch: |-
              - op: add
                path: /spec/template/spec/initContainers/0/env
                value:
                  - name: LAPI_HOST
                    value: ${CROWDSEC_LAPI_HOST:=crowdsec.cloud.clerici.tech}
                  - name: LAPI_PORT
                    value: "${CROWDSEC_LAPI_PORT:=443}"
