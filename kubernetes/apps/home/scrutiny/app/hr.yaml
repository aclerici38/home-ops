---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      scrutiny:
        pod: &userns
          hostUsers: false
        containers:
          scrutiny:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.79.0-web@sha256:54ae2b7ef42d2d8a523a59700b6ed98c960d8b1700e3c3e04d7703032fdb6d6d
            env:
              SCRUTINY_NO_LOGO: true
              SCRUTINY_WEB_INFLUXDB_HOST: scrutiny-influxdb
              SCRUTINY_WEB_DATABASE_TYPE: postgres
              SCRUTINY_WEB_DATABASE_DSN:
                configMapKeyRef:
                  name: scrutiny-postgres
                  key: uri
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8080
              readiness: *probes
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 32Mi
              limits:
                memory: 256Mi
      influxdb:
        pod: *userns
        containers:
          influxdb:
            image:
              repository: mirror.gcr.io/library/influxdb
              tag: 2.9.1-alpine@sha256:385d5fe4746f4c087d6468519f023b24b425c0848a63b3185de8681e0f94d285
            env:
              INFLUXD_REPORTING_DISABLED: true
            probes:
              liveness: &dbProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &dbPort 8086
                    path: /health
              readiness: *dbProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *dbPort
                    path: /health
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 20Mi
              limits:
                memory: 512Mi
            securityContext: *sec
      collector:
        type: daemonset
        containers:
          scrutiny-collector:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.79.0-collector@sha256:5841d5984f41ec10a3ab57a829470aacab6e07da37666b5ad2ebc1eda2683e9b
            # The image's entrypoint rewrites /etc/cron.d and su's into cron,
            # which needs a writable rootfs plus SETUID/SETGID. A plain loop
            # needs neither; the first pass doubles as run-on-startup.
            command: &loop
              - /bin/sh
              - -c
              - |
                trap 'exit 0' TERM INT
                while :; do
                  "$0" run || echo "collector run failed: $?" >&2
                  sleep "$INTERVAL" & wait $!
                done
            args:
              - /opt/scrutiny/bin/scrutiny-collector-metrics
            env:
              INTERVAL: 3600
              SCRUTINY_NO_LOGO: true
              COLLECTOR_API_ENDPOINT: &api http://scrutiny:8080
              # Seagate FARM log; non-Seagate drives are skipped.
              COLLECTOR_COMMANDS_METRICS_FARM_ENABLED: true
              COLLECTOR_HOST_ID: &nodeName
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
                devic.es/disks: 1
              limits:
                memory: 128Mi
                devic.es/disks: 1
            # smartctl needs root: SYS_RAWIO for SATA/SAS passthrough, SYS_ADMIN
            # for NVMe admin commands
            securityContext: &rootSec
              privileged: false
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "SYS_RAWIO"
                  - "SYS_ADMIN"
      collector-zfs:
        containers:
          collector-zfs:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.79.0-collector-zfs@sha256:318c8f94b386d374316774f75409f3b85f2c07a556af9f4a52eb5ca15379119e
            command: *loop
            args:
              - /opt/scrutiny/bin/scrutiny-collector-zfs
            env:
              INTERVAL: 900
              SCRUTINY_NO_LOGO: true
              COLLECTOR_ZFS_API_ENDPOINT: *api
              COLLECTOR_ZFS_HOST_ID: *nodeName
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 64Mi
                devic.es/zfs: 1
            # zpool/zfs ioctls on /dev/zfs need SYS_ADMIN.
            securityContext:
              <<: *rootSec
              capabilities:
                drop:
                  - "ALL"
                add:
                  - "SYS_ADMIN"
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      scrutiny:
        controller: scrutiny
        ports:
          http:
            port: *port
      influxdb:
        controller: influxdb
        ports:
          http:
            port: *dbPort
    serviceMonitor:
      scrutiny:
        serviceName: scrutiny
        endpoints:
          - port: http
            path: /api/metrics
            interval: 1m
    networkpolicies:
      web:
        type: cilium
        controller: scrutiny
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
            toPorts: &web
              - ports:
                  - {port: "8080", protocol: TCP}
          - fromControllers:
              - collector
              - collector-zfs
            toPorts: *web
        egress:
          - toControllers:
              - influxdb
            toPorts:
              - ports:
                  - {port: "8086", protocol: TCP}
      influxdb:
        type: cilium
        controller: influxdb
        ingress:
          - fromControllers:
              - scrutiny
            toPorts:
              - ports:
                  - {port: "8086", protocol: TCP}
        egress:
          - {}
      collectors:
        type: cilium
        controllers:
          - collector
          - collector-zfs
        ingress:
          - {}
        egress:
          - toControllers:
              - scrutiny
            toPorts: *web
    route:
      scrutiny:
        hostnames:
          - scrutiny.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: scrutiny
                port: *port
    persistence:
      config:
        existingClaim: scrutiny
        advancedMounts:
          influxdb:
            influxdb:
              - path: /var/lib/influxdb2
                subPath: influxdb
      postgres-cert:
        type: secret
        name: scrutiny-postgres-cert
        defaultMode: 0440
        advancedMounts:
          scrutiny:
            scrutiny:
              - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
      udev:
        type: hostPath
        hostPath: /run/udev
        advancedMounts:
          collector:
            scrutiny-collector:
              - path: /run/udev
                readOnly: true
  dependsOn:
    - name: scrutiny-resources
