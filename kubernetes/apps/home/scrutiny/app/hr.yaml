---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      scrutiny:
        containers:
          scrutiny:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.76.4-web@sha256:3fe864c8844bce1947dbf2602f044f7446bef81b6c997571d84eb1091abf6418
            env:
              SCRUTINY_WEB_INFLUXDB_HOST: scrutiny-influxdb
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8080
              readiness: *probes
            securityContext: &sec
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 20Mi
              limits:
                memory: 128Mi
      influxdb:
        containers:
          influxdb:
            image:
              repository: mirror.gcr.io/library/influxdb
              tag: 2.9.1-alpine@sha256:f551adeb94b6f97626d2043ec90ed17f81de18d15bb5412d2101e0965c93c797
            probes:
              liveness: &dbProbes
                enabled: false
                custom: true
                spec:
                  httpGet:
                    port: &dbPort 8086
                    path: /health
              readiness: *dbProbes
            resources:
              requests:
                cpu: 100m
                memory: 20Mi
              limits:
                memory: 512Mi
            securityContext: *sec
      collector:
        type: daemonset
        containers:
          scrutiny-collector:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.76.4-collector@sha256:70cb8617e879f0fffa7f84102aa65ebdb6c13e231bd916879e753a79a74814ef
            env:
              COLLECTOR_RUN_STARTUP: true
              COLLECTOR_API_ENDPOINT: "http://scrutiny:8080"
              COLLECTOR_CRON_SCHEDULE: "0 * * * *"
              COLLECTOR_HOST_ID:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 10Mi
                devic.es/disks: 1
              limits:
                memory: 128Mi
                devic.es/disks: 1
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SYS_RAWIO
                  - SYS_ADMIN
                  - SETUID
                  - SETGID
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      scrutiny:
        controller: scrutiny
        ports:
          http:
            port: *port
      influxdb:
        controller: influxdb
        ports:
          http:
            port: *dbPort
    route:
      scrutiny:
        hostnames:
          - scrutiny.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: scrutiny
                port: *port
    persistence:
      config:
        existingClaim: scrutiny
        advancedMounts:
          scrutiny:
            scrutiny:
              - path: /opt/scrutiny/config
                subPath: scrutiny
          influxdb:
            influxdb:
              - path: /var/lib/influxdb2
                subPath: influxdb
      udev:
        type: hostPath
        hostPath: /run/udev
        advancedMounts:
          collector:
            scrutiny-collector:
              - path: /run/udev
                readOnly: true
  dependsOn:
    - name: scrutiny-resources
