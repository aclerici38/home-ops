---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: intel-gpu-resource-driver
spec:
  # Publishes ResourceSlices (apiserver-clients CCNP) and talks to the kubelet
  # over unix sockets; the gRPC health probes come from the host
  endpointSelector:
    matchLabels:
      app: intel-gpu-resource-driver
  ingress:
    - {}
  egress:
    - {}
