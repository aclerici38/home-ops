---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: collabora-resources
  values:
    controllers:
      collabora:
        forceRename: collabora
        strategy: RollingUpdate
        pod:
          hostUsers: false
          securityContext:
            # upstream 'cool' user
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: Unconfined
        containers:
          collabora:
            image:
              repository: mirror.gcr.io/collabora/code
              tag: 26.04.6.2.1@sha256:a2f5d4e88addd46033d8440f7a13b82f7e6fe444bf8c6b5a3eadc789f0b5342b
            env:
              aliasgroup1: http://opencloud-wopi:9300
              DONT_GEN_SSL_CERT: "YES"
              extra_params: |
                --o:ssl.enable=false \
                --o:ssl.ssl_verification=false \
                --o:ssl.termination=true \
                --o:welcome.enable=false \
                --o:net.frame_ancestors=cloud.clerici.tech
              username:
                secretKeyRef:
                  name: collabora
                  key: COLLABORA_ADMIN_USER
              password:
                secretKeyRef:
                  name: collabora
                  key: COLLABORA_ADMIN_PASS
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                add:
                  - MKNOD
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 9980
                    path: /hosting/discovery
              readiness: *probes
    defaultPodOptionsStrategy: merge
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      collabora:
        forceRename: collabora
        controller: collabora
        ports:
          http:
            port: 9980
    route:
      collabora:
        hostnames:
          - collabora.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    networkpolicies:
      collabora:
        type: cilium
        controller: collabora
        ingress:
          # Route
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "9980", protocol: TCP}
        egress:
          # aliasgroup1 WOPI host
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: opencloud
                  app.kubernetes.io/controller: wopi
            toPorts:
              - ports:
                  - {port: "9300", protocol: TCP}
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /opt/cool/cache
            subPath: cache
          - path: /opt/cool/child-roots
            subPath: roots
