---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.0-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nats-opencloud-stream-replicas
spec:
  # opencloud creates its JetStream streams/KVs at R=1
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 7200
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: stream-replicas
              image: mirror.gcr.io/natsio/nats-box:0.20.0-nonroot@sha256:be25666441c3aee65193aba33d60ff2f06ede7ee9eba58864324b33d7eb94fea
              env:
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp
                - name: XDG_DATA_HOME
                  value: /tmp
                - name: NATS_URL
                  value: nats://nats-opencloud.opencloud.svc.cluster.local:4222
              command:
                - "sh"
                - "-c"
              args:
                - |
                  set -u
                  # Bump every stream/KV to R=3. opencloud creates them at R=1.
                  streams=$(nats stream ls -n) || exit 1
                  test -n "$streams" || { echo "no streams returned"; exit 1; }

                  rc=0
                  for s in $streams; do
                    echo "=== $s"
                    case "$s" in
                      # `nats stream edit` always prompts on KV-backed streams,
                      # and -f does not suppress that prompt, so use `nats kv edit`
                      KV_*) nats kv edit "$${s#KV_}" --replicas 3 || rc=1 ;;
                      *) nats stream edit "$s" --replicas 3 -f || rc=1 ;;
                    esac
                  done
                  exit $rc
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
