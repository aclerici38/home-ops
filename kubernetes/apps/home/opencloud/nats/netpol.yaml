---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nats-opencloud
spec:
  # Monitoring (8222) is the prom-exporter sidecar over localhost and the
  # kubelet probes; the exporter's 7777 scrape comes from the baseline CCNP
  endpointSelector:
    matchLabels: &nats
      app.kubernetes.io/instance: nats-opencloud
      app.kubernetes.io/name: nats
  ingress:
    # Clients: every opencloud service, and the stream-replicas CronJob
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: opencloud
        - matchLabels:
            app.kubernetes.io/name: nats-opencloud-stream-replicas
      toPorts:
        - ports:
            - {port: "4222", protocol: TCP}
    # Cluster routes
    - fromEndpoints:
        - matchLabels: *nats
      toPorts:
        - ports:
            - {port: "6222", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels: *nats
      toPorts:
        - ports:
            - {port: "6222", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nats-opencloud-stream-replicas
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nats-opencloud-stream-replicas
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: nats-opencloud
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - {port: "4222", protocol: TCP}
