---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats-opencloud
spec:
  interval: 1h
  maxHistory: 1
  chart:
    spec:
      chart: nats
      sourceRef:
        kind: HelmRepository
        name: nats
      version: 2.15.2
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    config:
      cluster:
        enabled: true
        replicas: 3
        merge:
          name: opencloud-cluster
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: &pvc 10Gi
            storageClassName: ceph-filesystem
          maxSize: *pvc
        memoryStore:
          enabled: true
          maxSize: &mem 256Mi
    natsBox:
      enabled: false
    container:
      image:
        registry: mirror.gcr.io
        repository: nats
        tag: 2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
      env:
        # Should be ~80% of memory limit
        GOMEMLIMIT: 410MiB
      merge:
        securityContext: &sec
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 512Mi
    reloader:
      image:
        registry: mirror.gcr.io
        repository: natsio/nats-server-config-reloader
        tag: 0.24.0@sha256:d758a82a9c20337e46c2f7356a413faa52cf4d6b02497c3ad81f72f1ba106464
      merge:
        securityContext: *sec
    promExporter:
      enabled: true
      image:
        registry: mirror.gcr.io
        repository: natsio/prometheus-nats-exporter
        tag: 0.20.3@sha256:4b8ddc1c86fec360b5cd3d5e1fbc6fb52bdafd5805bba3901cc52926538af255
      merge:
        securityContext: *sec
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
      podMonitor:
        enabled: true
        merge:
          spec:
            podMetricsEndpoints:
              - port: prom-metrics
                metricRelabelings:
                  - sourceLabels:
                      - "__name__"
                      - "stream_name"
                    regex: "nats_consumer_.*;KV_.*"
                    action: drop
                  - sourceLabels:
                      - "__name__"
                      - "consumer_name"
                    regex: "nats_consumer_.*;sse-.*"
                    action: drop
    serviceAccount:
      enabled: true
    podTemplate:
      topologySpreadConstraints:
        kubernetes.io/hostname:
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
      merge:
        spec:
          hostUsers: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
