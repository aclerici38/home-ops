---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.4/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencloud-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur
  values:
    externalSecret:
      spec:
        data:
          - secretKey: DECOMPOSEDS3_ACCESS_KEY
            remoteRef:
              key: versity
              property: username
          - secretKey: DECOMPOSEDS3_SECRET_KEY
            remoteRef:
              key: versity
              property: password
    kopiur:
      existingClaim: true
      cephfs: true
