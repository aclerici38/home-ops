---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-flux
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: flux-mcp
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    fullnameOverride: mcp-flux

    # The chart's own binding is cluster-admin.
    rbac:
      create: false

    networkPolicy:
      ingress:
        namespaces:
          - envoy-gateway

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
