---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-flux
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 0.64.0
        digest: sha256:e91bd4ccfe3ba68717e4d4cd0d19fb966aa402c5c78d3989a7bc973eac9533ed
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator-mcp
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token.actions.githubusercontent.com$
            subject: ^https://github.com/controlplaneio-fluxcd/charts.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    fullnameOverride: mcp-flux

    # The chart's own binding is cluster-admin.
    rbac:
      create: false

    commonLabels:
      dormammu.internal/apiserver-client: "true"

    networkPolicy:
      create: false

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
