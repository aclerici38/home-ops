---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-flux
spec:
  # apiserver egress comes from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-flux
      app.kubernetes.io/name: flux-operator-mcp
  ingress:
    # flux MCP Backend
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
  egress:
    - {}
