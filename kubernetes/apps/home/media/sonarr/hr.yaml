---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      sonarr:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          sonarr:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2569@sha256:b699df6b4b10e71ce23fb6fd8944653171f49164f79020cb0ea09e46b51b0517
            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: Oidc
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__AUTH__OIDCAUTHORITY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-oidc-credentials
                    key: issuer_url
              SONARR__AUTH__OIDCCLIENTID:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-oidc-credentials
                    key: client_id
              SONARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-oidc-credentials
                    key: client_secret
              # pocket-id sub
              SONARR__AUTH__OIDCUSERIDENTIFIER: a15f91db-50ff-4b61-aafa-ad5276a4c21e
              SONARR__SERVER__TRUSTEDNETWORKS: ${CLUSTER_POD_CIDR},${CLUSTER_POD_CIDR_V6}
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__ANALYTICSENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 8989
              SONARR__POSTGRES__MAINDBCONNECTIONSTRING:
                valueFrom:
                  configMapKeyRef:
                    name: sonarr-postgres
                    key: npgsql
            envFrom:
              - secretRef:
                  name: sonarr
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 16Gi
    service:
      sonarr:
        controller: sonarr
        ports:
          http:
            port: *port
    route:
      sonarr:
        hostnames:
          - sonarr.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      sonarr:
        type: cilium
        controller: sonarr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
              # App sync
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
              # Bazarr+ API polling
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
              # Recyclarr profile sync
              - matchLabels:
                  app.kubernetes.io/instance: recyclarr
              # Seerr requests
              - matchLabels:
                  app.kubernetes.io/instance: seerr
              # Import list
              - matchLabels:
                  app.kubernetes.io/instance: sonarr-raphael
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Torznab indexers proxied by prowlarr
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
            toPorts:
              - ports:
                  - {port: "9696", protocol: TCP}
          # On-import webhook
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
          # Autoscan webhook
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: silo
                  app.kubernetes.io/instance: silo
                  app.kubernetes.io/controller: silo
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Skyhook metadata, scene mappings (services + XEM), TheTVDB artwork
          - toFQDNs:
              - matchName: skyhook.sonarr.tv
              - matchName: services.sonarr.tv
              - matchName: thexem.info
              - matchName: artworks.thetvdb.com
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: sonarr-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
      config:
        type: persistentVolumeClaim
        storageClass: ceph-filesystem
        accessMode: ReadWriteMany
        size: 5Gi
        globalMounts:
          - path: /config
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /allMedia
  dependsOn:
    - name: sonarr-resources
