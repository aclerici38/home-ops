---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      bazarr:
        pod:
          labels:
            dormammu.internal/flaresolverr-client: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          bazarr:
            image:
              repository: ghcr.io/home-operations/bazarr-plus
              tag: 2.7.1@sha256:f72f7be289a4675e33979241f2dd1d6e7f9505c9f92f1587b5d44d0280c2de3f
            env:
              POSTGRES_ENABLED: "true"
              POSTGRES_URL:
                valueFrom:
                  configMapKeyRef:
                    name: bazarr-postgres
                    key: uri
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/ping
                    port: &port 6767
              readiness: *probes
              # Alembic migrations run before the server binds.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/system/ping
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
    service:
      bazarr:
        controller: bazarr
        ports:
          http:
            port: *port
    route:
      bazarr:
        hostnames:
          - bazarr.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      bazarr:
        type: cilium
        controller: bazarr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
            toPorts: &web
              - ports:
                  - {port: "6767", protocol: TCP}
          # On-import webhooks
          - fromEndpoints: &sonarr
              - matchLabels:
                  app.kubernetes.io/instance: sonarr
              - matchLabels:
                  app.kubernetes.io/instance: sonarr-raphael
            toPorts: *web
          - fromEndpoints: &radarr
              - matchLabels:
                  app.kubernetes.io/instance: radarr
              - matchLabels:
                  app.kubernetes.io/instance: radarr-raphael
            toPorts: *web
        egress:
          - toEndpoints: *sonarr
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
          - toEndpoints: *radarr
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
          # Item/library refresh on subtitle download
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: silo
                  app.kubernetes.io/instance: silo
                  app.kubernetes.io/controller: silo
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Subtitle providers (some still plain http), TMDB, Provider Hub
          # catalog on GitHub + plugin deps from PyPI
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: bazarr-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      config:
        existingClaim: bazarr
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /mnt/media
  dependsOn:
    - name: bazarr-resources
