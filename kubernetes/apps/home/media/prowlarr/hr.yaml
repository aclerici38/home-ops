---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      prowlarr:
        strategy: RollingUpdate
        pod:
          labels:
            dormammu.internal/flaresolverr-client: "true"
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          prowlarr:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.6.5.5623@sha256:0e2e6e9a2a16683a160ff1c6830d8192231a0502ab0d605b416023b2ca225ff9
            env:
              # FlareSolverr's cf_clearance cookie is bound to the v4 egress IP; .NET otherwise prefers v6 and gets re-challenged
              DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__APP__THEME: dark
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG__ANALYTICSENABLED: "False"
              PROWLARR__LOG__LEVEL: info
              PROWLARR__SERVER__PORT: &port 9696
              PROWLARR__POSTGRES__MAINDBCONNECTIONSTRING:
                valueFrom:
                  configMapKeyRef:
                    name: prowlarr-postgres
                    key: npgsql
            envFrom:
              - secretRef:
                  name: prowlarr
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 2Gi
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - prowlarr
            env:
              PORT: &metricsPort 9707
              URL: http://localhost:9696
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: prowlarr
                    key: PROWLARR__AUTH__APIKEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *containerSecurity
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      prowlarr:
        controller: prowlarr
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      prowlarr:
        serviceName: prowlarr
        endpoints:
          - port: metrics
    route:
      prowlarr:
        hostnames:
          - prowlarr.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      prowlarr:
        type: cilium
        controller: prowlarr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
            toPorts: &web
              - ports:
                  - {port: "9696", protocol: TCP}
          # Synced indexers proxy their searches back through prowlarr
          - fromEndpoints: &sonarr
              - matchLabels:
                  app.kubernetes.io/instance: sonarr
              - matchLabels:
                  app.kubernetes.io/instance: sonarr-raphael
            toPorts: *web
          - fromEndpoints: &radarr
              - matchLabels:
                  app.kubernetes.io/instance: radarr
              - matchLabels:
                  app.kubernetes.io/instance: radarr-raphael
            toPorts: *web
        egress:
          # App sync (indexer push)
          - toEndpoints: *sonarr
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
          - toEndpoints: *radarr
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
          # Grabs from prowlarr's own search UI
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Indexers, servarr update/definitions API
          - toEntities:
              - world
            toPorts:
              - ports:
                  - {port: "80", protocol: TCP}
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: prowlarr-postgres-cert
        defaultMode: 0440
        advancedMounts:
          prowlarr:
            prowlarr:
              - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        advancedMounts:
          prowlarr:
            prowlarr:
              - path: /config
                subPath: config
              - path: /tmp
                subPath: tmp
  dependsOn:
    - name: prowlarr-resources
