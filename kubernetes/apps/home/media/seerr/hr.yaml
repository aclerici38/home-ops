---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.1.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      seerr:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          seerr:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
            env:
              DB_TYPE: postgres
              DB_HOST:
                valueFrom:
                  configMapKeyRef:
                    name: seerr-postgres
                    key: host
              DB_USER:
                valueFrom:
                  configMapKeyRef:
                    name: seerr-postgres
                    key: username
              DB_NAME:
                valueFrom:
                  configMapKeyRef:
                    name: seerr-postgres
                    key: dbname
              # mTLS
              DB_USE_SSL: "true"
              DB_SSL_CA_FILE: /var/run/secrets/postgresql/ca.crt
              DB_SSL_CERT_FILE: /var/run/secrets/postgresql/tls.crt
              DB_SSL_KEY_FILE: /var/run/secrets/postgresql/tls.key
            resources:
              requests:
                cpu: 15m
                memory: 350M
              limits:
                memory: 600M
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 5055
                    path: /api/v1/status
              readiness: *probes
    service:
      seerr:
        controller: seerr
        ports:
          http:
            port: *port
    route:
      seerr:
        hostnames:
          - seer.clerici.tech
          - seerr.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    persistence:
      postgres-cert:
        type: custom
        volumeSpec:
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: postgres-mtls
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: seerr
              csi.cert-manager.io/key-usages: client auth,digital signature
              csi.cert-manager.io/key-algorithm: ECDSA
              csi.cert-manager.io/key-size: "384"
              csi.cert-manager.io/key-encoding: PKCS8
              csi.cert-manager.io/duration: 24h
        globalMounts:
          - path: /var/run/secrets/postgresql
      config:
        existingClaim: seerr
        globalMounts:
          - path: /app/config
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
  dependsOn:
    - name: seerr-resources
