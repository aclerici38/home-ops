---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      seerr:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          seerr:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
            env:
              DB_TYPE: postgres
              DB_HOST:
                valueFrom:
                  configMapKeyRef:
                    name: seerr-postgres
                    key: host
              DB_USER:
                valueFrom:
                  configMapKeyRef:
                    name: seerr-postgres
                    key: username
              DB_NAME:
                valueFrom:
                  configMapKeyRef:
                    name: seerr-postgres
                    key: dbname
              # mTLS
              DB_USE_SSL: "true"
              DB_SSL_CA_FILE: /var/run/secrets/postgresql/ca.crt
              DB_SSL_CERT_FILE: /var/run/secrets/postgresql/tls.crt
              DB_SSL_KEY_FILE: /var/run/secrets/postgresql/tls.key
            resources:
              requests:
                cpu: 15m
                memory: 350M
              limits:
                memory: 600M
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 5055
                    path: /api/v1/status
              readiness: *probes
    service:
      seerr:
        controller: seerr
        ports:
          http:
            port: *port
    route:
      seerr:
        hostnames:
          - seer.clerici.tech
          - seerr.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
    networkpolicies:
      seerr:
        type: cilium
        controller: seerr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
              # Requests plugin
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: silo
                  app.kubernetes.io/instance: silo
                  app.kubernetes.io/controller: silo
            toPorts:
              - ports:
                  - {port: "5055", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: sonarr
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: radarr
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
          # Jellyfin-compatible API: library sync + media-server login
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: silo
                  app.kubernetes.io/instance: silo
                  app.kubernetes.io/controller: silo
            toPorts:
              - ports:
                  - {port: "8096", protocol: TCP}
          # TMDB, Rotten Tomatoes (Algolia), IMDb ratings via Radarr's proxy, anime-list mappings on GitHub,
          # avatars, version check (GitHub + npm)
          - toFQDNs:
              - matchName: api.themoviedb.org
              - matchName: 79frdp12pn-dsn.algolia.net
              - matchName: api.radarr.video
              - matchName: raw.githubusercontent.com
              - matchName: gravatar.com
              - matchName: api.github.com
              - matchName: registry.npmjs.org
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: seerr-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      config:
        existingClaim: seerr
        globalMounts:
          - path: /app/config
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
  dependsOn:
    - name: seerr-resources
