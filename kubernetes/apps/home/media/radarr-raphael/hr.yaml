---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr-raphael
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      radarr-raphael:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          radarr-raphael:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            env:
              RADARR__APP__INSTANCENAME: Radarr Raphael
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__ANALYTICSENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 7878
              RADARR__POSTGRES__MAINDBCONNECTIONSTRING:
                valueFrom:
                  configMapKeyRef:
                    name: radarr-raphael-postgres
                    key: npgsql
            envFrom:
              - secretRef:
                  name: radarr-raphael
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 4Gi
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - radarr
            env:
              PORT: &metricsPort 9707
              URL: http://localhost:7878
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-raphael
                    key: RADARR__AUTH__APIKEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *containerSecurity
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      radarr-raphael:
        controller: radarr-raphael
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      radarr-raphael:
        serviceName: radarr-raphael
        endpoints:
          - port: metrics
    route:
      radarr-raphael:
        hostnames:
          - radarr-raphael.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      radarr-raphael:
        type: cilium
        controller: radarr-raphael
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
              # App sync
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
              # Bazarr+ API polling
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
              # Recyclarr profile sync
              - matchLabels:
                  app.kubernetes.io/instance: recyclarr
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Torznab indexers proxied by prowlarr
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
            toPorts:
              - ports:
                  - {port: "9696", protocol: TCP}
          # On-import webhook
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
          # "Main Radarr" import list
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: radarr
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
          # Radarr metadata, TMDB artwork
          - toFQDNs:
              - matchName: api.radarr.video
              - matchName: radarr.servarr.com
              - matchName: image.tmdb.org
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: radarr-raphael-postgres-cert
        defaultMode: 0440
        advancedMounts:
          radarr-raphael:
            radarr-raphael:
              - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        advancedMounts:
          radarr-raphael:
            radarr-raphael:
              - path: /tmp
                subPath: tmp
      config:
        type: persistentVolumeClaim
        storageClass: ceph-filesystem
        accessMode: ReadWriteMany
        size: 5Gi
        advancedMounts:
          radarr-raphael:
            radarr-raphael:
              - path: /config
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        advancedMounts:
          radarr-raphael:
            radarr-raphael:
              - path: /allMedia
  dependsOn:
    - name: radarr-raphael-resources
