---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr-raphael
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      radarr-raphael:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          radarr-raphael:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            env:
              RADARR__APP__INSTANCENAME: Radarr Raphael
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 7878
              RADARR__POSTGRES__MAINDBCONNECTIONSTRING:
                valueFrom:
                  configMapKeyRef:
                    name: radarr-raphael-postgres
                    key: npgsql
            envFrom:
              - secretRef:
                  name: radarr-raphael
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 4Gi
    service:
      radarr-raphael:
        controller: radarr-raphael
        ports:
          http:
            port: *port
    route:
      radarr-raphael:
        hostnames:
          - radarr-raphael.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    persistence:
      postgres-cert:
        type: custom
        volumeSpec:
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: postgres-mtls
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: radarr-raphael
              csi.cert-manager.io/key-usages: client auth,digital signature
              csi.cert-manager.io/key-algorithm: ECDSA
              csi.cert-manager.io/key-size: "384"
              csi.cert-manager.io/key-encoding: PKCS8
              csi.cert-manager.io/duration: 24h
        globalMounts:
          - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /config
            subPath: config
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /allMedia
  dependsOn:
    - name: radarr-raphael-resources
