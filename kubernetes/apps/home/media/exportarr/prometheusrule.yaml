---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/prometheus-operator/0.94.2/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: exportarr-rules
spec:
  groups:
    - name: exportarr.rules
      rules:
        # Queue-only: health checks are config nags, not broken downloads.
        # exportarr drops queue series on a failed scrape, so keep_firing_for
        # stops a brief gap from resolving and re-notifying.
        # importBlocked = needs manual import; failedPending/failed = failed-download handling stuck
        - alert: ArrImportStuck
          expr: |-
            sum by (job, download_state, download_status) (
              {__name__=~"(sonarr|radarr)_queue_total", download_state=~"importBlocked|failedPending|failed"}
                or {__name__=~"(sonarr|radarr)_queue_total", download_status="error"}
            ) > 0
          for: 1h
          keep_firing_for: 30m
          annotations:
            summary: >-
              {{ $value }} {{ $labels.job }} queue item(s) stuck in {{ $labels.download_state }}
              ({{ $labels.download_status }})
          labels: &labels
            severity: warning
        # Queue status, not trackedDownloadStatus: "stalled with no connections" only shows up here
        - alert: ArrDownloadsStalled
          expr: |-
            sum by (job) ({__name__=~"(sonarr|radarr)_queue_total", status="warning"}) > 0
          for: 12h
          keep_firing_for: 30m
          annotations:
            summary: >-
              {{ $value }} {{ $labels.job }} download(s) stalled or warning for over 12h
          labels: *labels
