---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      radarr:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          radarr:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__ANALYTICSENABLED: "False"
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 7878
              RADARR__POSTGRES__MAINDBCONNECTIONSTRING:
                valueFrom:
                  configMapKeyRef:
                    name: radarr-postgres
                    key: npgsql
            envFrom:
              - secretRef:
                  name: radarr
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 4Gi
    service:
      radarr:
        controller: radarr
        ports:
          http:
            port: *port
    route:
      radarr:
        hostnames:
          - radarr.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      radarr:
        type: cilium
        controller: radarr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
              # App sync
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
              # Bazarr+ API polling
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
              # Recyclarr profile sync
              - matchLabels:
                  app.kubernetes.io/instance: recyclarr
              # Seerr requests
              - matchLabels:
                  app.kubernetes.io/instance: seerr
              # Import list
              - matchLabels:
                  app.kubernetes.io/instance: radarr-raphael
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Torznab indexers proxied by prowlarr
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
            toPorts:
              - ports:
                  - {port: "9696", protocol: TCP}
          # On-import webhook
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
          # Autoscan webhook
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: silo
                  app.kubernetes.io/instance: silo
                  app.kubernetes.io/controller: silo
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Radarr metadata, TMDB artwork
          - toFQDNs:
              - matchName: api.radarr.video
              - matchName: radarr.servarr.com
              - matchName: image.tmdb.org
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: radarr-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /config
            subPath: config
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /allMedia
  dependsOn:
    - name: radarr-resources
