---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: external-secrets
      namespace: external-secrets
    - name: nfs-server
      namespace: nfs-server
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    nfsGate: {}
    cnpg:
      mode: shared
      mtls: true
    pocketId:
      # ASP.NET OpenIdConnect defaults
      callbackPaths:
        - /signin-oidc
      logoutCallbackPaths:
        - /signout-callback-oidc
    externalSecret: {}
