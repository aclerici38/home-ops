---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-raphael
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      sonarr-raphael:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          sonarr-raphael:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
            env:
              SONARR__APP__INSTANCENAME: Sonarr Raphael
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__ANALYTICSENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 8989
              SONARR__POSTGRES__HOST:
                valueFrom:
                  configMapKeyRef:
                    name: sonarr-raphael-postgres
                    key: host
              SONARR__POSTGRES__USER:
                valueFrom:
                  configMapKeyRef:
                    name: sonarr-raphael-postgres
                    key: username
              SONARR__POSTGRES__MAINDB:
                valueFrom:
                  configMapKeyRef:
                    name: sonarr-raphael-postgres
                    key: dbname
              # Sonarr v4 (Npgsql 7) takes no connection string or SSL Mode, but Npgsql
              # presents PGSSLCERT/PGSSLKEY: client-cert auth works; the pooler cert is
              # not verified (SslMode stays Prefer) until Sonarr takes a connection string.
              PGSSLCERT: /var/run/secrets/postgresql/tls.crt
              PGSSLKEY: /var/run/secrets/postgresql/tls.key
            envFrom:
              - secretRef:
                  name: sonarr-raphael
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 16Gi
    service:
      sonarr-raphael:
        controller: sonarr-raphael
        ports:
          http:
            port: *port
    route:
      sonarr-raphael:
        hostnames:
          - sonarr-raphael.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      sonarr-raphael:
        type: cilium
        controller: sonarr-raphael
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
              # App sync
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
              # Bazarr+ API polling
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
              # Recyclarr profile sync
              - matchLabels:
                  app.kubernetes.io/instance: recyclarr
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Torznab indexers proxied by prowlarr
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
            toPorts:
              - ports:
                  - {port: "9696", protocol: TCP}
          # On-import webhook
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
          # "Main Sonarr" import list
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: sonarr
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
          # Skyhook metadata, scene mappings (services + XEM), TheTVDB artwork
          - toFQDNs:
              - matchName: skyhook.sonarr.tv
              - matchName: services.sonarr.tv
              - matchName: thexem.info
              - matchName: artworks.thetvdb.com
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: sonarr-raphael-postgres-cert
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /config
            subPath: config
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        globalMounts:
          - path: /allMedia
  dependsOn:
    - name: sonarr-raphael-resources
