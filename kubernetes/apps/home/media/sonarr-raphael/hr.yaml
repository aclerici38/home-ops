---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-raphael
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      sonarr-raphael:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          sonarr-raphael:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2870@sha256:d90a762127d86cd3b7e27cc05b7acd2cf5cf33766cc8d5a5e23a0254e6a61f97
            env:
              SONARR__APP__INSTANCENAME: Sonarr Raphael
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: Oidc
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__AUTH__OIDCAUTHORITY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-raphael-oidc-credentials
                    key: issuer_url
              SONARR__AUTH__OIDCCLIENTID:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-raphael-oidc-credentials
                    key: client_id
              SONARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-raphael-oidc-credentials
                    key: client_secret
              # pocket-id sub
              SONARR__AUTH__OIDCUSERIDENTIFIER: a15f91db-50ff-4b61-aafa-ad5276a4c21e
              SONARR__SERVER__TRUSTEDNETWORKS: ${CLUSTER_POD_CIDR},${CLUSTER_POD_CIDR_V6}
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__ANALYTICSENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 8989
              SONARR__POSTGRES__MAINDBCONNECTIONSTRING:
                valueFrom:
                  configMapKeyRef:
                    name: sonarr-raphael-postgres
                    key: npgsql
            envFrom:
              - secretRef:
                  name: sonarr-raphael
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probes
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 16Gi
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - sonarr
            env:
              PORT: &metricsPort 9707
              URL: http://localhost:8989
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-raphael
                    key: SONARR__AUTH__APIKEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *containerSecurity
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      sonarr-raphael:
        controller: sonarr-raphael
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      sonarr-raphael:
        serviceName: sonarr-raphael
        endpoints:
          - port: metrics
    route:
      sonarr-raphael:
        hostnames:
          - sonarr-raphael.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      sonarr-raphael:
        type: cilium
        controller: sonarr-raphael
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dashbrr
                  app.kubernetes.io/instance: dashbrr
              # App sync
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
              # Bazarr+ API polling
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
              # Recyclarr profile sync
              - matchLabels:
                  app.kubernetes.io/instance: recyclarr
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
                  app.kubernetes.io/instance: qbittorrent
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
          # Torznab indexers proxied by prowlarr
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: prowlarr
            toPorts:
              - ports:
                  - {port: "9696", protocol: TCP}
          # On-import webhook
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: bazarr
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
          # "Main Sonarr" import list
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: sonarr
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
          # Skyhook metadata, scene mappings (services + XEM), TheTVDB artwork
          - toFQDNs:
              - matchName: skyhook.sonarr.tv
              - matchName: services.sonarr.tv
              - matchName: thexem.info
              - matchName: artworks.thetvdb.com
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      postgres-cert:
        type: secret
        name: sonarr-raphael-postgres-cert
        defaultMode: 0440
        advancedMounts:
          sonarr-raphael:
            sonarr-raphael:
              - path: /var/run/secrets/postgresql
      tmpfs:
        type: emptyDir
        advancedMounts:
          sonarr-raphael:
            sonarr-raphael:
              - path: /config
                subPath: config
              - path: /tmp
                subPath: tmp
      config:
        type: persistentVolumeClaim
        storageClass: ceph-filesystem
        accessMode: ReadWriteMany
        size: 5Gi
        advancedMounts:
          sonarr-raphael:
            sonarr-raphael:
              - path: /config/MediaCover
                subPath: MediaCover
      media:
        type: persistentVolumeClaim
        storageClass: nfs-media
        accessMode: ReadWriteMany
        # Ignored
        size: 1Gi
        suffix: media
        advancedMounts:
          sonarr-raphael:
            sonarr-raphael:
              - path: /allMedia
  dependsOn:
    - name: sonarr-raphael-resources
