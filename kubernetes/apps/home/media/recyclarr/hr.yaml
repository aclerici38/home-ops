---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          schedule: "@hourly"
          timeZone: America/Los_Angeles
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 2
        pod:
          restartPolicy: Never
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          recyclarr:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
            args:
              - sync
              # Wait for sonarr v5 support
              - radarr
            envFrom:
              - secretRef:
                  name: recyclarr
            resources:
              limits:
                memory: 200Mi
              requests:
                cpu: 10m
                memory: 50Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    networkpolicies:
      recyclarr:
        type: cilium
        controller: recyclarr
        # Nothing connects in (baseline CCNP still admits Prometheus).
        ingress:
          - {}
        egress:
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: sonarr
              - matchLabels:
                  app.kubernetes.io/instance: sonarr-raphael
            toPorts:
              - ports:
                  - {port: "8989", protocol: TCP}
          - toEndpoints:
              - matchLabels:
                  app.kubernetes.io/instance: radarr
              - matchLabels:
                  app.kubernetes.io/instance: radarr-raphael
            toPorts:
              - ports:
                  - {port: "7878", protocol: TCP}
          # Git resource providers: TRaSH Guides + recyclarr config templates
          - toFQDNs:
              - matchName: github.com
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      config:
        existingClaim: recyclarr
      config-file:
        type: configMap
        name: recyclarr-config
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
          - path: /config/settings.yml
            subPath: settings.yml
      custom-formats:
        type: configMap
        name: recyclarr-custom-formats
        globalMounts:
          - path: /custom-formats
