---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.7.3/schemas/config-schema.json
#
# Priorities, highest first. Each instance's scores are sized so no lower rule
# can outweigh a higher one; the "holds:" lines are the inequalities to keep
# true when retuning (G = worst-case stack of guide tiebreakers on one release).
#   1. English audio. A release without it is still grabbed, but only when
#      nothing with English exists (penalised, yet above min_format_score).
#   2. Resolution (home). raphael is 1080p WEB only, for the RV projector.
#   3. HEVC.  4. Season packs.  5. Guide tiebreakers at the guide's scores
#      (release-group tiers, HDR, streaming services, repacks).
#   Garbage (LQ, upscales, BR-DISK, extras, ...) is never grabbed.
#
# Home profiles put every quality in ONE group: Sonarr/Radarr never replace a
# file with a lower *quality*, so resolution must be a score for a 720p English
# release to replace a 1080p non-English one.
#
# Language is two local CFs (custom-formats/), because the parser misreads
# anime: "Dual Audio"/"Multi-Audio" as Japanese-only (No English Audio exempts
# them), and subtitle tags like "[Eng-Subs]" or "[Multiple Subtitle] [ENG]" as
# English audio (English Subs Only, anime profiles only - live-action titles
# use "Eng Subs" alongside real English audio). Specs of one implementation
# form a group that matches when its required specs pass and ANY spec passes,
# so a negated required spec makes optional siblings moot: keep every
# release-title spec in these CFs required.
#
# Anime gets its own home profiles because the anime group tiers also list
# live-action groups (e.g. playWEB). Sonarr/Seerr route by series type; Radarr
# anime movies are assigned by hand.
#
# Size limits: guide floors (they keep starved encodes out), our ceilings, set
# from measured releases. Ceilings below real 2160p sizes are why 1080p used to
# win. Score, not size, picks among everything that fits.

sonarr:
  # Rejects -300000 | no English (anime: or subs only) -100000 | 2160p/1080p/720p 75000/50000/25000
  # x265 +7000 | season pack +2500 | no group -1000 | AV1 -7000
  # G = 2557 (HQ tier 1900, HDR 500, streaming 75+75, repack 7); anime G = 1918
  # holds: pack 2500 > best tier 2057; x265 7000 - 1000 > pack + G = 5057;
  #   AV1: pack + G - 7000 < -1000; 720p step 25000 > 7000+2500+2557+7000+1000+51;
  #   English 100000 > best 87057 - worst English 6949 (720p, AV1, no group, v0,
  #   Anime Raws -10000); min -120000 < worst non-English -93051, and
  #   > reject + best (-212943).
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR__AUTH__APIKEY
    delete_old_custom_formats: true
    media_naming: &tv_naming
      season: default
      series: jellyfin-tvdb
      episodes: {rename: true, standard: default, daily: default, anime: default}
    # Repacks are scored by the guide's Repack/Proper CFs instead.
    media_management: &media_management {propers_and_repacks: do_not_prefer}

    quality_definition:
      type: series
      # 1080p 150 MB/min: WEB-DLs (40-80), Bluray and fat anime HEVC encodes
      # (~120); not remuxes. 2160p 300: every 2160p WEB-DL measured (116-185).
      qualities:
        - {name: HDTV-720p, max: 150, preferred: 145}
        - {name: WEBRip-720p, max: 150, preferred: 145}
        - {name: WEBDL-720p, max: 150, preferred: 145}
        - {name: Bluray-720p, max: 150, preferred: 145}
        - {name: HDTV-1080p, max: 150, preferred: 145}
        - {name: WEBRip-1080p, max: 150, preferred: 145}
        - {name: WEBDL-1080p, max: 150, preferred: 145}
        - {name: Bluray-1080p, max: 150, preferred: 145}
        - {name: Bluray-1080p Remux, max: 150, preferred: 145}
        - {name: HDTV-2160p, max: 300, preferred: 295}
        - {name: WEBRip-2160p, max: 300, preferred: 295}
        - {name: WEBDL-2160p, max: 300, preferred: 295}
        - {name: Bluray-2160p, min: 50, max: 300, preferred: 295} # guide 94.6 drops lean HEVC
        - {name: Bluray-2160p Remux, max: 300, preferred: 295}
    quality_profiles:
      - name: English Preferred (720p+)
        min_format_score: -120000
        upgrade: &home_upgrade {allowed: true, until_quality: Any (720p-2160p), until_score: 100000}
        reset_unmatched_scores: &reset {enabled: true}
        qualities: &tv_qualities
          - name: Any (720p-2160p)
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
      - name: English Preferred Anime (720p+)
        min_format_score: -120000
        upgrade: *home_upgrade
        reset_unmatched_scores: *reset
        qualities: *tv_qualities

    custom_formats:
      - trash_ids:
          - local-no-english-audio
        score: -100000
        assign_scores_to: &tv_both
          - name: English Preferred (720p+)
          - name: English Preferred Anime (720p+)
      - trash_ids:
          - local-english-subs-only
        score: -100000
        assign_scores_to:
          - name: English Preferred Anime (720p+)
      - trash_ids:
          - 1bef6c151fa35093015b0bfef18279e5 # 2160p
        score: 75000
        assign_scores_to: *tv_both
      - trash_ids:
          - 290078c8b266272a5cc8e251b5e2eb0b # 1080p
        score: 50000
        assign_scores_to: *tv_both
      - trash_ids:
          - c99279ee27a154c2f20d1d505cc99e25 # 720p
        score: 25000
        assign_scores_to: *tv_both
      - trash_ids:
          - c9eafd50846d299b862ca9bb6ea91950 # x265
        score: 7000
        assign_scores_to: *tv_both
      # Not via the [Optional] Season Packs group: it is only this CF, at +10.
      - trash_ids:
          - 3bc5f395426614e155e585a2f056cdf1 # Season Pack
        score: 2500
        assign_scores_to: *tv_both
      - trash_ids:
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
        score: -1000
        assign_scores_to: *tv_both
      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        score: -7000
        assign_scores_to: *tv_both
      - trash_ids: &tv_rejects
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
          - fbcb31d8dabd2a319072b84fc0b7249c # Extras
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48 # LQ (Release Title)
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
        score: -300000
        assign_scores_to: *tv_both

    # Guide scores. select_all is required on release-group sets (their tier
    # CFs are opt-in). No [Audio] Audio Formats: up to 5000 would break 3 and 4.
    custom_format_groups:
      add:
        - trash_id: b4a4353e3b3e6789dbef07677ff23686 # [Release Groups] HQ
          select_all: true
          assign_scores_to: &tv_live
            - name: English Preferred (720p+)
        - trash_id: abe720fab2d27682adc2a735136cec02 # [Streaming Services] General
          assign_scores_to: *tv_live
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
          assign_scores_to: *tv_live
        # Includes Anime Raws / LQ Groups at -10000: a last resort, not a reject.
        - trash_id: f206572b1147d0221bb1c96765b349e8 # [Release Groups] Anime
          select_all: true
          assign_scores_to: &tv_anime
            - name: English Preferred Anime (720p+)
        - trash_id: 4b196eed652c65ea98d615212040ebe2 # [Required] Anime Versions
          assign_scores_to: *tv_anime
        - trash_id: f54985e5e96747cef58731f1cf4c9181 # [Streaming Services] Anime
          assign_scores_to: *tv_anime
        - trash_id: 7e1724c5da59e7474803ad25be98f6a3 # [HDR Formats] HDR
          assign_scores_to: &tv_both_g
            - name: English Preferred (720p+)
            - name: English Preferred Anime (720p+)
        - trash_id: 22256473b656e195eabc2798e326fbb7 # [Required] Repack/Proper
          assign_scores_to: *tv_both_g

  # RV: XGIMI MoGo 4 Laser (1080p, hardware HEVC decode), so a 1080p x265 encode
  # direct-plays at a quarter of the bytes. AV1 is rejected (no decode to rely on).
  # Rejects -300000 | no English -20000 | x265 +6000 | pack +2500 | no group -1000
  # G = 2057 (HQ tier 1900, streaming 75+75, repack 7)
  # holds: pack 2500 > 2057; x265 6000 - 1000 > 2500 + 2057; English 20000 >
  #   best 10557 + 1000; min -30000 < worst non-English -21000.
  sonarr-raphael:
    base_url: http://sonarr-raphael.media.svc.cluster.local:8989
    api_key: !env_var SONARR_RAPHAEL__AUTH__APIKEY
    delete_old_custom_formats: true
    media_naming: *tv_naming
    media_management: *media_management

    quality_definition:
      type: series
      # min 4: a full-season HEVC WEBRip measures 6.3 MB/min, under the guide's
      # 15. max 100: clears the fattest native WEB-DL seen (87.6). preferred 25:
      # among equal scores, take the leaner file - RV disk is finite.
      qualities: &rv_sizes
        - {name: WEBDL-1080p, min: 4, max: 100, preferred: 25}
        - {name: WEBRip-1080p, min: 4, max: 100, preferred: 25}
    quality_profiles:
      - &rv_profile
        name: English Preferred (1080p HEVC)
        min_format_score: -30000
        upgrade: {allowed: true, until_quality: WEB 1080p, until_score: 100000}
        reset_unmatched_scores: *reset
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p

    custom_formats:
      - trash_ids:
          - local-no-english-audio
        score: -20000
        assign_scores_to: &rv
          - name: English Preferred (1080p HEVC)
      - trash_ids:
          - c9eafd50846d299b862ca9bb6ea91950 # x265
        score: 6000
        assign_scores_to: *rv
      - trash_ids:
          - 3bc5f395426614e155e585a2f056cdf1 # Season Pack
        score: 2500
        assign_scores_to: *rv
      - trash_ids:
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
        score: -1000
        assign_scores_to: *rv
      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        score: -300000
        assign_scores_to: *rv
      - trash_ids: *tv_rejects
        score: -300000
        assign_scores_to: *rv

    custom_format_groups:
      add:
        - trash_id: b4a4353e3b3e6789dbef07677ff23686 # [Release Groups] HQ
          select_all: true
          assign_scores_to: &rv_g
            - name: English Preferred (1080p HEVC)
        - trash_id: abe720fab2d27682adc2a735136cec02 # [Streaming Services] General
          assign_scores_to: *rv_g
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
          assign_scores_to: *rv_g
        - trash_id: 22256473b656e195eabc2798e326fbb7 # [Required] Repack/Proper
          assign_scores_to: *rv_g

radarr:
  # Rejects -300000 | no English -60000 | 2160p/1080p/720p 45000/30000/15000
  # x265 +4000 | no group -1000 | AV1 -4000
  # G = 2477 (HQ tier 1950, HDR 500, streaming 20, repack 7); anime G = 1921
  # holds: x265 4000 - 1000 > G; AV1: G - 4000 < -1000; 720p step 15000 >
  #   4000+2477+4000+1000+51; English 60000 > best 51477 - worst English -51;
  #   min -80000 < worst non-English -60051, and > reject + best (-248523).
  radarr:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR__AUTH__APIKEY
    delete_old_custom_formats: true
    media_naming: &movie_naming
      folder: jellyfin-tmdb
      movie: {rename: true, standard: jellyfin-tmdb}
    media_management: *media_management

    quality_definition:
      type: movie
      # x0.12 = GB for two hours. <=1080p 200 (~24 GB): Bluray encodes, not
      # remuxes. 2160p 400 (~48 GB): every good 2160p encode measured (151-348,
      # e.g. Life of Pi x265 HDR 186, Happy Gilmore UHD x265 348); not remuxes.
      qualities:
        - {name: HDTV-720p, max: 200, preferred: 195}
        - {name: WEBRip-720p, max: 200, preferred: 195}
        - {name: WEBDL-720p, max: 200, preferred: 195}
        - {name: Bluray-720p, max: 200, preferred: 195}
        - {name: HDTV-1080p, max: 200, preferred: 195}
        - {name: WEBRip-1080p, max: 200, preferred: 195}
        - {name: WEBDL-1080p, max: 200, preferred: 195}
        - {name: Bluray-1080p, max: 200, preferred: 195}
        - {name: Remux-1080p, max: 200, preferred: 195}
        - {name: HDTV-2160p, max: 400, preferred: 395}
        - {name: WEBRip-2160p, max: 400, preferred: 395}
        - {name: WEBDL-2160p, max: 400, preferred: 395}
        - {name: Bluray-2160p, min: 60, max: 400, preferred: 395} # guide 102 drops lean HEVC
        - {name: Remux-2160p, max: 400, preferred: 395}
    quality_profiles:
      - name: English Preferred (720p+)
        min_format_score: -80000
        upgrade: *home_upgrade
        reset_unmatched_scores: *reset
        qualities: &movie_qualities
          - name: Any (720p-2160p)
            qualities:
              - Remux-2160p
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Remux-1080p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
      - name: English Preferred Anime (720p+)
        min_format_score: -80000
        upgrade: *home_upgrade
        reset_unmatched_scores: *reset
        qualities: *movie_qualities

    custom_formats:
      - trash_ids:
          - local-no-english-audio
        score: -60000
        assign_scores_to: &movie_both
          - name: English Preferred (720p+)
          - name: English Preferred Anime (720p+)
      - trash_ids:
          - local-english-subs-only
        score: -60000
        assign_scores_to:
          - name: English Preferred Anime (720p+)
      - trash_ids:
          - fb392fb0d61a010ae38e49ceaa24a1ef # 2160p
        score: 45000
        assign_scores_to: *movie_both
      - trash_ids:
          - 820b09bb9acbfde9c35c71e0e565dad8 # 1080p
        score: 30000
        assign_scores_to: *movie_both
      - trash_ids:
          - b2be17d608fc88818940cd1833b0b24c # 720p
        score: 15000
        assign_scores_to: *movie_both
      - trash_ids:
          - 9170d55c319f4fe40da8711ba9d8050d # x265
        score: 4000
        assign_scores_to: *movie_both
      - trash_ids:
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
        score: -1000
        assign_scores_to: *movie_both
      - trash_ids:
          - cae4ca30163749b891686f95532519bd # AV1
        score: -4000
        assign_scores_to: *movie_both
      - trash_ids: &movie_rejects
          - b8cd450cbfa689c0259a01d9e29ba3d6 # 3D
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ed38b889b31be83fda192888e2286d83 # BR-DISK
          - 0a3f082873eb454bde444150b70253cc # Extras
          - e6886871085226c3da1830830146846c # Generated Dynamic HDR
          - c465ccc73923871b3eb1802042331306 # Line/Mic Dubbed
          - 90a6f9a284dff5103f6346090e6280c8 # LQ
          - e204b80c87be9497a8a6eaff48f72905 # LQ (Release Title)
          - 712d74cd88bceb883ee32f773656b1f5 # Sing-Along Versions
          - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled
        score: -300000
        assign_scores_to: *movie_both

    custom_format_groups:
      add:
        - trash_id: b2f2af430f73f3ad1f9948f33e0f0cf8 # [Release Groups] HQ
          select_all: true
          assign_scores_to: &movie_live
            - name: English Preferred (720p+)
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028 # [Streaming Services] General
          assign_scores_to: *movie_live
        - trash_id: 1f8404f7f72c7edc8901f2f3589d1a91 # [Release Groups] Anime
          select_all: true
          exclude:
            - 4a3b087eea2ce012fcc1ce319259a3be # Anime Dual Audio: language CFs cover it
          assign_scores_to: &movie_anime
            - name: English Preferred Anime (720p+)
        - trash_id: 6ebc4bfba9721581d3e9e8994456e6f7 # [Required] Anime Versions
          assign_scores_to: *movie_anime
        - trash_id: f993ad37540147e4d00e66503545d81b # [Streaming Services] Anime
          assign_scores_to: *movie_anime
        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46 # [HDR Formats] HDR
          assign_scores_to: &movie_both_g
            - name: English Preferred (720p+)
            - name: English Preferred Anime (720p+)
        - trash_id: d688ff99733a9bc626c37eb61ea74704 # [Required] Repack/Proper
          assign_scores_to: *movie_both_g

  # RV: see sonarr-raphael.
  # Rejects -300000 | no English -20000 | x265 +4000 | no group -1000
  # G = 1977 (HQ tier 1950, streaming 20, repack 7)
  # holds: x265 4000 - 1000 > G; English 20000 > 4000 + G + 1000;
  #   min -30000 < worst non-English -21000.
  radarr-raphael:
    base_url: http://radarr-raphael.media.svc.cluster.local:7878
    api_key: !env_var RADARR_RAPHAEL__AUTH__APIKEY
    delete_old_custom_formats: true
    media_naming: *movie_naming
    media_management: *media_management

    quality_definition:
      type: movie
      qualities: *rv_sizes # as sonarr-raphael; max 100 ~ 12 GB for two hours

    quality_profiles:
      - *rv_profile

    custom_formats:
      - trash_ids:
          - local-no-english-audio
        score: -20000
        assign_scores_to: *rv
      - trash_ids:
          - 9170d55c319f4fe40da8711ba9d8050d # x265
        score: 4000
        assign_scores_to: *rv
      - trash_ids:
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
        score: -1000
        assign_scores_to: *rv
      - trash_ids:
          - cae4ca30163749b891686f95532519bd # AV1
        score: -300000
        assign_scores_to: *rv
      - trash_ids: *movie_rejects
        score: -300000
        assign_scores_to: *rv

    custom_format_groups:
      add:
        - trash_id: b2f2af430f73f3ad1f9948f33e0f0cf8 # [Release Groups] HQ
          select_all: true
          assign_scores_to: *rv_g
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028 # [Streaming Services] General
          assign_scores_to: *rv_g
        - trash_id: d688ff99733a9bc626c37eb61ea74704 # [Required] Repack/Proper
          assign_scores_to: *rv_g
