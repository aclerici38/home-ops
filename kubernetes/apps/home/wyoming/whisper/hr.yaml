---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.1.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      whisper:
        strategy: RollingUpdate
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - bonds
                          - cain
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          whisper:
            image:
              repository: mirror.gcr.io/rhasspy/wyoming-whisper
              tag: 3.6.0@sha256:b7da5869ac9caba5f8db1c0dec373fb46a58d31f4aee1855faa7b49b7c0d4b49
            env:
              HOME: /tmp
              HF_HOME: /data
              HASS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: whisper
                    key: HOME_HASS_TOKEN
            args:
              - --model
              - base.en
              - --compute-type
              - int8
              - --language
              - en
              - --beam-size
              - "5"
              - --initial-prompt
              - "Alexa, turn on the lights and set the brightness to fifty percent. Set the air conditioning to seventy two degrees."
              - --hass-token
              - $(HASS_TOKEN)
              - --hass-api
              - http://home-assistant.home-assistant:8123/api
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      whisper:
        controller: whisper
        ports:
          wyoming:
            port: 10300
    persistence:
      data:
        existingClaim: whisper-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
