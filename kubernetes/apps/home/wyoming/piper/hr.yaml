---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      piper:
        strategy: RollingUpdate
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - bonds
                          - cain
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          piper:
            image:
              repository: mirror.gcr.io/rhasspy/wyoming-piper
              tag: 2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
            env:
              HOME: /tmp
              # onnxruntime >=1.30 ships 1DS telemetry on linux (mobile.events.data.microsoft.com)
              ORT_DISABLE_TELEMETRY: 1
            args:
              - --voice
              - en_US-lessac-high
              - --download-dir
              - /data
            probes:
              liveness:
                enabled: true
                type: TCP
              readiness:
                enabled: true
                type: TCP
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      piper:
        controller: piper
        ports:
          wyoming:
            port: 10200
    networkpolicies:
      piper:
        type: cilium
        controller: piper
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: home-assistant
                  app.kubernetes.io/instance: home-assistant
            toPorts:
              - ports:
                  - {port: "10200", protocol: TCP}
        egress:
          # Model/voice downloads when --voice/--model changes (cached on the PVC);
          - toFQDNs:
              - matchName: huggingface.co
              - matchPattern: "*.hf.co"
            toPorts:
              - ports:
                  - {port: "443", protocol: TCP}
    persistence:
      data:
        existingClaim: piper-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
