---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: it-tools
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      it-tools:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsGroup: 1000
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          it-tools:
            image:
              repository: ghcr.io/sharevb/it-tools
              tag: 2026.10.25@sha256:c6e68a94af10c73cb4e53eaa78726d8abbbb4ad1a89a3f127a69f85a9ae029ab
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 500Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            probes:
              liveness:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
    service:
      service:
        controller: it-tools
        ports:
          http:
            port: &port 8080
    route:
      service:
        hostnames:
          - it-tools.clerici.tech
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    networkpolicies:
      it-tools:
        type: cilium
        controller: it-tools
        ingress:
          # Route
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: internal
            toPorts:
              - ports:
                  - {port: "8080", protocol: TCP}
        egress:
          - {}
    persistence:
      tmp:
        type: emptyDir
