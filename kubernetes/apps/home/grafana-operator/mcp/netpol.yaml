---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: mcp-grafana
      app.kubernetes.io/name: grafana-mcp
  ingress:
    # grafana MCP Backend
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            app: grafana
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-mcp
spec:
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: mcp-grafana
            app.kubernetes.io/name: grafana-mcp
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
