---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-grafana
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: grafana-mcp
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    fullnameOverride: mcp-grafana
    image:
      registry: mirror.gcr.io

    grafana:
      url: http://grafana-service.grafana-operator.svc.cluster.local:3000
      apiKeySecret:
        name: mcp-grafana-token
        key: token

    envValueFrom:
      MCP_GRAFANA_SERVER_TOKEN:
        secretKeyRef:
          name: mcp-grafana-server-token
          key: token

    extraArgs:
      # Appended to the entrypoint's own "--transport sse --address
      # 0.0.0.0:8000"; last flag wins.
      - --transport=streamable-http
      - --endpoint-path=/mcp
      # Host validation covers /healthz and /metrics too, and both arrive on
      # the pod IP.
      - "--allowed-hosts=*"
      - --disable-write
      - --enabled-tools=search,datasource,prometheus,alerting,dashboard,folder,navigation

    readinessProbe: &probes
      httpGet:
        path: /healthz
        port: mcp-http
    livenessProbe: *probes

    metrics:
      enabled: true
    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

    automountServiceAccountToken: false
    serviceAccount:
      automountServiceAccountToken: false
