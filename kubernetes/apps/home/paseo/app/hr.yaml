---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paseo
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  dependsOn:
    - name: paseo-resources
  values:
    controllers:
      paseo:
        pod:
          automountServiceAccountToken: true
          labels:
            dormammu.internal/apiserver-client: "true"
          hostUsers: false
          securityContext:
            runAsGroup: 1000
            runAsUser: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        initContainers:
          tools:
            image: &image
              repository: ghcr.io/getpaseo/paseo
              tag: 0.15.4@sha256:d9c05730c66a6b64a708303e7cfa6a4009f31f89507bf986fb5b098af25a1c3f
            # Copy the repo's mise config to the default global path (writable, so mise
            # can relock it), refreshed every start to pick up bumps; works without a checkout
            command:
              - sh
              - -c
              - |
                mkdir -p /home/paseo/.config/mise
                cp /etc/home-ops/.mise.toml /home/paseo/.config/mise/config.toml
                cp /etc/home-ops/mise.lock /home/paseo/.config/mise/mise.lock
                exec /opt/mise/bin/mise install claude-code gh
            env:
              <<: &mise
                KUBE_VERSION: ${KUBE_VERSION}
                MISE_TRUSTED_CONFIG_PATHS: /workspace
                # Image ships node; mise comes from the image volume
                MISE_DISABLE_TOOLS: node,aqua:jdx/mise
              MISE_LOCKED: true
              MISE_NO_HOOKS: true
            securityContext: &sec
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
        containers:
          paseo:
            image: *image
            env:
              <<: *mise
              PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/mise/bin:/home/paseo/.local/share/mise/shims
              SHELL: /bin/bash
              KUBECONFIG: /etc/kube/config
              PASEO_HOSTNAMES: paseo.clerici.tech
              PASEO_TRUSTED_PROXIES: ${CLUSTER_POD_CIDR},${CLUSTER_POD_CIDR_V6}
              PASEO_RELAY_ENABLED: false
              PASEO_APP_BASE_URL: https://paseo.clerici.tech
              PASEO_DICTATION_ENABLED: false
              PASEO_PASSWORD:
                secretKeyRef:
                  name: paseo
                  key: password
              CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
              CLAUDE_CODE_RETRY_WATCHDOG: 1
              ENABLE_CLAUDEAI_MCP_SERVERS: false
              CLAUDE_CODE_OAUTH_TOKEN:
                secretKeyRef:
                  name: paseo
                  key: CLAUDE_CODE_OAUTH_TOKEN
              GH_TOKEN:
                secretKeyRef:
                  name: paseo
                  key: GH_TOKEN
              GIT_CONFIG_COUNT: 4
              GIT_CONFIG_KEY_0: credential.https://github.com.helper
              GIT_CONFIG_VALUE_0: "!gh auth git-credential"
              GIT_CONFIG_KEY_1: user.name
              GIT_CONFIG_VALUE_1: aclerici38
              GIT_CONFIG_KEY_2: user.email
              GIT_CONFIG_VALUE_2: anthony@clerici.me
              GIT_CONFIG_KEY_3: pull.rebase
              GIT_CONFIG_VALUE_3: "true"
            securityContext: *sec
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    port: &port 6767
                    path: /api/health
                  periodSeconds: 5
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: *health
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 8Gi
    service:
      paseo:
        controller: paseo
        ports:
          http:
            port: *port
    route:
      paseo:
        hostnames:
          - paseo.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: paseo
                port: *port
    networkpolicies:
      paseo:
        type: cilium
        controller: paseo
        # DNS from the baseline CCNP, apiserver from apiserver-clients
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/component: proxy
            toPorts:
              - ports:
                  - {port: "10443", protocol: TCP}
          - toEntities:
              - world
    configMaps:
      kubeconfig:
        forceRename: paseo-kubeconfig
        data:
          config: |-
            apiVersion: v1
            kind: Config
            current-context: home
            contexts:
              - name: home
                context: {cluster: home, user: home, namespace: paseo}
              - name: cloud
                context: {cluster: cloud, user: cloud}
            clusters:
              - name: home
                cluster:
                  server: https://kubernetes.default.svc
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              - name: cloud
                cluster:
                  server: https://vps.clerici.tech:6443
                  certificate-authority: /etc/kube/cloud-ca.crt
            users:
              - name: home
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              - name: cloud
                user:
                  tokenFile: /etc/kube/cloud-token
          # update on a cloud CA roll
          cloud-ca.crt: |-
            -----BEGIN CERTIFICATE-----
            MIIBiTCCATCgAwIBAgIRAOW70/d3YkC9QMabEcESeNYwCgYIKoZIzj0EAwIwFTET
            MBEGA1UEChMKa3ViZXJuZXRlczAeFw0yNjA2MTYwNjI4NDBaFw0zNjA2MTMwNjI4
            NDBaMBUxEzARBgNVBAoTCmt1YmVybmV0ZXMwWTATBgcqhkjOPQIBBggqhkjOPQMB
            BwNCAARL90RcpsggdaY1yZz18Pac0nsqbHuF7Hq9u2+CawOEVcGAXqxEa6fWatY+
            CJB1j7bQOqUN+IVA+PrYjd+IeTE4o2EwXzAOBgNVHQ8BAf8EBAMCAoQwHQYDVR0l
            BBYwFAYIKwYBBQUHAwEGCCsGAQUFBwMCMA8GA1UdEwEB/wQFMAMBAf8wHQYDVR0O
            BBYEFCc9viYuDivcFsxBMddahr54vxGHMAoGCCqGSM49BAMCA0cAMEQCICpuuUrz
            NnK5pfSaQ4b+4Vdi4hr1V3UXlcqblr+9piZaAiAOIvFlo7FCKX3uNiqeNtP3y0U1
            BeXdLYz6ZOfdial+VA==
            -----END CERTIFICATE-----
    persistence:
      data:
        existingClaim: paseo
        globalMounts:
          - path: /home/paseo
            subPath: home
          - path: /workspace
            subPath: workspace
      mise-config:
        type: configMap
        name: paseo-mise
        advancedMounts:
          paseo:
            tools:
              - path: /etc/home-ops
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.11.0@sha256:6e05da4113a812cc8ac72b21a38889d019fb0f97df6ce8075c0de98d1cf48cc4
        globalMounts:
          - path: /opt/mise/bin
            subPath: usr/local/bin
      kube:
        type: custom
        volumeSpec:
          projected:
            sources:
              - configMap:
                  name: paseo-kubeconfig
              - secret:
                  name: paseo-cloud-token
                  optional: true
                  items:
                    - {key: token, path: cloud-token}
        advancedMounts:
          paseo:
            paseo:
              - path: /etc/kube
                readOnly: true
      tmp:
        type: emptyDir
      logs:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          paseo:
            paseo:
              - path: /var/log/paseo
