---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paseo
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 1
  upgrade:
    timeout: 10m
    remediation:
      retries: 1
  dependsOn:
    - name: paseo-resources
  values:
    controllers:
      paseo:
        pod:
          automountServiceAccountToken: true
          labels:
            dormammu.internal/apiserver-client: "true"
          hostUsers: false
          securityContext:
            runAsGroup: 1000
            runAsUser: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        initContainers:
          tools:
            image: &image
              repository: ghcr.io/getpaseo/paseo
              tag: 0.15.3@sha256:57048c43a2c2988434273c7f8a4b25aa585bca6c1720493ae52e2fa91497b99a
            # Copy the repo's mise config to the default global path (writable, so mise
            # can relock it), refreshed every start to pick up bumps; works without a checkout
            command:
              - sh
              - -c
              - |
                mkdir -p /home/paseo/.config/mise
                cp /etc/home-ops/.mise.toml /home/paseo/.config/mise/config.toml
                cp /etc/home-ops/mise.lock /home/paseo/.config/mise/mise.lock
                exec /opt/mise/bin/mise install claude-code gh
            env:
              <<: &mise
                KUBE_VERSION: ${KUBE_VERSION}
                MISE_TRUSTED_CONFIG_PATHS: /workspace
                # Image ships node; mise comes from the image volume
                MISE_DISABLE_TOOLS: node,aqua:jdx/mise
              MISE_LOCKED: true
              MISE_NO_HOOKS: true
            securityContext: &sec
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
        containers:
          paseo:
            image: *image
            env:
              <<: *mise
              PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/mise/bin:/home/paseo/.local/share/mise/shims
              SHELL: /bin/bash
              PASEO_HOSTNAMES: paseo.clerici.tech
              PASEO_TRUSTED_PROXIES: ${CLUSTER_POD_CIDR},${CLUSTER_POD_CIDR_V6}
              PASEO_RELAY_ENABLED: false
              PASEO_APP_BASE_URL: https://paseo.clerici.tech
              PASEO_DICTATION_ENABLED: false
              PASEO_PASSWORD:
                secretKeyRef:
                  name: paseo
                  key: password
              CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
              CLAUDE_CODE_RETRY_WATCHDOG: 1
              ENABLE_CLAUDEAI_MCP_SERVERS: false
              CLAUDE_CODE_OAUTH_TOKEN:
                secretKeyRef:
                  name: paseo
                  key: CLAUDE_CODE_OAUTH_TOKEN
              GH_TOKEN:
                secretKeyRef:
                  name: paseo
                  key: GH_TOKEN
              GIT_CONFIG_COUNT: 4
              GIT_CONFIG_KEY_0: credential.https://github.com.helper
              GIT_CONFIG_VALUE_0: "!gh auth git-credential"
              GIT_CONFIG_KEY_1: user.name
              GIT_CONFIG_VALUE_1: aclerici38
              GIT_CONFIG_KEY_2: user.email
              GIT_CONFIG_VALUE_2: anthony@clerici.me
              GIT_CONFIG_KEY_3: pull.rebase
              GIT_CONFIG_VALUE_3: "true"
            securityContext: *sec
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    port: &port 6767
                    path: /api/health
                  periodSeconds: 5
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet: *health
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 8Gi
    service:
      paseo:
        controller: paseo
        ports:
          http:
            port: *port
    route:
      paseo:
        hostnames:
          - paseo.clerici.tech
        parentRefs:
          - name: trusted
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: paseo
                port: *port
    networkpolicies:
      paseo:
        type: cilium
        controller: paseo
        # DNS from the baseline CCNP, apiserver from apiserver-clients
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: trusted
            toPorts:
              - ports:
                  - {port: "6767", protocol: TCP}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/component: proxy
            toPorts:
              - ports:
                  - {port: "10443", protocol: TCP}
          - toEntities:
              - world
    persistence:
      data:
        existingClaim: paseo
        globalMounts:
          - path: /home/paseo
            subPath: home
          - path: /workspace
            subPath: workspace
      mise-config:
        type: configMap
        name: paseo-mise
        advancedMounts:
          paseo:
            tools:
              - path: /etc/home-ops
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.11.0@sha256:6e05da4113a812cc8ac72b21a38889d019fb0f97df6ce8075c0de98d1cf48cc4
        globalMounts:
          - path: /opt/mise/bin
            subPath: usr/local/bin
      tmp:
        type: emptyDir
      logs:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          paseo:
            paseo:
              - path: /var/log/paseo
