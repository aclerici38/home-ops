---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paseo-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur
    - name: envoy-gateway
      namespace: envoy-gateway
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    # 1Password item `paseo`: PASEO_PASSWORD, CLAUDE_CODE_OAUTH_TOKEN
    # (`claude setup-token`), GH_TOKEN (fine-grained, home-ops only)
    externalSecret: {}
    # Claude memory and Paseo state; code lives on its remote
    kopiur:
      capacity: 30Gi
      ignoreRules:
        - /workspace
        - /home/.paseo/worktrees
        # mise installs
        - /home/.local
        - /home/.cache
    pocketId:
      callbackPaths:
        - /oauth2/callback
      spec:
        oidcClient:
          secret:
            keys:
              clientID: client-id
              clientSecret: client-secret
    oidc: {}
