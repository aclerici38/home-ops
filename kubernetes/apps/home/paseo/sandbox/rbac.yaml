---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/role-rbac-v1.json
# Ad-hoc test workloads; reads come from the paseo ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-sandbox
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - deletecollection
  - apiGroups:
      - ""
    resources:
      - pods/exec
      - pods/attach
      - pods/portforward
    verbs:
      - get
      - create
  # kubectl debug
  - apiGroups:
      - ""
    resources:
      - pods/ephemeralcontainers
    verbs:
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - deletecollection
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.2-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paseo-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paseo-sandbox
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: paseo
