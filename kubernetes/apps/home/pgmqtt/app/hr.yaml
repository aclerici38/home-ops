---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=pgmqtt/0.1.18
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgmqtt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pgmqtt
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: pgmqtt-resources
  values:
    podAntiAffinity:
      enabled: true
    # The embedded User operator; apiserver egress via the apiserver-clients CCNP
    podLabels:
      dormammu.internal/apiserver-client: "true"
    database:
      # `uri` from the pgmqtt-postgres ConfigMap; the chart only takes a Secret
      url: postgresql://pgmqtt@pg18-pooler-mtls-session-rw.cloudnative-pg.svc.cluster.local:5432/pgmqtt?sslmode=verify-full&sslcert=/var/run/secrets/postgresql/tls.crt&sslkey=/var/run/secrets/postgresql/tls.key&sslrootcert=/var/run/secrets/postgresql/ca.crt
      # Sent as a Postgres startup parameter, which pgbouncer refuses
      statementTimeoutMs: 0
    extraVolumes:
      - name: postgres-cert
        secret:
          secretName: pgmqtt-postgres-cert
          defaultMode: 0440
    extraVolumeMounts:
      - name: postgres-cert
        mountPath: /var/run/secrets/postgresql
        readOnly: true
    serviceMonitor:
      enabled: true
    grafana:
      dashboard:
        enabled: true
        allowCrossNamespaceImport: true
        instanceSelector:
          matchLabels:
            grafana.internal/instance: grafana
