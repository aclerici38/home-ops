---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/gateway-api/1.6.3/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgmqtt
spec:
  parentRefs:
    - name: internal
      kind: Gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - pgmqtt.clerici.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mqtt
      backendRefs:
        - name: pgmqtt
          port: 8083
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pgmqtt-ui
          port: 80
