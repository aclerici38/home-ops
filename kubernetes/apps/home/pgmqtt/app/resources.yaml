---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgmqtt-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: cloudnative-pg
      namespace: cloudnative-pg
    - name: envoy-gateway
      namespace: envoy-gateway
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    cnpg:
      mode: shared
      mtls: true
      # LISTEN/NOTIFY + session advisory locks
      poolMode: session
      # The broker only, not the UI
      podLabels:
        app.kubernetes.io/instance: pgmqtt
        app.kubernetes.io/component: broker
    pocketId:
      callbackPaths:
        - /oauth2/callback
      spec:
        oidcClient:
          secret:
            keys:
              clientID: client-id
              clientSecret: client-secret
    oidc: {}
