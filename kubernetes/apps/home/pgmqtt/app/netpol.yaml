---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pgmqtt
spec:
  # Client ingress comes from each client's <app>-mqtt (resource-bundle mqtt),
  # Postgres egress from pgmqtt-postgres, apiserver egress from the
  # apiserver-clients CCNP, DNS + Prometheus from the baseline CCNP.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: pgmqtt
      app.kubernetes.io/component: broker
  ingress:
    # MQTT over WebSocket from the UI (in the browser), via httproute.yaml
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "8083", protocol: TCP}
  egress:
    - {}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pgmqtt-ui
spec:
  # Static files only; the browser talks to the broker itself
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: pgmqtt
      app.kubernetes.io/component: ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: internal
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
  egress:
    - {}
