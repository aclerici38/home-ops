---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyplex-watched
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    controllers:
      jellyplex-watched:
        type: cronjob
        cronjob:
          schedule: "@hourly"
          timeZone: America/Los_Angeles
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          activeDeadlineSeconds: 1800
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 2
        pod:
          restartPolicy: Never
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          jellyplex-watched:
            image:
              repository: ghcr.io/luigi311/jellyplex-watched
              tag: 9.0.0@sha256:f7174e8a53fb5782a81e5cddf4ede5406eed7577c171406cab3de73bffb2c6c7
            # silo API keys only see their own user, and one server that fails to connect aborts
            # the whole run, so sync raphael against one silo user at a time. SILO_USERS is
            # "<user> <key>" per line, built from the 1Password item. Tokens are patched onto the
            # servers in config.yaml by name. The image entrypoint is skipped: its preflight
            # validates settings before the loop has set any tokens.
            command:
              - sh
              - -c
              - |
                while read -r user key; do
                  [ -n "$user" ] || continue
                  echo "=== syncing $user"
                  JPW_SERVER_TOKENS="{\"raphael\": \"$RAPHAEL_API_KEY\", \"silo\": \"$key\"}" \
                    JPW_WHITELIST_USERS="[\"$user\"]" python -u main.py </dev/null
                done <<EOF
                $SILO_USERS
                EOF
            env:
              YAML_FILE: /app/config/config.yaml
            envFrom:
              - secretRef:
                  name: jellyplex-watched
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    configMaps:
      config:
        data:
          config.yaml: |-
            dryrun: false
            debug_level: INFO
            run_only_once: true
            # RO root fs
            log_file: /tmp/log.log
            mark_file: /tmp/mark.log
            request_timeout: 300
            max_threads: 1
            # Raphael's copies are separate arr grabs, so filenames never match
            generate_guids: true
            generate_locations: false
            whitelist_libraries: [Movies, tv]
            library_mappings:
              - canonical: tv
                aliases:
                  - {server: raphael, library: TV Shows}
                  - {server: silo, library: TV}
            jellyfin:
              - name: raphael
                baseurl: http://jellyfin:8096
                sync_to: [silo]
              - name: silo
                baseurl: https://jellyfin.clerici.tech
                sync_to: [raphael]
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config/config.yaml
            subPath: config.yaml
            readOnly: true
      tmpfs:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
            subPath: tmp
