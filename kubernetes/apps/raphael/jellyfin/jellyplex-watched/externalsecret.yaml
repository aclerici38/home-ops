---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.9.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyplex-watched
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyplex-watched
    template:
      data:
        # Order must match JELLYFIN_BASEURL in the HelmRelease: raphael, then home.
        JELLYFIN_TOKEN: "{{ .RAPHAEL_API_KEY }}, {{ .HOME_API_KEY }}"
  data:
    - secretKey: RAPHAEL_API_KEY
      remoteRef:
        key: jellyplex-watched
        property: RAPHAEL_API_KEY
    - secretKey: HOME_API_KEY
      remoteRef:
        key: jellyplex-watched
        property: HOME_API_KEY
