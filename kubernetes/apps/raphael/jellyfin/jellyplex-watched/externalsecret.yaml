---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.14.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyplex-watched
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyplex-watched
    template:
      data:
        RAPHAEL_API_KEY: "{{ .RAPHAEL_API_KEY }}"
        SILO_USERS: |-
          {{- range $k, $v := . }}{{ if hasSuffix "_SILO_API_KEY" $k }}
          {{ trimSuffix "_SILO_API_KEY" $k | lower }} {{ $v }}
          {{- end }}{{ end }}
  dataFrom:
    - extract:
        key: jellyplex-watched
