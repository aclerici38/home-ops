---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/helm.toolkit.fluxcd.io/HelmRelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    controllers:
      onepassword-connect:
        pod:
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        strategy: RollingUpdate
        replicas: 1
        defaultContainerOptionsStrategy: merge
        defaultContainerOptions:
          env:
            XDG_DATA_HOME: &configDir /config
            OP_SESSION:
              valueFrom:
                secretKeyRef:
                  name: onepassword-connect
                  key: 1password-credentials.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 256M
        containers:
          api:
            image:
              repository: mirror.gcr.io/1password/connect-api
              tag: 1.8.4@sha256:0f74924c55c9156b8116f59f485223b2c2d30a5148d362562aa27838159bdffa
            env:
              OP_HTTP_PORT: &apiPort 80
              OP_BUS_PORT: 11220
              OP_BUS_PEERS: localhost:11221
            probes: &probes
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /heartbeat
                    port: *apiPort
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  initialDelaySeconds: 15
          sync:
            image:
              repository: mirror.gcr.io/1password/connect-sync
              tag: 1.8.4@sha256:ca34850f2a20ca302e688a9347cdb696f29ce3bfc011d2554eff338e315c9089
            env:
              OP_HTTP_PORT: 8081
              OP_BUS_PORT: 11221
              OP_BUS_PEERS: localhost:11220
            probes: *probes
    service:
      onepassword-connect:
        controller: onepassword-connect
        ports:
          http:
            port: *apiPort
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: *configDir
