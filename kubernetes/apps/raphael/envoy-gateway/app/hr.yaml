---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
  values:
    crds:
      enabled: true
    global:
      imageRegistry: mirror.gcr.io
    deployment:
      replicas: 1
      envoyGateway:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
    config:
      envoyGateway:
        extensionApis:
          # Gates the Backend CRD the OIDC SecurityPolicies resolve pocket-id
          # through. EnvoyPatchPolicy stays off: it injects arbitrary xDS.
          enableBackend: true
