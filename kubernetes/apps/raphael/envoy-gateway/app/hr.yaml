---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 8760h
      ref:
        tag: 1.10.0
        digest: sha256:62fe8cca72a8770bb33900dd5c0990011ab98f2d6f4420c449ce44b1ca4eebe6
      url: oci://mirror.gcr.io/envoyproxy/gateway-helm
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    crds:
      enabled: true
    global:
      imageRegistry: mirror.gcr.io
    deployment:
      replicas: 1
      envoyGateway:
        # No leader election
        strategy:
          type: Recreate
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
    config:
      envoyGateway:
        provider:
          kubernetes:
            # Single node
            leaderElection:
              disable: true
        extensionApis:
          # Gates the Backend CRD the OIDC SecurityPolicies resolve pocket-id
          # through. EnvoyPatchPolicy stays off: it injects arbitrary xDS.
          enableBackend: true
