---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    crds:
      gatewayAPI:
        enabled: true
        # Same set config/crd installs upstream, safe-upgrade VAP included.
        channel: standard
      envoyGateway:
        enabled: true
