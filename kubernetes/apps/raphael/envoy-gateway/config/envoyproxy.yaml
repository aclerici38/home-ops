---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.2/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-params
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          image: mirror.gcr.io/envoyproxy/envoy:distroless-v1.40.0@sha256:23b72ac1fa94908b2ca7ebf194cc6083cd0d4913210c7d7453e4b2008ca26c84
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 512Mi
        pod:
          # k8tz injects an init container that sets every restricted control
          # except runAsNonRoot, which it expects from the pod. Envoy Gateway
          # leaves the pod securityContext empty, so PodSecurity rejects it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
      envoyService:
        externalTrafficPolicy: Local
  shutdown:
    drainTimeout: 60s
    minDrainDuration: 15s
  telemetry:
    # No Prometheus here, and every logged request is a write to the QLC drive.
    accessLog:
      disable: true
    metrics:
      prometheus:
        disable: true
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.2/envoyproxy_v1alpha1.json
# The external Gateway is reached only in-cluster.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
spec:
  mergeType: StrategicMerge
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        name: external
        type: ClusterIP
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.2/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
spec:
  mergeType: StrategicMerge
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: internal
