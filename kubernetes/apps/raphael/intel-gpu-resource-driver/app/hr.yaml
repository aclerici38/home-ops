---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    kubeletPlugin:
      privileged: true
      healthMonitoring:
        enabled: false
