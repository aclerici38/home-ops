---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: towonel-agent
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    defaultPodOptions:
      hostUsers: false
    controllers:
      main:
        replicas: 1
        # containers:
        #   main:
        #     image:
        #       # Maybe bbr3 change, n0-computer/noq #800 / #819.
        #       tag: 1.11.0
        #       digest: sha256:f2e0d2bba2a30b85def3e7b6c110a74ad23c6be31697516225a42a8c999712c9
    agent:
      replica: 1
      # Temporary: debugging BBRv3 throughput decay on 1.13.1 (path/migration events).
      logLevel: info,towonel_agent=debug,iroh=debug,noq_proto=debug
      inviteTokenSecret:
        name: raphael-k8s-token
        key: token
      services:
        - hostname: "raphael.living"
          origin: external.envoy-gateway.svc.cluster.local:443
        - hostname: "*.raphael.living"
          origin: external.envoy-gateway.svc.cluster.local:443
      udpServices:
        - name: wireguard
          origin: 192.168.71.1:51822
          listen_port: 51822
