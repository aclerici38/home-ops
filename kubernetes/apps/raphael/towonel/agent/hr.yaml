---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 8760h
      ref:
        tag: 1.15.1
        digest: sha256:e1b4d8cb87c60eccdc25b2af6b862cffa5b50df1ea6700c50d724483514594ae
      url: oci://git.ow-ops.eu/towonel/charts/towonel-agent
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    defaultPodOptions:
      hostUsers: false
    controllers:
      main:
        replicas: 1
    agent:
      replica: 1
      inviteTokenSecret:
        name: raphael-k8s-token
        key: token
      services:
        - hostname: "raphael.living"
          origin: external.envoy-gateway.svc.cluster.local:443
        - hostname: "*.raphael.living"
          origin: external.envoy-gateway.svc.cluster.local:443
      udpServices:
        - name: wireguard
          origin: 192.168.71.1:51822
          listen_port: 51822
