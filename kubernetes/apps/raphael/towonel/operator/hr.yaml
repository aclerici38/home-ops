---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-operator
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 8760h
      ref:
        tag: v1.10.0
        digest: sha256:6bfb27c3de4fc70514b4af9e931a670de008bf1c6ec306cfb6caf0b3a14ca01c
      url: oci://ghcr.io/jacaudi/charts/towonel-operator
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  dependsOn:
    - name: towonel-operator-resources
  # The chart hardcodes RollingUpdate; without leader election a surge pod
  # would reconcile alongside the old one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: towonel-operator
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: towonel-operator
              spec:
                strategy:
                  $patch: replace
                  type: Recreate
  values:
    replicas: 1
    # Single node
    leaderElection:
      enabled: false
    towonel:
      apiURL: https://towonel.cloud.clerici.tech
    credentials:
      existingSecret: towonel-operator
      tokenKey: TOWONEL_HUB_OPERATOR_API_KEY
    agentNodeRBAC:
      create: false
