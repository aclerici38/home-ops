---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 8760h
      ref:
        tag: 0.12.14
        digest: sha256:63ac830d6db2be34fc7fdb748087158e9ee136666c84e0e7a1a18d50428e56b6
      url: oci://ghcr.io/home-operations/charts/miroir
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
            subject: "^https://github\\.com/home-operations/.*"
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    logging:
      level: error
    drbd:
      # Every volume is a DRBD device even at replicas: 1. Raising the activity-log
      # extents slashes metadata write-amplification on scattered SQLite writes;
      # single-node crash-resync cost is nil (no peer). Prime, < 65534.
      alExtents: 6007
    # Only ever applies to 2-replica volumes — cannot fire at replicas: 1.
    autoTieBreaker: false
    agent:
      # hostPath on the root XFS (reflink=1)
      # Must match spec.pools[].loopfile.baseDir in the MiroirNode CR.
      loopfileBaseDirs:
        - /var/lib/miroir
      # storageCapacity/autoDiskful/autoEvict are all off
      poolStatsInterval: 300s
