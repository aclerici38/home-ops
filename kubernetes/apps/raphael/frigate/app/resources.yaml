---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.3/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: intel-gpu-resource-driver
      namespace: intel-gpu-resource-driver
  values:
    kopiur:
      capacity: 10Gi
      storageClass: miroir
      snapshotClass: miroir
      parallelism: 1
      # See the home release: config.yaml + model_cache are worth keeping, the
      # sqlite DB isn't (its media lives on the local-path frigate-media PVC and
      # isn't backed up either). Doubly worth skipping here — miroir is QLC, so
      # not rewriting a churny DB into every snapshot is the point.
      ignoreRules:
        - /frigate.db*
        - /backup.db
    gpu: {}
    externalSecret:
      data:
        - secretKey: FRIGATE_MQTT_PASS
          remoteRef:
            key: mosquitto
            property: FRIGATE_MQTT_PASS
