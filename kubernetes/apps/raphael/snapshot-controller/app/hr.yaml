---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    replicaCount: 1
    # Single node
    controller:
      leaderElection:
        enabled: false
    # /healthz/leader-election only exists with leader election on.
    livenessProbe:
      httpGet:
        path: /metrics
    readinessProbe:
      httpGet:
        path: /metrics
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
