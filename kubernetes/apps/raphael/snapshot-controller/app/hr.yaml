---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 8760h
      ref:
        tag: 0.1.2
        digest: sha256:392cd2f3e093bc87e4b2ec29c31f444f860a5a222a94cba035b3ab0069877f01
      url: oci://ghcr.io/home-operations/charts/snapshot-controller
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
            subject: "^https://github\\.com/home-operations/.*"
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    replicaCount: 1
    # Single node
    controller:
      leaderElection:
        enabled: false
    # /healthz/leader-election only exists with leader election on.
    livenessProbe:
      httpGet:
        path: /metrics
    readinessProbe:
      httpGet:
        path: /metrics
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
