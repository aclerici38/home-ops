---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=external-dns/1.20.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-adguard
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: external-dns-adguard
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  dependsOn:
    - name: external-dns-adguard-resources
  values:
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
        env:
          # The client appends API paths verbatim, so the /control/ suffix is required
          - name: ADGUARD_URL
            value: http://192.168.71.1:3000/control/
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard
                key: username
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard
                key: password
          - name: DOMAIN_FILTER
            value: raphael.living
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: {drop: ["ALL"]}
    extraArgs:
      # Routes on both gateways would otherwise get the internal IP and the vps CNAME for one name
      - --gateway-name=internal
    policy: sync
    triggerLoopOnEvent: true
    sources:
      - "crd"
      - "gateway-httproute"
      - "service"
    txtPrefix: k8s.
    txtOwnerId: ${CLUSTER_NAME}
    domainFilters:
      - "raphael.living"
