---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=external-dns/1.20.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  dependsOn:
    - name: external-dns-cloudflare-resources
  values:
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare
            key: CLOUDFLARE_API_TOKEN
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --gateway-name=external
    policy: sync
    # Events still trigger syncs
    interval: 1h
    triggerLoopOnEvent: true
    sources:
      - "crd"
      - "gateway-httproute"
      - "service"
    txtPrefix: k8s.
    txtOwnerId: ${CLUSTER_NAME}
    domainFilters:
      - "clerici.tech"
      - "raphael.living"
