---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    kopiur:
      capacity: 10Gi
      storageClass: miroir
      # HA's own backups/ are encrypted tars that never dedup (~470 MB/day), and
      # the recorder DB re-uploads most of itself daily (~0.7 GB) for history only.
      ignoreRules:
        - /backups
        - /home-assistant_v2.db*
      spec:
        policy:
          repository:
            name: backblaze
          volumeSnapshotClassName: miroir
          upload:
            maxParallelFileReads: 1
      # Custom integration deps; the image rebuilds the venv on every HA version
      ignoreRules:
        - /.venv
