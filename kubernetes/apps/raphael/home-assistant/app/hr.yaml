---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    controllers:
      home-assistant:
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: false
            seccompProfile: {type: Unconfined}
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
            env:
              S6_READ_ONLY_ROOT: true
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              CODE_SERVER_COOKIE:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant
                    key: CODE_SERVER_COOKIE
            resources:
              requests:
                cpu: 47m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_RAW
                  - NET_ADMIN
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.141.0@sha256:72ab24b5680ee597dd647b30d82625752f40109b5f61bef90ffbf1ea1f02dbb8
            command:
              - "/usr/bin/dumb-init"
              - "--"
              - "/usr/bin/code-server"
            args:
              # Accessed through https://github.com/lovelylain/hass_ingress
              - "--bind-addr=127.0.0.1:24601"
              - "--auth=password"
              - "--app-name=Home Assistant"
              - "--disable-telemetry"
              - "--disable-update-check"
              - "--disable-getting-started-override"
              - "--disable-workspace-trust"
              - "/config"
            env:
              HOME: /home/coder
              HASHED_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant
                    key: HASHED_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "curl"
                      - "-fsS"
                      - "http://127.0.0.1:24601/healthz"
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile: {type: RuntimeDefault}
    service:
      home-assistant:
        controller: home-assistant
        ports:
          http:
            port: 8123
    route:
      home-assistant:
        hostnames:
          - raphael.living
        parentRefs:
          - name: internal
            namespace: envoy-gateway
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: home-assistant
                port: 8123
    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
        advancedMounts:
          home-assistant:
            code-server:
              - path: /home/coder
                subPath: .code-server
      dbus:
        type: hostPath
        hostPath: /run/dbus
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /run/dbus
                readOnly: true
      tmpfs:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /.dockerenv
            subPath: dockerenv
          - path: /config/logs
            subPath: logs
          - path: /run
            subPath: run
          - path: /tmp
            subPath: tmp
