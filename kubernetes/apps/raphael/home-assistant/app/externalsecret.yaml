---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.9.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant
    template:
      data:
        HASHED_PASSWORD: "{{ .HASHED_PASSWORD }}"
        CODE_SERVER_COOKIE: "code-server-session={{ .HASHED_PASSWORD }}"
  data:
    - secretKey: HASHED_PASSWORD
      remoteRef:
        key: raphael-home-assistant
        property: HASHED_PASSWORD
