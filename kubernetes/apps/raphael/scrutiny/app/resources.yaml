---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrutiny-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    externalSecret:
      spec:
        data:
          - secretKey: MQTT_PASSWORD
            remoteRef:
              key: raphael-mosquitto
              property: SCRUTINY_MQTT_PASS
        dataFrom: []
