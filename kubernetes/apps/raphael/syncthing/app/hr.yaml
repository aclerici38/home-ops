---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 8760h
      ref:
        tag: 5.3.0
        digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts.*$
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    controllers:
      syncthing:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          syncthing:
            image:
              repository: ghcr.io/syncthing/syncthing
              tag: 2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
            env:
              HOME: /var/syncthing
              STHOMEDIR: /var/syncthing/config
              STGUIADDRESS: 0.0.0.0:8384
              STNODEFAULTFOLDER: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &port 8384
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: *port
    route:
      syncthing:
        hostnames:
          - syncthing.raphael.living
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    persistence:
      config:
        existingClaim: syncthing
        globalMounts:
          - path: /var/syncthing
      media:
        type: hostPath
        hostPath: /data/media
        globalMounts:
          - path: /allMedia
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
  dependsOn:
    - name: syncthing-resources
