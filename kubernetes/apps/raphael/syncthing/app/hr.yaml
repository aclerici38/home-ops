---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    controllers:
      syncthing:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          syncthing:
            image:
              repository: ghcr.io/syncthing/syncthing
              tag: 2.1.6@sha256:4d0281bdcb4ed9baf503d251d0544ddd856f49fce3f114056257ae172b7fb670
            env:
              HOME: /var/syncthing
              STHOMEDIR: /var/syncthing/config
              STGUIADDRESS: 0.0.0.0:8384
              STNODEFAULTFOLDER: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &port 8384
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: *port
    route:
      syncthing:
        hostnames:
          - syncthing.raphael.living
        parentRefs:
          - name: internal
            namespace: envoy-gateway
    persistence:
      config:
        existingClaim: syncthing
        globalMounts:
          - path: /var/syncthing
      media:
        type: hostPath
        hostPath: /data/media
        globalMounts:
          - path: /allMedia
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
  dependsOn:
    - name: syncthing-resources
