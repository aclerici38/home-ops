---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=kopiur/0.11.2
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 8760h
      ref:
        tag: 0.11.2
        digest: sha256:a24feb1e2b1004ca7178d22ff7a8549ef7167e80c0c98381e92a7250b8cbd4d3
      url: oci://ghcr.io/home-operations/charts/kopiur
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
            subject: "^https://github\\.com/home-operations/.*"
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    installScope: cluster
    leaderElection:
      enabled: false
    workerThreads: 1
    logging:
      level: info
    features:
      credentialProjection:
        enabled: true
      kopiaUi:
        enabled: false
