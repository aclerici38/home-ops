---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=kopiur/0.10.9
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: kopiur
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  values:
    installScope: cluster
    leaderElection:
      enabled: false
    workerThreads: 1
    logging:
      level: info
    features:
      credentialProjection:
        enabled: true
      kopiaUi:
        enabled: false
