---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: apiserver-clients
spec:
  description: Egress to kube-apiserver for pods labelled dormammu.internal/apiserver-client=true
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      dormammu.internal/apiserver-client: "true"
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
