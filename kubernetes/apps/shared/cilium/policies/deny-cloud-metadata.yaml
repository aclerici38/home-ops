---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-cloud-metadata
spec:
  description: No pod reaches the cloud instance metadata service (instance-principal certs, user-data)
  # A deny-only policy would otherwise put egress into default-deny for every pod.
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector: {}
  egressDeny:
    # Oracle documents no IPv6 IMDS address. Talos' own NTP to it is host-netns, unaffected.
    - toCIDR:
        - 169.254.169.254/32
