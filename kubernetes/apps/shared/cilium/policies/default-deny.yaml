---
# Opt a namespace in with the label `network.dormammu/default-deny: "true"`
# Kubelet probes from the local node are always allowed.
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  description: Deny all traffic for pods in namespaces labelled network.dormammu/default-deny
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.network.dormammu/default-deny: "true"
  ingress:
    - {}
  egress:
    - {}
