---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=flux-operator/0.64.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 0.64.0
        digest: sha256:bfa2e5544943ae2430874f6cb3a25609c83e950207d34987b81b867a31503ca3
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token.actions.githubusercontent.com$
            subject: ^https://github.com/controlplaneio-fluxcd/charts.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    commonLabels:
      dormammu.internal/apiserver-client: "true"
    serviceMonitor:
      create: true
    web:
      networkPolicy:
        create: false
    installCRDs: true
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: "RuntimeDefault"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
