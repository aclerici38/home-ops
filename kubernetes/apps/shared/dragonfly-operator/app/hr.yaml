---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: v1.8.0
        digest: sha256:c52cf016eafb100f2b4f8d7f4f1469b743aac0787a992dbda88cac4544a2eb14
      url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    replicaCount: 2
    rbacProxy:
      image:
        repository: quay.io/brancz/kube-rbac-proxy
        tag: v0.23.1@sha256:c280684dd23793fb2f287d1f4efc84b7800b3e01205d770b98694827bfe514cb
    podLabels:
      dormammu.internal/apiserver-client: "true"
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
