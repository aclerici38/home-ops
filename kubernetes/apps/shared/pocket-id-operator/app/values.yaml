---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-id-operator-values
  namespace: pocket-id-operator
data:
  values.yaml: |-
    operator:
      args:
        - --zap-log-level=debug
      defaultLogoTemplate: "https://cdn.jsdelivr.net/gh/selfhst/icons/webp/{{name}}.webp"
      defaultDarkLogoTemplate: "https://cdn.jsdelivr.net/gh/selfhst/icons/webp/{{name}}-light.webp"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
