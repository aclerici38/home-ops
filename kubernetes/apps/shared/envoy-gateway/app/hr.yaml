---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
  values:
    # CRDs live in the chart's crds/ directory, so Helm installs them without
    # writing 3.7MB of CustomResourceDefinition into the release Secret -- which
    # is what the separate gateway-crds-helm chart does, and it exceeds the 1MiB
    # Secret limit. Bundle is the Gateway API experimental channel.
    crds:
      enabled: true
    deployment:
      replicas: 2
      envoyGateway:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
    config:
      envoyGateway:
        extensionApis:
          # Gates the Backend CRD the OIDC SecurityPolicies resolve pocket-id
          # through. EnvoyPatchPolicy stays off: it injects arbitrary xDS.
          enableBackend: true
