---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 1.10.0
        digest: sha256:62fe8cca72a8770bb33900dd5c0990011ab98f2d6f4420c449ce44b1ca4eebe6
      url: oci://mirror.gcr.io/envoyproxy/gateway-helm
  install:
    timeout: 3m
    remediation:
      retries: 1
  upgrade:
    timeout: 3m
    remediation:
      retries: 1
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-ai-values
      valuesKey: values.yaml
      optional: true
  values:
    crds:
      enabled: true
    global:
      imageRegistry: mirror.gcr.io
    # The pre-install/upgrade hook writes the control plane's TLS Secrets
    certgen:
      job:
        pod:
          labels:
            dormammu.internal/apiserver-client: "true"
    deployment:
      replicas: 2
      pod:
        labels:
          dormammu.internal/apiserver-client: "true"
      envoyGateway:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
    config:
      envoyGateway:
        extensionApis:
          # Gates the Backend CRD the OIDC SecurityPolicies resolve pocket-id
          # through. EnvoyPatchPolicy stays off: it injects arbitrary xDS.
          enableBackend: true
