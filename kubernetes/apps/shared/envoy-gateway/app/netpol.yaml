---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-helm
      control-plane: envoy-gateway
  ingress:
    # xDS
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
            app.kubernetes.io/managed-by: envoy-gateway
      toPorts:
        - ports:
            - {port: "18000", protocol: TCP}
    # topology-injector webhook
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "9443", protocol: TCP}
  egress:
    - {}
