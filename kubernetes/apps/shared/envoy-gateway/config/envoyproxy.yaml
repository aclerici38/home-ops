---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/envoy-gateway/1.9.1/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-params
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 1Gi
        pod:
          # k8tz injects an init container that sets every restricted control
          # except runAsNonRoot, which it expects from the pod. Envoy Gateway
          # leaves the pod securityContext empty, so PodSecurity rejects it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  app.kubernetes.io/component: proxy
      envoyService:
        externalTrafficPolicy: Local
  shutdown:
    # Long enough for Jellyfin streams and websockets to finish on a rollout.
    drainTimeout: 300s
    minDrainDuration: 15s
  telemetry:
    metrics:
      enableVirtualHostStats: true
      prometheus:
        compression:
          type: Zstd
    accessLog:
      settings:
        - type: Route
          # Drop kubelet probe noise.
          matches:
            - "!(request.useragent.startsWith('kube-probe/'))"
          format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              authority: "%REQ(:AUTHORITY)%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              response_flags: "%RESPONSE_FLAGS%"
              duration_ms: "%DURATION%"
              upstream_service_time_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              route_name: "%ROUTE_NAME%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              upstream_host: "%UPSTREAM_HOST%"
              requested_server_name: "%REQUESTED_SERVER_NAME%"
              tls_version: "%DOWNSTREAM_TLS_VERSION%"
              # Set by the AI Gateway ext_proc and the route's llmRequestCosts.
              model: "%REQ(X-AI-EG-MODEL)%"
              response_model: "%DYNAMIC_METADATA(io.envoy.ai_gateway:response_model)%"
              backend: "%DYNAMIC_METADATA(io.envoy.ai_gateway:backend_name)%"
              llm_input_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_input_token)%"
              llm_output_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_output_token)%"
              llm_total_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_total_token)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
