---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/prometheus-operator/0.93.1/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
spec:
  jobLabel: envoy-proxy
  namespaceSelector:
    matchNames:
      - envoy-gateway
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 25s
      honorLabels: true
      relabelings:
        - sourceLabels:
            - "__meta_kubernetes_pod_label_gateway_envoyproxy_io_owning_gateway_name"
          targetLabel: gateway
          action: replace
        - sourceLabels:
            - "__meta_kubernetes_pod_label_gateway_envoyproxy_io_owning_gateway_namespace"
          targetLabel: gateway_namespace
          action: replace
