---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy
spec:
  # Every Gateway's proxies
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  ingress:
    # Listeners (Gateway port + 10000): LAN, towonel and in-cluster clients
    - fromEntities:
        - all
      toPorts:
        - ports:
            - {port: "10080", protocol: TCP}
            - {port: "10443", protocol: TCP}
  egress:
    # Route backends, OIDC/JWKS Backends, ext_authz, ratelimit and xDS (all pods)
    - toEndpoints:
        - matchExpressions:
            - {key: 'k8s:io.kubernetes.pod.namespace', operator: Exists}
