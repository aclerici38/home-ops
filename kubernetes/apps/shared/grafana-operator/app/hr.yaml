---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 5.26.0
        digest: sha256:ed199fff9f727777762762496c5663047d46fc208889ba568420e3f11e490539
      url: oci://ghcr.io/grafana/helm-charts/grafana-operator
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    hostUsers: false
    podLabels:
      dormammu.internal/apiserver-client: "true"
    env:
      - name: DEFAULT_RESYNC_PERIOD
        value: ${GRAFANA_RESYNC_PERIOD}
    crds:
      immutable: false
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
  dependsOn:
    - name: grafana-operator-resources
