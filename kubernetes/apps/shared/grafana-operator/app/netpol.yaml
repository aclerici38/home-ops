---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-operator
spec:
  # apiserver egress comes from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana-operator
      app.kubernetes.io/name: grafana-operator
  ingress:
    - {}
  egress:
    # Grafana HTTP API
    - toEndpoints:
        - matchLabels:
            app: grafana
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
    # GrafanaDashboard spec.url sources
    - toFQDNs:
        - matchName: grafana.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
