---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    externalSecret: {}
    pocketId:
      name: grafana
      clientID: grafana-${CLUSTER_NAME}
      url: grafana.${CLUSTER_NAME}.clerici.tech
      callbackPaths:
        - /login/generic_oauth
      spec:
        allowedUserGroups:
          - groupName: admin
        logo:
          nameOverride: grafana
