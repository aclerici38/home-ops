---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  # Route ingress is per-cluster; pocket-id egress comes from grafana-operator-pocket-id
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: grafana-operator
            app.kubernetes.io/name: grafana-operator
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-prometheus-stack
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - {port: "9093", protocol: TCP}
