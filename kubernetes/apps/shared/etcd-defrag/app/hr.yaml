---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-defrag
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    controllers:
      etcd-defrag:
        type: cronjob
        cronjob:
          # Daily; most runs defrag nothing.
          schedule: "15 5 * * *"
          timeZone: America/Los_Angeles
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          successfulJobsHistory: 1
          failedJobsHistory: 1
          # Don't retry
          backoffLimit: 0
          activeDeadlineSeconds: 900
        pod:
          restartPolicy: Never
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          etcd-defrag:
            image:
              repository: mirror.gcr.io/library/busybox
              tag: 1.38.0-musl@sha256:ea2b9914a16a4ac1981994af97b318f7c7d4db76b580c56177f08bf76f4a0be8
            env:
              PATH: /opt/talosctl:/bin
              TALOSCONFIG: /var/run/secrets/talos.dev/config
              NODES: ${ETCD_NODES}
            command:
              - sh
              - -c
            args:
              - |
                set -eu
                log() { echo "[$(date +%T)] $*"; }

                # Fails if any member is unreachable
                status=$(talosctl -n "$NODES" etcd status)
                echo "$status"

                # Defrag members using under half their db file (the alert's ratio), leader last.
                # Columns: NODE MEMBER DB SIZE (2) IN USE (3, e.g. "102 MB (19.41%)") LEADER ...
                # Decisions go to stderr, the node list to stdout.
                nodes=$(echo "$status" | awk 'NR > 1 {
                  gsub(/[(%)]/, "", $7)
                  role = ($2 == $8) ? "leader" : "follower"
                  action = ($7 < 50) ? "defrag" : "skip"
                  printf "%s (%s): %s %s of %s %s in use (%s%%) -> %s\n", $1, role, $5, $6, $3, $4, $7, action > "/dev/stderr"
                  if (action == "defrag") print ($2 == $8), $1
                }' | sort | cut -d' ' -f2)

                for node in $nodes; do
                  log "defragmenting $node"
                  start=$(date +%s)
                  talosctl -n "$node" etcd defrag
                  log "defragmented $node in $(($(date +%s) - start))s, waiting 30s"
                  sleep 30
                done
                [ -n "$nodes" ] || log "nothing to defragment"

                # alarm list prints nothing when there are none. Disarm is a no-op
                # without alarms; etcd re-raises NOSPACE if a member is still over quota.
                alarms=$(talosctl -n "$NODES" etcd alarm list)
                if [ -n "$alarms" ]; then
                  log "alarms, disarming:"
                  echo "$alarms"
                else
                  log "no alarms"
                fi
                talosctl -n "$NODES" etcd alarm disarm

                log "done"
                talosctl -n "$NODES" etcd status
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      talosctl:
        type: image
        image: ghcr.io/siderolabs/talosctl:${TALOS_VERSION}
        globalMounts:
          - path: /opt/talosctl
      talosconfig:
        type: secret
        name: etcd-defrag
        defaultMode: 0440
        globalMounts:
          - path: /var/run/secrets/talos.dev
    networkpolicies:
      etcd-defrag:
        type: cilium
        controller: etcd-defrag
        ingress:
          - {}
        egress:
          # apid via the talos.default Service
          - toEntities:
              - host
              - remote-node
            toPorts:
              - ports:
                  - {port: "50000", protocol: TCP}
