---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: towonel-agent-values
  namespace: towonel
data:
  values.yaml: |-
    controllers:
      main:
        replicas: 1
        # containers:
          # main:
          #   image:
          #     # Maybe bbr3 change, n0-computer/noq #800 / #819.
          #     tag: 1.11.0
          #     digest: sha256:f2e0d2bba2a30b85def3e7b6c110a74ad23c6be31697516225a42a8c999712c9
    defaultPodOptions:
      hostUsers: false
    agent:
      inviteTokenSecret:
        name: ${CLUSTER_NAME}-k8s-token
        key: token
      services:
        - hostname: "*.${EXTERNAL_DOMAIN}"
          origin: external.envoy-gateway.svc.cluster.local:443
        - hostname: "*.${CLUSTER_NAME}.clerici.tech"
          origin: external.envoy-gateway.svc.cluster.local:443
    serviceMonitor:
      enabled: true
    monitoring:
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
