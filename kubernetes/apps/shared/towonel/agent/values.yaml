---
apiVersion: v1
kind: ConfigMap
metadata:
  name: towonel-agent-values
  namespace: towonel
data:
  values.yaml: |-
    controllers:
      main:
        replicas: 1
    defaultPodOptions:
      hostUsers: false
    agent:
      inviteTokenSecret:
        name: ${CLUSTER_NAME}-k8s-token
        key: token
      services:
        - hostname: "*.${EXTERNAL_DOMAIN}"
          origin: external.kgateway.svc.cluster.local:443
        - hostname: "*.${CLUSTER_NAME}.clerici.tech"
          origin: external.kgateway.svc.cluster.local:443
    serviceMonitor:
      enabled: true
    monitoring:
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
