---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-operator
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: towonel-operator
  install:
    timeout: 5m
    remediation:
      retries: 1
  upgrade:
    timeout: 5m
    remediation:
      retries: 1
  dependsOn:
    - name: towonel-operator-resources
  # The chart has no pod-label value; apiserver egress via the apiserver-clients CCNP
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: towonel-operator
            patch: |
              - op: add
                path: /spec/template/metadata/labels/dormammu.internal~1apiserver-client
                value: "true"
  values:
    replicas: 1
    leaderElection:
      enabled: true
    logLevel: debug
    towonel:
      apiURL: https://towonel.cloud.clerici.tech
    # observability:
    #   metrics:
    #     serviceMonitor:
    #       enabled: true
    credentials:
      existingSecret: towonel-operator
      tokenKey: TOWONEL_HUB_OPERATOR_API_KEY
    agentNodeRBAC:
      create: false
