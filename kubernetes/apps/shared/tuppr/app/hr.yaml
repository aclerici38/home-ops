---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=tuppr/0.5.14
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.5.14
        digest: sha256:2d38c3ab5f9e23b5e1ba1b4326aa1fbe79c59ebcb0e2768b5a9781a5e108599c
      url: oci://ghcr.io/home-operations/charts/tuppr
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    podLabels:
      dormammu.internal/apiserver-client: "true"
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          matchLabels:
            grafana.internal/instance: grafana
