---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=cert-manager/1.21.3
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: v1.21.3
        digest: sha256:e482675aec32862d323a9218293ff7de81192337998615e4378c56498473f240
      url: oci://quay.io/jetstack/charts/cert-manager
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    crds:
      enabled: true
    replicaCount: 2
    podLabels: &apiserverClient
      dormammu.internal/apiserver-client: "true"
    webhook:
      podLabels: *apiserverClient
    cainjector:
      podLabels: *apiserverClient
    startupapicheck:
      podLabels: *apiserverClient
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
