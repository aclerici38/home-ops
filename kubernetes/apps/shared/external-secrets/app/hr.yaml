---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=external-secrets/2.15.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 2.15.0
        digest: sha256:839666a0c7dd395b4c6bdc616e31b3a839407afbedf33620696578ab6f2268cb
      url: oci://ghcr.io/external-secrets/charts/external-secrets
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token.actions.githubusercontent.com$
            subject: ^https://github.com/external-secrets/external-secrets.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    installCRDs: true
    global:
      podLabels:
        dormammu.internal/apiserver-client: "true"
    grafanaDashboard:
      enabled: true
    replicaCount: 2
    leaderElect: true
    hostUsers: false
    image:
      repository: ghcr.io/external-secrets/external-secrets
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    webhook:
      hostUsers: false
      image:
        repository: ghcr.io/external-secrets/external-secrets
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceMonitor:
        enabled: true
        interval: 1m
    certController:
      hostUsers: false
      image:
        repository: ghcr.io/external-secrets/external-secrets
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceMonitor:
        enabled: true
        interval: 1m
    serviceMonitor:
      enabled: true
      interval: 1m
