---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: echo-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: echo-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: external
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - {}
