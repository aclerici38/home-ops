---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=external-dns/1.20.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 1.24.0
        digest: sha256:1273036048cd516dfd077a27b653c15c28aba69b676ec3b081e00be90abec8a5
      url: oci://registry.k8s.io/external-dns/charts/external-dns
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://accounts\.google\.com$
            subject: ^krel-trust@k8s-releng-prod\.iam\.gserviceaccount\.com$
  install:
    timeout: 2m
  upgrade:
    timeout: 2m
  dependsOn:
    - name: external-dns-resources
  values:
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
    podLabels:
      dormammu.internal/apiserver-client: "true"
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns
            key: CLOUDFLARE_API_TOKEN
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --gateway-name=external
    policy: sync
    triggerLoopOnEvent: true
    sources:
      - "crd"
      - "gateway-httproute"
      - "service"
    txtPrefix: k8s.
    txtOwnerId: ${CLUSTER_NAME}
    domainFilters:
      - "clerici.tech"
    serviceMonitor:
      enabled: true
