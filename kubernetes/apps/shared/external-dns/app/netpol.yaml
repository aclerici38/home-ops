---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-dns-cloudflare
spec:
  # apiserver egress comes from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: external-dns-cloudflare
  ingress:
    - {}
  egress:
    - toFQDNs:
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
