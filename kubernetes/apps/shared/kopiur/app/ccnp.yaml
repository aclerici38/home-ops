---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: backblaze-clients
spec:
  # The backblaze ClusterRepository stamps the label on every mover pod via
  # moverDefaults.podLabels, in any namespace (snapshots, restores, maintenance,
  # probes, discovery). The kopia-server UI doesn't get it; see its own CNP.
  description: Egress to Backblaze B2 for pods labelled dormammu.internal/backblaze-client=true
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      dormammu.internal/backblaze-client: "true"
  egress:
    - toFQDNs:
        - matchName: s3.us-west-004.backblazeb2.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
