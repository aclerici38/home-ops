---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: kopiur
      app.kubernetes.io/component: controller
  ingress:
    - {}
  egress:
    - {}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur-webhook
spec:
  # apiserver egress comes from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: kopiur
      app.kubernetes.io/component: webhook
  ingress:
    # kopiur-validating / kopiur-mutating (Service 443 -> 8443)
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
  egress:
    - {}
