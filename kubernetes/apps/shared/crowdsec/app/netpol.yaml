---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
# LAPI egress for pods labelled dormammu.internal/crowdsec-lapi-client: in-cluster
# on cloud, through its external gateway (TLS passthrough) from home.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-lapi-clients
spec:
  endpointSelector:
    matchExpressions:
      - {key: dormammu.internal/crowdsec-lapi-client, operator: Exists}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: crowdsec
            type: lapi
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - toFQDNs:
        - matchName: crowdsec.cloud.clerici.tech
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-hub
spec:
  # Hub index and collections installed at startup
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
  egress:
    - toFQDNs:
        - matchName: cdn-hub.crowdsec.net
        - matchName: hub-data.crowdsec.net
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-appsec
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: appsec
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: crowdsec-gateway-bouncer
      toPorts:
        - ports:
            - {port: "7422", protocol: TCP}
