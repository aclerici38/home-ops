---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.14.0/externalsecret_v1.json
# Bouncer key AppSec validates against the LAPI
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
  labels:
    dormammu.internal/component: external-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - secretKey: WAF_API_KEY
      remoteRef: {key: crowdsec, property: WAF_API_KEY}
---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.14.0/externalsecret_v1.json
# CAPI registration for cloud's LAPI. Here rather than with the LAPI so it is
# Ready before the chart's capi-register hook checks for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-capi-credentials
  labels:
    dormammu.internal/component: external-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - secretKey: online_api_credentials.yaml
      remoteRef: {key: crowdsec, property: ONLINE_API_CREDENTIALS}
