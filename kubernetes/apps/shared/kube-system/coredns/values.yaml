---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-values
  namespace: kube-system
data:
  values.yaml: |-
    fullnameOverride: coredns
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: null
        memory: 512Mi
    image:
      repository: mirror.gcr.io/coredns/coredns
      tag: 1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    replicaCount: 3
    podLabels:
      dormammu.internal/apiserver-client: "true"
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: ${COREDNS_CLUSTER_IP}
