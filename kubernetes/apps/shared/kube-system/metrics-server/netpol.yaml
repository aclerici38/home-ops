---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server
spec:
  # apiserver egress comes from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: metrics-server
      app.kubernetes.io/name: metrics-server
  ingress:
    # v1beta1.metrics.k8s.io APIService (Service 443 -> 10250)
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "10250", protocol: TCP}
  egress:
    # Kubelet summary API
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "10250", protocol: TCP}
