---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/prometheus-operator/0.87.0/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kgateway-proxy
spec:
  jobLabel: kgateway-proxy
  namespaceSelector:
    matchNames:
      - kgateway
  # Selects every kgateway-provisioned Envoy proxy, so a new Gateway is
  # scraped without adding another PodMonitor.
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      interval: 30s
      scrapeTimeout: 25s
      honorLabels: true
      relabelings:
        # Lets dashboards split external vs internal without parsing pod names.
        - sourceLabels:
            - "__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name"
          targetLabel: gateway
          action: replace
        - sourceLabels:
            - "__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_class_name"
          targetLabel: gateway_class
          action: replace
