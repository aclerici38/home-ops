---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-values
  namespace: kube-prometheus-stack
data:
  values.yaml: |-
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
        podLabels:
          app.kubernetes.io/component: crds-upgrade
          dormammu.internal/apiserver-client: "true"
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      enabled: true
      ingress:
        enabled: false
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
          global:
            resolveTimeout: 5m
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheusOperator:
      podLabels:
        dormammu.internal/apiserver-client: "true"
      admissionWebhooks:
        # Webhook certs from cert-manager instead of the create/patch hook Jobs
        certManager:
          enabled: true
    prometheus:
      prometheusSpec:
        version: v2.55.1 # bypass 'unsupported Prometheus version' error
        podMetadata:
          labels:
            dormammu.internal/apiserver-client: "true"
        image:
          registry: ghcr.io
          repository: deckhouse/prompp
          tag: 0.8.0@sha256:31b2b76059cc9eab4e62445d1c8c4913b9e16939dc88590b0e270fa9825b4a76
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 35GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 3Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - "__meta_kubernetes_pod_node_name"
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      podLabels:
        dormammu.internal/apiserver-client: "true"
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - "__meta_kubernetes_pod_node_name"
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: true
