---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/prometheus-operator/0.94.2/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - "alertname"
      - "job"
    groupInterval: 10m
    groupWait: 1m
    receiver: discord
    repeatInterval: 12h
    routes:
      # Watchdog always fires; each push is the other cluster's gatus heartbeat
      - receiver: heartbeat
        groupWait: 0s
        groupInterval: 1m
        repeatInterval: 2m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: discord
        groupWait: 0s
        groupInterval: 5m
        matchers:
          - name: alertname
            value: OmadaNewClient
            matchType: =
  inhibitRules:
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
  receivers:
    - name: "null"
    - name: heartbeat
      webhookConfigs:
        - url: https://${GATUS_BUDDY_HOST}/api/v1/endpoints/buddy_${CLUSTER_NAME}/external?success=true
          sendResolved: false
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: kube-prometheus-stack
                key: BUDDY_TOKEN
    - name: discord
      discordConfigs:
        - sendResolved: false
          apiURL:
            name: kube-prometheus-stack
            key: DISCORD_WEBHOOK_URL
          title: >-
            [{{ .Status | toUpper }}] [${CLUSTER_NAME}] [{{ .CommonLabels.alertname }}]: {{
              with .CommonAnnotations.description -}}
                {{ . }}
              {{- else -}}
                {{ (index .Alerts 0).Annotations.description }}
              {{- end }}
