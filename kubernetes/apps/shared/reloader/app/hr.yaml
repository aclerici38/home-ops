---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=reloader/2.2.21
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 2.2.21
        digest: sha256:d8daf25bbedcc180fa4bb35297709f9539c0e231f1d7815080541810deadaa98
      url: oci://ghcr.io/stakater/charts/reloader
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/stakater/Reloader.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  values:
    reloader:
      autoReloadAll: true
      watchGlobally: true
      ignoreNamespaces: "cilium,rook-ceph,kube-system,renovate-operator"
      readOnlyRootFileSystem: true
      deployment:
        labels:
          dormammu.internal/apiserver-client: "true"
      podMonitor:
        enabled: true
        namespace: reloader
