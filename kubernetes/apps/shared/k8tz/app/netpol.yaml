---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.2/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8tz
spec:
  # Webhook + cert-watcher; apiserver egress (podOwnerLookup, TLS secret) comes
  # from the apiserver-clients CCNP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: k8tz
      app.kubernetes.io/name: k8tz
  ingress:
    # Mutating webhook (Service 443 -> 8443)
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
  egress:
    - {}
