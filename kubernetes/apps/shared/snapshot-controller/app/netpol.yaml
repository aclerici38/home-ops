---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: snapshot-controller
spec:
  # apiserver egress comes from the apiserver-clients CCNP; no webhook
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: snapshot-controller
      app.kubernetes.io/name: snapshot-controller
  ingress:
    - {}
  egress:
    - {}
