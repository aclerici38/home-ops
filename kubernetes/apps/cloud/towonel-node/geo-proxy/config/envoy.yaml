---
# Every connection gets a GeoLite2 country lookup on its source IP and anything
# that is not exactly US is closed, including IPs with no result. The edge is
# only dialled after the client has sent data, so RBAC has decided before an
# upstream connection exists.
#
# No admin listener: nothing consumes it, and on hostNetwork any process on the
# node could reach it.
node:
  id: geo-proxy
  cluster: geo-proxy
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 10000
static_resources:
  listeners:
    - name: https_in
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      additional_addresses:
        - address:
            socket_address:
              address: "::"
              port_value: 443
      per_connection_buffer_limit_bytes: 32768
      access_log: &accessLog
        - name: envoy.access_loggers.stdout
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
            log_format:
              text_format_source:
                inline_string: |
                  %DOWNSTREAM_REMOTE_ADDRESS% -> %DOWNSTREAM_LOCAL_ADDRESS% country=%FILTER_STATE(envoy.geoip:FIELD:country)% term=%CONNECTION_TERMINATION_DETAILS% flags=%RESPONSE_FLAGS% dur=%DURATION%ms rx=%BYTES_RECEIVED% tx=%BYTES_SENT%
      filter_chains:
        - filters:
            - &geoip
              name: envoy.filters.network.geoip
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.geoip.v3.Geoip
                provider:
                  name: envoy.geoip_providers.maxmind
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.geoip_providers.maxmind.v3.MaxMindConfig
                    country_db_path: /geoip/GeoLite2-Country.mmdb
                    common_provider_config:
                      geo_field_keys:
                        country: country
            - &rbac
              name: envoy.filters.network.rbac
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
                stat_prefix: geo
                matcher:
                  matcher_tree:
                    input:
                      name: country
                      typed_config:
                        "@type": type.googleapis.com/envoy.extensions.matching.common_inputs.network.v3.FilterStateInput
                        key: envoy.geoip
                        field: country
                    exact_match_map:
                      map:
                        US:
                          action:
                            name: allow-us
                            typed_config:
                              "@type": type.googleapis.com/envoy.config.rbac.v3.Action
                              name: allow-us
                              action: ALLOW
                  on_no_match:
                    action:
                      name: deny
                      typed_config:
                        "@type": type.googleapis.com/envoy.config.rbac.v3.Action
                        name: deny
                        action: DENY
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: https
                cluster: edge_https
                upstream_connect_mode: ON_DOWNSTREAM_DATA
                max_early_data_bytes: 16384
    - name: http_in
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      additional_addresses:
        - address:
            socket_address:
              address: "::"
              port_value: 80
      per_connection_buffer_limit_bytes: 32768
      access_log: *accessLog
      filter_chains:
        - filters:
            - *geoip
            - *rbac
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: http
                cluster: edge_http
                upstream_connect_mode: ON_DOWNSTREAM_DATA
                max_early_data_bytes: 16384
    # Kubelet probes only; not in the OCI security list.
    - name: health
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8404
      ignore_global_conn_limit: true
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: health
                route_config: {}
                http_filters:
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - name: :path
                          string_match:
                            exact: /ready
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: edge_https
      type: STATIC
      connect_timeout: 5s
      per_connection_buffer_limit_bytes: 32768
      load_assignment:
        cluster_name: edge_https
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9443
      transport_socket: &proxyProtocol
        name: envoy.transport_sockets.upstream_proxy_protocol
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.proxy_protocol.v3.ProxyProtocolUpstreamTransport
          config:
            version: V2
          transport_socket:
            name: envoy.transport_sockets.raw_buffer
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer
    - name: edge_http
      type: STATIC
      connect_timeout: 5s
      per_connection_buffer_limit_bytes: 32768
      load_assignment:
        cluster_name: edge_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9080
      transport_socket: *proxyProtocol
