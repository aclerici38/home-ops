---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-node-resources
spec:
  interval: 1h
  chart:
    spec:
      chart: kubernetes/charts/resource-bundle
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: resource-bundle-chart
        namespace: flux-system
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur
    - name: miroir
      namespace: miroir
    - name: pocket-id-operator
      namespace: pocket-id-operator
  values:
    externalSecret: {}
    kopiur:
      capacity: 1Gi
      storageClass: miroir
      spec:
        policy:
          repository:
            name: backblaze
          volumeSnapshotClassName: miroir
          mover:
            securityContext:
              runAsUser: 10001
              runAsGroup: 10001
            podSecurityContext:
              fsGroup: 10001
              fsGroupChangePolicy: OnRootMismatch
          upload:
            maxParallelFileReads: 1
        restore:
          mover:
            securityContext:
              runAsUser: 10001
              runAsGroup: 10001
            podSecurityContext:
              fsGroup: 10001
              fsGroupChangePolicy: OnRootMismatch
