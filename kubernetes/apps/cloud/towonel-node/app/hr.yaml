---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=towonel-node/1.13.4
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-node
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-node
  interval: 30m
  dependsOn:
    - name: towonel-node-resources
  values:
    defaultPodOptions:
      dnsPolicy: Default
    hub:
      # tower_governor's per_second(n): ONE token replenished every n seconds, per client IP.
      rateLimitPerSecond: 1
      rateLimitBurst: 2000
    edge:
      # Loopback only: geo-proxy is the sole client
      bindAddress: 127.0.0.1
      httpsPort: 9443
      httpPort: 9080
    controllers:
      main:
        containers:
          main:
            env:
              RUST_LOG: info
              TOWONEL_HUB_PUBLIC_URL: https://towonel.cloud.clerici.tech
              TOWONEL_HUB_RELAY_URL: &iroh https://vps.clerici.tech:8444
              TOWONEL_EDGE_RELAY_URL: *iroh
              TOWONEL_EDGE_ADVERTISED_ADDRESSES: vps.clerici.tech:443
              TOWONEL_EDGE_PUBLIC_IPS: ${NODE_V4_IP},${NODE_V6_IP}
              TOWONEL_EDGE_REGION: CA
              # geo-proxy in front. Since v1.12 the edge takes the PROXY v2
              # destination, so v6 clients work over the single v4 loopback hop.
              TOWONEL_EDGE_PROXY_PROTOCOL: "true"
              TOWONEL_EDGE_PROXY_PROTOCOL_TRUSTED: "127.0.0.1/32"
              TOWONEL_HUB_TRUSTED_PROXIES: "172.16.0.0/24,10.40.40.41/32"
              TOWONEL_HUB_DB_DRIVER: sqlite
              TOWONEL_HUB_DB_DSN: sqlite:///data/towonel.db?mode=rwc
              TOWONEL_IDENTITY_KEY:
                secretKeyRef:
                  name: towonel-node
                  key: TOWONEL_IDENTITY_KEY
              TOWONEL_HUB_OPERATOR_API_KEY:
                secretKeyRef:
                  name: towonel-node
                  key: TOWONEL_HUB_OPERATOR_API_KEY
              TOWONEL_HUB_KEK:
                secretKeyRef:
                  name: towonel-node
                  key: TOWONEL_HUB_KEK
              TOWONEL_INVITE_HASH_KEY:
                secretKeyRef:
                  name: towonel-node
                  key: TOWONEL_INVITE_HASH_KEY
              TOWONEL_HUB_LINK_PSK:
                secretKeyRef:
                  name: towonel-node
                  key: TOWONEL_HUB_LINK_PSK
            resources:
              requests: {}
              limits: {}
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: towonel-node
    route:
      towonel-node:
        annotations:
          # coredns rewrites this name to the in-cluster envoy Service (agent
          # bootstrap); resolve publicly so the probe takes geo-proxy -> edge -> envoy
          gatus.home-operations.com/endpoint: |-
            group: towonel
            path: /v1/health
            client:
              dns-resolver: udp://1.1.1.1:53
            conditions:
              - "[STATUS] == 200"
              - "[BODY].status == ok"
        hostnames:
          - towonel.cloud.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: 8443
    serviceMonitor:
      main:
        enabled: true
    monitoring:
      prometheusrule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
