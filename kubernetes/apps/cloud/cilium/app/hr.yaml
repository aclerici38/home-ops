---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json?values=cilium/1.20.5
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  maxHistory: 1
  chart:
    kind: OCIRepository
    spec:
      interval: 5m
      ref:
        tag: 1.20.5
        digest: sha256:873a782bf1064b08fbb05f64c4ed50fcb66d6f05f981f817bddd91f038b69935
      url: oci://quay.io/cilium/charts/cilium
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/cilium/cilium.*$
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
  values:
    ipv4NativeRoutingCIDR: 172.16.0.0/16
    ipv6:
      enabled: false
    bgpControlPlane:
      enabled: false
    cluster:
      name: main
      id: 2
