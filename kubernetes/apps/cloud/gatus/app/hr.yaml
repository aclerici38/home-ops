---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=gatus-sidecar/0.6.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: gatus-resources
  # Public status page and home's off-site watcher.
  values:
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    podLabels:
      dormammu.internal/apiserver-client: "true"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    gatus:
      image:
        repository: ghcr.io/twin/gatus
        tag: v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
      extraEnv:
        - name: BUDDY_TOKEN
          valueFrom:
            secretKeyRef:
              name: gatus
              key: BUDDY_TOKEN
    # Opt-in discovery of towonel-node only, read via a Role there
    # (towonel-node/app/gatus-rbac.yaml) rather than the chart's ClusterRole
    sidecar:
      namespace: towonel-node
      kinds:
        httproute:
          enable: true
          auto: false
        service:
          enable: true
          auto: false
    rbac:
      create: false
    config:
      existingConfigMap: gatus-config
      items:
        - key: config.yaml
          path: config.yaml
    # sqlite, so the status page keeps its history across restarts
    persistence:
      enabled: true
      storageClass: miroir
      size: 1Gi
    monitoring:
      serviceMonitor:
        enabled: true
    httpRoute:
      enabled: true
      hostnames:
        - gatus.cloud.clerici.tech
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https
