---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.6/helmrelease_v2.json?values=gatus-sidecar/0.5.3
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: gatus-resources
  # Public status page and home's off-site watcher.
  values:
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi
    gatus:
      image:
        repository: ghcr.io/twin/gatus
        tag: v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
      extraEnv:
        - name: BUDDY_TOKEN
          valueFrom:
            secretKeyRef:
              name: gatus
              key: BUDDY_TOKEN
    sidecar:
      enabled: false
    serviceAccount:
      automount: false
    rbac:
      create: false
    config:
      existingConfigMap: gatus-config
      items:
        - key: config.yaml
          path: config.yaml
    # sqlite, so the status page keeps its history across restarts
    persistence:
      enabled: true
      storageClass: miroir
      size: 1Gi
    monitoring:
      serviceMonitor:
        enabled: true
    httpRoute:
      enabled: true
      hostnames:
        - gatus.cloud.clerici.tech
      parentRefs:
        - name: external
          namespace: envoy-gateway
          sectionName: https
