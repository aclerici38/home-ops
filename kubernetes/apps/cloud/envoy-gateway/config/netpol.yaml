---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.3/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-external
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: external
      app.kubernetes.io/managed-by: envoy-gateway
  egress:
    # towonel-node hub API (hostNetwork)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
