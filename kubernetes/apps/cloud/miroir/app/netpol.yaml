---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miroir-controller
spec:
  # Controller + CSI sidecars.
  # The agent is hostNetwork and the RWX gateway is disabled.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: miroir
      app.kubernetes.io/component: controller
  ingress:
    - {}
  egress:
    - {}
