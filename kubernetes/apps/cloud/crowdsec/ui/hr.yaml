---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=app-template/5.3.0
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-ui
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  dependsOn:
    - name: crowdsec-ui-resources
    - name: crowdsec
  values:
    controllers:
      crowdsec-ui:
        pod:
          labels:
            dormammu.internal/crowdsec-lapi-client: "true"
          automountServiceAccountToken: false
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
        containers:
          crowdsec-ui:
            image:
              repository: ghcr.io/theduffman85/crowdsec-web-ui
              tag: 2026.10.11@sha256:20333d6bc218f274a4cdaabc2e79716d7e203c0a23446c75f6aa6ccfc59a1431
            env:
              CONFIG_UI_TIME_ZONE: ${TZ}
              CONFIG_UPDATES_ENABLED: false
              CONFIG_INSTANCE_LAPI_URL: https://crowdsec-service.crowdsec.svc.cluster.local:8080
              CONFIG_INSTANCE_LAPI_AUTH_TYPE: mtls
              CONFIG_INSTANCE_LAPI_AUTH_CERT_FILE: /certs/tls.crt
              CONFIG_INSTANCE_LAPI_AUTH_KEY_FILE: /certs/tls.key
              CONFIG_INSTANCE_LAPI_TLS_CA_FILE: /certs/ca.crt
              CONFIG_AUTH_ENABLED: true
              CONFIG_AUTH_PASSWORD_LOGIN_ENABLED: false
              CONFIG_AUTH_OIDC_ISSUER_URL:
                secretKeyRef:
                  name: crowdsec-ui-oidc-credentials
                  key: issuer_url
              CONFIG_AUTH_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: crowdsec-ui-oidc-credentials
                  key: client_id
              CONFIG_AUTH_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: crowdsec-ui-oidc-credentials
                  key: client_secret
              CONFIG_AUTH_OIDC_SCOPE: "openid profile email groups"
              CONFIG_AUTH_OIDC_GROUPS_CLAIM: groups
              CONFIG_AUTH_OIDC_ADMIN_GROUPS_0: admin
              CONFIG_AUTH_OIDC_UNMATCHED_ROLE: deny
              CONFIG_NOTIFICATIONS_ALLOW_PRIVATE_ADDRESSES: false
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3000
                    path: /api/health
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              # Includes the in-memory data volume
              limits:
                memory: 768Mi
    service:
      crowdsec-ui:
        controller: crowdsec-ui
        ports:
          http:
            port: *port
    route:
      crowdsec-ui:
        hostnames:
          - crowdsec-ui.cloud.clerici.tech
        parentRefs:
          - name: external
            namespace: envoy-gateway
        rules:
          - backendRefs:
              - identifier: crowdsec-ui
                port: *port
            # The app builds its CSRF/OIDC/passkey origin from X-Forwarded-Host
            # when present, and nothing upstream sets it legitimately.
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - X-Forwarded-Host
    networkpolicies:
      crowdsec-ui:
        type: cilium
        controller: crowdsec-ui
        # Egress: OIDC from crowdsec-ui-pocket-id, LAPI from crowdsec-lapi-clients.
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: envoy-gateway
                  gateway.envoyproxy.io/owning-gateway-name: external
            toPorts:
              - ports:
                  - {port: "3000", protocol: TCP}
    persistence:
      certs:
        type: secret
        name: crowdsec-ui-tls
        defaultMode: 0440
        globalMounts:
          - path: /certs
            readOnly: true
      data:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /app/data
