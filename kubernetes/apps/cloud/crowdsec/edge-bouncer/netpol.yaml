---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
# LAPI egress comes from crowdsec-lapi-clients.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-edge-bouncer
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: crowdsec-edge-bouncer
  ingress:
    # geo-proxy (hostNetwork)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
