---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json?values=envoy-proxy-crowdsec-bouncer/0.8.3
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-edge-bouncer
spec:
  interval: 1h
  maxHistory: 1
  chartRef:
    kind: OCIRepository
    name: envoy-proxy-crowdsec-bouncer
  install:
    timeout: 2m
    remediation:
      retries: 1
  upgrade:
    timeout: 2m
    remediation:
      retries: 1
  # geo-proxy's L4 ext_authz: decisions only, there is no request to inspect
  values:
    replicaCount: 2
    fullnameOverride: crowdsec-edge-bouncer
    podLabels:
      dormammu.internal/crowdsec-lapi-client: "true"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    # The chart drops lowercase "all", which restricted PSA doesn't accept
    securityContext:
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: null
        memory: 128Mi
    config:
      bouncer:
        lapiURL: https://crowdsec-service.crowdsec.svc.cluster.local:8080
        tls:
          enabled: true
        tlsSecretRef:
          name: crowdsec-bouncer-tls
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
  # Not exposed by the chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/hostUsers
                value: false
