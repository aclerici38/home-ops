---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/renovate-operator/7.0.0/renovatejobtemplate_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJobTemplate
metadata:
  name: default
spec:
  provider:
    name: github
  renovateConfig:
    inline: |
      module.exports = {
        allowedCommands: ['pnpm run bundle', '^mise lock --upgrade$'],
        allowedUnsafeExecutions: ['mise'],
        packageRules: [
          {
            // Upgrade formats only when mise itself changes, including CI pins
            // and the container image, rather than every managed tool.
            matchPackageNames: ['jdx/mise', 'ghcr.io/jdx/mise'],
            postUpgradeTasks: {
              commands: ['mise lock --upgrade'],
              executionMode: 'branch',
              installTools: { mise: {} },
              // Format upgrades can also generate native dependency sidecars.
              fileFilters: ['**/mise.lock', '**/.mise/locks/**'],
            },
          },
        ],
        customEnvVariables: {
          MISE_TRUSTED_CONFIG_PATHS: '/tmp/repos',
        },
        // Docker Hub 403s past page 10
        dockerMaxPages: 10,
        hostRules: [
          {
            hostType: 'docker',
            matchHost: 'docker.io',
            username: process.env.DOCKERHUB_USERNAME,
            password: process.env.DOCKERHUB_TOKEN,
          },
        ],
        platformCommit: 'enabled',
        redisUrl: 'redis://renovate-operator-dragonfly-db:6379',
      };
  extraEnv:
    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-operator
          key: DOCKERHUB_USERNAME
    - name: DOCKERHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-operator
          key: DOCKERHUB_TOKEN
  image: ghcr.io/renovatebot/renovate:45.0.0-full@sha256:14d2900fa0a9ec46a485d04463c7e9b7ef01b8e5692963a8a7f08b223026cd1b
  parallelism: 1
  scratchVolume:
    medium: Memory
    sizeLimit: 4Gi
  resources:
    requests:
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 5Gi
  githubAppReference:
    secretName: renovate-operator
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
