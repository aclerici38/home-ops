---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/renovate-operator/6.5.0/renovatejobtemplate_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJobTemplate
metadata:
  name: default
spec:
  provider:
    name: github
  renovateConfig:
    inline: |
      module.exports = {
        allowedCommands: ['pnpm run bundle'],
        allowedUnsafeExecutions: ['mise'],
        customEnvVariables: {MISE_TRUSTED_CONFIG_PATHS: '/tmp/repos'},
        // Docker Hub 403s past page 10
        dockerMaxPages: 10,
        hostRules: [
          {
            hostType: 'docker',
            matchHost: 'docker.io',
            username: process.env.DOCKERHUB_USERNAME,
            password: process.env.DOCKERHUB_TOKEN,
          },
        ],
        platformCommit: 'enabled',
        redisUrl: 'redis://renovate-operator-dragonfly-db:6379',
      };
  extraEnv:
    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-operator
          key: DOCKERHUB_USERNAME
    - name: DOCKERHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-operator
          key: DOCKERHUB_TOKEN
  image: ghcr.io/renovatebot/renovate:44.151.4-full@sha256:50ebcbf8562a3f51c9bea5825e21c56127fa89019d3ff8e9464ebe7355472813
  parallelism: 1
  scratchVolume:
    medium: Memory
    sizeLimit: 4Gi
  resources:
    requests:
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 5Gi
  githubAppReference:
    secretName: renovate-operator
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
