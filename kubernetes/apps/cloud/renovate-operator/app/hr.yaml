---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.1/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 1h
      ref:
        tag: 7.0.0
        digest: sha256:cb8f083de9eb9e64af50ffadf8a7c62a3f8f41014d465da7f38effe15fdc8ad3
      url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/mogenius/renovate-operator.*$
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: &oidcSecret renovate-operator-oidc-credentials
      valuesKey: issuer_url
      targetPath: auth.oidc.issuerUrl
    - kind: Secret
      name: *oidcSecret
      valuesKey: client_id
      targetPath: auth.oidc.clientId
  values:
    fullnameOverride: renovate-operator
    deployment:
      podLabels:
        dormammu.internal/apiserver-client: "true"
    route:
      enabled: true
      hostnames:
        - renovate.cloud.clerici.tech
      parentRefs:
        - name: external
          namespace: envoy-gateway
    config:
      logStorage:
        mode: memory
      # Common label on discovery + executor job pods, for netpols
      podLabelTemplates:
        app.kubernetes.io/name: renovate
    logging:
      format: console
    webhook:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
    auth:
      oidc:
        enabled: true
        existingSecret: *oidcSecret
        secretKey: client_secret
        redirectUrl: https://renovate.cloud.clerici.tech/auth/callback
    authorization:
      enabled: false
    policy:
      enabled: true
  dependsOn:
    - name: renovate-operator-resources
