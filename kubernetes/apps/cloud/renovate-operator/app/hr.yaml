---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.10.0/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: &oidcSecret renovate-operator-oidc-credentials
      valuesKey: issuer_url
      targetPath: auth.oidc.issuerUrl
    - kind: Secret
      name: *oidcSecret
      valuesKey: client_id
      targetPath: auth.oidc.clientId
  values:
    fullnameOverride: renovate-operator
    deployment:
      podLabels:
        dormammu.internal/apiserver-client: "true"
    route:
      enabled: true
      hostnames:
        - renovate.cloud.clerici.tech
      parentRefs:
        - name: external
          namespace: envoy-gateway
    config:
      logStorage:
        mode: memory
      # Common label on discovery + executor job pods, for netpols
      podLabelTemplates:
        app.kubernetes.io/name: renovate
    logging:
      format: console
    webhook:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          allowCrossNamespaceImport: true
    auth:
      oidc:
        enabled: true
        existingSecret: *oidcSecret
        secretKey: client_secret
        redirectUrl: https://renovate.cloud.clerici.tech/auth/callback
    authorization:
      enabled: false
    policy:
      enabled: true
  dependsOn:
    - name: renovate-operator-resources
