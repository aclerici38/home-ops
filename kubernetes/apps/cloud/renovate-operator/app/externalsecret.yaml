---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/external-secrets/2.10.0/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-operator
  labels:
    dormammu.internal/component: external-secret
spec:
  refreshInterval: "1m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    template:
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
  dataFrom:
    - extract:
        key: renovate-operator
