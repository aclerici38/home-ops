---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: backblaze
spec:
  backend:
    s3:
      bucket: kopia-k8s
      prefix: cloud/
      endpoint: s3.us-west-004.backblazeb2.com
      region: us-west-004
      auth:
        secretRef:
          name: kopiur-backblaze
          namespace: kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-backblaze
      namespace: kopiur
      key: KOPIA_PASSWORD
  create:
    enabled: true
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 900
  allowedNamespaces:
    all: true
  credentialProjection:
    allowed: true
  # Pin the identity derivation (matches kopiur's defaults) so a cross-namespace
  # restore stays resolvable across alpha operator upgrades.
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: namespace + '-' + policyName
  scheduleDefaults:
    timezone: America/Los_Angeles
  moverDefaults:
    cache:
      mode: Ephemeral
      contentCacheSizeMb: 500
      metadataCacheSizeMb: 500
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    # GC finished mover Jobs/pods so they don't linger as API objects.
    ttlSecondsAfterFinished: 300
  health:
    probe:
      enabled: true
      interval: 1h
  maintenance:
    enabled: true
    schedule:
      timezone: America/Los_Angeles
      quick:
        cron: "0 */12 * * *"
        jitter: 1h
      full:
        cron: "0 7 * * 0"
        jitter: 1h
