---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/cilium/1.20.4/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: konflate
spec:
  # Every konflate-<cluster> instance.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: konflate
  ingress:
    # UI and GitHub webhooks via the Route
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: external
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    # GitHub API plus every git/OCI/Helm source a render pulls
    - toEntities:
        - world
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
