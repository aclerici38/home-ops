---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/kgateway/2.4.3/httplistenerpolicy_v1alpha1.json
apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: http-listener-policy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  accessLog:
    # Structured access logs to stdout so the gateway can answer "who reached
    # this host, from where" without exec'ing into Envoy's admin endpoint.
    - fileSink:
        path: /dev/stdout
        jsonFormat:
          start_time: "%START_TIME%"
          authority: "%REQ(:AUTHORITY)%"
          method: "%REQ(:METHOD)%"
          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
          protocol: "%PROTOCOL%"
          response_code: "%RESPONSE_CODE%"
          response_code_details: "%RESPONSE_CODE_DETAILS%"
          response_flags: "%RESPONSE_FLAGS%"
          duration_ms: "%DURATION%"
          upstream_service_time_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
          bytes_received: "%BYTES_RECEIVED%"
          bytes_sent: "%BYTES_SENT%"
          # Real client identity: XFF is the public IP for proxied traffic,
          # downstream_remote_address is the immediate peer.
          x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
          downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
          downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
          user_agent: "%REQ(USER-AGENT)%"
          request_id: "%REQ(X-REQUEST-ID)%"
          route_name: "%ROUTE_NAME%"
          upstream_cluster: "%UPSTREAM_CLUSTER%"
          upstream_host: "%UPSTREAM_HOST%"
          requested_server_name: "%REQUESTED_SERVER_NAME%"
          tls_version: "%DOWNSTREAM_TLS_VERSION%"
      filter:
        # Drops kubelet/LB probe noise; everything else is logged.
        notHealthCheckFilter: true
  streamIdleTimeout: 0s
  upgradeConfig:
    enabledUpgrades:
      - websocket
