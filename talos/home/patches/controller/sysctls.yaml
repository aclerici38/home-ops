---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # Disable v6 discovery on the multus interfaces
  net.ipv6.conf.bond1.disable_ipv6: 1
  net.ipv6.conf.bond1/20.disable_ipv6: 1
  net.ipv6.conf.bond1/40.disable_ipv6: 1
  net.ipv6.conf.bond1/50.disable_ipv6: 1
  net.ipv6.conf.bond1/60.disable_ipv6: 1
  net.ipv6.conf.bond1/80.disable_ipv6: 1
  # bond1 has no IPv4 address; never let it answer ARP for bond0's IPs/VIP.
  net.ipv4.conf.bond1.arp_ignore: 1
  net.ipv4.conf.bond1.arp_announce: 2
