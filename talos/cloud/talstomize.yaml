---
apiVersion: config.talstomize.dev/v1alpha1
kind: Talstomize

clusterName: cloud
controlPlaneEndpoint: https://vps.${SECRET_DOMAIN}:6443
kubernetesVersion: ${CLOUD_KUBE_VERSION}
talosVersion: ${CLOUD_TALOS_VERSION}
# Selects the oracle-installer image and validates in cloud mode.
platform: oracle
secrets: ./talsecret.sops.yaml

# Replaces talhelper's additionalApiServerCertSans + additionalMachineCertSans
additionalSubjectAltNames:
  - "madbum"
  - "vps.${SECRET_DOMAIN}"
  - "${CLOUD_NODE_IP}"
  - "${CLOUD_NODE_PRIVATE_IP}"
  - "127.0.0.1"

nodes:
  madbum:
    ip: "${CLOUD_NODE_IP}"
    kind: controlplane
    installer:
      schematic:
        customization:
          systemExtensions:
            officialExtensions:
              - siderolabs/drbd # miroir
          extraKernelArgs:
            - -selinux
            - apparmor=0
            - init_on_alloc=0
            - init_on_free=0
            - mitigations=off
            - security=none
            - talos.platform=oracle
    patches:
      - machine:
          install:
            diskSelector:
              wwid: naa.608a262117364966b0e79854d296a06a
      - apiVersion: v1alpha1
        kind: KernelModuleConfig
        name: drbd

# Applied to every node. Order matters: shared base from ../global, then this
# cluster's overrides.
patches:
  - apiVersion: v1alpha1
    kind: KubeNetworkConfig
    podSubnets:
      - "${CLOUD_POD_CIDR}"
    serviceSubnets:
      - "${CLOUD_SVC_CIDR}"
  # Disabling Flannel for Cilium means deleting it.
  - apiVersion: v1alpha1
    kind: KubeFlannelCNIConfig
    $patch: delete
  - "../global/machine-install.yaml"
  - "../global/machine-kubelet.yaml"
  - "./patches/global/machine-kubelet.yaml"
  - "../global/machine-network.yaml"
  - "./patches/global/machine-network.yaml"
  - "./patches/global/machine-sysctls.yaml"
  - "./patches/global/machine-time.yaml"
  - "../global/machine-kernel.yaml"
  - "../global/machine-features.yaml"
  - "../global/security-profile.yaml"
  - "../global/image-verification.yaml"

controlplanePatches:
  - "../global/cluster.yaml"
  - "../global/cluster-k8s.yaml"
  - "./patches/controller/etcd.yaml"
  - "../global/controller-machine-features.yaml"

workerPatches: []
