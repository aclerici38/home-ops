---
# Per-cluster kubelet nodeIP is layered on via each cluster's
# patches/global/machine-kubelet.yaml (KubeNodeConfig, applied after this).
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  max-pods: "200"
  allowed-unsafe-sysctls: net.ipv6.conf.*
config:
  imageGCHighThresholdPercent: 60
  imageGCLowThresholdPercent: 50
  imageMaximumGCAge: 168h
  featureGates:
    ImageVolume: true
