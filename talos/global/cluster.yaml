---
# Shared controlPlane cluster config. Per-cluster etcd subnets are layered on
# via each cluster's patches/controller/etcd.yaml (applied after this patch).
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
