---
# Shared network config. Per-cluster nameservers are layered on via each
# cluster's patches/global/machine-network.yaml (applied after this patch);
# ResolverConfig is a singleton document, so the two merge.
machine:
  network:
    kubespan:
      enabled: false
      advertiseKubernetesNetworks: false
---
apiVersion: v1alpha1
kind: ResolverConfig
searchDomains:
  disableDefault: true
