---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Actionlint

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".mise.toml"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".mise.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_AUTO_INSTALL: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: actionlint

      - name: actionlint
        run: actionlint -color
