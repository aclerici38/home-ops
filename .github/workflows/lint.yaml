---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  push:
    branches:
      - "main"
    paths:
      - "mise-tasks/**"
      - "**/*.json"
      - "**/*.json5"
      - "**/*.md"
      - ".mise.toml"
      - ".shellcheckrc"
      - "mise.lock"
      - ".github/workflows/lint.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "mise-tasks/**"
      - "**/*.json"
      - "**/*.json5"
      - "**/*.md"
      - ".mise.toml"
      - ".shellcheckrc"
      - "mise.lock"
      - ".github/workflows/lint.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_AUTO_INSTALL: "0"

jobs:
  shell:
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "shellcheck shfmt"

      - name: shfmt
        run: find mise-tasks -type f -exec shfmt -d -i 2 -ci -sr {} +

      - name: shellcheck
        run: find mise-tasks -type f -exec shellcheck -x {} +

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # oxfmt is an npm package and shells out to node at runtime
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "node oxfmt"

      - name: oxfmt
        run: git ls-files -z '*.json' '*.json5' '*.md' | xargs -0 oxfmt --check

  mise:
    name: Mise
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "taplo yq"

      - name: mise:check
        env:
          MISE_NO_HOOKS: "1"
        run: mise run mise:check
