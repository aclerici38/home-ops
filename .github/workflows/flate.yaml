---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/**
      - globals.env
      - .mise.toml
      - .github/workflows/flate.yaml
  push:
    branches:
      - main
    paths:
      - kubernetes/**
      - globals.env
      - .mise.toml
      - .github/workflows/flate.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  MISE_NO_HOOKS: "1"
  MISE_AUTO_INSTALL: "0"

jobs:
  test:
    name: Flate Test (${{ matrix.cluster }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { cluster: home, arch: amd64 }
          - { cluster: cloud, arch: arm64 }
          - { cluster: raphael, arch: amd64 }
      fail-fast: false
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: github:home-operations/flate

      - name: Run flate test
        run: flate test all --path ./kubernetes/flux/${{ matrix.cluster }}

      - name: Check new images have linux/${{ matrix.arch }}
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          flate diff images --path ./kubernetes/flux/${{ matrix.cluster }} --base origin/main -o json --no-progress \
            | jq -r '.[] | sub("^mirror.gcr.io/"; "docker.io/")' \
            | while read -r img; do
                docker buildx imagetools inspect --raw "$img" \
                  | jq -e --arg a "$ARCH" '.manifests == null or any(.manifests[]; .platform.architecture == $a)' >/dev/null \
                  || { echo "::error::$img has no linux/$ARCH manifest"; exit 1; }
                echo "ok: $img"
              done

  success:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs:
      - test
    name: Flate - Success
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
