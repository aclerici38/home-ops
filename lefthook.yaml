---
# remotes:
#   - git_url: "https://github.com/home-operations/.github"
#     ref: "main"
#     configs:
#       - "lefthook.common.toml"
pre-commit:
  parallel: true
  commands:
    nixfmt:
      glob: "raphael/**/*.nix"
      run: nixfmt --check {staged_files}
      stage_fixed: true
    yaml:
      glob: "kubernetes/**/*.{yaml,yml}"
      exclude:
        - "**/*.sops.yaml"
        - "kubernetes/charts/*/templates/**"
      # Auto-fix formatting first (trailing whitespace, EOF newline, indent),
      # then lint so anything yamlfmt can't fix blocks here instead of in CI.
      run: yamlfmt {staged_files} && yamllint {staged_files}
      stage_fixed: true
    actionlint:
      glob: ".github/{workflows,actions}/**/*.{yaml,yml}"
      run: actionlint {staged_files}
    talos-nodeconfig:
      glob: "talos/**"
      # talstomize does not validate what it renders, so check the generated
      # configs here. madbum is an Oracle VM; every other node is metal.
      run: |-
        for f in talos/home/clusterconfig/*.yaml talos/cloud/clusterconfig/*.yaml; do
          [ -e "$f" ] || continue
          case "$f" in */talosconfig) continue ;; esac
          mode=metal
          case "$f" in talos/cloud/*) mode=cloud ;; esac
          talosctl validate --config "$f" --mode "$mode" || exit 1
        done
    shell:
      glob: "mise-tasks/**"
      # Format first so shellcheck lints what will actually be committed.
      run: shfmt -w -i 2 -ci -sr {staged_files} && shellcheck -x {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "**/*.{json,json5,md}"
      run: oxfmt --write {staged_files}
      stage_fixed: true
