#:schema https://mise.jdx.dev/schema/mise.json
# Keep 1Password values out of task output; bootstrap:secrets needs
# `op run --no-masking` so the real values still reach kubectl.
redactions = ["ONEPASSWORD_*", "GITHUB_TOKEN"]

[settings]
experimental = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
minimum_release_age = "3h"

# home.nix points MISE_GLOBAL_CONFIG_FILE at this file, so it is both the
# project config and the global one. mise loads it once, so {{ config_root }} is
# $HOME on this machine but the checkout in CI (which clones to a path unrelated
# to $HOME). globals.env is therefore listed under both; mise skips the one that
# does not exist without complaining.
[env]
# SOPS_AGE_KEY_FILE must precede _.file: mise resolves [env] in order, and the
# encrypted secrets.env.json cannot be decrypted before the key is known.
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/home-ops/age.key"
_.file = [
  "{{ config_root }}/globals.env",
  "{{ env.HOME }}/home-ops/globals.env",
  "{{ env.HOME }}/home-ops/secrets.env.json",
]
EDITOR = "nvim"
TALOSCONFIG = "{{ env.HOME }}/home-ops/talos/home/clusterconfig/talosconfig"
ATUIN_SYNC_ADDRESS = "https://atuin.clerici.tech"
FLATE_KUBE_VERSION = "{{ env.KUBE_VERSION }}"
FLATE_API_VERSIONS = "cert-manager.io/v1,monitoring.coreos.com/v1,monitoring.coreos.com/v1alpha1,gateway.networking.k8s.io/v1,gateway.networking.k8s.io/v1beta1,grafana.integreatly.org/v1beta1,external-secrets.io/v1,volsync.backube/v1alpha1,snapshot.storage.k8s.io/v1,gateway.networking.k8s.io/v1/HTTPRoute,cilium.io/v2/CiliumNetworkPolicy,monitoring.coreos.com/v1/ServiceMonitor,grafana.integreatly.org/v1beta1/GrafanaDashboard,admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy,admissionregistration.k8s.io/v1/ValidatingAdmissionPolicyBinding,apiregistration.k8s.io/v1"
FLATE_ALLOW_MISSING_KINDS = "Secret"
FLATE_SKIP_KINDS = "Secret"

[hooks]
postinstall = "cd {{ env.HOME }}/home-ops 2>/dev/null || cd {{ config_root }}; lefthook install"

[tools]
"aqua:jdx/mise" = "v2026.11.14"

# k8s
kubectl = "1.37.3"
helm = "4.3.2"
kustomize = "5.8.3"
flux2 = "2.10.1"
kind = "0.33.0"
kubebuilder = "4.16.0"
helmfile = "1.8.5"
helm-docs = "1.14.2"
cilium-cli = "0.20.3"
kubeconform = "0.8.0"
kubelogin = "1.36.4"

# Talos
talosctl = "1.14.7"

# Tools
actionlint = "1.7.12"
age = "1.3.2"
atuin = "18.25.1"
claude-code = "2.1.332"
cosign = "3.1.6"
crane = "0.22.1"
dyff = "1.12.0"
envsubst = "1.4.3"
gh = "2.106.0"
go = "1.27.4"
jq = "1.8.2"
lefthook = "2.2.3"
mc = "latest"
neovim = "0.12.6"
node = "26.13.1"
oxfmt = "0.75.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
sops = "3.13.3"
taplo = "0.10.0"
uv = "0.13.10"
yamlfmt = "0.21.0"
yamllint = { version = "1.38.0", python = "3.14" }  # pyyaml has no Python 3.15 wheels yet
yq = "4.54.3"
zizmor = "1.33.1"

"github:mirceanton/talstomize" = "v1.0.4"

# Verify kubectl-cnpg with the SLSA signer used by CloudNativePG's release workflow.
"github:cloudnative-pg/cloudnative-pg" = { version = "v1.30.2", slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0", slsa_signer_issuer = "https://token.actions.githubusercontent.com" }
"github:home-operations/yayamlls" = "0.3.3"
"github:home-operations/flate" = "v0.8.0"
"aqua:nklmilojevic/sofka" = "v0.39.0"
bun = "1.4.5"
python = "3.15.2"
viddy = "v1.3.1"
codex = "0.169.0"
