#:schema https://mise.jdx.dev/schema/mise.json
# Keep 1Password values out of task output; bootstrap:secrets needs
# `op run --no-masking` so the real values still reach kubectl.
redactions = ["ONEPASSWORD_*", "GITHUB_TOKEN"]

[settings]
experimental = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

# home.nix points MISE_GLOBAL_CONFIG_FILE at this file, so it is both the
# project config and the global one. mise loads it once, so {{ config_root }} is
# $HOME on this machine but the checkout in CI (which clones to a path unrelated
# to $HOME). globals.env is therefore listed under both; mise skips the one that
# does not exist without complaining.
[env]
# SOPS_AGE_KEY_FILE must precede _.file: mise resolves [env] in order, and the
# encrypted secrets.env.json cannot be decrypted before the key is known.
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/home-ops/age.key"
_.file = [
  "{{ config_root }}/globals.env",
  "{{ env.HOME }}/home-ops/globals.env",
  "{{ env.HOME }}/home-ops/secrets.env.json",
]
EDITOR = "nvim"
TALOSCONFIG = "{{ env.HOME }}/home-ops/talos/home/clusterconfig/talosconfig"
ATUIN_SYNC_ADDRESS = "https://atuin.clerici.tech"
FLATE_KUBE_VERSION = "{{ env.KUBE_VERSION }}"
FLATE_API_VERSIONS = "cert-manager.io/v1,monitoring.coreos.com/v1,monitoring.coreos.com/v1alpha1,gateway.networking.k8s.io/v1,gateway.networking.k8s.io/v1beta1,grafana.integreatly.org/v1beta1,external-secrets.io/v1,volsync.backube/v1alpha1,snapshot.storage.k8s.io/v1"
FLATE_ALLOW_MISSING_SECRETS = "true"
FLATE_SKIP_CRDS = "false"

[hooks]
postinstall = "cd {{ env.HOME }}/home-ops 2>/dev/null || cd {{ config_root }}; lefthook install"

[tools]
"aqua:jdx/mise" = "2026.9.3"

# k8s
kubectl = "1.37.0"
helm = "4.2.4"
kustomize = "5.8.1"
flux2 = "2.9.5"
k9s = "0.51.0"
kind = "0.33.0"
kubebuilder = "4.15.0"
helmfile = "1.7.4"
helm-docs = "1.14.2"
cilium-cli = "0.20.0"
kubeconform = "0.8.0"

# Talos
talosctl = "1.14.0"
talhelper = "3.1.17"

# Tools
actionlint = "1.7.12"
age = "1.3.2"
atuin = "18.21.0"
claude-code = "2.1.266"
crane = "0.22.1"
dyff = "1.12.0"
envsubst = "1.4.3"
ffmpeg = "8.1.1"
gh = "2.100.0"
go = "1.27.1"
jq = "1.8.2"
lefthook = "2.1.12"
mc = "latest"
neovim = "0.12.5"
node = "26.8.1"
oci = "3.92.1"
oxfmt = "0.67.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
sops = "3.13.3"
taplo = "0.10.0"
uv = "0.12.11"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
yq = "4.53.6"
zizmor = "1.30.1"

