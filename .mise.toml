#:schema https://mise.jdx.dev/schema/mise.json
# Keep 1Password values out of task output; bootstrap:secrets needs
# `op run --no-masking` so the real values still reach kubectl.
redactions = ["ONEPASSWORD_*", "GITHUB_TOKEN"]

[settings]
experimental = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

# This file is both the project config and MISE_GLOBAL_CONFIG_FILE. mise loads
# it once, so {{ config_root }} is $HOME on this machine but the checkout in CI
# (which clones to a path unrelated to $HOME). globals.env is therefore listed
# under both; mise skips the one that does not exist without complaining.
[env]
# SOPS_AGE_KEY_FILE must precede _.file: mise resolves [env] in order, and the
# encrypted secrets.env.json cannot be decrypted before the key is known.
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/home-ops/age.key"
_.file = [
  "{{ config_root }}/globals.env",
  "{{ env.HOME }}/home-ops/globals.env",
  "{{ env.HOME }}/home-ops/secrets.env.json",
]
EDITOR = "nvim"
TALOSCONFIG = "{{ env.HOME }}/home-ops/talos/home/clusterconfig/talosconfig"
ATUIN_SYNC_ADDRESS = "https://atuin.clerici.tech"
FLATE_KUBE_VERSION = "{{ env.KUBE_VERSION }}"
FLATE_API_VERSIONS = "cert-manager.io/v1,monitoring.coreos.com/v1,monitoring.coreos.com/v1alpha1,gateway.networking.k8s.io/v1,gateway.networking.k8s.io/v1beta1,grafana.integreatly.org/v1beta1,external-secrets.io/v1,volsync.backube/v1alpha1,snapshot.storage.k8s.io/v1"
FLATE_ALLOW_MISSING_SECRETS = "true"
FLATE_SKIP_CRDS = "false"

[hooks]
postinstall = "lefthook install"

[tools]
"aqua:jdx/mise" = "2026.8.15"

# k8s
kubectl = "1.36.4"
helm = "4.2.4"
kustomize = "5.8.1"
flux2 = "2.9.4"
k9s = "0.51.0"
kind = "0.33.0"
kubebuilder = "4.15.0"
helmfile = "1.7.4"
helm-docs = "1.14.2"
cilium-cli = "0.20.0"
kubeconform = "0.8.0"

# Talos
talosctl = "1.13.9"
talhelper = "3.1.17"

# Tools
actionlint = "1.7.12"
age = "1.3.2"
atuin = "18.20.1"
claude-code = "2.1.251"
crane = "0.22.0"
direnv = "2.37.1"
dyff = "1.12.0"
envsubst = "1.4.3"
ffmpeg = "8.1.1"
gh = "2.98.0"
go = "1.27.0"
jq = "1.8.2"
lefthook = "2.1.12"
mas = "7.0.0"
mc = "latest"
neovim = "0.12.5"
node = "26.8.1"
oci = "3.91.0"
oxfmt = "0.65.0"
shellcheck = "0.11.0"
shfmt = "3.14.0"
sops = "3.13.3"
taplo = "0.10.0"
uv = "0.12.7"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
yq = "4.53.6"
zizmor = "1.30.0"

"github:cloudnative-pg/cloudnative-pg" = { version = "1.30.0", exe = "kubectl-cnpg" }
"github:home-operations/yayamlls" = "0.2.0"
"github:home-operations/flate" = "v0.6.1"

[bootstrap.brew]
# Take over apps already on disk instead of replacing the bundle, so macOS
# Privacy & Security grants survive.
adopt = true

[bootstrap.packages]
"brew:fish" = "latest"
"brew:git" = "latest"
"brew:skopeo" = "latest"

"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:android-platform-tools" = "latest"
"brew-cask:balenaetcher" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:opencloud" = "latest"
"brew-cask:protonvpn" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:ultimaker-cura" = "latest"
"brew-cask:utm" = "latest"
"brew-cask:vlc" = "latest"
"brew-cask:whatcable" = "latest"
"brew-cask:wireshark-app" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:zen" = "latest"
"brew-cask:zoom" = "latest"

"mas:1381004916" = "latest" # Discovery
"mas:441258766" = "latest"  # Magnet
"mas:1451685025" = "latest" # WireGuard

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleShowAllExtensions = true, InitialKeyRepeat = 15, KeyRepeat = 2 }
"com.apple.finder" = { AppleShowAllFiles = true, FXDefaultSearchScope = "SCcf", FXPreferredViewStyle = "Nlsv", ShowPathbar = true, ShowStatusBar = true }
"com.apple.dock" = { autohide = false, "show-recents" = false }

# Touch ID for sudo
[bootstrap.files."/etc/pam.d/sudo_local"]
content = "auth       sufficient     pam_tid.so\n"
owner = "root"
group = "wheel"
mode = "0444"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/.config/fish/config.fish" = "dotfiles/fish/config.fish"
"~/.config/zed/settings.json" = "dotfiles/zed/settings.json"
"~/.gitconfig" = "dotfiles/gitconfig"
"~/.ssh/config" = "dotfiles/ssh_config"
